# fusion.yaml — 双书融合创作流水线 DAG(fusion-fiction 插件;机器可读)
# 与 agents/workflow.yaml 同构;约定与调度纪律见 agents/WORKFLOW.md §10。
# 节点 id 前缀 fs/gf,不与主流程 p*/g*、derivative-fiction nv*/gn* 冲突;
# orchestrator 把本 DAG 节点并入项目 runs/dag.json 统一跟踪。
#
# ⚠️ 直改正史(本插件的特殊授权,覆盖 §10.3.5 的命名空间默认纪律):
#   融合流程把产物**直接写回正史路径**(bible/、story/episodes/),
#   让人物/世界观/场景/分镜等全部预览页直接呈现融合结果。
#   分支与版本由用户自行管理(插件不做克隆/版本登记/回滚,建议开工前自行留存备份如 git 分支);
#   FH1 签字项含「确认直改本项目正史」;
#   剧本覆写前 script-transposer 先存甲本原剧本快照(fusion/episodes/{ep}/source_screenplay.md),
#   QA 魂对账与用户对照以该快照为基线;
#   fusion/ 仅存过程件(矩阵/映射表/字典/台账/基线快照/乙本档案)。
#
# 前置(plugin.json requires):甲本已跑完主流程 p0–p3 与 p5(bible/ 冻结、各集 screenplay 就绪)。
# 乙本原文(全文模式)由用户放 fusion/source_b/novel/(按章节,格式同主流程 novel/);名著模式留空。

version: 1
plugin: fusion-fiction
defaults:
  eval_threshold: 80
  max_retries: 3
  on_fail: escalate_human
  run_record: [context.md, result.json, eval.json, meta.json]
  gate_auto: [open_blocker_major_defects_zero_or_waived, due_gate_defects_closed,
              qa_hold_requires_waiver, human_checks_executed_or_waived]

phases:
  - id: fs0
    name: 融合立项
    tasks:
      - id: fs0-plan
        agent: 14-fusion/fusion-planner
        outputs: [fusion/fusion_plan.json]
        # canon_write_confirmed:与用户明确确认「本流程直改本项目正史(bible/、story/),
        #   版本管理自理」,确认登记进 fusion_plan;未确认一律拒绝开工;
        # dimension_matrix_complete:全部维度(story/soul/appearance/dialogue_style/geography/
        #   politics/economy/religion/culture/magic/art_style/era_anchor)各有归属 A|B|blend;
        # source_b_mode_declared:乙本摄入模式 classic|fulltext 二选一,fulltext 须确认原文已就位
        validation:
          auto: [schema, canon_write_confirmed, dimension_matrix_complete,
                 era_anchor_defined, source_b_mode_declared]
          rubric: creative_v1
      - { id: gf0, gate: true, human: true, checkpoint: FH1-融合蓝图签字,
          depends_on: [fs0-plan] }

  - id: fs1
    name: 乙本摄入          # 按 fusion_plan.source_b.mode 二选一分支;orchestrator 只实例化选中分支,
    depends_on: [gf0]       # 另一分支节点标 skipped(不算失败)
    tasks:
      # —— 分支 A:名著模式(mode=classic;零文本输入,凭模型知识考据) ——
      - id: fs1-b-classic
        agent: 14-fusion/classic-scholar
        outputs: [fusion/source_b/bible/, fusion/source_b/characters.json]
        # dims_match_plan:只产出矩阵中归属 B|blend 的维度;version_statement_present:版本口径声明非空
        validation:
          auto: [schema, dims_match_plan, version_statement_present, knowledge_source_tagged]
          rubric: extraction_v1
      # —— 分支 B:全文模式(mode=fulltext;复用主流程解析工位,产物重定向 fusion/source_b/) ——
      - id: fs1-b-parse
        agent: 01-story/novel-parser
        outputs: [fusion/source_b/structured_story.json]
        # 输入路径:fusion/source_b/novel/(工单 inputs 显式指定,不读项目根 novel/)
        validation: { auto: [schema], rubric: extraction_v1 }
      - id: fs1-b-world
        depends_on: [fs1-b-parse]
        for_each: b_dimension     # 按 fusion_plan 矩阵中归属 B|blend 的世界观维度实例化,
        agent: 02-worldbuilding/geography   # agent 逐维度替换(geography/political/economy/religion/culture/magic-cultivation/world)
        outputs: ["fusion/source_b/bible/{dim}.json"]
        validation: { auto: [schema], rubric: extraction_v1 }
      - id: fs1-b-chars
        depends_on: [fs1-b-parse]
        agent: 03-characters/character-manager    # 人物索引+性格+关系(映射特征所需最小集;工单可加派 personality/relationship)
        outputs: [fusion/source_b/characters.json]
        validation: { auto: [schema], rubric: extraction_v1 }
      # —— 汇合闸(自动):矩阵勾选 B|blend 的维度在 source_b/ 全覆盖 ——
      - { id: gf1, gate: true, depends_on: [fs1-b-classic, fs1-b-world, fs1-b-chars] }

  - id: fs2
    name: 人物映射            # 此时 bible/characters/ 仍是甲本原版(fs3 才改写),映射特征取甲本无歧义
    depends_on: [gf1]
    tasks:
      - id: fs2-map
        agent: 14-fusion/character-mapper
        outputs: [fusion/character_map.json]
        # user_locks_respected:fusion_plan 里用户预指定的映射对原样保留且标 locked;
        # a_main_cast_covered:甲本 S/A 级角色 100% 有 locked|suggested|unmapped 归类;
        # map_targets_exist:映射目标全部存在于 source_b/characters.json
        validation:
          auto: [schema, user_locks_respected, a_main_cast_covered, map_targets_exist]
          rubric: analysis_v1
          qa: [11-qa/character-consistency-qa]
      - { id: gf2, gate: true, human: true, checkpoint: FH2-人物对应表签字,
          depends_on: [fs2-map] }

  - id: fs3
    name: 世界融合            # ★ 直改正史:矩阵维度写回 bible/*.json,合成人设卡写回 bible/characters/
    depends_on: [gf2]
    tasks:
      - id: fs3-merge
        agent: 14-fusion/world-merger
        outputs: [bible/, fusion/dictionary.json, fusion/conflicts.json]
        # 正史改写范围:矩阵标 B|blend 的维度文件(geography/politics/economy/religion/culture/
        #   cultivation/world…)、合成人设卡(bible/characters/<id>/ 魂字段保甲本、壳字段换乙本,
        #   index.json 人名同步)、术语并入 bible/dictionary.json;标 A 的维度文件不动。
        # rewrite_manifest_present:被改写的正史文件清单(含来源标注)完整记入 result.json;
        # dimension_matrix_applied:每个维度产物可溯源到矩阵声明的来源(A|B|blend);
        # blacklist_nonempty:fusion/dictionary.json 含现代词黑名单(时代错位扫描词表);
        # fused_cards_per_mapping:character_map 每条 locked|suggested 映射对应一张合成人设卡
        validation:
          auto: [schema, rewrite_manifest_present, dimension_matrix_applied,
                 canon_refs_valid, blacklist_nonempty, fused_cards_per_mapping]
          rubric: creative_v1
          qa: [11-qa/world-consistency-qa]
      - { id: gf3, gate: true, human: true, checkpoint: FH3-融合圣经与转换字典签字,
          depends_on: [fs3-merge] }
        # 签字前即可在预览页(世界观/人物)直接查看融合结果;不满意可退回重做

  - id: fs4
    name: 剧本移植            # ★ 直改正史:移植版直接覆写 story/episodes/{ep}/screenplay.md;
    depends_on: [gf3]         # 试点集策略:首集走通并过 FH4 后,其余集方可批量并行
    for_each: episode          # 按甲本 story/episode_plan.json 实例化(fs4-transpose-epNN / fs4-dialogue-epNN)
    tasks:
      - id: fs4-transpose
        agent: 14-fusion/script-transposer
        outputs: ["story/episodes/{ep}/screenplay.md", "fusion/episodes/{ep}/source_screenplay.md",
                  "fusion/episodes/{ep}/transpose_log.json"]
        # baseline_snapshot_saved:改写前把甲本原剧本完整快照存 fusion/episodes/{ep}/source_screenplay.md
        #   并登记进 transpose_log.baseline,QA 魂对账与用户 diff 均以该快照为准;
        # beats_preserved_100:对账基线快照场景节拍全量保留(合并/拆分须在 transpose_log 登记);
        # names_via_character_map:出场人名 100% 走映射表(unmapped 角色按表内 fallback 策略);
        # blacklist_zero_hit:现代词黑名单零命中
        validation:
          auto: [baseline_snapshot_saved, beats_preserved_100, names_via_character_map,
                 blacklist_zero_hit]
          rubric: writing_v1
      - id: fs4-dialogue
        agent: 01-story/dialogue-rewrite
        depends_on: [fs4-transpose]
        outputs: ["story/episodes/{ep}/screenplay.md"]   # 台词打磨版直接覆写同路径
        validation:
          auto: [no_plot_change, blacklist_zero_hit]
          rubric: writing_v1
          qa: [11-qa/fusion-fidelity-qa]
      - { id: gf4, gate: true, scope: book, human_on: first_episode,
          checkpoint: FH4-首集试读签字, depends_on: [fs4-dialogue] }

  - id: fs5
    name: 全剧终审
    depends_on: [gf4]
    tasks:
      - { id: fs5-logic,    agent: 11-qa/logic-qa,
          outputs: [qa/reports/fusion/logic.json],     pass: blocker_eq_0 }
      - { id: fs5-world,    agent: 11-qa/world-consistency-qa,   # 正史 bible/ 此时即融合圣经,常规对照
          outputs: [qa/reports/fusion/world.json],     pass: blocker_eq_0 }
      - { id: fs5-char,     agent: 11-qa/character-consistency-qa,   # 对照合成人设卡
          outputs: [qa/reports/fusion/character.json], pass: score_gte_85 }
      - { id: fs5-fidelity, agent: 11-qa/fusion-fidelity-qa,     # 全剧粒度:甲魂保真(基线取 fusion/episodes/ 快照)+乙壳完整
          outputs: [qa/reports/fusion/fidelity.json],  pass: score_gte_80 }
      - { id: fs5-copyright, agent: 11-qa/copyright,             # 甲本多为在版权作品,融合产物风险必审
          outputs: [qa/reports/fusion/copyright.json], pass: all_assets_licensed }
      - { id: gf5, gate: true, human: true, checkpoint: FH5-融合剧本定稿签字,
          depends_on: [fs5-logic, fs5-world, fs5-char, fs5-fidelity, fs5-copyright] }

  - id: fs6
    name: 下游刷新与小说化(均可选)
    depends_on: [gf5]
    optional: true
    tasks:
      # 下游刷新:bible/ 与 story/ 已是融合版,把主流程受影响的下游节点置 stale 按需重跑
      # (p3-scene 场景重抽取、p4 美术概念、p6 分镜…),场景/分镜/视频预览页即呈现融合世界;
      # 重跑范围由用户点单决定,orchestrator 不得自行扩大到视觉生成等高成本阶段
      - { id: fs6-restale, agent: 00-orchestration/workflow-orchestrator,
          outputs: [runs/dag.json] }
      # 小说化:前置 derivative-fiction 插件已启用;正史即融合圣经,nv 流程照常读 bible/ 与
      # story/episodes/(无需特殊输入源),产物照常落 derivative/;用户未点单则跳过
      - { id: fs6-handoff, agent: 00-orchestration/workflow-orchestrator,
          outputs: [fusion/novelize_brief.json] }

# 贯穿型服务与主流程一致(context/evaluation/memory-bible/orchestrator 钩子),见 agents/workflow.yaml services 段
