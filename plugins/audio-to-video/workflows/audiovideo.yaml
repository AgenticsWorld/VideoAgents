# audiovideo.yaml — 音频配画流水线 DAG(audio-to-video 插件;机器可读)
# 与 agents/workflow.yaml 同构;约定与调度纪律见 agents/WORKFLOW.md §10。
# 节点 id 前缀 av/ga,不与主流程 p*/g*、derivative-fiction nv*/gn*、fusion-fiction fs*/gf* 冲突;
# 人工签字点 AVH1–AVH5,不与主流程 H1–H5/H3A/H3B、DH1–DH3、FH1–FH5 冲突。
# orchestrator 把本 DAG 节点并入项目 runs/dag.json 统一跟踪。
#
# ══════════════════════════════════════════════════════════════════════════════
# ⚠️ 本插件的三项特殊授权(覆盖主流程默认纪律,均由 AVH1 用户签字兜底)
# ══════════════════════════════════════════════════════════════════════════════
#
# ① 直改正史(覆盖 §10.3.5 命名空间纪律,同 fusion-fiction 先例)
#    考据/形象/场景/分镜/剧本直接写回 bible/、story/、directing/,让现有预览页
#    (世界观/人物/场景/分镜/视频)零改动呈现结果;av/ 只存过程件
#    (audio_map / beat_track / timeline_plan)。分支与版本由用户自理,插件不做克隆/回滚。
#
# ② 音频权威(方向反转:主流程画面固定、旁白压缩;本流程音频固定、画面适配)
#    母带 MP3 是唯一时长事实源。禁止对母带做任何重编码/归一化/剪裁。
#    画面按实测时长**整秒切分**:每组 span 为整数秒且 ∈[4,14](上限取 14 而非 15,
#    留 1s 给模型 ±1s 交付公差);末组吸收小数余量,total_duration_s 取 ceil 后由
#    timeline 的 out 修剪。整秒累加使累计漂移在数学上恒为 0。
#
# ③ 五处主流程机检不适用,逐项替换(依据见 code/check_av_sync.py 与下方各节点注释)
#    - narration_anchors 窗口检查:主流程要求 window_s ≥ est×1.15 且 dur ≤ window×0.9,
#      音频锁定下 window == dur,数学上不可满足 → narration_anchors 置 [],
#      check_generation_groups.py 一律带 --skip-7d,改由 av_sync 机检覆盖
#    - narration_anchors_cover_all / narration.md 缺失:同上 --skip-7d
#    - audio_track_present:本流程一律 --generate-audio off 出无声画面(彻底规避口型问题),
#      故反向断言 clip_silent(组片段不得含音轨)
#    - narration_anchor_sync(edit 封装前):本流程无 TTS 旁白轨,替换为 av_sync
#      (工单须显式声明,否则 edit 按 SOUL 会停手上报)
#    - audio-qa 的 lufs_-14_pm1 / true_peak / 音效出声率:与「零重编码 + 无原生音轨」对立,
#      改为只测量上报(loudness_measured_reported),超标开 minor 缺陷并在 AVH1 永久豁免
#      (§7 PASS_WITH_WAIVER,follow_up:母带为用户提供,禁止重编码)
#
# 封装铁律:严禁 ffmpeg -shortest(实测会静默截断音频末帧,而成片总长检查仍会 PASS,
#   只有逐帧 md5 能发现)。音频是权威时长,视频须 ≥ 音频后由 timeline 修剪。
#
# 前置:无需主流程任何阶段(本插件自起项目)。用户输入两件:
#   refs/audio/<name>.mp3(讲述音频)+ 对应文本(refs/ 下或工单内)。
#   影片风格用现成 UI:菜单「设计构想」→「设计风格」→ 🎨 风格库(94 预设),不另建字段。
# v1 限定:一个 MP3 = 一个项目 = ep01(episode_minutes 是项目级设置,
#   多集不同长度无法同时满足 duration_pm_5pct)。
#
# 依赖两个仓库级文件(插件为纯声明式,不含可执行代码,§10.4):
#   modules/avsync.py       时间轴原语(实测/停顿/切分/逐帧校验)
#   code/check_av_sync.py   机检 av_sync(--stamp 盖章;分 timeline/clips/final 三阶段)

version: 1
plugin: audio-to-video

# 主流程分支联动跳过(WORKFLOW.md §10 规则 6)。本插件是**自起流程**:输入是音频不是小说,
# 主 DAG 从解析到发布几乎整条不适用——世界圣经由 av1-era 轻量考据替代、剧本由 av2-script
# 替代、分镜由 av2-timeline 替代、音频阶段更是绝不能跑(母带即声轨)。
# 全部未开工(pending/template/blocked)时整组置 skipped(写 skip_reason 含插件名);
# 清单内存在任一已开工节点则视为视频制作进行中,一个也不跳。
# skipped 是挂起不是放弃:用户其后要求按主流程做视频时恢复 pending 重新排产。
# ⚠️ 刻意不含 p0-init 与 g0:项目创建时 orchestrator 已跑过项目初始化(状态 done),
#    把已开工节点列进清单会触发「一个也不跳」的白名单条件,导致整组跳过失效。
main_dag_on_start:
  skip:                # p*- 为前缀通配(含按集展开后的逐集节点);g1–g10 为闸门节点精确 id
    - p0-scan          # 小说分章扫描——本流程输入是音频
    - p0-parse-*       # 小说分章解析
    - p1-*             # 剧情理解(结构/事件/时间线)
    - p2-*             # 世界圣经九维——由 av1-era 轻量时代考据替代
    - p3-*             # 角色与资产——由 av1-era + av1-charconcept 在本流程内完成
    - p4-*             # 美术风格——由 av1-style/color/aspect 在本流程内完成
    - p5-*             # 剧本改编——由 av2-script 画面编剧替代
    - p6-*             # 导演分镜——由 av2-timeline 整秒切分替代
    - p7-*             # 视觉生成——由 av3-* 完成(--generate-audio off)
    - p8-*             # ★音频——母带即成片声轨,绝不跑 TTS 旁白与混音
    - p9-*             # 剪辑合成——由 av4-edit 完成
    - p10-*            # 成片终审——由 av5-* 完成
    - p11-*            # 视频发布——按需另点单
    - g1
    - g2               # H1-世界圣经确认
    - g3               # H1A-角色与资产确认
    - g4               # H2-美术风格锁定
    - g5               # H3-第1集剧本确认
    - g6               # H3A-分镜确认
    - g7               # H3B-视觉生成确认
    - g8
    - g9               # H4-首集成片确认
    - g10              # H5-发布签字

defaults:
  eval_threshold: 80
  max_retries: 3
  on_fail: escalate_human
  run_record: [context.md, result.json, eval.json, meta.json]
  gate_auto: [open_blocker_major_defects_zero_or_waived, due_gate_defects_closed,
              qa_hold_requires_waiver, human_checks_executed_or_waived]

# orchestrator 注意:并入 runs/dag.json 时给每个节点显式写 phase 字段(值取所属 phase 的 id),
# 否则工作流预览页的 _wf_phase_of() 只认 ^[pg]\d+,av* 节点会全落进「加派任务」泳道。

phases:
  - id: av0
    name: 音频立项
    tasks:
      - id: av0-ingest
        agent: 15-audio-video/audio-ingest
        outputs: [av/audio_map.json, "assets/audio/master/{ep}.mp3"]
        # master_copied_verbatim:母带按原字节复制到 assets/audio/master/{ep}.mp3(禁转码),sha256 入册;
        # duration_measured:ffprobe 实测时长写入 master_duration_s(全精度,不四舍五入);
        # silences_detected:silencedetect 停顿清单非空(纯净无停顿音频须在 result.json 说明并降级为等分切分);
        # loudness_reported:响度只测量上报,normalized 恒为 false;
        # tools_verified:ffprobe/ffmpeg 可用性已显式探测(缺则升级人工,禁止静默跳过)
        validation:
          auto: [schema, master_copied_verbatim, duration_measured, silences_detected,
                 loudness_reported, tools_verified, ascii_filename]
          rubric: extraction_v1
      - id: av0-align
        agent: 15-audio-video/transcript-aligner
        depends_on: [av0-ingest]
        outputs: [av/beat_track.json]
        # text_lossless:切句后拼接 == 原文(不丢字不改字不去重);
        # beats_monotonic:段落单调、无缝隙、精确覆盖 [0, master_duration_s];
        # boundaries_snapped_reported:吸附到停顿中点的比例写入 result.json(未吸附段须列明)
        validation:
          auto: [schema, text_lossless, beats_monotonic, boundaries_snapped_reported]
          rubric: analysis_v1
      - { id: ga0, gate: true, human: true, checkpoint: AVH1-时间轴基线签字,
          depends_on: [av0-align] }
        # ★全流程最关键签字点:基线一旦签字,后续全部工作建其上;基线错了整片重做。
        # 签字项(缺一不得放行,登记进 av/audio_map.json 的 user_confirmations):
        #   1. 实测时长与切分方案(N 组,各 4–14 整秒;末组小数余量)
        #   2. 直改本项目正史(bible/、story/、directing/),版本回滚自理
        #   3. 使用原始 MP3 作最终声轨,响度不做归一化(audio-qa 指标永久豁免)
        #   4. 关闭片头/片尾/预告(settings.json packaging 三项置 false)
        #      —— 片头会重编码并把讲述起点推后,破坏零漂移证明

  - id: av1
    name: 设定与美术        # 轻量考据替代主流程 Phase 2 九维世界观;但美术/场景底座省不掉:
    depends_on: [ga0]       # 08-video-gen/prompt 硬检 lighting_scheme_bound / costume_bound /
    tasks:                  # prop_scale_token_ok,缺 bible/ 里的英文片段即拒跑
      - id: av1-era
        agent: 15-audio-video/era-researcher
        outputs: [bible/era.json, bible/world.json, "bible/characters/", "bible/scenes/index.json"]
        # era_anchor_defined:时代锚点(纪年/地域/文明阶段)明确且可考;
        # visual_dims_covered:服饰/建筑/器物/礼制四维各有可入 prompt 的英文片段;
        # cast_from_text_only:出场人物全部出自音频文本,零虚构增补;
        # scene_list_covers_beats:场景清单覆盖 beat_track 全部段落
        validation:
          auto: [schema, era_anchor_defined, visual_dims_covered, cast_from_text_only,
                 scene_list_covers_beats, ascii_filename]
          rubric: creative_v1
          qa: [11-qa/world-consistency-qa]
      - { id: av1-style, agent: 06-art/art-director, outputs: [bible/style.json],
          depends_on: [av1-era] }
        # 输入:用户在「设计构想 → 设计风格」选定的风格库条目(brief.md 的「## 设计风格」节,
        # 由 core 注入提示词并为全片画面视觉权威定义);art-director 据此落 style.json
      - { id: av1-aspect, agent: 06-art/aspect-ratio, outputs: [bible/aspect.json],
          depends_on: [av1-style] }
      - { id: av1-color, agent: 06-art/color-script, outputs: [bible/color_script.json],
          depends_on: [av1-style] }
      - id: av1-scene
        agent: 05-scenes/scene
        depends_on: [av1-era]
        for_each: scene
        outputs: ["bible/scenes/{id}/scene.json"]
        validation: { auto: [schema], rubric: visual_plan_v1 }
      - id: av1-env
        agent: 05-scenes/environment
        depends_on: [av1-scene]
        for_each: scene
        outputs: ["bible/scenes/{id}/environment.json"]
        validation: { auto: [schema], rubric: visual_plan_v1 }
      - id: av1-arch
        agent: 05-scenes/architecture
        depends_on: [av1-scene, av1-era]
        for_each: scene
        outputs: ["bible/scenes/{id}/architecture.json"]
        validation: { auto: [schema, era_consistent], rubric: visual_plan_v1 }
      - id: av1-light
        agent: 05-scenes/lighting        # ★必需:prompt 的 lighting_scheme_bound 要逐字引用
        depends_on: [av1-env]            #   lighting.json 的 prompt_fragment_en,缺则 video-gen 拒跑
        for_each: scene
        outputs: ["bible/scenes/{id}/lighting.json"]
        validation:
          auto: [schema, prompt_fragment_en_present]
          rubric: visual_plan_v1
          qa: [11-qa/visual-qa]
      - id: av1-costume
        agent: 06-art/costume             # ★必需:costume_bound 依赖 bible/costumes.json 的 visual_en
        depends_on: [av1-era, av1-style]
        outputs: [bible/costumes.json]
        validation: { auto: [schema, visual_en_present, era_consistent], rubric: visual_plan_v1 }
      - id: av1-prop
        agent: 06-art/prop                # ★必需:prop_scale_token_ok 依赖 props.json 的 scale.prompt_token
        depends_on: [av1-era, av1-style]
        outputs: [bible/props.json, "assets/concepts/props/"]
        validation: { auto: [schema, scale_prompt_token_present], rubric: visual_plan_v1 }
      - id: av1-charconcept
        agent: 06-art/character-concept    # 概念图:§6A concept_coverage_ok 是 G6 硬前置
        depends_on: [av1-era, av1-style]
        for_each: character
        outputs: ["assets/concepts/characters/{id}/"]
        validation: { auto: [three_view_complete, gender_in_prompt], rubric: visual_gen_v1 }
      - id: av1-envconcept
        agent: 06-art/environment-concept
        depends_on: [av1-light]
        for_each: scene
        outputs: ["assets/concepts/scenes/{id}/"]
        validation: { auto: [concept_coverage_ok], rubric: visual_gen_v1 }
      - { id: ga1, gate: true, human: true, checkpoint: AVH2-风格与时代考据签字,
          depends_on: [av1-color, av1-aspect, av1-arch, av1-light, av1-costume,
                       av1-prop, av1-charconcept, av1-envconcept] }

  - id: av2
    name: 画面规划          # 时序先锁死,创作不得改动时序:visual-scripter 只决定「画什么」,
    depends_on: [ga1]       # timeline-planner 只决定「多长」,两者严格分工
    tasks:
      - id: av2-script
        agent: 15-audio-video/visual-scripter
        outputs: ["story/episodes/{ep}/screenplay.md", "directing/{ep}/storyboard.json"]
        # beats_all_covered:beat_track 每一段都有对应画面描述,无空段;
        # no_timing_change:不得写入/修改任何时长字段(时长归 timeline-planner);
        # content_matches_text:画面内容与该段文本语义对应(av-sync-qa 逐段抽检的依据);
        # no_speaking_characters:不得设计说话镜头(本流程无原生对白音轨,画面不出口型)
        validation:
          auto: [beats_all_covered, no_timing_change, content_matches_text,
                 no_speaking_characters, ascii_filename]
          rubric: writing_v1
          qa: [11-qa/logic-qa]
      - id: av2-timeline
        agent: 15-audio-video/timeline-planner
        depends_on: [av2-script]
        outputs: ["directing/{ep}/shot_list.json", av/timeline_plan.json]
        # av_sync_stamped:code/check_av_sync.py --stamp --task-id 已过并盖章(timeline 段 1-7 全过);
        # groups_skip7d_clean:check_generation_groups.py --skip-7d 零错误;
        # narration_anchors_empty:narration_anchors 恒为 [](本流程无 TTS 旁白挂点)
        validation:
          auto: [schema, av_sync_stamped, groups_skip7d_clean, narration_anchors_empty,
                 ascii_filename]
          rubric: visual_plan_v1
          qa: [11-qa/timeline-qa]
      - { id: av2-continuity, agent: 07-directing/continuity-planning,
          depends_on: [av2-timeline], outputs: ["directing/{ep}/continuity.json"] }
        # ★必需:prompt 的 costume_bound 读 continuity.json#costume_states
      - { id: ga2, gate: true, human: true, checkpoint: AVH3-画面规划与分镜确认,
          depends_on: [av2-continuity] }
        # 签字前可在「分镜预览」页直接看逐组画面与时间轴;不满意退回 av2-script 重做
        # (退回 av2-script 不动时间轴,不需重签 AVH1)

  - id: av3
    name: 视觉生成          # 组序串行(前组尾帧作续接锚);复用主流程工位,零改动
    depends_on: [ga2]
    for_each: group         # 按 directing/{ep}/shot_list.json generation_groups 实例化
    tasks:
      - id: av3-prompt
        agent: 08-video-gen/prompt
        outputs: ["assets/prompts/{ep}/{group}.json"]
        # 与主流程同规格机检(lighting_scheme_bound / costume_bound / blocking_bound /
        # prop_scale_token_ok);另加本流程专有:
        # generate_audio_off_declared:prompt 显式声明本组出无声画面、人物不开口;
        # no_dialogue_line:prompt 不得含任何台词/对白句(音轨由母带提供)
        validation:
          auto: [lighting_scheme_bound, costume_bound, prop_scale_token_ok,
                 generate_audio_off_declared, no_dialogue_line]
          rubric: visual_plan_v1
      - id: av3-image
        agent: 08-video-gen/image-generation
        depends_on: [av3-prompt]
        outputs: ["assets/keyframes/{ep}/{group}/"]
        validation: { auto: [grpsh_id_3digits, ascii_filename], rubric: visual_gen_v1 }
      - id: av3-video
        agent: 08-video-gen/video-generation
        depends_on: [av3-image, "av3-video@prev_group"]
        outputs: ["assets/clips/{ep}/{group}.mp4"]
        # ★替换主流程 audio_track_present:本流程一律 --generate-audio off,
        #   故反向断言 clip_silent(片段不得含音轨);
        # clip_ge_span:实测片长 ≥ 该组 av_span_s(否则 timeline 的 out 修剪会超出片长)。
        #   处置阶梯:① timeline 用 speed=measured/span 微调(≤3% 不可感知)
        #             ② 重 roll 该组  ③ 末帧定格补足
        validation:
          auto: [group_duration_pm_1s, clip_silent, clip_ge_span, grpsh_id_3digits]
          rubric: visual_gen_v1
      - { id: av3-consistency, agent: 08-video-gen/character-consistency,
          depends_on: [av3-video], outputs: ["qa/reports/{ep}/consistency_{group}.json"] }
      - { id: ga3, gate: true, scope: episode, human: true,
          checkpoint: AVH4-视觉生成确认, depends_on: [av3-consistency] }
        # 签字前在「视频预览」页逐组审看;整集组片段齐备且 av_sync --require clips 通过方可放行

  - id: av4
    name: 剪辑与封装
    depends_on: [ga3]
    tasks:
      - id: av4-edit
        agent: 10-editing/edit
        outputs: ["edit/{ep}/timeline.json", "edit/{ep}/final.mp4"]
        # 工单必须显式声明(否则 edit 按其 SOUL 会跑 check_narration_sync 并停手上报):
        #   「本流程无 TTS 旁白轨,narration_anchor_sync 不适用,改跑 code/check_av_sync.py」
        # 参考音轨:assets/audio/master/{ep}.mp3(非 assets/audio/final/{ep}.wav——本流程不跑 p8-mix)
        # timeline 只写组级条目(不写 shot_id):主流程「镜级 in/out 须落在 boundary_map 区间内」
        #   的机检对精确到音频段的 out 不适用
        # 封装:ffmpeg -map 0:v:0 -map 1:a:0 -c:v copy -c:a copy,严禁 -shortest
        validation:
          auto: [av_sync_final, timeline_out_exact, no_cumulative_drift,
                 final_audio_no_transcode, final_audio_frames_intact, no_black_frames]
          rubric: edit_v1
      - id: av4-subtitle
        agent: 10-editing/subtitle
        depends_on: [av4-edit]
        outputs: ["edit/{ep}/subtitles.srt", "edit/{ep}/subtitles_final.srt"]
        # 本流程字幕是白捡的:beat_track.json 自带精确时间码,逐段直接转 SRT。
        # 片头关闭 ⇒ 两个时基一致,subtitles_final.srt 为 subtitles.srt 原样拷贝
        # (subtitle_offset_ok 在无片头时即此口径)
        validation:
          auto: [srt_valid, cues_match_beat_track, subtitle_offset_ok]
          rubric: edit_v1
      - { id: av4-title, agent: 10-editing/title, depends_on: [av4-edit],
          outputs: ["edit/{ep}/title/"] }
      - { id: av4-thumb, agent: 10-editing/thumbnail, depends_on: [av4-edit],
          outputs: ["edit/{ep}/thumbnail_01.png"] }
      - { id: ga4, gate: true, depends_on: [av4-subtitle, av4-title, av4-thumb] }

  - id: av5
    name: 终审
    depends_on: [ga4]
    tasks:
      - { id: av5-avsync, agent: 11-qa/av-sync-qa,
          outputs: ["qa/reports/{ep}/av_sync.json"], pass: blocker_eq_0 }
      - { id: av5-visual, agent: 11-qa/visual-qa,
          outputs: ["qa/reports/{ep}/visual.json"], pass: score_gte_80 }
      - { id: av5-world, agent: 11-qa/world-consistency-qa,   # 时代考据自洽(服饰/建筑/器物不穿越)
          outputs: ["qa/reports/{ep}/world.json"], pass: blocker_eq_0 }
      - { id: av5-safety, agent: 11-qa/content-safety,
          outputs: ["qa/reports/{ep}/safety.json"], pass: blocker_eq_0 }
      - { id: av5-copyright, agent: 11-qa/copyright,           # 用户音频的权利归属须过一遍
          outputs: ["qa/reports/{ep}/copyright.json"], pass: all_assets_licensed }
      - id: av5-audio
        agent: 11-qa/audio-qa
        outputs: ["qa/reports/{ep}/audio.json"]
        # ★只测量上报,不阻断:lufs_-14_pm1 / true_peak_lte_-1dBTP / 音效出声率 ≥90%
        #   与「零重编码 + 无原生音轨」直接对立。超标开 minor 缺陷,
        #   由 AVH1 的第 3 项签字永久豁免(§7 PASS_WITH_WAIVER;
        #   follow_up:母带为用户提供,禁止重编码)。
        #   仍要审的实项:成片音轨与母带一致(不得有二次混音痕迹)、无爆音削波上报。
        pass: report_only
        validation:
          auto: [loudness_measured_reported, master_identity_confirmed]
      - { id: ga5, gate: true, human: true, checkpoint: AVH5-成片签字,
          depends_on: [av5-avsync, av5-visual, av5-world, av5-safety,
                       av5-copyright, av5-audio] }
        # 放行前必须:code/check_av_sync.py --require final 全 PASS
        # 人工抽查:开头/中段/结尾三点,确认画面对应该时刻讲述内容,且片尾声画不脱节

# 贯穿型服务与主流程一致(context/evaluation/memory-bible/version/orchestrator 钩子),
# 见 agents/workflow.yaml services 段。
#
# 发布(12-publishing/*)按需另点单,不在本 DAG 内:platform-adapter 必然按平台规格转码,
# 「零重编码」的保证止于 edit/{ep}/final.mp4;需要平台分发时另出转码副本,
# 且副本文件名不得含 final/master(否则被视频预览页当成第二个成片)。
