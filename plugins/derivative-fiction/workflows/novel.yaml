# novel.yaml — 衍生小说创作流水线 DAG(derivative-fiction 插件;机器可读)
# 与 agents/workflow.yaml 同构;约定与调度纪律见 agents/WORKFLOW.md §10。
# 节点 id 前缀 nv/gn,不与主流程 p*/g* 冲突;orchestrator 把本 DAG 节点并入项目 runs/dag.json 统一跟踪。
# 前置(plugin.json requires):正史 bible/ 已产出并过 H1;正史对本流程只读,
# 新增设定一律写 derivative/bible-delta/(memory-bible SOUL「衍生分支圣经」)。

version: 1
plugin: derivative-fiction
defaults:
  eval_threshold: 80
  max_retries: 3
  on_fail: escalate_human
  # 四件套同主流程(WORKFLOW.md §6.1):context_package: inline 的工单免 context.md,不构成每单必调
  # context Agent 的依据。本插件章节级扇出(nv3 draft/edit 等)所需上下文(premise/chapters.json 本章
  # 节拍/文风圣经/正史术语)均可用明确路径列进工单 inputs,默认走 inline;仅重做单(attempt>1 必附上次
  # 失败意见)与确需跨文件摘要裁剪时 full,且同批扇出共享底包、逐章只补增量(§1 原则 5)
  run_record: [context.md, result.json, eval.json, meta.json]
  gate_auto: [open_blocker_major_defects_zero_or_waived, due_gate_defects_closed,
              qa_hold_requires_waiver, human_checks_executed_or_waived]

# 并入主 DAG 时的联动处理(语义与执行纪律见 WORKFLOW.md §10.3 第 6 条)。
# orchestrator 在把 nv*/gn* 节点并入 runs/dag.json 的同一次改动中执行:
# 小说创作只依赖正史 bible/(文字设定),下列主流程节点均为视听制作专用,
# 全部未开工(pending/template/blocked)时整组置 skipped(写 skip_reason 含插件名),
# 免得后续排产误入与小说无关的分支;清单内存在任一已开工节点则视为视频制作进行中,一个也不跳。
# skipped 是挂起不是放弃:用户其后要求制作视频时恢复 pending 重新排产。
# g3(H1A)照常判定,skipped 依赖(p3-voice/p3-lighting)视为已满足。
main_dag_on_start:
  skip:                # p*- 为前缀通配(含按集展开后的逐集节点);g4–g10 为闸门节点精确 id
    - p3-voice         # 声纹选角(TTS 配音用)
    - p3-lighting      # 灯光设计(出图用)
    - p4-*             # 美术风格
    - p5-*             # 剧本改编(逐集剧本,视频专用;小说大纲走本流程 nv1-outline)
    - p6-*             # 导演分镜
    - p7-*             # 视觉生成
    - p8-*             # 音频
    - p9-*             # 剪辑合成
    - p10-*            # 成片终审
    - p11-*            # 视频发布
    - g4               # H2-美术风格锁定
    - g5               # H3-第1集剧本确认
    - g6               # H3A-分镜确认
    - g7               # H3B-视觉生成确认
    - g8
    - g9               # H4-首集成片确认
    - g10              # H5-发布签字

phases:
  - id: nv0
    name: 衍生立项
    tasks:
      - id: nv0-premise
        agent: 13-derivative-fiction/derivative-planner
        outputs: [derivative/premise.json]
        # canon_refs_valid:引用的正史 ID(CHAR-*/SCN-*/地名/势力/术语)必须真实存在;
        # divergence 声明的分歧点(if 线)视为本分支公理,不再与正史比对
        validation:
          auto: [schema, canon_refs_valid, timeline_anchor_defined, forbidden_zones_listed]
          rubric: creative_v1
          qa: [11-qa/world-consistency-qa]
      - { id: gn0, gate: true, depends_on: [nv0-premise] }

  - id: nv1
    name: 架构与文风          # 两任务并行,均依赖 gn0
    depends_on: [gn0]
    tasks:
      - { id: nv1-outline, agent: 13-derivative-fiction/novel-outline,
          outputs: [derivative/outline.json],
          validation: { auto: [schema, canon_refs_valid, arc_per_main_character],
                        rubric: writing_v1, qa: [11-qa/logic-qa] } }
      - { id: nv1-style, agent: 13-derivative-fiction/prose-style,
          outputs: [derivative/prose_style.md],
          validation: { rubric: creative_v1 } }
      - { id: gn1, gate: true, human: true, checkpoint: DH1-衍生企划与大纲确认,
          depends_on: [nv1-outline, nv1-style] }

  - id: nv2
    name: 章节规划
    depends_on: [gn1]
    tasks:
      - id: nv2-chapters
        agent: 13-derivative-fiction/chapter-planner
        outputs: [derivative/chapters_plan.json]
        # beats_assigned_once:大纲节拍 100% 分配到章且不重复(对账 outline.beats 全量)
        validation:
          auto: [schema, beats_assigned_once, chapter_length_budget_defined, hook_point_per_chapter]
          rubric: writing_v1
          qa: [01-story/hook]         # 断章钩子顾问会签(复用内置剧情组)
      - { id: gn2, gate: true, depends_on: [nv2-chapters] }

  - id: nv3
    name: 章节写作            # 试点章策略:首章走通并过 DH2 后,其余章方可批量并行
    depends_on: [gn2]
    for_each: chapter          # 按 chapters_plan.json 实例化(nv3-draft-chNNN / nv3-edit-chNNN)
    tasks:
      - { id: nv3-draft, agent: 13-derivative-fiction/prose-writer,
          outputs: ["derivative/chapters/{ch}.md"],
          validation: { auto: [chapter_length_in_budget, pov_matches_prose_style,
                               canon_refs_valid, new_canon_logged_to_delta],
                        rubric: writing_v1 } }
      - { id: nv3-edit, agent: 13-derivative-fiction/line-editor, depends_on: [nv3-draft],
          outputs: ["derivative/chapters/{ch}.md"],   # 润色版以新版本落同路径(version 管理)
          validation: { auto: [no_plot_change, length_delta_lte_15pct],
                        rubric: writing_v1, qa: [11-qa/prose-qa] } }
      - { id: gn3, gate: true, scope: book, human_on: first_chapter,
          checkpoint: DH2-首章试读确认, depends_on: [nv3-edit] }

  - id: nv4
    name: 全书终审
    depends_on: [gn3]
    tasks:
      - { id: nv4-logic, agent: 11-qa/logic-qa,
          outputs: [qa/reports/derivative/logic.json],  pass: blocker_eq_0 }
      - { id: nv4-world, agent: 11-qa/world-consistency-qa,
          outputs: [qa/reports/derivative/world.json],  pass: blocker_eq_0 }
      - { id: nv4-char, agent: 11-qa/character-consistency-qa,
          outputs: [qa/reports/derivative/character.json], pass: score_gte_85 }
      - { id: nv4-prose, agent: 11-qa/prose-qa,          # 全书抽检 + 跨章一致(与逐章会签不同粒度)
          outputs: [qa/reports/derivative/prose.json],  pass: score_gte_80 }
      - { id: nv4-delta, agent: 00-orchestration/memory-bible,
          outputs: [derivative/bible-delta/audit.json],  # delta 登记完整、canon 引用合法、零正史污染
          validation: { auto: [delta_entries_sourced, canon_refs_valid, canon_untouched] } }
      - { id: gn4, gate: true, human: true, checkpoint: DH3-衍生小说发布签字,
          depends_on: [nv4-logic, nv4-world, nv4-char, nv4-prose, nv4-delta] }

  - id: nv5
    name: 发布
    depends_on: [gn4]
    tasks:
      - { id: nv5-release, agent: 12-publishing/novel-release,
          outputs: [derivative/publish/],
          validation: { auto: [format_lint, chapters_complete, ascii_filename] } }

# 贯穿型服务与主流程一致(context/evaluation/version/memory-bible/orchestrator 钩子),见 agents/workflow.yaml services 段
