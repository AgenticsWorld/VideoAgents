<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="/static/i18n/i18n.js"></script>
<script>
/* 兜底:i18n 运行时未加载(如服务端未挂 /static)时保持中文界面可用 */
if(!window.I18N){
  window.I18N={lang:'zh',langs:{zh:'中文'},t:function(s){return s},
    f:function(s,p){p=p||{};return String(s).replace(/\{(\w+)\}/g,function(m,k){return k in p?p[k]:m})},
    setLang:function(){return Promise.resolve()}};
  window.t=function(s){return s};window.I18N_DICT={};
}
</script>
<style>
:root{--bg:#0f1117;--panel:#161a23;--border:#2a3040;--text:#dde3ee;--dim:#8b93a7;--accent:#6c9ef8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"PingFang SC",sans-serif;
  touch-action:none;overflow:hidden}
#app{position:relative;height:100%;display:flex;flex-direction:column}
/* 旋转类由 JS 按「视口方向 vs 手机物理方向」施加:视口被锁竖屏而手机横持时整体旋转
   ±90°(rot90=手机右沿朝上横持,rot-90=左沿朝上),获得横屏画板;指针坐标映射见 pos();
   布局尺寸(clientWidth 等)不受 transform 影响,fit() 不用改 */
#app.rot90,#app.rot-90{position:fixed;top:0;left:0;width:100vh;height:100vw;transform-origin:top left}
#app.rot90{transform:rotate(90deg) translateY(-100vw)}
#app.rot-90{transform:rotate(-90deg) translateX(-100vh)}
@supports (width:100dvh){
  #app.rot90,#app.rot-90{width:100dvh;height:100dvw}
  #app.rot90{transform:rotate(90deg) translateY(-100dvw)}
  #app.rot-90{transform:rotate(-90deg) translateX(-100dvh)}
}
/* 全屏作画:隐藏所有 UI,只留画布与退出按钮 */
#app.fs header,#app.fs #tools,#app.fs #form{display:none}
#app.fs #stage{padding:0}
#fs-exit{display:none;position:absolute;top:10px;right:10px;z-index:8;
  background:rgba(28,33,48,.88);color:var(--text);border:1px solid var(--border);
  border-radius:8px;padding:8px 14px;font-size:14px}
#app.fs #fs-exit{display:block}
header{padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;flex:none}
header .grp{font-weight:600;color:var(--accent)}
header .hint{color:var(--dim);font-size:11.5px}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px}
canvas{background:#fff;border-radius:6px;max-width:100%;max-height:100%;touch-action:none;
  box-shadow:0 0 0 1px var(--border)}
#tools{display:flex;gap:6px;padding:8px 10px;background:var(--panel);border-top:1px solid var(--border);
  flex:none;align-items:center;flex-wrap:wrap}
#tools button{background:#1c2130;color:var(--text);border:1px solid var(--border);border-radius:8px;
  padding:8px 14px;font-size:14px}
#tools button.on{background:var(--accent);color:#0b1020;border-color:var(--accent);font-weight:600}
#form{padding:8px 10px 14px;background:var(--panel);flex:none;display:flex;gap:8px}
#note{flex:1;background:#1c2130;color:var(--text);border:1px solid var(--border);border-radius:8px;
  padding:10px;font-size:14px;resize:none;height:52px}
#submit{background:var(--accent);color:#0b1020;border:0;border-radius:8px;padding:0 22px;
  font-size:15px;font-weight:600}
#submit:disabled{opacity:.45}
#toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#1c2130;
  border:1px solid var(--border);border-radius:10px;padding:10px 18px;display:none;z-index:9;
  max-width:88%;text-align:center}
#done{position:absolute;inset:0;background:rgba(15,17,23,.94);display:none;z-index:10;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
#done .msg{color:#4ade80;font-size:15px;line-height:1.7}
#done .sub{color:var(--dim);font-size:12.5px}
#done button{background:#1c2130;color:var(--text);border:1px solid var(--border);border-radius:8px;
  padding:10px 22px;font-size:14px}
</style>
</head>
<body>
<div id="app">
<header>
  <span>✏️ 手绘分镜</span><span class="grp" id="grp">…</span>
  <span class="hint">黑白线稿·标注空间关系(如"手从环中间伸出")</span>
</header>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="tools">
  <button id="pen" class="on">✏️ 细笔</button>
  <button id="pen2">🖊 粗笔</button>
  <button id="eraser">◻ 橡皮</button>
  <button id="undo">↩ 撤销</button>
  <button id="clear">🗑 清空</button>
  <button id="aspect">▭ 16:9</button>
  <button id="fs">⛶ 全屏</button>
</div>
<div id="form">
  <textarea id="note" placeholder="必填:这张线稿表达什么(例:手臂从黑色金属环的正中间伸出,朝向画面右侧)"></textarea>
  <button id="submit">提交</button>
</div>
<div id="toast"></div>
<div id="done">
  <div class="msg" id="done-msg"></div>
  <div class="sub">正在自动关闭页面…(若未关闭可手动关闭,或继续画)</div>
  <button id="done-more">✏️ 再画一张</button>
</div>
<button id="fs-exit">✕ 退出全屏</button>
</div>
<script>
const $=s=>document.querySelector(s);
const token=location.pathname.split('/').pop();
const cv=$('#cv'),ctx=cv.getContext('2d');
let W=1280,H=720,AR='16:9',strokes=[],cur=null,tool={size:4,erase:false};

// 画幅:长边固定 1280,按比例算短边;横幅▭ / 竖幅▯ 按钮可随时互切(a:b ↔ b:a)
function setAspect(a){
  const[aw,ah]=a.split(':').map(Number);
  if(!aw||!ah)return;
  AR=a;
  if(aw>=ah){W=1280;H=Math.round(W*ah/aw)}else{H=1280;W=Math.round(H*aw/ah)}
  cv.width=W;cv.height=H;
  $('#aspect').textContent=(aw>=ah?'▭ ':'▯ ')+a;
  applyRot();fit();redraw();
}

function toast(msg,ok){const t=$('#toast');t.textContent=msg;
  t.style.borderColor=ok?'#4ade80':'#f87171';t.style.display='block';
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600)}

async function init(){
  try{
    const r=await fetch('/api/draw/'+token);
    if(!r.ok)throw new Error((await r.json()).detail||r.status);
    const info=await r.json();
    $('#grp').textContent=info.project+' / '+info.ep+' / '+info.grp;
    setAspect(info.aspect||'16:9');
  }catch(e){toast('会话无效:'+e.message,false);$('#submit').disabled=true}
}
function fit(){
  const st=$('#stage'),pad=12;
  const sw=st.clientWidth-pad,sh=st.clientHeight-pad;
  const sc=Math.min(sw/W,sh/H);
  cv.style.width=(W*sc)+'px';cv.style.height=(H*sc)+'px';
}
// 方向自适应:页面方向跟随画幅——竖幅画板(如 9:16)页面始终保持垂直,不做横屏旋转;
// 横幅画板时,视口横屏(未锁定旋转)直接跟随系统,视口被锁竖屏时用重力传感器判断
// 手机实际怎么拿——横持则旋转 ±90°(方向随左横/右横),竖持则不旋转。
// 传感器不可用/未授权时,竖屏视口+横幅画板默认横屏(保持旧行为)
let PHYS=null,ROT=null;
function applyRot(){
  const vpPortrait=innerHeight>innerWidth;
  let rot=0;
  if(vpPortrait&&W>=H)rot=PHYS==='portrait'?0:(PHYS==='land-cw'?-90:90);
  if(rot===ROT)return;
  ROT=rot;
  $('#app').classList.toggle('rot90',rot===90);
  $('#app').classList.toggle('rot-90',rot===-90);
  fit();
}
function onDO(e){
  const b=e.beta,g=e.gamma;
  if(b==null||g==null)return;
  const ab=Math.abs(b),ag=Math.abs(g);
  let p=null;                       // 模糊区(斜持/平放)不判定,保持现状避免来回抖动
  if(ag>55&&ab<35)p=g>0?'land-cw':'land-ccw';   // gamma>0=右沿朝下(顺时针横持)
  else if(ab>55&&ag<35)p='portrait';
  if(p&&p!==PHYS){PHYS=p;applyRot()}
}
if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){
  // iOS 13+:传感器需在用户手势里授权,首次触摸时申请(Safari 会记住本站的选择)
  const once=async()=>{removeEventListener('pointerdown',once,true);
    try{if(await DeviceOrientationEvent.requestPermission()==='granted')
      addEventListener('deviceorientation',onDO)}catch(_){}};
  addEventListener('pointerdown',once,true);
}else if(typeof DeviceOrientationEvent!=='undefined'){
  addEventListener('deviceorientation',onDO);
}
window.addEventListener('resize',()=>{applyRot();fit()});
applyRot();

// ⛶ 全屏作画:隐藏头部/工具栏/表单,只留画布;退出恢复
$('#fs').onclick=()=>{$('#app').classList.add('fs');fit()};
$('#fs-exit').onclick=()=>{$('#app').classList.remove('fs');fit()};

function redraw(){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const s of strokes){
    ctx.strokeStyle=s.erase?'#fff':'#000';ctx.lineWidth=s.size;
    ctx.beginPath();
    s.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    if(s.pts.length===1)ctx.lineTo(s.pts[0][0]+.1,s.pts[0][1]+.1);
    ctx.stroke();
  }
}
// 旋转态下 getBoundingClientRect 返回旋转后的外接框(宽高互换):
// rot90 画布 x 轴指向屏幕下方、y 轴指向屏幕左方;rot-90 相反。按此映射回画布坐标
function pos(e){
  const r=cv.getBoundingClientRect();
  if(ROT===90)return[(e.clientY-r.top)*W/r.height,(r.right-e.clientX)*H/r.width];
  if(ROT===-90)return[(r.bottom-e.clientY)*W/r.height,(e.clientX-r.left)*H/r.width];
  return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);
  cur={size:tool.erase?tool.size*6:tool.size,erase:tool.erase,pts:[pos(e)]};
  strokes.push(cur);redraw()});
cv.addEventListener('pointermove',e=>{if(!cur)return;e.preventDefault();
  cur.pts.push(pos(e));redraw()});
const end=()=>{cur=null};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);

function pick(id,fn){$(id).onclick=()=>{
  ['#pen','#pen2','#eraser'].forEach(s=>$(s).classList.remove('on'));
  $(id).classList.add('on');fn()}}
pick('#pen',()=>{tool={size:4,erase:false}});
pick('#pen2',()=>{tool={size:10,erase:false}});
pick('#eraser',()=>{tool={size:10,erase:true}});
$('#undo').onclick=()=>{strokes.pop();redraw()};
$('#clear').onclick=()=>{strokes=[];redraw()};
$('#aspect').onclick=()=>{
  setAspect(AR.split(':').reverse().join(':'));
  if(strokes.length)toast(I18N.f('已切到 {a},已有笔迹保留原位(超界部分被裁掉,可撤销/清空)',{a:AR}),true);
};

$('#submit').onclick=async()=>{
  const text=$('#note').value.trim();
  if(!text)return toast('请先填写文字说明',false);
  if(!strokes.filter(s=>!s.erase).length)return toast('画布还是空的',false);
  $('#submit').disabled=true;
  try{
    const r=await fetch('/api/draw/'+token,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:cv.toDataURL('image/png'),text})});
    if(!r.ok)throw new Error((await r.json()).detail||r.status);
    const d=await r.json();
    strokes=[];$('#note').value='';redraw();
    // 提交成功即尝试自关页面(手机 Safari 手动关标签繁琐;扫码新开的无历史标签允许脚本自关)。
    // 关不掉(如页内有导航历史)则停留在成功遮罩,可手动关闭或点「再画一张」继续
    $('#done-msg').textContent=I18N.f('✅ 已保存 {f} 并注入组 prompt([Image {n}])',{f:d.saved,n:d.image_n});
    $('#done').style.display='flex';
    setTimeout(()=>window.close(),1200);
  }catch(e){toast('提交失败:'+e.message,false)}
  $('#submit').disabled=false;
};
$('#done-more').onclick=()=>$('#done').style.display='none';
init();
</script>
</body>
</html>
