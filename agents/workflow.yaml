# workflow.yaml — 小说→视频流水线 DAG(机器可读)
# 与 WORKFLOW.md 保持同步;WORKFLOW.md 是人读权威,本文件是 orchestrator 的执行输入。
# 约定:
#   for_each: 声明扇出维度(episode=每集一个任务实例, shot=每镜, character=每角色, scene=每场景, platform=每平台,
#             creature=每生物——实例来自 bible/creatures/index.json creatures[](CRE-*,登记为空即零实例,2026-08-26),
#             chapter_batch=每章节批——p0 解析扇出,批清单来自 story/chapter_manifest.json,
#             episode_scene / episode_creature=本集用到且概念图库里还没有的场景 / 生物——p6 按集出图扇出,已出过的跨集复用不再实例化,2026-09-30)
#   validation.auto      机器校验(schema/指标),不过直接退回
#   validation.rubric    evaluation Agent 的评分表,阈值默认 80
#   validation.qa        专项 QA Agent 会签
#   gate: 闸门任务,全部依赖通过才放行;human: true 表示需用户签字
#   scene_plates_requested: = NOT whitebox_requested(白模关闭,2026-09-17)——白模关闭项目的场景一致性走「场景图(正向/反向)」A 方案(docs/scene_plates.md):
#     p6-env-concept(每集开头,本集用到的场景;2026-09-30 前在 p4)出正向图 main_01.png 并登记 scene_plates.json;分镜每镜写 plate_view;p6-scene-plates 按项目 output.scene_plates(auto|single|pair,场景级可覆盖)
#     以正向图为母版补反向图 reverse_01.png(code/render_scene_plates.py);prompt 由 code/sync_scene_plates.py --write 挂图并逐镜点名(机检 scene_plate_bound)。白模开启时该节点不实例化、机检报 skipped
#   whitebox_requested: = 项目输出设置 output.spatial_blocking(「白模/人物精确空间位置」,默认关;2026-09-16 起未配置过的存量项目也视为关)——2026-09-07 起该开关的含义即
#     「用白模摄影机视角视频给视频生成定位人物」:开启时实例化 p6-scene-model / p6-whitebox / g6w / p6-whitebox-export / p6-shot-plates,
#     白模视频自动接成组视频生成的参考视频,分镜背景图自动接成组参考图;
#     2026-09-09 顺序:p6-whitebox 只编译(--compile-only)供预览页审看 → 用户签字 g6w「H3W-白模确认」→ p6-whitebox-export 导出 camera.mp4(2026-09-10 起同派 whitebox-staging,原 whitebox-export 工位已并入)
#     → p6-shot-plates 生成分镜背景图(code/render_shot_plates.py)→ g6「H3A-分镜确认」;
#     关闭时不实例化以上白模节点，并从 g6 移除对应依赖（同其他 condition 节点）。用户工单单独要求白模预演时同此。
#   g7p「H3V-视频提示词确认」(2026-10-05,每集):本集全部组 p7-prompt 关单 → 用户在「🎦 分镜预览」页审看各组视频提示词并签字 → 才派 p7-image / p7-video;
#     宿主硬校验 video_prompt_signed(genmedia video)与签字前置(缺提示词的组 → 拒签)见 p7 段注释与 modules/prompt_gate.py
#   transition_design_enabled: = 本集生效「过场模式」≠ minimal(settings.json#transitions.mode,集级 episode.json#transitions_mode 覆盖;
#     `python3 code/transition_design.py mode --project <slug> --ep epNN` 的 mode)——开启时实例化 p6-transition-design(07-directing/transition-design)
#     并加进 g6 依赖;极简 = 不实例化、g6 不因缺它而 HOLD(2026-09-26,docs/transition_design.md)
#   dialogue_direction_enabled: = 项目输出设置 output.dialogue_tts 开启(或 output.dialogue_voice=dubbing)且本集 shot_list 有对白——
#     开启时实例化 p6-dialogue-direction(07-directing/dialogue-direction)并加进 g6 依赖;否则不实例化、g6 不因缺它而 HOLD
#     (2026-10-02,WORKFLOW.md §8A「台词演法」)
#   transition_clips_requested: = H3A 定稿的 shot_list 里含需视频生成的过场插入段(establishing source.mode=i2v / bridge;
#     `python3 code/transition_design.py clips --project <slug> --ep epNN` 列出非空)——只在模式允许生成式过场(电影感 / 自定义勾选)时可能为真;
#     真时实例化 p7-transition-clips(08-video-gen/video-generation,每集)并加进 g7 依赖;假 = 不实例化、g7 不因缺它而 HOLD
#   offscreen_lines_present: = 项目输出设置 output.sound_split ≠ off 且本集定稿 shot_list 有 dialogue_lines[].placement ∈ os|vo 的画外 / V.O. 句
#     (`python3 code/offscreen_lines.py plan --project <slug> --ep epNN --json` 的 lines 非空)——真时实例化 p8-offscreen(09-audio/voice-generation,每集)
#     并加进 p8-mix 依赖;假 = 不实例化、p8-mix 不因缺它而 HOLD(2026-10-03,WORKFLOW.md §8D「声画分离」,docs/sound_split.md)

version: 1
defaults:
  eval_threshold: 80
  max_retries: 3
  on_fail: escalate_human
  # 运行记录三件套(细则 WORKFLOW.md §6.1):任务关单前 runs/<task_id>/ 必须齐备,缺一不得置 done/passed。
  # 上下文由 orchestrator 内联进工单本体(instruction/inputs,§1 原则 5),不另落 context.md(2026-09-08 上下文管家 Agent 已删除)
  run_record: [result.json, eval.json, meta.json]
  # 闸门通用机检(WORKFLOW.md §7 闸门放行硬约束):对 g0–g10 一律附加
  gate_auto: [open_blocker_major_defects_zero_or_waived, due_gate_defects_closed,
              qa_hold_requires_waiver, human_checks_executed_or_waived]

phases:
  - id: p0
    name: 摄入与立项
    tasks:
      - id: p0-init
        agent: 00-orchestration/workflow-orchestrator
        outputs: [runs/dag.json]
        validation: { auto: [dag_acyclic, paths_valid] }
      - id: p0-bible-init
        agent: 00-orchestration/memory-bible
        depends_on: [p0-init]
        outputs: [bible/]
      # p0 解析走「分章 map + 全局 merge」(2026-07-23 改版,治整本单任务上下文溢出):
      # scan 产章节批清单 → parse 按批并行结构化 → merge 机械拼装出总表。
      # 不设字数阈值分支——短篇就是少数几批,统一走这条路;粒度由 scan 的分批逻辑控制。
      - id: p0-scan
        agent: 01-story/novel-parser
        depends_on: [p0-init]
        outputs: [story/chapter_manifest.json]
        validation:
          auto: [schema, chapter_files_coverage_100, batch_word_count_in_range]
      - id: p0-parse
        agent: 01-story/novel-parser
        for_each: chapter_batch      # 按 chapter_manifest.batches 实例化(p0-parse-bNN)
        depends_on: [p0-scan]
        outputs: ["story/structured_story/"]   # 本批各章分片 chNNN.json,每章一文件
        validation:
          auto: [schema, batch_chapter_coverage_100, speaker_missing_lt_2pct]
          rubric: extraction_v1
          threshold: 85
      - id: p0-merge
        agent: 01-story/novel-parser
        depends_on: [p0-parse]
        outputs: [story/structured_story.json]   # 下游契约不变:仍产总表;分片保留供按章裁剪
        validation:
          auto: [schema, chapter_coverage_100, ids_unique_across_shards, speaker_missing_lt_2pct]
      - id: g0
        gate: true
        depends_on: [p0-merge, p0-bible-init]

  - id: p1
    name: 剧情理解
    depends_on: [g0]
    tasks:
      - { id: p1-structure, agent: 01-story/story-structure, outputs: [story/story_graph.json],
          validation: { auto: [chapter_refs_valid], rubric: analysis_v1, qa: [11-qa/logic-qa] } }
      - { id: p1-events, agent: 01-story/event, outputs: [story/events.json],
          validation: { auto: [event_ids_unique, required_fields], rubric: extraction_v1 } }
      - { id: p1-timeline, agent: 01-story/timeline-story, depends_on: [p1-events],
          outputs: [story/story_timeline.json],
          validation: { auto: [no_temporal_conflicts], qa: [11-qa/timeline-qa] } }
      - { id: g1, gate: true, depends_on: [p1-structure, p1-events, p1-timeline],
          validation: { auto: [events_mapped_to_graph_and_timeline] } }

  - id: p2
    name: 世界圣经
    depends_on: [g1]
    tasks:
      - { id: p2-world,      agent: 02-worldbuilding/world,             outputs: [bible/world.json] }
      - { id: p2-timeline,   agent: 02-worldbuilding/timeline,          outputs: [bible/timeline.json] }
      - { id: p2-geography,  agent: 02-worldbuilding/geography,         outputs: [bible/geography.json] }
      - { id: p2-religion,   agent: 02-worldbuilding/religion,          outputs: [bible/religion.json] }
      - { id: p2-culture,    agent: 02-worldbuilding/culture,           outputs: [bible/culture.json] }
      - { id: p2-political,  agent: 02-worldbuilding/political,         outputs: [bible/politics.json] }
      - { id: p2-economy,    agent: 02-worldbuilding/economy,           outputs: [bible/economy.json] }
      - { id: p2-magic,      agent: 02-worldbuilding/magic-cultivation, outputs: [bible/cultivation.json],
          validation: { auto: [rank_order_acyclic] } }
      - { id: p2-dictionary, agent: 02-worldbuilding/dictionary,        outputs: [bible/dictionary.json],
          validation: { auto: [terms_unique] } }
      # 共同校验(orchestrator 对 p2-* 统一附加):
      #   auto: [schema, source_refs_required, no_unknown_placeholder]; rubric: extraction_v1
      # no_unknown_placeholder(WORKFLOW.md §1 原则 10):制作必需字段值禁 UNKNOWN/未知/待定/TBD/留空——
      # 原文与上游均无依据时 Agent 须自行发挥设计定值并标 inferred:true+reason 后继续,占位即退回;
      # 剧情刻意不揭示的悬念如实记「原文刻意未揭示」不算占位,但同实体制作字段仍须定值
      # cross_refs_valid 覆盖全部 ID 命名空间(ev*/CHAR-*/SCN-*/地名/势力/术语),
      # 任何引用指向不存在的 ID 即 FAIL(WORKFLOW.md §4 Phase 2)
      - { id: p2-merge, agent: 00-orchestration/memory-bible,
          depends_on: [p2-world, p2-timeline, p2-geography, p2-religion, p2-culture,
                       p2-political, p2-economy, p2-magic, p2-dictionary],
          outputs: [bible/@v1],
          validation: { auto: [cross_refs_valid_all_namespaces, dictionary_hit_100pct, no_unknown_placeholder], qa: [11-qa/world-consistency-qa, 11-qa/timeline-qa] } }
      - { id: g2, gate: true, human: true, checkpoint: H1-世界圣经确认, depends_on: [p2-merge] }

  - id: p3
    name: 角色与资产
    depends_on: [g2]
    tasks:
      - { id: p3-char-index, agent: 03-characters/character-manager,
          outputs: [bible/characters/index.json],
          validation: { auto: [ids_unique, alias_unambiguous], qa: [11-qa/character-consistency-qa] } }
      - { id: p3-appearance, agent: 03-characters/appearance, for_each: character, depends_on: [p3-char-index],
          outputs: ["bible/characters/{id}/appearance.json"], validation: { rubric: extraction_v1 } }
      - { id: p3-growth, agent: 03-characters/character-growth, for_each: character, depends_on: [p3-appearance],
          outputs: ["bible/characters/{id}/age_versions.json"], validation: { auto: [timeline_spans_valid] } }
      - { id: p3-personality, agent: 03-characters/personality, for_each: character, depends_on: [p3-char-index],
          outputs: ["bible/characters/{id}/personality.json"], validation: { rubric: analysis_v1, qa: [11-qa/logic-qa] } }
      - { id: p3-relationship, agent: 03-characters/relationship, depends_on: [p3-char-index],
          outputs: [bible/characters/relationship.json], validation: { auto: [edge_ids_valid] } }
      - { id: p3-voice, agent: 03-characters/voiceprint, for_each: character,
          depends_on: [p3-personality, p3-appearance],
          outputs: ["bible/characters/{id}/voice.json"], validation: { qa: [11-qa/audio-qa] } }
      - { id: p3-dialogue-style, agent: 03-characters/dialogue-style, for_each: character, depends_on: [p3-char-index],
          outputs: ["bible/characters/{id}/dialogue_style.json"],
          validation: { auto: [style_hit_rate_gte_80], rubric: analysis_v1 } }
      - { id: p3-creature, agent: 04-creatures/creature, outputs: [bible/creatures/creature.json] }
      - { id: p3-mount, agent: 04-creatures/mount, depends_on: [p3-creature], outputs: [bible/creatures/mount.json] }
      - { id: p3-scene-index, agent: 05-scenes/scene, outputs: [bible/scenes/index.json],
          validation: { auto: [ids_unique, geography_refs_valid] } }
      - { id: p3-environment, agent: 05-scenes/environment, for_each: scene, depends_on: [p3-scene-index],
          outputs: ["bible/scenes/{id}/environment.json"], validation: { auto: [season_time_consistent] } }
      - { id: p3-architecture, agent: 05-scenes/architecture, for_each: scene, depends_on: [p3-scene-index],
          outputs: ["bible/scenes/{id}/architecture.json"], validation: { qa: [11-qa/visual-qa] } }
      - { id: p3-lighting, agent: 05-scenes/lighting, for_each: scene, depends_on: [p3-environment],
          outputs: ["bible/scenes/{id}/lighting.json"], validation: { qa: [11-qa/visual-qa] } }
      - { id: g3, gate: true, human: true, checkpoint: H1A-角色与资产确认,
          depends_on: [p3-appearance, p3-growth, p3-personality, p3-relationship, p3-voice,
                       p3-dialogue-style, p3-mount, p3-environment, p3-architecture, p3-lighting],
          validation: { auto: [all_refs_resolve, no_unknown_placeholder], qa: [11-qa/character-consistency-qa] } }

  - id: p4
    name: 美术风格
    depends_on: [g3]
    # 本阶段全组任务的额外输入:refs/(用户参考图,约定与优先级见 WORKFLOW.md §2)
    # 用户参考图 > Agent 自行发挥;凡引用须在产物 meta 记 user_refs
    tasks:
      - { id: p4-style, agent: 06-art/art-director, outputs: [bible/style.json], validation: { rubric: creative_v1 } }
      - { id: p4-char-concept, agent: 06-art/character-concept, for_each: character, depends_on: [p4-style, p4-costume],
          # 2026-08-26 起依赖 p4-costume:定稿 sheet.png 的着装 = costumes.json 默认装 visual_en 逐字入 prompt(此前二者并行,人设图着装与默认装只能靠事后对齐)
          outputs: ["assets/concepts/characters/{id}/"],
          validation: { auto: [appearance_fields_match, default_costume_in_prompt], qa: [11-qa/visual-qa, 11-qa/character-consistency-qa] } }
      - { id: p4-costume-sheet, agent: 06-art/costume-concept, for_each: character, depends_on: [p4-char-concept, p4-costume],
          # 服装 sheet(2026-08-26):以定稿 sheet.png 为形象锚,按 costumes.json 该角色每套非默认服装各出整版四视图 sheet_<COS-id>.png,
          # 默认装登记复用 sheet.png;台账 costume_sheets.json 是 p6 分镜挂图 / §6A 审计 / p7 refs / 预览页取图的唯一入口
          # 分龄/异体时期无基准 sheet_<tag>.png 的套装记 blocked_on 回派 character-concept,不拿现有 sheet 硬当锚
          outputs: ["assets/concepts/characters/{id}/costume_sheets.json"],
          validation: { auto: [costume_sheet_coverage, costume_visual_en_in_prompt, costume_sheet_identity_ref], qa: [11-qa/visual-qa, 11-qa/character-consistency-qa] } }
      # 2026-09-30 按集出图:场景 / 道具 / 生物三类在 Phase 4 只做设定(场景设定 = p3 environment/architecture/lighting,生物设定 = p3 creature/mount,
      # 道具设定 = 本阶段 p4-prop 只写 bible/props.json 文字卡),**不出任何图**;出图挪到 Phase 6 每集开头,只出本集用到且库里还没有的
      # (p6-env-concept / p6-scene-model / p6-prop-concept / p6-creature-concept)。原因:首集做完常改风格,全书一次出齐的场景/道具/生物图会整批作废。
      # 角色人设图 / 服装 sheet 仍在本阶段出(H2 风格锁定靠它们看效果)。
      - { id: p4-prop, agent: 06-art/prop, depends_on: [p4-style], outputs: [bible/props.json],
          # 只写设定卡:剧情道具 scale 三字段(canonical_size/relative_anchor/prompt_token)、readable_face 三子字段等文字字段定值;
          # 道具图 main_01.png 本阶段不出,由 p6-prop-concept 按集出(2026-09-30);比例锚图 scale_ref_01.png 2026-10-05 停出
          validation: { auto: [plot_props_coverage_100, prop_scale_fields_defined, no_unknown_placeholder] } }
      - { id: p4-costume, agent: 06-art/costume, depends_on: [p4-style], outputs: [bible/costumes.json],
          validation: { auto: [no_unknown_placeholder] } }
      - { id: p4-color-script, agent: 06-art/color-script, depends_on: [p4-style, p5-episode-plan],
          outputs: [bible/color_script.json], validation: { auto: [color_script_ok], rubric: creative_v1, qa: [06-art/art-director] } }   # color_script_ok = code/check_color_script.py --strict(字段契约 2026-09-17 锁死:episode_id/key_palette/acts[].event_refs·scene_ids·palette 色值/variants.<kind>.grade)
      - { id: p4-aspect, agent: 06-art/aspect-ratio, outputs: [bible/aspect_ratio.json],
          validation: { auto: [platform_spec_match] } }
      - { id: g4, gate: true, human: true, checkpoint: H2-美术风格锁定,
          depends_on: [p4-char-concept, p4-costume-sheet, p4-prop, p4-costume, p4-color-script, p4-aspect] }   # 场景/道具/生物概念图不在本闸门(2026-09-30 改按集出,见 p6-*-concept)

  - id: p5
    name: 剧本改编          # 与 p4 并行,均依赖 g3
    depends_on: [g3]
    tasks:
      - { id: p5-episode-plan, agent: 01-story/episode-planner, outputs: [story/episode_plan.json],   # 2026-09-12 §5A:事件「分配」改「归类+取舍」,每集 treatments[] 逐事件定 dramatize/mention/merge/cut;机检 code/verify_episode_plan.py --project
          validation: { auto: [events_classified_once, treatments_complete, dramatize_within_cap, hook_points_dramatized, cut_not_on_causal_chain, merge_target_valid, duration_in_budget], rubric: writing_v1 } }
      - { id: p5-screenplay, agent: 01-story/screenplay, for_each: episode, depends_on: [p5-episode-plan],
          outputs: ["story/episodes/{ep}/screenplay.md"],   # 只把 dramatize 事件写成场,每场首行 [事件] 行;机检 code/check_screenplay_events.py --project --ep(§5A,2026-09-12)
          validation: { auto: [id_refs_valid, dramatized_events_covered, cut_events_absent, scene_has_dramatized_event], rubric: writing_v1, qa: [11-qa/logic-qa] } }
      - { id: p5-dialogue, agent: 01-story/dialogue-rewrite, for_each: episode, depends_on: [p5-screenplay],
          validation: { auto: [style_hit_rate_gte_80, line_duration_fits] } }   # 2026-10-03 起每句对白行元信息随 emotion 写 pace: fast|medium|slow(语速档),估时按时间尺(modules/time_cost.py)   # line_duration_fits:code/check_dialogue_fit.py 无 shot_list 时的「仅剧本层」模式(line_le_cap + line_est_consistent,2026-08-30)
      - { id: p5-narration, agent: 01-story/narration, for_each: episode, depends_on: [p5-dialogue],
          condition: narration_enabled,   # 「📤 输出设置」旁白开关(默认关;2026-09-16 起未配置过的存量项目也视为关);关=用户约定全片无任何旁白,不派发、g5 不因缺我而 HOLD(§7D)
          outputs: ["story/episodes/{ep}/narration.md"],   # 每条带场景锚点 + est_duration_s(按 narrator 声线实测语速估算)
          validation: { auto: [pov_consistent_100, every_entry_anchored_with_est_duration], qa: [11-qa/logic-qa] } }
      - { id: p5-hooks, agent: 01-story/hook, for_each: episode, depends_on: [p5-narration],
          outputs: ["story/episodes/{ep}/hooks.json"], validation: { rubric: creative_v1, qa: [human_pick] } }
      # 时间预算(2026-10-03,docs/time_cost.md):分时长前宿主按时间尺算每场内容需求(台词估时含开口前后余量 + 动作节拍单价),
      # Σ需求 > 集预算按用户拍板三步:加长单集(≤ 设置「可加长单集」%,pacing 写 duration_budget_s + duration_policy)> 精简台词
      # (trim_targets 回派 dialogue-rewrite)> 合并动作短镜(merge_candidates 交 storyboard)。code/check_time_budget.py --scope script
      - { id: p5-pacing, agent: 01-story/pacing, for_each: episode, depends_on: [p5-hooks],
          outputs: ["story/episodes/{ep}/pacing.json", "story/episodes/{ep}/time_budget.json"],
          validation: { auto: [total_duration_pm_10pct, scene_time_budget_ok, episode_time_budget_ok,
                               pacing_budget_adopted, pacing_extension_within_cap, pacing_total_matches_budget],
                        qa: [07-directing/director] } }
      - { id: p5-breakdown, agent: 01-story/timeline-story, for_each: episode, depends_on: [p5-pacing],
          outputs: ["story/episodes/{ep}/script_breakdown.json"],   # 剧本拆解表(2026-09-11):剧情层产物的结构化视图,供「剧本预览」页与 H3 审看;只读拆解,不改剧本
          validation: { auto: [script_breakdown_ok] } }   # code/check_script_breakdown.py --project --ep
      - { id: g5, gate: true, human: true, checkpoint: H3-第1集剧本确认, depends_on: [p5-breakdown] }

  - id: p6
    name: 导演分镜
    depends_on: [g4, g5]
    for_each: episode          # 整个 phase 按集实例化;首集先行(pilot 策略)
    tasks:
      # ── 按集出图(2026-09-30):场景 / 道具 / 生物概念图只出「本集用到且库里还没有」的,已出过的跨集直接复用(不重出、不改)──
      #   本集用到的实体:场景 = story/episodes/{ep}/script_breakdown.json scenes[].scene_id(缺则取 screenplay.md 场头 SCN-*);
      #   道具 / 生物 = 定稿 shot_list(每镜 props / creatures[]、组 creatures_union),所以排在 p6-shots 之后。
      #   库里已有 = assets/concepts/{scenes,props,creatures}/<id>/ 主目录已有该实体所需视图(判定口径同 §6A ①,candidates/ 不算);
      #   本集零缺口 = 零实例:orchestrator 不实例化该节点,下游对它的依赖视同满足(同 creature 登记为空即零实例的惯例)。
      - { id: p6-env-concept, agent: 06-art/environment-concept, for_each: episode_scene,   # 实例 = 本集场景 − 库里已有布局包/正向图的场景
          outputs: ["assets/concepts/scenes/{id}/"],
          # 产物形态同原 p4-env-concept:白模开启 → 布局包 layout_top.png + layout.json;关闭 → 正向图 main_01.png + scene_plates.json(pair 模式同出反向图)
          validation: { auto: [scene_layout_pack_ok, scene_plates_complete], qa: [11-qa/visual-qa] } }   # 白模开启:code/blocking_map_check.py --scene <id>;白模关闭:code/render_scene_plates.py --status --scene <本集场景…>
          # (须用 --scene 列本集场景,不能用 --ep——此时本集还没有 shot_list,--ep 取不到场景会空跑 PASS);两项各自在另一模式下 skipped
      - { id: p6-scene-model, agent: 05-scenes/scene-modeling, for_each: episode_scene,
          condition: whitebox_requested, depends_on: [p6-env-concept],   # 实例 = 本集场景 − 已有 bible/scenes/{id}/whitebox.json 的场景
          outputs: ["bible/scenes/{id}/whitebox.json"],
          validation: { auto: [whitebox_layout_ok], qa: [11-qa/visual-qa] } }   # code/whitebox_layout_check.py --scene <id>;更新已有场景时对引用它的已有分镜集逐集跑 render_whitebox.py --scene <id>(自动刷新两路 MP4)
      #   拆解表外的场景(storyboard / shot_list 引用了但 script_breakdown 没有的 SCN-*):orchestrator 发现即为其追加 p6-env-concept(+白模开启时 p6-scene-model)实例;
      #   白模开启时 storyboard 的 blocking_map 与 p6-whitebox 都要等这些实例完成(布局包 / whitebox.json 缺失 = blocking_map_present / 白模编译必然失败)。
      - { id: p6-prop-concept, agent: 06-art/prop, depends_on: [p6-shots],   # 本集 shot_list 出场剧情道具 − 库里已有道具图 main_01.png 的道具
          outputs: ["assets/concepts/props/{id}/", bible/props.json],   # 按 props.json 设定卡每件只出道具图 main_01.png(不出尺寸对比图,尺寸靠 scale.prompt_token 文字,2026-10-05),回写图路径;设定卡缺条目的先补卡
          # 道具图无人物红线(2026-08-18):道具全部参考图不出现人物/身体局部,--ref 禁传角色/服装概念图
          validation: { auto: [prop_scale_defined, prop_image_no_person, prop_readable_face_defined], qa: [11-qa/visual-qa] } }
      - { id: p6-creature-concept, agent: 06-art/creature-concept, for_each: episode_creature, depends_on: [p6-shots],
          # 实例 = 本集 shot_list creatures_union 的 CRE-* − 库里已有 sheet.png 且本集所需阶段变体 sheet_<stage>.png 也在的生物
          # 坐骑图无骑手红线;目录键用 CRE-*;只补本集用到的阶段变体,其余阶段等用到的集再出
          outputs: ["assets/concepts/creatures/{id}/"],
          validation: { auto: [creature_identifiers_match, creature_image_no_person, creature_stage_variants_ok], qa: [11-qa/visual-qa] } }
      - { id: p6-plan, agent: 07-directing/director, outputs: ["directing/{ep}/directing_plan.md"],
          validation: { rubric: creative_v1, qa: [06-art/art-director] } }
      - { id: p6-storyboard, agent: 07-directing/storyboard, depends_on: [p6-plan, p6-env-concept],   # 白模开启时 blocking_map 引用本集场景 layout.json 地标,须等本集场景布局包出齐
          outputs: ["directing/{ep}/storyboard.json"],   # 含 groups_draft(生成组草案)、每组 scene_refs/blocking_map(人物起点/动线/终点标注,引用场景 layout.json 地标)、每组 costumes(角色→COS-id,2026-08-26)、每镜 view_tile
          validation: { auto: [scene_coverage_100, every_shot_in_group, blocking_map_present, creature_refs_valid,
                               costume_refs_valid, transition_ok,
                               shot_time_budget_ok, group_density_ok], rubric: visual_plan_v1 } }   # 时间尺(2026-10-03):code/check_time_budget.py --scope shots --source storyboard   # transition_ok:每组按导演转场清单登记 transition_in(受控枚举)/narrative_block(闪回等块成对),WORKFLOW.md §9C(2026-08-28)   # costume_refs_valid:每组每个出场角色有 costumes[CHAR]=合法 COS-id(属该角色);换装点不得落在组内(2026-08-26)   # blocking_map_present:code/blocking_map_check.py --source storyboard --strict(2026-09-07 起只机检、不再渲染动线草图)
      - { id: g6s, gate: true, human: true, checkpoint: H3S-故事板确认, depends_on: [p6-storyboard] }   # 2026-09-11:用户在「📋 故事板」页(/preview/board)看分镜草案逐场逐镜表(可按需出铅笔草图,草图不是签字前置)后签字;未签字不派 shot-planning;签字后 storyboard.json 又改动则页面标「签字已过期」,orchestrator 重新建单
      - { id: p6-shots, agent: 07-directing/shot-planning, depends_on: [g6s],
          outputs: ["directing/{ep}/shot_list.json"],    # 含 generation_groups(定稿生成组)、narration_anchors(旁白挂点定稿:每条旁白→镜/组区间+可用画面窗口,窗口扣画内句 + 同窗画外句)、逐组 audio_plan(dialogue/voice_over/ambient_only;narration_over 为 voice_over 旧名)、每句 dialogue_lines[].placement(on/os/vo,声画分离 §8D,2026-10-03)
          validation: { auto: [duration_sum_pm_10pct, id_refs_valid, shot_ids_unique,
                               groups_cover_all_shots, group_shots_contiguous_same_scene,
                               group_duration_4_15_int, group_characters_lte_4,
                               narration_anchors_cover_all, narration_window_gte_est_x1.15,   # 旁白开关关闭时两项自动跳过(skipped: narration off),且 audio_plan 禁 narration_over(code/check_generation_groups.py)
                               group_audio_plan_defined, ambient_only_groups_justified,
                               dialogue_est_fits_group_x0.7,   # 2026-08-30 起由 code/check_dialogue_fit.py 执行(dialogue_fit_group),超限不再自查放行——定稿后固定进 p6-dialogue-fit 精简环节
                               shot_time_budget_ok, group_density_ok,   # 时间尺(2026-10-03):每镜镜长 ≥ 节拍单价 + 台词估时 + 余量;平均镜长 <1.5s 的密集组 ≤15s(code/check_time_budget.py --scope shots;group_density_ok 也内置于 check_generation_groups.py)
                               creature_refs_valid,   # 每镜 creatures[] / 组 creatures_union 引用须存在于 bible/creatures/index.json(2026-08-26)
                               costume_refs_valid,    # 每镜 costumes{CHAR:COS} / 组 costumes_by_char 合法且组内同角色同一套;换装点只能落在组边界(costume_change_on_group_boundary,2026-08-26)
                               transition_ok,         # 组入口转场 transition_in:类型枚举/时长范围/非硬切必填 intent+reason/Σ可渲染 ≤ 集预算 1%/narrative_block 成对连续(code/check_generation_groups.py 内置,WORKFLOW.md §9C,2026-08-28)
                               speakers_le_3,         # §8A:dialogue 组画内说话人 ≤3(2026-10-03 起落成代码 code/check_generation_groups.py;placement=os|vo 的画外句不计,第四人插话可按 §8D D3 转画外)
                               placement_valid, placement_speaker_is_cast, placement_reason_valid, offscreen_fit, post_voice_no_overlap,   # 声画分离(2026-10-03,WORKFLOW.md §8D,code/offscreen_lines.py check):os/vo 句 heard_in 同组、speaker 为本集 cast 人物编号、分镜转画外须带白名单 trigger、画外句装进 heard_in 窗口(扣画内句 + 同窗旁白)且与旁白不同窗抢位;output.sound_split=off 时 skipped
                               native_lead_valid,   # 原生先入(三期 2026-10-03,§8D ⑨,code/sync_native_leads.py check / 内置于 check_generation_groups):画内句 dialogue_lines[].native_lead 须满足 P1–P8(sound_split=auto、视频原声、Seedance 2.5、同组前一镜无说话人无台词、本镜首句、s ≤ min(前镜,1.0,估时×40%)、先入文本不含表演触发词);只开放 J
                               blocking_map_present] } }   # 继承 storyboard blocking_map/view_tile 并按定稿组重切(code/blocking_map_check.py --strict,2026-08-19;2026-09-07 起不再渲染 blocking_maps/*.png,人物空间位置由 p6-whitebox 白模参考视频承担)   # 旁白/对白估时级适配 + 无声组核查(WORKFLOW.md §7D ①,H3A 签字前;ambient_only 组必附 silent_rationale,讲不清叙事的回派 narration 补写并写回 narration.md;dialogue 组 Σ台词估时 ≤ 组时长×0.7,超限优先回派 dialogue-rewrite 改短台词——台词超长会迫使视频模型赶词提速)
      # 对白时长校验修正环节(2026-08-30,WORKFLOW.md §7D ①′):对白在 Phase 5 写完、镜头时长到 Phase 6 才定,长度必然漂移。
      # 定稿镜头表后固定跑 code/check_dialogue_fit.py:PASS 即关单(报告落盘);超限组按报告 trim_targets 由 dialogue-rewrite
      # 逐句精简(只动对白文本层:screenplay.md 对白层 + dialogue.md + shot_list dialogue_lines 文本镜像;不动镜/组结构),
      # --write-est 同步估时后复检至 PASS;3 轮仍装不下 = 上报 orchestrator 回派 shot-planning 调镜时长/拆组(分镜变更)。
      # blocking(表演触发词 trigger.line_ref/word 取自台词)与 H3A 签字均以本节点 PASS 为前置;严禁指望模型压语速消化。
      - { id: p6-dialogue-fit, agent: 01-story/dialogue-rewrite, depends_on: [p6-shots],
          outputs: ["directing/{ep}/dialogue_fit.json", "story/episodes/{ep}/screenplay.md", "story/episodes/{ep}/dialogue.md",
                    "directing/{ep}/shot_list.json"],   # 后三项仅超限精简时产生新版本(对白文本层 diff)
          validation: { auto: [dialogue_fit_group, dialogue_fit_shot, line_le_cap, line_est_consistent,
                               lines_text_match_source,   # 以上 5 项 code/check_dialogue_fit.py --project --ep 全批执行,退出码 0 为 PASS
                               style_hit_rate_gte_80, non_dialogue_layer_diff_zero],   # 精简后风格命中率不降、非对白层零改动
                        qa: [11-qa/logic-qa] } }   # 仅精简发生时会签:改短不得引入逻辑断裂
      # 台词演法(2026-10-02,WORKFLOW.md §8A):对白定稿后逐句写「导演式」演法 + 语速档,宿主算目标时长并按镜长收口,存进 shot_list
      # dialogue_lines[].delivery;对白语音库 / 后期配音按它合成(情绪到位、时长落在镜长内)。只走宿主 CLI code/dialogue_direction.py
      # (plan → apply → check),工位不直接编辑 shot_list、不合成语音。用户可在分镜预览页「对白语音」面板逐句改。
      - { id: p6-dialogue-direction, agent: 07-directing/dialogue-direction, condition: dialogue_direction_enabled,
          depends_on: [p6-shots, p6-dialogue-fit],   # 台词再改 = 演法作废(text_sha 不符),需重跑本节点
          outputs: ["directing/{ep}/shot_list.json"],   # 只动 dialogue_lines[].emotion / delivery
          validation: { auto: [dialogue_direction_bound] } }   # code/dialogue_direction.py check:每句有说话人编号的对白都有有效演法;目标时长超镜长只 WARN
      - { id: p6-camera, agent: 07-directing/camera-movement, for_each: shot, depends_on: [p6-shots],
          outputs: ["directing/{ep}/shots/{shot}/camera.json"], validation: { auto: [movement_supported] } }
      - { id: p6-composition, agent: 07-directing/composition, for_each: shot, depends_on: [p6-shots],
          outputs: ["directing/{ep}/shots/{shot}/composition.json"],
          validation: { qa: [11-qa/visual-qa] } }
      - { id: p6-cinematography, agent: 07-directing/cinematography, depends_on: [p6-plan],
          outputs: ["directing/{ep}/cinematography.json"], validation: { qa: [06-art/art-director] } }
      - { id: p6-blocking, agent: 07-directing/blocking, for_each: shot, depends_on: [p6-shots, p6-dialogue-fit],   # performance.trigger 取自定稿台词,须待对白精简完成(2026-08-30)
          outputs: ["directing/{ep}/shots/{shot}/blocking.json"],
          validation: { auto: [presence_consistent_with_timeline, blocking_on_map,
                               beat_budget_ok, beat_spacing_ok] } }   # blocking_on_map:本镜站位落在组 blocking_map 动线上,地标词取场景 layout.json name_en;beat_*:时间尺节拍预算(2026-10-03,code/check_time_budget.py --scope blocking)
      - { id: p6-continuity, agent: 07-directing/continuity-planning,
          depends_on: [p6-camera, p6-composition, p6-blocking],
          outputs: ["directing/{ep}/continuity_plan.json"],   # 含 group_transitions(组间衔接检查)
          validation: { auto: [axis_jumps_zero_or_waived, group_transitions_cover_all_adjacent,
                               transition_anchor_consistent],   # group_transitions 镜像 shot_list transition_in;可渲染转场边界 anchor=none,match_cut 核构图对位(§9C,2026-08-28)
                        qa: [11-qa/timeline-qa] } }
      - { id: p6-whitebox, agent: 07-directing/whitebox-staging, condition: whitebox_requested,
          depends_on: [p6-scene-model, p6-shots, p6-camera, p6-blocking, p6-continuity],
          outputs: ["directing/{ep}/whitebox_plans/", "directing/{ep}/whitebox/episode.json"],
          validation: { qa: [11-qa/visual-qa] } } # 2026-09-09:只写调度计划并 render_whitebox.py --compile-only 编译落盘 episode.json 供分镜预览页 3D 审看,不导出视频;禁止只交付 --check-only。
      - { id: g6w, gate: true, human: true, checkpoint: H3W-白模确认, condition: whitebox_requested, depends_on: [p6-whitebox] }   # 用户在「分镜设定」预览页逐组审看 3D 白模(机位/走位/朝向/穿模)后签字;签字后才导出 camera.mp4、再生成分镜背景图(有出图费用);签字卡自动带白模待决项摘要,阻断级未清宿主拒签、建议级签字即接受默认取舍(docs/whitebox.md「待决项与用户裁决」)
      - { id: p6-whitebox-export, agent: 07-directing/whitebox-staging, condition: whitebox_requested, depends_on: [g6w],   # 2026-09-10:导出工单派给白模调度本岗(SOUL「视频导出」节),原 07-directing/whitebox-export 已删除
          outputs: ["assets/whitebox/{ep}/"],
          validation: { auto: [whitebox_videos_exported] } }   # code/render_whitebox.py(不带 --compile-only)导出每组 camera.mp4/manifest.json 并自动 sync_whitebox_refs --write;机检 render_whitebox.py --verify-export;视频失败则任务未完成
      - { id: p6-shot-plates, agent: 08-video-gen/shot-plates, condition: whitebox_requested, depends_on: [p6-whitebox-export],
          outputs: ["directing/{ep}/shot_plates.json"],   # 背景图本体入场景库 assets/concepts/scenes/<sid>/plates/(按机位指纹复用,跨组跨集)
          validation: { auto: [shot_plates_complete, shot_plate_bound], qa: [11-qa/visual-qa] } }   # shot_plates_complete=render_shot_plates.py --status 逐镜齐全(验收以此为准,不采信自述;前科 Agent 丢后台结单一张没出);code/render_shot_plates.py:运镜分档出镜首/镜尾、查库复用/裁切、缺的出新图(长边 1920,控制台默认图像模型)并自动 sync_shot_plates --write;机检 code/sync_shot_plates.py
          # 全景制(2026-09-10,docs/scene_panos.md):脚本先保证场景全景齐备(modules/scene_panos.py 按机位规划少数锚点、每光照方案一张 2:1 全景),背景图一律由全景按机位重投影后二次生成,不再基于白模帧+俯视图;图像模型不支持 2:1 全景 → 退出码 2 [pano_unsupported] 一张不出,Agent 上报用户换图像模型(不得自行换)
      - { id: p6-scene-plates, agent: 06-art/environment-concept, condition: scene_plates_requested, depends_on: [p6-shots, p6-camera],
          # 按集出图后(2026-09-30):shot_list 引用了但还没有正向图的场景(拆解表外、分镜新增的场景),本节点先按 p6-env-concept 规范补正向图 + 登记,再补反向图
          # 光照变体(2026-09-30,学生物阶段变体按集判缺口):p6-env-concept 只出母版光照(front.lighting_scheme_id = 本集该场景首个时段的方案);本集组 lighting_scheme_id ≠ 母版的,
          # 同一脚本以母版为参考只改光照补出 main_01__<方案>.png / reverse_01__<方案>.png(scene_plates.json#variants),sync_scene_plates 按组方案挂变体;--status 同时核变体齐且未过期
          outputs: ["assets/concepts/scenes/{id}/scene_plates.json"],   # 场景图(正向/反向,2026-09-17,白模关闭项目):分镜定稿后按 shot_list 每镜 plate_view 与项目/场景模式,用 code/render_scene_plates.py --ep epNN 以正向图为母版补出需要的反向图并自动 sync_scene_plates --write
          validation: { auto: [scene_plates_complete], qa: [11-qa/visual-qa] } }   # scene_plates_complete = render_scene_plates.py --status:每场景正向图在、需要反向图的场景反向图在(验收以此为准,不采信自述)
      - { id: p6-concept-audit, agent: 06-art/art-director, depends_on: [p6-shots, p6-env-concept, p6-prop-concept, p6-creature-concept],   # 2026-09-30 起按集出图节点先出,本审计只兜底核对 + 补漏
          outputs: ["directing/{ep}/concept_coverage.json"],   # 每实体:所需视图/现货路径/缺口状态 covered|dispatched|filled(WORKFLOW.md §6A)
          validation: { auto: [concept_coverage_ok],           # 本集 shot_list 出场实体×所需视图 100% 有现货方可发起 H3A;未过不派本集任何 p7-*
                        qa: [11-qa/visual-qa, 11-qa/character-consistency-qa] } }   # 缺口回派 06-art/character-concept·costume-concept(本集各组 costumes_by_char 所指非默认服装的 sheet_<COS-id>.png)·environment-concept·prop·creature-concept 补齐,补出概念图过常规打分入库(与 Phase 4 同标准)
      # 过场设计二期(2026-09-26,docs/transition_design.md,WORKFLOW.md §9C):组边界过场(字卡 / 定场空镜+叠地点字幕 / 时光流转 / 接缝风格)在分镜定稿后、
      # H3A 前由工位逐边界出建议——宿主 transition_design.py propose 按项目「过场模式」直出,工位复核候选 / 改字 / design 换主设计,**只出建议不接受**;
      # 用户在分镜预览页过场卡裁决,H3A 签字即接受剩余建议(同 H3W 待决项先例)。定场素材依赖分镜背景图 / 场景图节点,故排在其后。
      - { id: p6-transition-design, agent: 07-directing/transition-design, condition: transition_design_enabled,
