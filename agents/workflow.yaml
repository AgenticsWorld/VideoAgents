                               whitebox_ref_bound,   # 白模视频已导出的组:video_refs=camera.mp4(按生效模型参考视频预算取舍;2026-09-08 起无 top.mp4)+ 正文 Whitebox reference/legend 固定段 + Global constraints 禁白模外观句(code/sync_whitebox_refs.py,2026-09-07;开关关闭 skipped)
                               layout_map_bound,  # 2026-09-09 改版:refs 不得含场景俯视图 layout_top*.png / 九宫格 grid_9views*.png / 已退役的 blocking_maps/(俯视图只供分镜预览),逐角色 route_en 逐字命中、主体定义句用 blocking_map label(code/layout_map_bound_check.py)
                               scene_plate_bound,  # 场景图(正向/反向,2026-09-17,白模关闭项目):refs 在角色/生物 sheet 之后挂该场景正向图(+有镜标 reverse 时的反向图)、不再挂该场景旧概念图/俯视图,正文 Shot 1: 前固定段 Scene plates: + 每个 Shot 段头 Scene plate: this shot uses [Image N] … and not [Image M].(code/sync_scene_plates.py;白模开启 skipped)
                               shot_plate_bound,  # 分镜背景图已生成的组:refs 在角色/生物 sheet 之后按镜序挂各镜背景图(两张图的镜 start+end 都挂,不走首尾帧模式)+ 正文 Shot 1: 前固定段 Shot plates:(逐镜 [Image N] 说明句);背景图机位与当前白模不一致 WARN 过期(code/sync_shot_plates.py,2026-09-09;开关关闭 skipped)
                               nonspeech_group_prompt_ok,   # §7D ③:voice_over(旧名 narration_over)/ambient_only 组禁 {} 台词、必含无对白约束句;voice_over 组声明配后期人声(旁白或画外对白,通用句);只数画内说话人(2026-10-03)
                               offscreen_not_in_prompt,   # 声画分离(2026-10-03,§8D,code/offscreen_lines.py check):dialogue_lines[].placement=os|vo 的句不得出现在 {} 内、audio_refs 不得含只有画外句的说话人、正文不提其名(白模 hidden 规则不变);sound_split=off 时 skipped
                               native_lead_bound,   # 原生先入(三期 2026-10-03,§8D ⑨,code/sync_native_leads.py sync --write 机器写入 / check):带 native_lead 的句,前镜段末有【原生先入】句 + {先入},本镜段 {全句}→{余句} + 接续句,全句 / 先入文本不再出现在本镜 {};prompt 工位不手写、不自行拆句;无 native_lead 的集 skipped
                               prompt_beats_bound,   # 时间尺(2026-10-03):每个 Shot 段顺序连接词数 ≤ blocking 节拍数 + 1,prompt 只把节拍写细不加顺序动作(code/check_time_budget.py --scope prompt)
                               prompt_skill_applied,   # §7F:组 json 回执 skill_applied 与项目「提示词技能」快照一致(id/sha256/checklist),code/prompt_skill_check.py
                               sd25_prompt_structure,   # 2026-09-09:套用 sd25-pe 的组正文必须按 2.5 官方结构(【人物】/【动作与声音】分组、每镜「使用/不采用」清单、【未采用素材】、【保持一致】;【场景】槽位由 sync_shot_plates 写),同脚本自动执行
                               h3_prompt_structure,   # 2026-09-09:期望 h3-pe 的组正文必须按 H3 Ref2VA 六段结构(subject_definitions 逐图 <Subject N>…<Picture i> / retention_analysis 逐份 / <d> 台词 / <Audio N> 绑 (Sx);背景图 <Picture N> 构图锚与 Plate anchor 由 sync_shot_plates 写),同脚本自动执行;自述 checklist 不算数。原注释:套用 sd25-pe 的组正文必须按 2.5 官方结构(【人物】/【动作与声音】分组、每镜「使用/不采用」清单、【未采用素材】、【保持一致】;【场景】槽位由 sync_shot_plates 写),同脚本自动执行;自述 checklist 不算数。原注释:组 json 回执 skill_applied 与项目「提示词技能」快照一致(id/sha256/checklist;不套用时 id=null+reason),code/prompt_skill_check.py;运行时另核 prompt_skill_read——漏读 SKILL.md 的运行直接 error 退回(2026-08-28)
                               motion_pair_bound,   # 2026-09-26 三期:组边界 transition_in.motion_pair(成对运镜)两侧组 prompt 含宿主写入的「【运镜对接】」句(前组末 Shot 段尾镜带出 / 本组首 Shot 段接入),残留过期句 = 违规;code/sync_motion_pairs.py --write 机器写入,无 motion_pair 的集 PASS
                               shot_timing_bound] } }   # 2026-09-23:镜次时长——shot_list 每镜 duration_s 按生效模型官方写法进正文(2.5/Wan 3.0 连续整数秒时间段标在段首镜段头后、H3 Shot k≥2 切点 At MM:SS.mmm,、2.0 不写),标签齐全/连续/末段止于 round(total_duration_s)/Σ duration_s = total_duration_s;code/sync_shot_timing.py --write 机器写入(§7F ⑩)
      # 视频提示词签字(2026-10-05):本集**全部**生成组的 p7-prompt 关单(含各 sync_* 机器写入段与 validation.auto 全过)后,用户在「🎦 分镜预览」页
      # (/preview/storyboard)逐组审看视频提示词(正文 + 参考图 / 参考视频 / 参考音频清单)并签字;集行右侧有「✅ 签字确认 / ⏸ 暂缓」(与控制台签字卡同一条)。
      # **未签字不派本集任何 p7-image / p7-consistency / p7-video**(也不提前出锚点包:提示词被打回时 refs 清单会变);宿主另有硬校验——
      # genmedia video 输出到 assets/clips/{ep}/grpNNN*.mp4 时,本集 g7p 节点在 DAG 里且未放行即拒单(video_prompt_signed,modules/prompt_gate.py)。
      # 签字前置(宿主拦):本集还有生成组没有 video_prompt → 409 拒签。用户暂缓 / 提意见 = 按意见回派 p7-prompt(或用户在预览页「✏️ 修改」发修改师)后重新建单。
      # 签字放行的是「首次开跑」:签字后用户自己在分镜预览页改某组提示词重出、修改师 / 缺陷返工改写个别组,**不重签**(页面只提示「签字后 N 组有改动」);
      # 只有整集提示词被标脏重写(p7-prompt 全集重跑,如 H3A 重签、换提示词技能 / 视频模型后成批重写)才把本节点退回 pending 重新建单。
      - { id: g7p, gate: true, human: true, checkpoint: H3V-视频提示词确认, scope: episode, depends_on: [p7-prompt] }
      - { id: p7-image, agent: 08-video-gen/image-generation, depends_on: [p7-prompt, g7p],
          outputs: ["assets/keyframes/{ep}/{group}/"],     # 组参考锚点包(≤9 张,建议 4–5;reuse-first:概念库全覆盖即零新生成 reuse-only,开场合成锚帧默认禁出,§7A 2026-07-24)
          validation: { auto: [resolution_ok, aspect_ok, anchors_lte_9, reuse_first_ok,   # aspect_ok:16:9/9:16 只是大致比例,近似即合规,禁按严格比例判等;reuse_first_ok:概念库已有可用图的锚不得新生成;新生成锚 meta 必记 gap_reason;anchor_opening 无兜底批准不得存在
                               prop_ref_attached,   # 组内出场剧情道具参考图已入锚点包
                               creature_ref_attached,    # 组内出场生物参考图已入锚点包(reuse-first 取 assets/concepts/creatures/<id>/,2026-08-26)
                               costume_ref_attached],    # 组内角色按 costumes_by_char 所指服装 sheet 已入锚点包(reuse-first 取 costume_sheets.json 台账所指文件,2026-08-26)
                        qa: [11-qa/visual-qa] } }
      - { id: p7-consistency, agent: 08-video-gen/character-consistency, depends_on: [p7-image],
          condition: group.has_character,
          validation: { auto: [face_similarity_gte_0.85] } }   # 仅校新生成锚;复用锚(source=reuse:)与概念图同源免校,reuse-only 组直接放行(§7A 2026-07-24)
      - { id: p7-video, agent: 08-video-gen/video-generation,
          depends_on: [g7p, p7-consistency, p7-video@prev_group, p8-voiceprints, p8-narrator],  # g7p:本集视频提示词用户签字(H3V)后才生成组视频(p7-consistency 是条件节点,故此处显式再挂一次);组序串行:前组尾帧作续接锚(仅「长镜头」开启的项目;关闭时无续接链,prev_group 依赖可解除、组可并行,2026-09-01);对白组台词干声作 reference_audio 音色锚(仅锚音色,对白语音口型模型原生;TTS 严禁作配音,§8A 红线);旁白/对白实测适配 narration_fit、dialogue_fit 未过不派发(§7D ②);开跑前核对 refs 素材完备(剧情道具缺参考图=违规配置退回,prop_ref_attached)
          # 组 json 有 video_refs(白模 camera.mp4,2026-09-07;2026-09-08 起无 top.mp4)时按序传 --ref-video;方舟/MiniMax 参考视频须公网 URL(文件托管已配置)
          # 原生先入(三期 2026-10-03,§8D ⑨):组有 native_lead 句时开跑前 code/sync_native_leads.py check 复核 native_lead_bound;交付后 code/sync_native_leads.py audible --groups {group}(人声起点落在前一镜窗口 ≥0.3s = PASS,否则 WARN「先入未生效」只记回执、不阻断、不开缺陷单)
          outputs: ["assets/clips/{ep}/{group}.mp4", "assets/clips/{ep}/{group}.meta.json"],
          validation: { auto: [group_duration_pm_1s, fps_ok, resolution_ok, audio_track_present, dialogue_audible,   # dialogue_audible(2026-10-03):对白镜计划时段 ±1.5s 窗内最长人声段 / 台词估时 <0.3 判疑似整句缺失(code/check_dialogue_audible.py,不转写);resolution_ok:画幅 16:9/9:16 只是大致比例——引擎原生输出近似比例(如 480p 档 864x496)即合规,不得因非严格 16:9/9:16 判失败或索要用户豁免(2026-08-03 Thedouble2 前科)
                               last_frame_saved, boundaries_detected],
                        rubric: visual_gen_v1, qa: [11-qa/visual-qa] } }
      - { id: p7-dub, agent: 09-audio/voice-generation, depends_on: [p7-video],
          condition: "output.dialogue_voice == dubbing and group.audio_plan == dialogue",   # 项目「输出设置→对白配音=后期配音」时每个对白组必派;视频原声(默认)不派、严禁 TTS 进成片对白(§8A)
          # §8C 后期配音(2026-10-03 改版):原生轨先本机人声分离去人声(bed 底床;模型不可用回落压低法=vocal_removal_ok WARN),在人声 stem 上
          # 按镜次时窗(meta boundary_map)定位每句台词的开口起点,按 casting.json 角色声线 TTS 逐句合成冻结版台词,起点对齐开口起点、
          # 语速(±25%)+atempo(±10%)尽量贴开口时长,bed 叠 TTS 替换 clip 对白轨(画面流 -c:v copy、时长不变;原生轨备份 grpNNN.native_audio.wav、
          # 底床 grpNNN.bed.wav);统一走 code/dub_group.py;撞到下一句开口 / clip 末尾的句子记 overflow 上报,不硬塞;混音盖章含配音指纹(mix_basis dub_fp)
          outputs: ["assets/audio/voice/{ep}/dub/{group}/dub_manifest.json", "assets/clips/{ep}/{group}.mp4"],
          validation: { auto: [dub_lines_text_match_frozen_script, dub_speaker_casting_bound, dub_fit_ok, vocal_removal_ok,
                               clip_duration_unchanged, video_stream_unchanged, av_offset_lt_80ms],
                        qa: [11-qa/audio-qa] } }
      - { id: p7-lipsync, agent: 08-video-gen/lip-sync, depends_on: [p7-video, p7-dub],
          condition: defect_assigned,                      # 仅不换语音的音画对齐兜底;口型/语音缺陷默认整组重生成(TTS 换轨重驱口型已废止,§8A 红线);后期配音模式下对配音后 clip 做同样的对齐兜底(§8C)
          validation: { auto: [av_offset_lt_80ms] } }
      - { id: p7-animation, agent: 08-video-gen/animation, depends_on: [p7-video],
          condition: defect_assigned, validation: { auto: [original_defect_recheck] } }
      - { id: p7-upscale, agent: 08-video-gen/upscale, depends_on: [p7-lipsync, p7-animation, p7-dub],   # 后期配音模式:超分取配音后的组 clip
          validation: { auto: [target_resolution_ok] } }
      # 过场素材(2026-09-26,docs/transition_design.md):H3A 定稿的过场设计里「定场空镜 i2v」/「生成式桥接」插入段各需一段视频模型生成的 clip——
      # 涉及视频生成,故放在 Phase 7 视觉生成期(H3A 后、H3B 前,与组视频并行、不进组序链),由 video-generation 按宿主清单图生视频:
      #   python3 code/transition_design.py clips --project <slug> --ep epNN --prepare   → 逐行 clip 路径 / 首帧静帧 / 提示词 / 需时长
      #   modules/genmedia.py video --first-frame <still> --prompt <提示词> --duration <请求时长> --output assets/transitions/epNN/<B-id>.establishing.mp4
      #   python3 code/transition_design.py clips --project <slug> --ep epNN --check     → 机检 transition_clips_ready
      # Phase 9 render_transitions build 只消费这些文件(缺 = inserts_built FAIL,不顶替);模式不允许生成式过场(极简 / 经典)= 不实例化,g7 不因缺它而 HOLD
      #   三期(2026-09-26)桥接段 bridge:首帧 = 前组尾帧、尾帧 = 本组首帧(clips --prepare 从两侧组 clip 抽),故本节点依赖全组 p7-video;
      #   定场 i2v 只需首帧静帧,也随本节点一并出(不进组序续接链、与 H3B 审看同批)
      - { id: p7-transition-clips, agent: 08-video-gen/video-generation, scope: episode, condition: transition_clips_requested,
          depends_on: [g6, p7-video],
          outputs: ["assets/transitions/{ep}/"],
          validation: { auto: [transition_clips_ready], qa: [11-qa/visual-qa] } }   # transition_clips_requested = 本集 shot_list 定稿设计含 establishing(source.mode=i2v)/ bridge 插入段(transition_design.py clips 非空)
      - { id: g7, gate: true, human: true, checkpoint: H3B-视觉生成确认, scope: episode, depends_on: [p7-upscale, p7-transition-clips],
          validation: { auto: [group_pass_rate_100_waiver_5pct], qa: [human_sample_10pct] } }   # 每集:机检/抽检通过后,用户在「后期处理」页审看本集生成组 clip 并签字,未签字不进 Phase 9 剪辑合成;签字确认的是组内容质量,成片方式(超分路径)仍按 §7B 自动执行不另询问

  - id: p8
    name: 音频        # 音频范式见 WORKFLOW.md §8A:对白/音效/环境声由 Seedance 原生随组视频生成(视频原声,默认);项目「对白配音=后期配音」时对白轨由 p7-dub 按开口时段 TTS 替换(§8C),
    depends_on: [g5, g6]   # sfx/ambience 产文字 cue、voice 产对白组干声锚、narrator 产旁白轨(均先于 p7-video);BGM 后期;旁白混入仍后期(§7D/§8A)
    for_each: episode
    tasks:
      - { id: p8-sfx-cues, agent: 09-audio/sound-effect,
          outputs: ["assets/audio/sfx/{ep}/audio_cues.json"],
          validation: { auto: [key_action_cue_coverage_gte_90, no_music_terms] } }
      - { id: p8-ambience-cues, agent: 09-audio/ambience,
          outputs: ["assets/audio/ambience/{ep}/ambience_cues.json"],
          validation: { auto: [every_scene_has_cue, cross_group_text_identical, no_music_terms] } }
      - { id: p8-voiceprints, agent: 09-audio/voice-generation,
          # §8A 改版(音色锚,2026-07-09):默认产出=每对白组单条台词干声轨 lines/grpNNN_dialogue.mp3
          # (角色固定 tts_voice,正常语速,Σ≤15s,与冻结台词逐字一致);仅作组生成 reference_audio 音色锚,
          # 严禁进成片对白(TTS 配音=严重口型问题);音色样本降为选角存档
          # §7D ② 对白实测适配:干声实测 ≤ 组时长×0.8,超限回派 dialogue-rewrite 改短台词;
          # 严禁压 --speed/atempo 硬塞——干声压速只掩盖超长,视频模型生成时照样赶词提速
          # 旁白声线卡(2026-09-01,仅旁白开关开启):项目级 assets/audio/voice/narrator.json +
          # refs/NARRATOR_voiceprint.mp3 由本工位设计冻结(按项目基调写声线描述;描述定制渠道直接
          # 合成,音色列表渠道按描述自动选参考音色);genmedia 此后按卡固定旁白声线,不随 TTS 设置变
          outputs: ["assets/audio/voice/{ep}/lines/", "assets/audio/voice/{ep}/refs/manifest.json"],
          validation: { auto: [dialogue_group_lines_coverage_100, group_lines_total_le_15s,
                               lines_text_match_frozen_script, dialogue_fit_le_group_x0.8],
                        qa: [11-qa/audio-qa] } }
      - { id: p8-narrator, agent: 09-audio/narrator, outputs: ["assets/audio/narration/{ep}/"],
          condition: narration_enabled,   # 「📤 输出设置」旁白开关(默认关;2026-09-16 起未配置过的存量项目也视为关);关=全片无旁白,不派发,p8-mix 只混原生轨+BGM 两路(§7D)
          # 先于 p7-video:提前合成正式旁白轨并逐条实测时长(manifest 记挂点/实测),供 §7D 旁白适配检查;
          # 超窗回派 01-story/narration 精简改稿(锚点不动,不改冻结 shot_list、不重签 H3A);
          # 交付前 code/check_narration_sync.py --stamp 把当前 narration_anchors 指纹盖进 manifest(§8B ①)
          validation: { auto: [speech_rate_in_range, narration_fit_within_window_x0.9,
                               no_overlap_with_dialogue, narration_anchor_sync], qa: [11-qa/audio-qa] } }
      - { id: p8-offscreen, agent: 09-audio/voice-generation, condition: offscreen_lines_present,   # 声画分离(2026-10-03,WORKFLOW.md §8D):本集有 placement=os|vo 的画外 / V.O. 句时每集派一次,先于 p8-mix
          depends_on: [p6-shots, p6-dialogue-fit, p6-dialogue-direction, p8-voiceprints],   # p6-dialogue-direction 未实例化(dialogue_direction_enabled 假)时依赖自动解除;台词 / placement / heard_in / 演法再改 = offscreen_synced 失配,重跑本节点
          # 只跑宿主 CLI code/offscreen_lines.py plan → synth → check:按 casting 该角色×形态 TTS 逐句合成画外句(同 §8C 口径,带 delivery;对白语音库开着时复用库文件)
          # → source_fx 声处理(plain/phone/door/distance/inner/memory)→ 实测时长 → 按 heard_in 窗口收口;超窗上报回派 dialogue-rewrite 精简或 shot-planning 改 heard_in,
          # 不得手摆音频 / 拉长画面 / 压语速硬塞;视频原声模式同样派发(画外无嘴,§8A TTS 红线只约束画内口型);产物作第四路「画外对白」轨由 p8-mix 按 mix_basis sources.offscreen_lines[] 铺
          outputs: ["assets/audio/voice/{ep}/offscreen/offscreen_manifest.json"],
          validation: { auto: [offscreen_fit, offscreen_synced, dub_speaker_casting_bound], qa: [11-qa/audio-qa] } }
      - { id: p8-music, agent: 09-audio/music, outputs: ["assets/audio/bgm/{ep}/"],
          # BGM 只在需烘托处落 cue(开场/转折/高潮/收束),不从头铺到尾
          # 项目音乐库(2026-09-27):选曲先查 assets/audio/library/music/(code/music_library.py list/search/theme);
          # 2026-10-07 两层库 + 复用配额:主题曲按配额 use 原样复用(≤40% 配乐点、同曲同集 1 次、一曲 ≤3 集),其余
          # variant 出主题变奏或新生成(≥30%),一次性 cue 不跨集;cue sheet 写完后 sync --ep {ep} --write 入库并登记使用记录
          validation: { auto: [bgm_coverage_30_60pct, music_library_synced],
                        qa: [11-qa/audio-qa, 11-qa/copyright] } }
      # p8-voice(兜底逐句 TTS patches/ 供 lip-sync 重驱)已废止(2026-07-09,§8A 红线:
      # TTS 进成片对白=严重口型问题);对白语音/口型缺陷走 p7-video 整组重生成
      - { id: p8-mix, agent: 09-audio/audio-mixing,
          depends_on: [p7-video, p7-dub, p8-narrator, p8-offscreen, p8-music],       # 原生轨来自全部组 clip(后期配音模式下即配音后 clip,§8C);p8-offscreen 未实例化(无画外句 / 声画分离关)时依赖自动解除;画外对白轨按 mix_basis sources.offscreen_lines[] 铺、指纹盖进 mix.json(§8B ⑤,2026-10-03)
          outputs: ["assets/audio/final/{ep}.wav", "assets/audio/final/{ep}.mix.json"],
          # 原生轨取源按后期页当前采纳版本(§8B ④,2026-09-23):只准 code/mix_basis.py sources 列出的 src / cum_start_s,
          # 交付前 code/mix_basis.py stamp --task-id 盖章;无盖章 = 旧口径(出成片时整条轨按 timemap 硬切)
          # 铺旁白前必跑 code/check_narration_sync.py(只检):指纹失配=shot_list 挂点已改版,停手上报
          # 回派 narrator 重签/重合成,严禁按旧 narration_track 人工连续铺排(§8B ②,前科 DEF-ep05-audio-0005)
          # 旁白开关关闭时:无旁白轨,两路混音(原生轨+BGM),narration_anchor_sync 自动跳过(skipped: narration off)
          # 声桥(2026-10-03,§9C 四期改版 sound_bridge):sources 之后、铺轨之前必跑 code/sound_bridge.py build 出底床片段(edit/{ep}/sound_bridges/),
          # 按 boundaries[].sound_bridge J/L × bed/line 摆位;本组原生轨一律从 cum_start_s 同步起,严禁整轨提前(旧 audio_lead_s 口径作废)
          validation: { auto: [narration_anchor_sync, mix_basis_current, sound_bridge_built, lufs_-14_pm1, true_peak_lte_-1dBTP, no_clipping], qa: [11-qa/audio-qa] } }
      - { id: g8, gate: true, depends_on: [p8-mix] }

  - id: p9
    name: 剪辑合成
    depends_on: [g7, g8]
    for_each: episode
    tasks:
      - { id: p9-edit, agent: 10-editing/edit, outputs: ["edit/{ep}/timeline.json", "edit/{ep}/cut_v1.mp4"],
          # 封装前重验 code/check_narration_sync.py(§8B ②):final_audio 所据旁白轨与当前 shot_list 挂点失配即停手上报
          validation: { auto: [narration_anchor_sync, duration_pm_5pct, no_black_frames], rubric: edit_v1 } }
      - { id: p9-transition, agent: 10-editing/transition, depends_on: [p9-edit],
          # 只按 shot_list transition_in 实施,只准宿主 CLI code/render_transitions.py plan→render→check(WORKFLOW.md §9C,2026-08-28):
          # cut_v1→cut_v2 pad 补偿总长不变;全片硬切时不产出 cut_v2(cut_v1 即定稿),transitions_render.json 照常落盘
          outputs: ["edit/{ep}/transitions_render.json"],
          validation: { auto: [transition_render_ok], qa: [11-qa/visual-qa] } }
      - { id: p9-subtitle, agent: 10-editing/subtitle, depends_on: [p9-transition],
          outputs: ["edit/{ep}/subtitles.srt"],
          # 烧录样式:字高≤4%画面高、底部居中贴底(下边距2-4%)、≤2行、禁大面积底板
          validation: { auto: [sync_lt_200ms, typo_check, line_length_ok, subtitle_style_ok] } }
      - { id: p9-caption, agent: 10-editing/caption, depends_on: [p9-transition, p9-subtitle],   # 需 subtitles.srt 作逐字语音轨台本
          condition: caption_enabled,   # 「🎚️ 后期处理」页「花字」板块的启用开关(output.caption_enabled,2026-09-13 起不在输出设置里),默认关;关=不派发,g9 不因缺我而 HOLD
          outputs: ["edit/{ep}/captions.json"],
          # schema v3(模版/sfx/组内时间);入出点=语音逐字起止(render_captions.py speech-align/snap);
          # 花字策略 output.caption_mode auto|manual(2026-09-24):manual 时每条 type ∈ output.caption_types,
          # 顶层 caption_policy 盖章与设置一致(render_captions.py policy --stamp);交付前 code/check_captions.py --require design
          validation: { auto: [dictionary_match_100, caption_schema_v2, caption_groups_valid,
                               caption_time_consistent, caption_speech_aligned, caption_assets_resolved,
                               caption_types_allowed, caption_policy_fresh] } }
      - { id: p9-caption-render, agent: 10-editing/caption, depends_on: [p9-caption],
          condition: caption_enabled, outputs: ["assets/clips_caption/{ep}/"],
          # 各组当前采纳的后期版本(未采纳 = 终版母本)上逐组烧录副本,源文件不动;只准宿主 CLI render_captions.py
          validation: { auto: [caption_toolchain_verified, captions_rendered_all,
                               caption_render_spec_ok, caption_clip_audio_intact] } }
      - { id: p9-caption-final, agent: 10-editing/edit, depends_on: [p9-caption-render, p9-title],
          condition: caption_enabled,
          outputs: ["edit/{ep}/final_caption.mp4", "edit/{ep}/caption_sfx.m4a"],
          # 花字版成片:只准 render_captions.py final(干净版 final.mp4 上按成片时间轴叠花字 + 同轴 SFX + 封装);
          # a:0=声轨权威+SFX 预混、a:1=声轨权威流拷贝存档;严禁 -shortest;干净版 final.mp4 照旧产出,双版本并列
          validation: { auto: [caption_final_duration_match, caption_final_fresh, caption_premix_present,
                               no_black_frames], rubric: edit_v1 } }
      - { id: p9-title, agent: 10-editing/title, depends_on: [p9-edit],
          # 下集预告默认不配旁白:文案走字卡/花字,声轨=画面原声+BGM;配音须工单显式指定
          outputs: ["edit/{ep}/intro_outro/"],
          validation: { auto: [teaser_no_narration], qa: [06-art/art-director] } }
      - { id: p9-thumbnail, agent: 10-editing/thumbnail, depends_on: [p9-edit],
          outputs: ["edit/{ep}/thumbnail_A.png", "edit/{ep}/thumbnail_B.png"],
          validation: { auto: [aspect_safe_area_ok], qa: [human_pick] } }
      - { id: p9-grade-plan, agent: 10-editing/grade-planner, depends_on: [p9-transition],
          condition: narrative_blocks_present,   # 2026-09-17:本集 shot_list 有 narrative_block(闪回/梦境/想象段;`post_apply.py blocks --json` 的 blocks 非空)才派发;无叙事块=不派发,g9p 不因缺我而 HOLD
          # 按色彩脚本/剧本写给叙事块的调色意图开 block 作用域的 ffmpeg 类调色处方(只准宿主 CLI post_apply.py propose → apply,出到「已出片」为止,不采纳;采纳归用户 H3P,§9D)
          outputs: ["edit/{ep}/post_plan.json"],
          validation: { auto: [grade_plan_proposed] } }
      - { id: g9p, gate: true, human: true, checkpoint: H3P-后期确认, scope: episode, depends_on: [p9-subtitle, p9-grade-plan] }   # 2026-09-11:用户在「🎚️ 后期处理」页(/preview/post)对签字母本做特效/包装/画面修补/光感/调色/音效处方(台账 edit/{ep}/post_plan.json,ffmpeg 类宿主直出、agent 类派 post-finishing、记录类只记台账),看过 A|B 与拼装预检后签字;派单中处方未清或 post_ok FAIL 宿主拒签;签字后台账再变即「签字已过期」,orchestrator 重新建单;签字时按保留规则清理旧版本(母本+最近两个已采纳)
      - { id: p9-post, agent: 10-editing/post-finishing, depends_on: [g9p],
          condition: post_recipes_adopted,   # 台账里有已采纳处方才派发(post_apply.py status --json 的 current 非空或 adopted>0);无处方=不派发,g9 不因缺我而 HOLD
          # 只准宿主 CLI code/post_apply.py finalize(build-cut → sync-timeline → render_transitions render --src cut_post.mp4 → finalize_episode assemble --cut … → check,WORKFLOW.md §9D);
          # 用户已在页面点过「出成片」且 post_check.json 指纹与台账一致时只重跑 check
          outputs: ["edit/{ep}/cut_post.mp4", "edit/{ep}/final.mp4", "edit/{ep}/post_check.json"],
          validation: { auto: [post_ok, intro_offset_ok, transition_render_ok], qa: [11-qa/visual-qa] } }
      - { id: g9, gate: true, human_on: first_episode, checkpoint: H4-首集成片确认,
          depends_on: [p9-subtitle, p9-caption, p9-title, p9-thumbnail, p9-caption-final, g9p, p9-post] }
        # post_recipes_adopted=false 时 p9-post 未派发,视同满足,G9 不 HOLD(同 caption 先例);g9p 是每集人工点,H4 只在首集
        # caption_enabled=false 时 p9-caption/p9-caption-render/p9-caption-final 均未派发,
        # 视同满足,G9 不 HOLD(同 §7B p7-upscale/g7 先例)

  - id: p10
    name: 终审
    depends_on: [g9]
    for_each: episode
    tasks:
      - { id: p10-logic,       agent: 11-qa/logic-qa,                 outputs: ["qa/reports/{ep}/logic.json"],       pass: blocker_eq_0 }
      - { id: p10-consistency, agent: 11-qa/character-consistency-qa, outputs: ["qa/reports/{ep}/consistency.json"], pass: score_gte_85 }
      - { id: p10-timeline,    agent: 11-qa/timeline-qa,              outputs: ["qa/reports/{ep}/timeline.json"],    pass: conflicts_eq_0 }
      - { id: p10-world,       agent: 11-qa/world-consistency-qa,     outputs: ["qa/reports/{ep}/world.json"],       pass: blocker_eq_0 }
      - { id: p10-visual,      agent: 11-qa/visual-qa,                outputs: ["qa/reports/{ep}/visual.json"],      pass: defect_shots_lte_2pct }
      - { id: p10-audio,       agent: 11-qa/audio-qa,                 outputs: ["qa/reports/{ep}/audio.json"],       pass: all_metrics_ok }
      - { id: p10-safety,      agent: 11-qa/content-safety,           outputs: ["qa/reports/{ep}/safety.json"],      pass: no_platform_violations }
      - { id: p10-copyright,   agent: 11-qa/copyright,                outputs: ["qa/reports/{ep}/copyright.json"],   pass: all_assets_licensed }
      - { id: g10, gate: true, human: true, checkpoint: H5-发布签字,
          depends_on: [p10-logic, p10-consistency, p10-timeline, p10-world,
                       p10-visual, p10-audio, p10-safety, p10-copyright] }

  - id: p11
    name: 发布
    depends_on: [g10]
    tasks:
      - { id: p11-adapt, agent: 12-publishing/platform-adapter, for_each: platform,
          outputs: ["publish/{platform}/"], validation: { auto: [platform_spec_lint] } }
      - { id: p11-seo, agent: 12-publishing/seo, depends_on: [p11-adapt],
          outputs: [publish/seo.json], validation: { auto: [length_ok, banned_words, description_public_only], qa: [human_pick] } }
      - { id: p11-meta, agent: 12-publishing/metadata, depends_on: [p11-adapt],
          outputs: [publish/metadata.json], validation: { auto: [schema, required_fields] } }
      - { id: p11-publish, agent: 12-publishing/publisher, depends_on: [p11-seo, p11-meta],
          outputs: [publish/receipts/], validation: { auto: [receipt_success] }, max_retries: 2 }

# 贯穿型 Agent(不在 DAG 中显式建任务,由 orchestrator 在派单/收单时自动调用)
services:
  - { agent: 00-orchestration/evaluation,  hook: on_submit }         # rubric 评分(产出型任务无 eval 不得关单)
  - { agent: 00-orchestration/memory-bible, hook: on_bible_access }  # Bible 写入仲裁与冲突受理;读取受控版免仲裁,不触发本钩子
  - { agent: 00-orchestration/reviser,          hook: on_user_revision }  # 修改师:预览页「✏️ 修改」默认收件人,无状态可并发,代行主责工位一人改完;
    # 不占 DAG 节点、不派 evaluation/QA;关单落 runs/revisions/<run_id>.json,总制片只标脏/重建签字单不重做(WORKFLOW.md §5、§7 第 6 条)
  - { agent: 00-orchestration/workflow-orchestrator, hook: on_task_complete }
    # 收尾钩子(WORKFLOW.md §6.1):校验 run_record 三件套 → 更新 runs/dag.json 节点 state/run_id;
    # 两步未完成不得关单,dag.json 与 gate 文件、runs/ 产物不一致视为调度缺陷
