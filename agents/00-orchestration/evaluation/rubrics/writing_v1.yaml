# writing_v1 — 剧本/旁白/拆集类产物评分表
# 适用:episode-planner, screenplay, dialogue-rewrite, narration
# 2026-09-12 调权(WORKFLOW.md §5A 事件取舍契约):忠实原著 30→15、戏剧性 25→35。
#   只罚「改错」不罚「改少」;把每个事件平均摊成一场戏的平铺覆盖式改编在「戏剧性」按低分打。
rubric: writing_v1
threshold: 80
dimensions:
  - name: 忠实原著
    weight: 15
    check: 关键因果与人物动机不走样;为节奏做的带过/并入/删减(episode_plan treatments、adaptation_note)有标注即不扣分——只罚改错,不罚改少
    anchors: { 95: 演出的情节原著党挑不出硬伤且取舍有据, 80: 改编点均有标注且不伤主线因果, 60: 关键情节走样或删掉了因果链上的事件 }
  - name: 戏剧性
    weight: 35
    check: 取舍清楚——演的事件少而深,每集有明确高潮与推进;冲突清晰、场与场之间有推进、无注水;逐事件平铺、看不出哪场是高潮的按低分打
    anchors: { 95: 高潮场明显高于其余场且前铺后收一气呵成, 80: 有推进有高潮但个别场可删, 60: 逐事件平铺、看不出哪一场是高潮 }
  - name: 对白/旁白自然
    weight: 20
    check: 符合角色 dialogue_style;口语顺耳;旁白不复述画面已表达的信息
  - name: 可拍性
    weight: 15
    check: 每场可转化为镜头;无"内心活动无画面"类不可拍段落;引用的角色/场景 ID 合法
  - name: 格式规范
    weight: 10
    check: 剧本格式(场景标题/动作/对白/每场 [事件] 行)规范;时长估算字段齐
feedback_required: true
