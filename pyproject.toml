[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "videoagents"
version = "1.0.1"
description = "A file-based multi-agent production system for adapting fiction into episodic video"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "AgenticsWorld"}]
keywords = ["agents", "video", "storytelling", "generative-ai", "workflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.24,<3",
  "PyYAML>=6,<7",
  "qrcode>=7.4,<9",
  "scipy>=1.10,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
deepagents = [
  "deepagents>=0.2",
  "langchain-openai>=0.3",
]
storage = [
  "boto3>=1.34",
  "cos-python-sdk-v5>=1.9",
  "oss2>=2.18",
  "tos>=2.8",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[project.urls]
Homepage = "https://github.com/AgenticsWorld/VideoAgents"
Repository = "https://github.com/AgenticsWorld/VideoAgents"
Issues = "https://github.com/AgenticsWorld/VideoAgents/issues"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
