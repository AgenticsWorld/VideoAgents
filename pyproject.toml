[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "videoagents"
version = "1.0.30"
description = "A product-ready multi-client system for adapting fiction into episodic video"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "AgenticsWorld"}]
keywords = ["agents", "video", "storytelling", "generative-ai", "workflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<1",
  "faster-whisper>=1.1,<2", # 本地 ASR:首次自动下载模型到 data/models/faster-whisper/
  "fonttools>=4.47,<5",   # 花字:字体 manifest 扫描(name 表 family + cmap CJK 覆盖判定)
  "lark-oapi>=1.4,<2",
  "numpy>=1.24,<3",
  "Pillow>=10,<12",       # 素材库:分镜联系图拼图(modules/footage_library.py)
  "playwright>=1.60,<2",  # 花字:HTML 渲染引擎(captions_html.py;首次需 python3 -m playwright install chromium)
  "pygit2>=1.17,<2",
  "PyYAML>=6,<7",
  "qrcode>=7.4,<9",
  "scenedetect>=0.6.4,<0.8",  # 素材库:PySceneDetect 镜头分割(自带 opencv-python 硬依赖)
  "scipy>=1.10,<2",
  "uvicorn>=0.30,<1",
  "yt-dlp>=2025.1",       # 素材库 / mashup 宿主 footage:YouTube·Bilibili 链接下载
]

[project.optional-dependencies]
deepagents = [
  "deepagents>=0.2",
  "langchain-openai>=0.3",
  "langgraph-checkpoint-sqlite>=2",   # Agent记忆:SqliteSaver 会话续接
]
storage = [
  "boto3>=1.34",
  "cos-python-sdk-v5>=1.9",
  "oss2>=2.18",
  "tos>=2.8",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "uv==0.11.30",
]

[project.urls]
Homepage = "https://github.com/AgenticsWorld/VideoAgents"
Repository = "https://github.com/AgenticsWorld/VideoAgents"
Issues = "https://github.com/AgenticsWorld/VideoAgents/issues"

[project.scripts]
videoagents-api = "services.api.__main__:main"
videoagents-web = "apps.web.server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["apps.web*", "services*"]

[tool.setuptools.package-data]
"apps.web" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
