name: Desktop release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: videoagents-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      build_hash: ${{ steps.release.outputs.build_hash }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify tag and release version
        id: release
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git merge-base --is-ancestor "$tag_commit" origin/main || {
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on main" >&2
            exit 1
          }
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Tag ${GITHUB_REF_NAME} is not a supported release version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_hash=${tag_commit:0:7}" >> "$GITHUB_OUTPUT"

  python:
    needs: prepare
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-14
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.30"
      - name: Build Python runtime
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python apps/desktop/scripts/build_runtime.py --version "$RELEASE_VERSION" --force
          python apps/desktop/scripts/package_runtime.py --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: python-runtime-${{ matrix.artifact }}
          path: apps/desktop/.runtime-packages/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  desktop:
    needs: prepare
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            distribution: s3
            args: --mac zip --arm64
          - os: windows-latest
            platform: win
            distribution: s3
            args: --win nsis --x64
          - os: macos-14
            platform: mac
            distribution: oss
            args: --mac zip --arm64
          - os: windows-latest
            platform: win
            distribution: oss
            args: --win nsis --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Set release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_HASH: ${{ needs.prepare.outputs.build_hash }}
          DISTRIBUTION: ${{ matrix.distribution }}
          S3_PUBLIC_BASE: ${{ vars.S3_PUBLIC_BASE || 'https://s3.agentics.world/packages/video-agents' }}
          OSS_PUBLIC_BASE: ${{ vars.OSS_PUBLIC_BASE || 'https://cdn.shumati.cn/packages/video-agents' }}
        run: |
          npm version "$RELEASE_VERSION" --workspace @videoagents/desktop --no-git-tag-version --allow-same-version
          if [ "$DISTRIBUTION" = "oss" ]; then
            update_index="$OSS_PUBLIC_BASE/metadata.json"
            package_base="$OSS_PUBLIC_BASE"
          else
            update_index="$S3_PUBLIC_BASE/metadata.json"
            package_base="$S3_PUBLIC_BASE"
          fi
          python apps/desktop/scripts/write_build_info.py \
            --channel release --version "$RELEASE_VERSION" --build-hash "${BUILD_HASH}-${DISTRIBUTION}" \
            --distribution "$DISTRIBUTION" --update-index-url "$update_index" --package-base-url "$package_base"
      - run: npm run build:desktop
      - name: Prepare Apple API key
        if: matrix.platform == 'mac'
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          test -n "$APPLE_API_KEY_CONTENT"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
      - name: Package desktop
        run: npm exec --workspace @videoagents/desktop electron-builder -- ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'mac' && 'true' || 'false' }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
      - name: Normalize desktop package
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_HASH: ${{ needs.prepare.outputs.build_hash }}
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          python apps/desktop/scripts/package_desktop.py \
            --platform "${{ matrix.platform }}" \
            --version "$RELEASE_VERSION" \
            --build-hash "${BUILD_HASH}-${DISTRIBUTION}"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.distribution }}-${{ matrix.platform }}
          path: apps/desktop/.desktop-packages/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, python, desktop]
    environment: production
    runs-on: ubuntu-latest
    env:
      OSS_ENDPOINT: oss-cn-shanghai.aliyuncs.com
      OSS_PACKAGES_BUCKET: shumati-pro
      S3_PUBLIC_BASE: ${{ vars.S3_PUBLIC_BASE || 'https://s3.agentics.world/packages/video-agents' }}
      OSS_PUBLIC_BASE: ${{ vars.OSS_PUBLIC_BASE || 'https://cdn.shumati.cn/packages/video-agents' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: python-runtime-*
          path: runtime-artifacts
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: desktop-artifacts
      - name: Build distribution metadata
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          MINIMUM_DESKTOP_VERSION: ${{ vars.MINIMUM_DESKTOP_VERSION || '1.0.0' }}
        run: |
          python apps/desktop/scripts/update_runtime_index.py \
            --index publish/s3/metadata.json \
            --artifacts runtime-artifacts \
            --desktop-artifacts desktop-artifacts/desktop-s3-mac \
            --desktop-artifacts desktop-artifacts/desktop-s3-win \
            --minimum-desktop-version "$MINIMUM_DESKTOP_VERSION" \
            --version "$RELEASE_VERSION" \
            --public-base "$S3_PUBLIC_BASE" \
            --ffmpeg-artifact apps/desktop/ffmpeg-artifact.json
          python apps/desktop/scripts/update_runtime_index.py \
            --index publish/oss/metadata.json \
            --artifacts runtime-artifacts \
            --desktop-artifacts desktop-artifacts/desktop-oss-mac \
            --desktop-artifacts desktop-artifacts/desktop-oss-win \
            --minimum-desktop-version "$MINIMUM_DESKTOP_VERSION" \
            --version "$RELEASE_VERSION" \
            --public-base "$OSS_PUBLIC_BASE" \
            --ffmpeg-artifact apps/desktop/ffmpeg-artifact.json
      - name: Fetch the pinned FFmpeg package for mirrors that lack it
        id: ffmpeg
        shell: bash
        run: |
          python apps/desktop/scripts/mirror_ffmpeg.py \
            --pin apps/desktop/ffmpeg-artifact.json \
            --mirror s3="$S3_PUBLIC_BASE" \
            --mirror oss="$OSS_PUBLIC_BASE" \
            --output ffmpeg-mirror >> "$GITHUB_OUTPUT"
      - name: Prepare six GitHub release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release-assets
          for distribution in s3 oss; do
            cp "desktop-artifacts/desktop-${distribution}-mac/VideoAgents-${RELEASE_VERSION}.zip" \
              "release-assets/VideoAgents-mac-${distribution}-${RELEASE_VERSION}.zip"
            cp "desktop-artifacts/desktop-${distribution}-win/VideoAgents-${RELEASE_VERSION}.zip" \
              "release-assets/VideoAgents-win-${distribution}-${RELEASE_VERSION}.zip"
          done
          cp runtime-artifacts/python-runtime-macos-arm64/*.zip release-assets/
          cp runtime-artifacts/python-runtime-windows-x64/*.zip release-assets/
          asset_count="$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')"
          test "$asset_count" = 6
      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if python scripts/release_notes.py "$RELEASE_VERSION" > "$RUNNER_TEMP/release-notes.md"; then
            echo "file=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CHANGELOG.md has no section for $RELEASE_VERSION; using auto-generated notes"
          fi
      - name: Publish GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/*.zip --clobber
            if [ -n "$NOTES_FILE" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
            fi
          elif [ -n "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" release-assets/*.zip \
              --verify-tag --notes-file "$NOTES_FILE" --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/*.zip \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      - name: Publish production packages to S3
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          UPLOAD_FFMPEG: ${{ steps.ffmpeg.outputs.upload_s3 }}
        run: |
          for package in runtime-artifacts/python-runtime-*/*.zip; do
            aws s3 cp "$package" \
              "s3://agentics-prod/packages/video-agents/python/$(basename "$package")" \
              --content-type application/zip \
              --cache-control "public,max-age=31536000,immutable"
          done
          if [ "$UPLOAD_FFMPEG" = "true" ]; then
            for package in ffmpeg-mirror/*.zip; do
              aws s3 cp "$package" \
                "s3://agentics-prod/packages/video-agents/ffmpeg/$(basename "$package")" \
                --content-type application/zip \
                --cache-control "public,max-age=31536000,immutable"
            done
          fi

          mac_package="desktop-artifacts/desktop-s3-mac/VideoAgents-${RELEASE_VERSION}.zip"
          win_package="desktop-artifacts/desktop-s3-win/VideoAgents-${RELEASE_VERSION}.zip"
          aws s3 cp "$mac_package" \
            "s3://agentics-prod/packages/video-agents/mac/VideoAgents-${RELEASE_VERSION}.zip" \
            --content-type application/zip \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp "$win_package" \
            "s3://agentics-prod/packages/video-agents/win/VideoAgents-${RELEASE_VERSION}.zip" \
            --content-type application/zip \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp "$mac_package" \
            "s3://agentics-prod/packages/video-agents/mac/VideoAgents.zip" \
            --content-type application/zip \
            --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp "$win_package" \
            "s3://agentics-prod/packages/video-agents/win/VideoAgents.zip" \
            --content-type application/zip \
            --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp publish/s3/metadata.json \
            s3://agentics-prod/packages/video-agents/metadata.json \
            --content-type application/json \
            --cache-control "no-cache, no-store, must-revalidate"
      - name: Setup ossutil
        uses: yizhoumo/setup-ossutil@v2
        with:
          endpoint: ${{ env.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
      - name: Publish production packages to OSS
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          UPLOAD_FFMPEG: ${{ steps.ffmpeg.outputs.upload_oss }}
        run: |
          for package in runtime-artifacts/python-runtime-*/*.zip; do
            ossutil cp -f "$package" \
              "oss://${OSS_PACKAGES_BUCKET}/packages/video-agents/python/$(basename "$package")" \
              --meta="Content-Type:application/zip#Cache-Control:public,max-age=31536000,immutable"
          done
          if [ "$UPLOAD_FFMPEG" = "true" ]; then
            for package in ffmpeg-mirror/*.zip; do
              ossutil cp -f "$package" \
                "oss://${OSS_PACKAGES_BUCKET}/packages/video-agents/ffmpeg/$(basename "$package")" \
                --meta="Content-Type:application/zip#Cache-Control:public,max-age=31536000,immutable"
            done
          fi

          mac_package="desktop-artifacts/desktop-oss-mac/VideoAgents-${RELEASE_VERSION}.zip"
          win_package="desktop-artifacts/desktop-oss-win/VideoAgents-${RELEASE_VERSION}.zip"
          ossutil cp -f "$mac_package" \
            "oss://${OSS_PACKAGES_BUCKET}/packages/video-agents/mac/VideoAgents-${RELEASE_VERSION}.zip" \
            --meta="Content-Type:application/zip#Cache-Control:public,max-age=31536000,immutable"
          ossutil cp -f "$win_package" \
            "oss://${OSS_PACKAGES_BUCKET}/packages/video-agents/win/VideoAgents-${RELEASE_VERSION}.zip" \
            --meta="Content-Type:application/zip#Cache-Control:public,max-age=31536000,immutable"
          ossutil cp -f "$mac_package" \
            "oss://${OSS_PACKAGES_BUCKET}/packages/video-agents/mac/VideoAgents.zip" \
            --meta="Content-Type:application/zip#Cache-Control:no-cache, no-store, must-revalidate"
          ossutil cp -f "$win_package" \
            "oss://${OSS_PACKAGES_BUCKET}/packages/video-agents/win/VideoAgents.zip" \
            --meta="Content-Type:application/zip#Cache-Control:no-cache, no-store, must-revalidate"
          ossutil cp -f publish/oss/metadata.json \
            "oss://${OSS_PACKAGES_BUCKET}/packages/video-agents/metadata.json" \
            --meta="Content-Type:application/json#Cache-Control:no-cache, no-store, must-revalidate"
