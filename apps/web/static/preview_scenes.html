<style>
:root{
  --bg:#0f1117; --panel:#161a23; --panel2:#1c2130; --border:#2a3040;
  --text:#dde3ee; --dim:#8b93a7; --accent:#6c9ef8; --link:#fb923c; --green:#4ade80;
  --red:#f87171; --yellow:#fbbf24; --purple:#c084fc;
}
*{box-sizing:border-box;margin:0;padding:0}
a{color:var(--link)}
body{background:var(--bg);color:var(--text);font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
header h1{font-size:15px;font-weight:600}
header a.back{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:3px 10px;line-height:1.4}
header a.back:hover{color:var(--accent);border-color:var(--accent)}
header .spacer{flex:1}
input[type=text]{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px}
button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}
header select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;cursor:pointer}
header select:hover{border-color:var(--accent)}
main{flex:1;display:flex;min-height:0}
#list{width:270px;border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column}
#search{margin:10px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text)}
#items{flex:1;overflow-y:auto;padding-bottom:20px}
.item{padding:7px 14px;cursor:pointer;border-left:2px solid transparent}
.item:hover{background:var(--panel2)}
.item.active{background:var(--panel2);border-left-color:var(--accent)}
.item .row1{display:flex;align-items:center;gap:6px;min-width:0}
.item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .id{display:block;color:var(--dim);font-size:11px;line-height:1.4;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:10px;line-height:14px;height:16px;box-sizing:border-box;display:inline-flex;align-items:center;gap:1px;border:1px solid var(--purple);color:var(--purple);border-radius:4px;padding:0 5px;flex:none}
.badge.pic{border-color:var(--green);color:var(--green)}
/* 列表行标签限宽:过长标签截断加省略号,不挤掉名字(完整文本见 title) */
.item .row1 .badge{display:inline-block;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#detail{flex:1;overflow-y:auto;padding:22px 26px}
.empty{color:var(--dim);text-align:center;margin-top:60px}
h2.title{font-size:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2.title .id{color:var(--dim);font-size:13px;font-weight:400}
.meta-line{color:var(--dim);font-size:13px;margin:6px 0 4px}
.notes{color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:13px}
.gallery{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}
.gallery figure{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px;text-align:center}
.gallery img{height:230px;max-width:380px;object-fit:contain;border-radius:6px;cursor:zoom-in;display:block}
.gallery figcaption{font-size:11px;color:var(--dim);margin-top:4px;max-width:380px;display:flex;align-items:center;justify-content:center;gap:6px}
.gallery figcaption .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gallery figure.folder{cursor:pointer}
.gallery figure.folder:hover{border-color:var(--accent)}
.gallery figure.folder img{cursor:pointer}
.sec{margin:18px 0 6px;font-size:14px}
/* 板块(2026-09-21):详情页按板块排,点标题折叠/展开;折叠态按 data-blk 记 localStorage,切场景/刷新保持。
   白模/全景/世界模型面板(.wb-panel)同样带 data-blk,点面板标题折叠(用属性不用 class:whitebox-ui 会整写 className) */
.blk{border:1px solid var(--border);border-radius:10px;margin:14px 0;overflow:hidden}
.blk>.blk-h{background:var(--panel);padding:9px 14px;font-size:13.5px;cursor:pointer;user-select:none}
.blk>.blk-h::before{content:'▾ ';color:var(--dim)}
.blk[data-closed]>.blk-h::before{content:'▸ '}
.blk>.blk-body{padding:2px 14px 6px}
.blk[data-closed]>.blk-body{display:none}
.blk-h .cnt{color:var(--dim);font-weight:400}
.wb-panel[data-blk] .wb-heading>strong{cursor:pointer;user-select:none}
.wb-panel[data-blk] .wb-heading>strong::before{content:'▾ ';color:var(--dim)}
.wb-panel[data-blk][data-closed] .wb-heading>strong::before{content:'▸ '}
.wb-panel[data-blk][data-closed]>.wb-toolbar{margin-bottom:0}
.wb-panel[data-blk][data-closed]>.wb-toolbar~*,.wb-panel[data-blk][data-closed]>.wb-toolbar>:not(.wb-heading),.wb-panel[data-blk][data-closed] .wb-heading>:not(strong){display:none!important}
.gallery.plates img{height:150px}
.gallery.plates figcaption{max-width:270px}
.fthumb{position:relative}
.fthumb .fmask{position:absolute;inset:0;background:rgba(15,17,23,.42);display:flex;align-items:center;justify-content:center;font-size:46px;border-radius:6px}
.fcnt{color:var(--dim);flex:none}
.foldbar{display:flex;align-items:center;gap:10px;margin:16px 0 -6px;font-size:13px}
.foldbar .fname{font-weight:600}
.editbtn{font-size:11px;padding:1px 7px;flex:none;background:var(--panel2);border:1px solid var(--border);border-radius:5px;color:var(--dim);cursor:pointer}
.editbtn:hover{color:var(--accent);border-color:var(--accent)}
.doc{border:1px solid var(--border);border-radius:10px;margin:14px 0;overflow:hidden}
.doc>h3{background:var(--panel);padding:9px 14px;font-size:13.5px;cursor:pointer;user-select:none}
.doc>h3::before{content:'▾ ';color:var(--dim)}
.doc.closed>h3::before{content:'▸ '}
.doc.closed>.body{display:none}
.doc>.body{padding:12px 16px;background:var(--panel2)}
dl.kv{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:4px 14px}
dl.kv>dt{color:var(--dim);font-size:12.5px;word-break:break-all}
dl.kv>dd{min-width:0;word-break:break-word}
dl.kv dl.kv{margin:2px 0 6px;padding-left:10px;border-left:1px solid var(--border)}
ul.arr{padding-left:18px}
ul.arr>li{margin:2px 0}
/* 全景图板块(2026-09-10):俯视图上标锚点中心 + 每锚点各光照方案全景 */
/* 2026-09-21:宽度跟随上方白模画布(JS 同步,兜底 760px);滚轮缩放、拖动平移、双击复位,锚点标记反向缩放保持大小 */
.pano-map{position:relative;display:block;width:100%;max-width:760px;margin:6px 0 10px;overflow:hidden;border-radius:6px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;--k:1}
.pano-map.panning{cursor:grabbing}
.pano-map-inner{position:relative;transform-origin:0 0;will-change:transform}
.pano-map img{width:100%;display:block;-webkit-user-drag:none}
.pano-zoom{position:absolute;top:6px;inset-inline-end:6px;display:flex;gap:4px;z-index:2}
.wb-panel .pano-zoom button{padding:0;width:24px;height:24px;line-height:1;background:rgba(22,26,35,.8)}
.pano-dot{position:absolute;transform:translate(-50%,-50%) scale(calc(1/var(--k)));min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.45);cursor:default}
.pano-grid{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;margin:6px 0}
.pano-anchor{width:320px;max-width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px}
.pano-title{font-size:13px}
.pano-serves{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.pano-serves.open{white-space:normal;overflow-wrap:anywhere}
.pano-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;margin:6px 0 0}
.pano-row figure{margin:0;width:100%;text-align:center}
.pano-row img{width:100%;height:auto;display:block;border-radius:5px;cursor:zoom-in}
.pano-row figcaption{font-size:11px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 归档图子行(2026-09-25):机检拒掉 / --redo 归档的成图,不入索引,供用户目视裁决 + 认领 */
.pano-archived{margin-top:8px;padding-top:6px;border-top:1px dashed var(--border)}
.pano-archived .pano-arch-head{font-size:12px;color:var(--dim);margin-bottom:4px}
.pano-archived figure{position:relative}
.pano-archived img{opacity:.92;outline:1px solid var(--red)}
.pano-archived .pano-badge{position:absolute;z-index:1;left:6px;top:6px;font-size:11px;line-height:1;padding:3px 6px;border-radius:4px;background:var(--red);color:#fff;pointer-events:none}
.pano-archived .pano-badge.redo{background:var(--dim)}
.pano-archived figcaption{white-space:normal;text-align:left;line-height:1.4}
.pano-archived .pano-reason{display:block;color:var(--fg);overflow-wrap:anywhere}
.pano-archived .pano-arch-meta{display:block;color:var(--dim)}
.pano-archived .pano-adopt{margin-top:4px;font-size:12px}
.pano-archived .pano-adopt[disabled]{opacity:.5;cursor:not-allowed}
.pano-archived .pano-discard{margin-top:4px;margin-left:6px;font-size:12px}
.pano-archived .pano-discard[disabled]{opacity:.5;cursor:not-allowed}
.pano-blocked{border:1px solid var(--red);color:var(--red);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px}
/* 创建全景图(2026-09-13):俯视图点选坐标 → 黄色待定点 + 坐标/方案表单 + 后台日志 */
.pano-map.picking{cursor:crosshair}
.pano-map.picking img{outline:2px dashed var(--yellow);outline-offset:-2px}
.pano-dot.new{background:var(--yellow);color:#000;pointer-events:none}
/* 新锚点朝向短线:零尺寸支点在圆点中心,按 yaw 旋转;短线从圆点外沿(12px)向外伸 */
.pano-dir{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:auto;cursor:grab;touch-action:none}
.pano-dir.rotating{cursor:grabbing}
.pano-dir::after{content:'';position:absolute;left:-2px;bottom:12px;width:4px;height:18px;box-sizing:border-box;background:var(--yellow);border:1px solid #000;border-radius:2px;box-shadow:0 0 0 1px #fff}
/* 拖动把手:短线外端的圆头 + 比线宽的透明命中区(伪元素的命中算在 .pano-dir 上) */
.pano-dir::before{content:'';position:absolute;left:-11px;bottom:8px;width:22px;height:34px;background:radial-gradient(circle at 50% 8px,var(--yellow) 0 4.5px,#000 4.5px 6px,#fff 6px 7px,transparent 7px)}
.pano-panel .ps-hint{color:var(--dim);font-size:12px;margin:2px 0 6px}
.pano-panel .ps-form[hidden],.pano-panel .ps-hint[hidden]{display:none}
.pano-panel .ps-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px;padding:8px 10px;border:1px dashed var(--border);border-radius:8px}
.pano-panel .ps-form .ps-surf{color:var(--dim);font-size:12px}
.pano-panel .ps-form .ps-surf:empty{display:none}
.pano-panel .ps-form label{display:inline-flex;align-items:center;gap:4px;color:var(--dim)}
.pano-panel .ps-form input[type=number]{width:78px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:3px 6px}
.pano-panel .ps-form select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:3px 6px}
.pano-panel .ps-log{background:#0b0e14;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:8px 0;max-height:220px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:var(--dim)}
.pano-panel .ps-status.err{color:var(--red)}
.pano-panel .ps-status.ok{color:var(--green)}
/* 世界模型板块(2026-09-12 World Labs Marble):来源下拉 + 生成按钮 + 后台日志 + Spark 视窗 */
.world-panel .ws-log{background:#0b0e14;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:8px 0;max-height:220px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:var(--dim)}
.world-panel .ws-status.err{color:var(--red)}
.world-panel .ws-status.ok{color:var(--green)}
.world-panel .ws-gen.armed{border-color:var(--yellow);color:var(--yellow)}
.world-panel .wv-toolbar label{display:inline-flex;align-items:center;gap:4px;color:var(--dim)}
.world-panel .wv-toolbar input[type=number]{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:3px 6px}
/* 「💾 背景图」与全景 360° 视窗里的同名按钮同色(pano-viewer.js .p360-save) */
.world-panel .wv-toolbar button.wv-save{background:rgba(40,120,70,.85);color:#fff;border-color:rgba(255,255,255,.25)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
#lightbox img{max-width:96vw;max-height:96vh;border-radius:6px}
/* ✂ 裁剪分镜背景图(2026-09-15):比例固定为项目画幅的框选浮层,拖选框移动、拖四角缩放,确认后服务端裁切覆盖原图 */
.cropbtn,.pcopybtn,.pflipbtn{font-size:11px;line-height:16px;padding:1px 7px;flex:none;background:var(--panel2);border:1px solid var(--border);border-radius:5px;color:var(--dim);cursor:pointer}
.cropbtn:hover,.pcopybtn:hover,.pflipbtn:hover{color:var(--accent);border-color:var(--accent)}
.cropbtn.ok,.pcopybtn.ok,.pflipbtn.ok{color:var(--green);border-color:var(--green)}
.pcopybtn.err,.pflipbtn.err{color:var(--red);border-color:var(--red);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcopybtn:disabled,.pflipbtn:disabled{opacity:.5;cursor:default}
/* 裁剪 / 复制 / 翻转 单独一行(2026-09-28) */
.gallery figcaption.pl-ops{flex-wrap:wrap}
#cropper{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:100;padding:12px}
#cropper .cr-bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;color:var(--dim);font-size:13px;max-width:92vw;text-align:center}
#cropper .cr-bar b{color:var(--text);font-weight:600}
#cropper .cr-msg.err{color:var(--red)}
#cropper .cr-msg.ok{color:var(--green)}
#cropper .cr-stage{position:relative;overflow:hidden;user-select:none;touch-action:none;border-radius:4px;line-height:0}
#cropper .cr-stage img{display:block;max-width:92vw;max-height:74vh;pointer-events:none}
#cropper .cr-box{position:absolute;box-sizing:border-box;border:1.5px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.6);cursor:move;
  background-image:linear-gradient(to right,rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.35) 1px,transparent 1px);
  background-size:33.34% 100%,100% 33.34%;background-position:-1px 0,0 -1px}
#cropper .cr-h{position:absolute;width:14px;height:14px;background:#fff;border:1px solid #000;border-radius:2px}
#cropper .cr-h.nw{left:-1px;top:-1px;cursor:nwse-resize}
#cropper .cr-h.ne{right:-1px;top:-1px;cursor:nesw-resize}
#cropper .cr-h.sw{left:-1px;bottom:-1px;cursor:nesw-resize}
#cropper .cr-h.se{right:-1px;bottom:-1px;cursor:nwse-resize}
#cropper button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<header>
  <a class="back" href="/" onclick="if(history.length>1){history.back();return false}" title="后退">&lt;</a>
  <a class="back" href="/">控制台</a>
  <h1>🏔 场景预览</h1>
  <div class="spacer"></div>
  <span id="imp" title="本页场景资产(概念图/分镜背景图/布局图/四方向图,全景图除外)出图用的图像渠道/模型,与全局「生成模型」设置分开;空=跟随全局"></span>
  <span id="impp" title="本页场景 2:1 全景图出图用的图像渠道/模型(须支持任意宽高比,如火山 Seedream),与全局设置及左侧「图像模型」分开;空=跟随全局"></span>
  <input type="hidden" id="project">
  <select id="pvnav" title="切换预览页"></select>
  <button id="reload">刷新</button>
</header>
<main>
  <div id="list">
    <input id="search" placeholder="搜索场景…">
    <div id="items"></div>
  </div>
  <div id="detail"><div class="empty">加载中…</div></div>
</main>
<div id="lightbox"><img alt=""></div>
<div id="cropper">
  <div class="cr-bar"><b class="cr-title"></b><span class="cr-hint"></span></div>
  <div class="cr-stage"><img alt=""><div class="cr-box"><i class="cr-h nw"></i><i class="cr-h ne"></i><i class="cr-h sw"></i><i class="cr-h se"></i></div></div>
  <div class="cr-bar"><span class="cr-dim"></span><span class="cr-msg"></span><button type="button" class="cr-ok"></button><button type="button" class="cr-cancel"></button></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA=[], CUR=null, FOLDER=null;
// 项目「白模」选项(output.spatial_blocking,随预览数据 whitebox_enabled 下发):关闭时不显示世界模型板块/生成按钮
let WB_ON=true;
// 项目「场景图」设置(output.scene_plates,随预览数据 scene_plates_mode 下发):白模关闭项目的场景一致性方案,场景级可覆盖
let SP_MODE='auto';
// 项目「背景图模式」(output.plate_mode,随预览数据 plate_mode 下发,2026-09-22):白模开启项目分镜背景图的参考来源,场景级可覆盖
let PLATE_MODE='grid';   // 2026-09-26 默认九宫格
const PLATE_MODE_NAMES={pano:'全景图',world:'世界模型',grid:'九宫格自动补图',grid_manual:'九宫格手动补图'};
// 深链定位:分镜预览页参考图标签跳转 ?id=<SCN-ID>,首次加载直接选中该场景
let JUMP_ID=new URLSearchParams(location.search).get('id');
// 把当前项目+选中场景写回地址栏(?project=&id=),刷新/分享后仍停在同一场景
function syncUrl(){
  const proj=$('#project').value.trim()||'demo';
  const id=CUR||JUMP_ID;
  history.replaceState(null,'','?project='+encodeURIComponent(proj)+(id?'&id='+encodeURIComponent(id):''));
}
const DOC_NAMES={architecture:'建筑/空间结构',environment:'环境设定',lighting:'光照设定'};
const NOISE=new Set(['$schema_version','schema_version','file','owner_agent','task_id','project','source_inputs','write_via','agent']);

// ---- 板块折叠(2026-09-21):折叠态按板块 key 存 localStorage(全场景共用),渲染时回填 data-closed
const BLK_KEY='pv_scenes_blk_closed';
function blkClosed(){try{return new Set(JSON.parse(localStorage.getItem(BLK_KEY)||'[]'))}catch(e){return new Set()}}
function blk(key,title,body){return `<section class="blk" data-blk="${key}"${blkClosed().has(key)?' data-closed':''}><h3 class="blk-h">${title}</h3><div class="blk-body">${body}</div></section>`}
function blkMark(el,key){el.dataset.blk=key;el.toggleAttribute('data-closed',blkClosed().has(key))}
function blkOpen(el){const b=el&&el.closest('[data-blk]');if(b)b.removeAttribute('data-closed')}   // 跳转定位用:只展开当前这次,不改记忆
document.addEventListener('click',e=>{
  const h=e.target.closest('.blk>.blk-h,.wb-panel[data-blk] .wb-heading>strong');
  if(!h||e.target.closest('button,select,a,input,label'))return;
  const b=h.closest('[data-blk]'),closed=b.toggleAttribute('data-closed');
  const set=blkClosed();closed?set.add(b.dataset.blk):set.delete(b.dataset.blk);
  try{localStorage.setItem(BLK_KEY,JSON.stringify([...set]))}catch(_){}
});

function jrender(v){
  if(v===null||v===undefined||v==='')return '<span style="color:var(--dim)">—</span>';
  if(Array.isArray(v)){
    if(!v.length)return '<span style="color:var(--dim)">(空)</span>';
    if(v.every(x=>typeof x!=='object'||x===null))return esc(v.join('、'));
    return '<ul class="arr">'+v.map(x=>'<li>'+jrender(x)+'</li>').join('')+'</ul>';
  }
  if(typeof v==='object'){
    const ks=Object.keys(v).filter(k=>!NOISE.has(k));
    if(!ks.length)return '<span style="color:var(--dim)">(空)</span>';
    return '<dl class="kv">'+ks.map(k=>`<dt>${esc(k)}</dt><dd>${jrender(v[k])}</dd>`).join('')+'</dl>';
  }
  return esc(String(v));
}

// 按集过滤(ep-filter.js):搜索框前的分集下拉,选集后只留该集出现的条目
const epOk=x=>x.narrator||EpFilter.match(x.id);
function renderList(){
  const q=$('#search').value.trim().toLowerCase();
  const box=$('#items');box.innerHTML='';
  DATA.filter(epOk).filter(s=>!q||s.id.toLowerCase().includes(q)||(s.name||'').toLowerCase().includes(q)
      ||(s.meta.aliases||[]).some(a=>String(a.name||a).toLowerCase().includes(q)))
    .forEach(s=>{
      const d=document.createElement('div');
      d.className='item'+(CUR===s.id?' active':'');
      d.innerHTML=`<div class="row1"><span class="nm">${esc(s.name)}</span>`
        +(s.meta.level?`<span class="badge" title="${esc(s.meta.level)}">${esc(s.meta.level)}</span>`:'')
        +(s.images.length?`<span class="badge pic" title="${esc(I18N.f('图{n}',{n:s.images.length}))}">🖼${s.images.length}</span>`:'')
        +(Array.isArray(s.docs?.whitebox?.objects)?`<span class="badge pic" title="${esc(t('3D 白模'))}" aria-label="${esc(t('3D 白模'))}">🧊</span>`:'')
        +`</div><span class="id">${esc(s.id)}</span>`;
      d.onclick=()=>{CUR=s.id;FOLDER=null;syncUrl();renderList();renderDetail(s)};
      box.appendChild(d);
    });
  if(!box.children.length)box.innerHTML='<div class="empty">没有匹配的场景</div>';
}

function renderDetail(s){
  import('/static/whitebox-ui.js?v=20260926-flykeys').then(m=>m.resetWhitebox());
  const box=$('#detail');
  const m=s.meta||{};
  const aliases=(m.aliases||[]).map(a=>a.name||a).filter(Boolean);
  let h=`<h2 class="title">${esc(s.name)}<span class="id">${esc(s.id)}</span>`
    +(m.level?`<span class="badge">${esc(m.level)}</span>`:'')
    +(m.key_scene?`<span class="badge" style="border-color:var(--yellow);color:var(--yellow)">关键场景</span>`:'')
    +`<button class="editbtn" data-kind="scene" data-id="${esc(s.id)}" data-loc="${esc(I18N.f('场景 {name}({id};设定文档 bible/scenes/{id}/,登记 bible/scenes/index.json)',{name:s.name,id:s.id}))}" title="对这个场景的设定提修改意见,发给修改师处理">✏️ 修改</button></h2>`;
  const ml=[];
  if(aliases.length)ml.push(t('别名:')+aliases.join('、'));
  if(m.parent)ml.push(t('父级:')+m.parent);
  if(m.chapters&&m.chapters.length)ml.push(t('出现章节:')+m.chapters.join(','));
  if(m.frequency)ml.push(t('频次:')+m.frequency);
  if(ml.length)h+=`<div class="meta-line">${esc(ml.join('  ·  '))}</div>`;
  if(m.notes)h+=`<div class="notes">${esc(m.notes)}</div>`;
  // 图库分组:场景目录根下的图直接展示;candidates/ 等子目录收成文件夹卡片,点击进入
  const rootImgs=[],folders={};
  s.images.forEach(im=>{
    const i=im.name.indexOf('/');
    if(i>0){const d=im.name.slice(0,i);(folders[d]=folders[d]||[]).push(im)}
    else rootImgs.push(im);
  });
  if(FOLDER&&!folders[FOLDER])FOLDER=null;
  const fig=(im,strip)=>{
    const nm=strip?im.name.slice(strip.length+1):im.name;
    return `<figure><img src="${esc(bust(im.url))}" loading="lazy" onclick="zoom(this.src)"><figcaption title="${esc(nm)}"><span class="fn">${esc(nm)}</span><button class="editbtn" data-url="${esc(im.url)}" title="对这张图提修改意见,发给修改师处理">✏️ 修改</button></figcaption></figure>`;
  };
  // 🖼 场景图板块(原「图库」,2026-09-25 改名):场景目录下全部图(grid_9views.png / layout_top.png / 概念图…)+ archive、candidates 等子文件夹
  let g='';
  if(FOLDER){
    const ims=folders[FOLDER];
    g+=`<div class="foldbar"><button onclick="closeFolder()">${t('← 返回')}</button><span class="fname">📁 ${esc(FOLDER)}</span><span class="fcnt">${esc(I18N.f('{n} 张',{n:ims.length}))}</span></div>`;
    g+='<div class="gallery">'+ims.map(im=>fig(im,FOLDER)).join('')+'</div>';
  }else if(s.images.length){
    g+='<div class="gallery">'+rootImgs.map(im=>fig(im)).join('')
      +Object.keys(folders).sort().map(d=>{
        const ims=folders[d];
        return `<figure class="folder" data-d="${esc(d)}" onclick="openFolder(this.dataset.d)" title="${esc(d)}">`
          +`<div class="fthumb"><img src="${esc(bust(ims[0].url))}" loading="lazy"><div class="fmask">📁</div></div>`
          +`<figcaption><span class="fn">📁 ${esc(d)}</span><span class="fcnt">${esc(I18N.f('{n} 张',{n:ims.length}))}</span></figcaption></figure>`;
      }).join('')+'</div>';
  }else{
    g+='<div class="meta-line">(暂无概念图)</div>';
  }
  h+=blk('gallery',`🖼 ${esc(t('场景图'))} <span class="cnt">${esc(I18N.f('{n} 张',{n:s.images.length}))}</span>`,g);
  // 场景图(正向/反向,2026-09-17,白模关闭项目的场景一致性 A 方案):scene_plates.json 登记 + 模式覆盖(继承项目/只出正向/正反两张)
  if(s.scene_plates&&!WB_ON){
    const sp=s.scene_plates;
    const modeName={auto:t('自动:正向必出,反向按分镜按需'),single:t('只出正向'),pair:t('正反两张都出')};
    const card=(v,role)=>{
      if(!v||!v.url)return `<figure><div class="fthumb" style="display:flex;align-items:center;justify-content:center;min-height:120px;color:var(--dim)">${esc(role==='front'?t('正向图未出(环境概念工位出 main_01.png 并登记)'):(sp.reverse_needed?t('反向图未出:分镜定稿后由 p6-scene-plates 补出(code/render_scene_plates.py)'):t('本场景不需要反向图')))}</div><figcaption><span class="fn">${esc(role==='front'?t('正向图'):t('反向图'))}</span></figcaption></figure>`;
      const cap=[v.standing_en?I18N.f('站位 {s}',{s:v.standing_en}):'',v.looking_en?I18N.f('看向 {s}',{s:v.looking_en}):''].filter(Boolean).join(' · ');
      const inf=(v.in_frame_en||[]).join(', ');
      const stale=role==='reverse'&&sp.reverse_stale?` <span style="color:#e6b422">⚠ ${esc(t('过期:正向图已重出,需重出反向图'))}</span>`:'';
      return `<figure title="${esc(v.file||'')}"><img src="${esc(bust(v.url))}" loading="lazy" onclick="zoom(this.src)"><figcaption><span class="fn">${esc(role==='front'?t('正向图(门口往内看)'):t('反向图(从里回望门口)'))} · ${esc(v.file||'')}${stale}</span></figcaption>`
        +(cap?`<figcaption><span class="fn">${esc(cap)}</span></figcaption>`:'')+(inf?`<figcaption><span class="fn">${esc(I18N.f('画内:{s}',{s:inf}))}</span></figcaption>`:'')+`</figure>`;
    };
    h+=blk('scene_plates',`🖼 ${esc(t('场景图(正向 / 反向)'))} <span class="cnt">${esc(I18N.f('生效模式 {m}',{m:modeName[sp.effective]||sp.effective}))}${sp.legacy?' · '+esc(t('旧版主图,未登记站位')):''}</span>`,
      `<div class="meta-line">${esc(t('本场景模式'))}: <select class="sp-mode" data-sid="${esc(s.id)}"${sp.legacy?' disabled title="'+esc(t('旧版主图尚未登记站位/画内清单,先回派环境概念工位补登记再改模式'))+'"':''}>`
      +`<option value="inherit"${sp.mode==='inherit'?' selected':''}>${esc(I18N.f('继承项目({m})',{m:modeName[SP_MODE]||SP_MODE}))}</option>`
      +`<option value="single"${sp.mode==='single'?' selected':''}>${esc(t('只出正向'))}</option>`
      +`<option value="pair"${sp.mode==='pair'?' selected':''}>${esc(t('正反两张都出'))}</option></select>`
      +` <span style="color:var(--dim)">${esc(sp.reverse_reason||'')}${(sp.needed_by||[]).length?' · '+esc(I18N.f('用到反向图的镜:{s}',{s:sp.needed_by.join(', ')})):''}</span></div>`
      +`<div class="gallery plates">${card(sp.front,'front')}${card(sp.reverse,'reverse')}</div>`
      // 光照变体(2026-09-30):组光照方案 ≠ 母版方案时按需补出,以母版为参考只改光照
      +((sp.variants||[]).length?`<div class="meta-line">${esc(t('光照变体'))}${sp.base_scheme?' · '+esc(I18N.f('母版光照 {s}',{s:sp.base_scheme})):''}</div><div class="gallery plates">`
        +sp.variants.map(v=>{
          const lab=(v.view==='reverse'?t('反向图'):t('正向图'))+' × '+v.scheme;
          const used=(v.needed_by||[]).length?`<figcaption><span class="fn">${esc(I18N.f('用到的镜:{s}',{s:v.needed_by.join(', ')}))}</span></figcaption>`:'';
          if(!v.url)return `<figure><div class="fthumb" style="display:flex;align-items:center;justify-content:center;min-height:120px;color:var(--dim)">${esc(t('光照变体未出:分镜定稿后由 p6-scene-plates 补出(code/render_scene_plates.py)'))}</div><figcaption><span class="fn">${esc(lab)}</span></figcaption>${used}</figure>`;
          const stale=v.stale?` <span style="color:#e6b422">⚠ ${esc(t('过期:母版已重出,需重出光照变体'))}</span>`:'';
          return `<figure title="${esc(v.file||'')}"><img src="${esc(bust(v.url))}" loading="lazy" onclick="zoom(this.src)"><figcaption><span class="fn">${esc(lab)} · ${esc(v.file||'')}${stale}</span></figcaption>${used}</figure>`;
        }).join('')+`</div>`:''));
  }
  // 分镜背景图(2026-09-09):场景库 plates/index.json,按机位指纹入库,标注被哪些集/镜引用
  // 背景图模式(2026-09-22):白模开启时板块常显,标题后「背景图模式」= 跟随全局 / 九宫格自动补图 / 九宫格手动补图(POST scenes/<sid>/plates/plate-mode);
  // 2026-10-04 用户拍板:全景图 / 世界模型两项隐藏(只在本场景当前就是该值时保留一条隐藏项,好让旧覆盖值正确显示)
  const pm=s.plate_mode||null;
  if((s.plates||[]).length||(WB_ON&&pm)){
    const plates=s.plates||[];
    const pmSel=pm?` <select class="pm-mode" data-sid="${esc(s.id)}" title="${esc(t('本场景分镜背景图的参考来源;默认跟随项目输出设置「背景图模式」,可单独覆盖'))}">`
      +`<option value="inherit"${pm.mode==='inherit'?' selected':''}>${esc(I18N.f('跟随全局({m})',{m:t(PLATE_MODE_NAMES[PLATE_MODE]||PLATE_MODE)}))}</option>`
      +`<option value="grid"${pm.mode==='grid'?' selected':''}>${esc(t('九宫格自动补图'))}</option>`
      +`<option value="grid_manual"${pm.mode==='grid_manual'?' selected':''}>${esc(t('九宫格手动补图'))}</option>`
      +(pm.mode==='pano'?`<option value="pano" selected hidden>${esc(t('全景图'))}</option>`:'')
      +(pm.mode==='world'?`<option value="world" selected hidden>${esc(t('世界模型'))}</option>`:'')+`</select>`:'';
    let body='';
    if(pm&&pm.effective==='world'&&!pm.has_world){
      body+=`<div class="meta-line pm-warn" style="color:#e6b422">⚠ ${esc(t('本场景背景图模式为「世界模型」,但尚未生成世界模型:出图链会停下(退出码 4),请先在上方「🌍 世界模型」板块生成'))} `
        +`<button type="button" class="editbtn pm-goworld">${esc(t('前往世界模型'))}</button></div>`;
    }
    // 九宫格手动补图(2026-10-04):没有合适格子的镜不自动出图,列出待用户手工截取的镜(集索引 view.manual_needed)与各自机位
    if(pm&&pm.effective==='grid_manual'){
      const need=pm.manual_needed||[];
      if(need.length){
        body+=`<div class="meta-line pm-warn" style="color:#e6b422">⚠ ${esc(I18N.f('手动补图:{n} 张背景图待手工截取。打开上方全景图的 360° 预览或世界模型视窗,转到该镜的方向后点「💾 背景图」保存,再重跑分镜背景图即自动选用;也可在分镜预览页对该镜「换图」手选。',{n:need.length}))}</div>`
          +`<div class="meta-line" style="color:var(--dim)">`+need.map(x=>esc(I18N.f('{s} · 朝向 {b}° · 俯仰 {p}° · 机高 {h} m',
            {s:`${x.ep}/${x.shot_id}(${x.role==='end'?t('终点'):t('起点')})`,b:x.bearing_deg!=null?Math.round(x.bearing_deg):'-',p:x.pitch_deg!=null?Math.round(x.pitch_deg):'-',h:x.height_m!=null?x.height_m:'-'}))).join('<br>')+`</div>`;
      }else{
        body+=`<div class="meta-line" style="color:var(--dim)">${esc(t('手动补图模式:没有合适九宫格图的镜不会自动出图,需要在全景图 360° 预览或世界模型视窗里用「💾 背景图」手工截取。当前没有待补的镜。'))}</div>`;
      }
    }
    body+=plates.length?`<div class="gallery plates">`
      +plates.map(p=>{
        const cam=p.camera||{};
        const used=(p.used_by||[]).join(', ');

// ---------------- 🌍 世界模型(World Labs Marble,2026-09-12) ----------------
// 仅项目「白模」选项开启时显示:全景来源下拉(场景全景图锚点/方案;2026-09-13 起必须基于全景图,白模深度转世界模型选项已去掉)+「生成世界模型」按钮;

// 后台任务日志经 SSE scene_world 事件逐行显示;已有 world 时用 Spark 挂可漫游视窗(world-viewer.js)
let WORLD_LIVE=null;   // 当前挂载的板块 {sid, onEvent}
function worldSourceOptions(s){
  const src=s.world_sources,opts=[];
  const anchors=(src&&src.anchors)||[];
  anchors.forEach(a=>(a.schemes||[]).forEach(sc=>opts.push({v:`scene_pano|${a.anchor_id}|${sc}`,label:I18N.f('全景图 {a} / {s}',{a:a.anchor_id,s:sc})})));

function mountWorldSection(whitebox,s){
  if(WB_ON===false)return;

  if(spBlk)spBlk.before(sec);else whitebox.after(sec);
  const world=s.world||null,job=s.world_job||null;
  const opts=worldSourceOptions(s);
  const inp=(world&&world.input)||{};
  const curV=inp.source?`${inp.source}|${inp.anchor_id||''}|${inp.scheme||''}`:'';
  const srcText=inp.source==='scene_pano'?I18N.f('全景图 {a} / {s}',{a:inp.anchor_id,s:inp.scheme}):inp.source==='depth2rgb'?I18N.f('Marble 深度转全景(锚点 {a})',{a:inp.anchor_id||'-'}):'';
  const running=job&&job.status==='running';
  let h=`<div class="wb-toolbar"><div class="wb-heading"><strong>🌍 ${esc(t('世界模型'))} · ${esc(s.id)}</strong>`
    +(world?`<span style="color:var(--dim);font-weight:400">${esc(world.model||'')}${srcText?' · '+esc(t('来源'))+' '+esc(srcText):''}${world.written_at?' · '+esc(String(world.written_at).replace('T',' ')):''}</span>`:'')
    +`</div><label style="color:var(--dim)">${esc(t('全景来源'))} <select class="ws-source">${opts.map(o=>`<option value="${esc(o.v)}"${o.v===curV?' selected':''}>${esc(o.label)}</option>`).join('')}</select></label>`
    +`<button type="button" class="ws-gen"${running?' disabled':''}>${esc(running?t('生成中…'):world?t('重新生成世界模型'):t('生成世界模型'))}</button></div>`
    +`<div class="wb-status ws-status">${esc(running?t('正在生成世界模型…'):world?'':t('尚未生成世界模型;选择全景来源后点「生成世界模型」(约 5–10 分钟,消耗 World Labs credits)'))}</div>`
    +`<pre class="ws-log" data-no-i18n${running?'':' hidden'}>${esc((job&&job.log||[]).join('\n'))}</pre>`
    +`<div class="ws-viewer"></div>`;
  if(world&&world.previews){
    const caps=[['whitebox_pano','白模全景'],['depth_pano','深度全景']].filter(([k])=>world.previews[k]);   // 输入全景不在此展示(全景图板块已有)
    if(caps.length)h+=`<div class="gallery plates" style="margin-top:8px">${caps.map(([k,cap])=>`<figure><img src="${esc(world.previews[k])}" alt="${esc(t(cap))}" loading="lazy" onclick="zoomPano(this.src)"><figcaption><span class="fn">${esc(t(cap))}</span></figcaption></figure>`).join('')}</div>`;
  }
  sec.innerHTML=h;
  const status=sec.querySelector('.ws-status'),log=sec.querySelector('.ws-log'),btn=sec.querySelector('.ws-gen'),sel=sec.querySelector('.ws-source');
  if(!opts.length&&!running){
    btn.disabled=true;sel.disabled=true;
    if(s.world_sources&&s.world_sources.has_whitebox===false)status.textContent=t('该场景还没有白模,不能生成世界模型');
    else{   // 有白模没全景图:提示先创建全景图,按钮跳到下方「🌐 全景图」板块并打开创建表单
      status.textContent=t('该场景还没有全景图,世界模型必须基于全景图:请先创建全景图')+' ';
      const go=document.createElement('button');go.type='button';go.className='editbtn';go.style.marginLeft='6px';go.textContent=t('➕ 前往创建全景图');
      go.onclick=()=>{const ps=whitebox.parentNode.querySelector('.pano-panel');if(!ps)return;blkOpen(ps);ps.scrollIntoView({behavior:'smooth',block:'start'});const c=ps.querySelector('.ps-create');if(c&&!c.disabled)c.click();};
      status.appendChild(go);
    }
  }
  let armed=null;
  btn.onclick=async()=>{
    const force=!!world;
    if(force&&!armed){   // 已有 world:第二次点击才真正提交(旧版归档到 world/variants/),不用 confirm 弹窗
      btn.classList.add('armed');btn.textContent=t('确认重新生成(旧版归档到 world/variants/)');
      armed=setTimeout(()=>{armed=null;btn.classList.remove('armed');btn.textContent=t('重新生成世界模型');},8000);return;
    }
    if(armed){clearTimeout(armed);armed=null;btn.classList.remove('armed');}
    const [source,anchor,scheme]=(sel.value||'scene_pano||').split('|');
    btn.disabled=true;btn.textContent=t('生成中…');status.className='wb-status ws-status';status.textContent=t('正在生成世界模型…');log.hidden=false;log.textContent='';
    try{
      const r=await fetch(`/api/v1/projects/${encodeURIComponent(proj)}/scenes/${encodeURIComponent(s.id)}/world`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source,anchor,scheme,force})});

    else{status.className='wb-status ws-status err';status.textContent=t('世界模型生成失败:')+(ev.error||'');btn.disabled=false;btn.textContent=world?t('重新生成世界模型'):t('生成世界模型');}
  }};
  if(world&&world.files&&Object.keys(world.files.splats||{}).length){
    const host=sec.querySelector('.ws-viewer');
    import('/static/world-viewer.js?v=20260926-save2').then(m=>m.mountWorld(host,proj,s.id,world,{format:FORMAT||null,onSaved:()=>reloadKeep()})).catch(e=>{host.textContent=t('世界模型加载失败:')+(e.message||e);});
  }

// 后台任务完成后重取预览数据并原位重绘(保留当前场景与滚动位置)
async function reloadKeep(){
  const proj=$('#project').value.trim()||'demo';
  const top=$('#detail').scrollTop;
  try{
    const r=await fetch('/api/v1/projects/'+encodeURIComponent(proj)+'/previews/scenes');
    if(!r.ok)return;
    const d=await r.json();DATA=d.scenes;WB_ON=d.whitebox_enabled===true;SP_MODE=d.scene_plates_mode||'auto';FORMAT=d.format||null;PLATE_MODE=d.plate_mode||'grid';
  }catch(e){return}

  const cur=DATA.find(x=>x.id===CUR);
  if(cur){renderDetail(cur);$('#detail').scrollTop=top;}

// SSE:世界模型后台任务日志/完成事件(仅当前项目 + 当前选中场景)
try{
  const es=new EventSource('/api/v1/events');
  es.onmessage=e=>{
    try{
      const ev=JSON.parse(e.data);

  };
}catch(e){/* EventSource 不可用时页面仍可手动刷新 */}

  };
  const onMapClick=e=>{

    const img=map.querySelector('img'),rc=img.getBoundingClientRect();

    if(map){map.classList.add('picking');map.addEventListener('click',onMapClick);hint.hidden=false;hint.textContent=t('在俯视图上点一下选择全景中心(坐标为白模米制,原点在场景中心)');}

// ✂ 裁剪分镜背景图(2026-09-15):选区用归一化坐标 {l,t,w,h}(0..1,相对原图),与显示缩放无关;比例固定 = 项目画幅(预览数据 format,
// 缺失时退回图片自身比例);拖选框移动、拖四角缩放(对角固定);确认 → POST scenes/<sid>/plates/crop,服务端裁切覆盖原图后原地换图,不整页重载。
let FORMAT=null;
const CROP={sid:null,key:null,W:0,H:0,aspect:1,sel:null,drag:null};
const CR=$('#cropper'),CR_IMG=CR.querySelector('img'),CR_BOX=CR.querySelector('.cr-box'),CR_STAGE=CR.querySelector('.cr-stage');
function crMsg(txt,cls){const m=CR.querySelector('.cr-msg');m.textContent=txt||'';m.className='cr-msg'+(cls?' '+cls:'');}
// 选区高由宽按固定比例推出(归一化坐标下 h = w·W/(aspect·H)),并整体收进 [0,1]
function crFit(l,t,w){
  const k=CROP.W/(CROP.aspect*CROP.H);
  const minW=64*Math.max(1,CROP.aspect)/CROP.W;   // 裁后短边 ≥ 64 px(与服务端一致)
  w=Math.min(Math.max(w,minW),1,1/k);
  const h=w*k;
  return {l:Math.min(Math.max(l,0),1-w),t:Math.min(Math.max(t,0),1-h),w,h};
}
function crLayout(){
  const sel=CROP.sel;if(!sel)return;
  const cw=CR_IMG.clientWidth,ch=CR_IMG.clientHeight;
  CR_BOX.style.left=(sel.l*cw)+'px';CR_BOX.style.top=(sel.t*ch)+'px';CR_BOX.style.width=(sel.w*cw)+'px';CR_BOX.style.height=(sel.h*ch)+'px';
  CR.querySelector('.cr-dim').textContent=I18N.f('选区 {w}×{h} px / 原图 {W}×{H}',{w:Math.round(sel.w*CROP.W),h:Math.round(sel.h*CROP.H),W:CROP.W,H:CROP.H});
}
function openCrop(sid,key,url){
  CROP.sid=sid;CROP.key=key;CROP.sel=null;CROP.drag=null;
  CR.querySelector('.cr-title').textContent=t('裁剪分镜背景图')+' · '+key;
  CR.querySelector('.cr-hint').textContent='';CR.querySelector('.cr-dim').textContent='';crMsg(t('加载中…'));
  const ok=CR.querySelector('.cr-ok'),cancel=CR.querySelector('.cr-cancel');
  ok.textContent=t('✂ 确认裁剪');cancel.textContent=t('取消');ok.disabled=true;cancel.disabled=false;
  CR_BOX.style.display='none';
  CR_IMG.onload=()=>{
    CROP.W=CR_IMG.naturalWidth;CROP.H=CR_IMG.naturalHeight;
    CROP.aspect=(FORMAT&&FORMAT.width>0&&FORMAT.height>0)?FORMAT.width/FORMAT.height:CROP.W/CROP.H;
    const gcd=(a,b)=>b?gcd(b,a%b):a;
    const ar=(FORMAT&&FORMAT.width>0&&FORMAT.height>0)?(g=>`${FORMAT.width/g}:${FORMAT.height/g}`)(gcd(FORMAT.width,FORMAT.height)):CROP.aspect.toFixed(3);
    CR.querySelector('.cr-hint').textContent=I18N.f('拖动选框移动,拖四角缩放;比例固定 {ar}(项目画幅),确认后覆盖原图并保留 .orig 备份',{ar});
    const w0=.8;const f=crFit(0,0,w0);CROP.sel=crFit((1-f.w)/2,(1-f.h)/2,f.w);
    CR_BOX.style.display='';crLayout();crMsg('');ok.disabled=false;
  };
  CR_IMG.onerror=()=>crMsg(t('图片加载失败'),'err');
  CR_IMG.src=url;
  CR.style.display='flex';
}
function closeCrop(){CR.style.display='none';CR_IMG.src='';CROP.sel=null;CROP.drag=null;}
CR_STAGE.addEventListener('pointerdown',e=>{
  if(!CROP.sel||e.button!==0)return;
  const h=e.target.closest('.cr-h');
  if(!h&&!e.target.closest('.cr-box'))return;
  const rc=CR_IMG.getBoundingClientRect(),sel=CROP.sel;
  const corner=h?[...h.classList].find(c=>/^(nw|ne|sw|se)$/.test(c)):null;
  CROP.drag={mode:corner?'resize':'move',corner,rc,x0:e.clientX,y0:e.clientY,sel0:{...sel}};
  CR_STAGE.setPointerCapture(e.pointerId);e.preventDefault();
});
CR_STAGE.addEventListener('pointermove',e=>{
  const d=CROP.drag;if(!d)return;
  const {rc,sel0}=d;
  if(d.mode==='move'){
    CROP.sel=crFit(sel0.l+(e.clientX-d.x0)/rc.width,sel0.t+(e.clientY-d.y0)/rc.height,sel0.w);
  }else{
    // 对角固定:锚点 = 所拖角的对角;沿宽/高两向取更大的延伸量,再按比例、按锚点到画幅边的余量收窄
    const px=Math.min(Math.max((e.clientX-rc.left)/rc.width,0),1),py=Math.min(Math.max((e.clientY-rc.top)/rc.height,0),1);
    const right=d.corner[1]==='e',down=d.corner[0]==='s';
    const ax=right?sel0.l:sel0.l+sel0.w,ay=down?sel0.t:sel0.t+sel0.h;
    const k=CROP.W/(CROP.aspect*CROP.H);
    let w=Math.max(Math.abs(px-ax),Math.abs(py-ay)/k);
    const availW=right?1-ax:ax,availH=down?1-ay:ay;
    w=Math.min(w,availW,availH/k);
    const f=crFit(0,0,w);w=f.w;const hh=f.h;
    CROP.sel=crFit(right?ax:ax-w,down?ay:ay-hh,w);
  }
  crLayout();
});
const crEnd=e=>{if(CROP.drag){CROP.drag=null;try{CR_STAGE.releasePointerCapture(e.pointerId)}catch(_){}}};
CR_STAGE.addEventListener('pointerup',crEnd);CR_STAGE.addEventListener('pointercancel',crEnd);
window.addEventListener('resize',()=>{if(CR.style.display==='flex')crLayout()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&CR.style.display==='flex'&&!CR.querySelector('.cr-cancel').disabled)closeCrop()});
CR.querySelector('.cr-cancel').onclick=closeCrop;
CR.querySelector('.cr-ok').onclick=async()=>{
  const sel=CROP.sel;if(!sel)return;
  const proj=$('#project').value.trim()||'demo',ok=CR.querySelector('.cr-ok'),cancel=CR.querySelector('.cr-cancel');
  ok.disabled=true;cancel.disabled=true;crMsg(t('裁剪中…'));
  try{
    const r=await fetch(`/api/v1/projects/${encodeURIComponent(proj)}/scenes/${encodeURIComponent(CROP.sid)}/plates/crop`,
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:CROP.key,left:sel.l,top:sel.t,width:sel.w,height:sel.h})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.detail||(r.status===404?t('服务未重启:裁剪接口不可用'):r.status));
    // 原地换图 + 同步 DATA,不整页重载(世界模型/全景板块状态不动);?v= 是文件 mtime(秒级),再补 &t= 防同秒二次裁剪命中缓存
    const url=d.url+(d.url.includes('?')?'&':'?')+'t='+Date.now();
    const sc=DATA.find(x=>x.id===CROP.sid);
    const pl=sc&&(sc.plates||[]).find(p=>p.key===CROP.key);
    if(pl){pl.url=url;pl.size=d.size;}
    document.querySelectorAll(`.gallery.plates figure[data-key="${CSS.escape(CROP.key)}"]`).forEach(fg=>{
      const im=fg.querySelector('img');if(im)im.src=url;
      const b=fg.querySelector('.cropbtn');if(b){b.classList.add('ok');b.textContent='✓ '+t('已裁剪并替换');setTimeout(()=>{b.classList.remove('ok');b.textContent='✂ '+t('裁剪')},2500);}
    });
    closeCrop();
  }catch(e){crMsg(t('裁剪失败:')+e.message,'err');ok.disabled=false;cancel.disabled=false;}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('.cropbtn');
  if(!b||!b.dataset.key)return;

PV_PAGES.forEach(([u,n])=>{const o=document.createElement('option');o.value=u;o.textContent=n;if(location.pathname===u)o.selected=true;$('#pvnav').appendChild(o)});
$('#pvnav').onchange=()=>{const p=($('#project').value||'').trim()||'demo';location.href=$('#pvnav').value+'?project='+encodeURIComponent(p)};
</script>
</body>
</html>
