<style>
:root{
  --bg:#0f1117; --panel:#161a23; --panel2:#1c2130; --border:#2a3040;
  --text:#dde3ee; --dim:#8b93a7; --accent:#6c9ef8; --link:#fb923c; --green:#4ade80;
  --red:#f87171; --yellow:#fbbf24; --purple:#c084fc;
}
*{box-sizing:border-box;margin:0;padding:0}
a{color:var(--link)}
body{background:var(--bg);color:var(--text);font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
header h1{font-size:15px;font-weight:600}
header a.back{color:var(--dim);text-decoration:none;font-size:13px}
header a.back:hover{color:var(--accent)}
header .spacer{flex:1}
input[type=text]{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px}
button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}
header select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;cursor:pointer}
header select:hover{border-color:var(--accent)}
main{flex:1;display:flex;min-height:0}
#list{width:270px;border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column}
#search{margin:10px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text)}
#items{flex:1;overflow-y:auto;padding-bottom:20px}
.item{padding:7px 14px;cursor:pointer;border-left:2px solid transparent}
.item:hover{background:var(--panel2)}
.item.active{background:var(--panel2);border-left-color:var(--accent)}
.item .row1{display:flex;align-items:center;gap:6px;min-width:0}
.item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .id{display:block;color:var(--dim);font-size:11px;line-height:1.4;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:10px;line-height:14px;height:16px;box-sizing:border-box;display:inline-flex;align-items:center;gap:1px;border:1px solid var(--purple);color:var(--purple);border-radius:4px;padding:0 5px;flex:none}
.badge.pic{border-color:var(--green);color:var(--green)}
#detail{flex:1;overflow-y:auto;padding:22px 26px}
.empty{color:var(--dim);text-align:center;margin-top:60px}
h2.title{font-size:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2.title .id{color:var(--dim);font-size:13px;font-weight:400}
.meta-line{color:var(--dim);font-size:13px;margin:6px 0 4px}
.notes{color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:13px}
.voices{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.voice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--yellow);border-radius:8px;padding:7px 12px;font-size:13px}
.voice .vtag{font-size:11px;color:var(--dim);border:1px solid var(--border);border-radius:4px;padding:0 5px}
.voice audio{height:32px;max-width:320px}
.gallery{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}
.gallery figure{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px;text-align:center}
.gallery img{height:230px;max-width:320px;object-fit:contain;border-radius:6px;cursor:zoom-in;display:block}
.gallery figcaption{font-size:11px;color:var(--dim);margin-top:4px;max-width:320px;display:flex;align-items:center;justify-content:center;gap:6px}
.gallery figcaption .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gallery figure.folder{cursor:pointer}
.gallery figure.folder:hover{border-color:var(--accent)}
.gallery figure.folder img{cursor:pointer}
.fthumb{position:relative}
.fthumb .fmask{position:absolute;inset:0;background:rgba(15,17,23,.42);display:flex;align-items:center;justify-content:center;font-size:46px;border-radius:6px}
.fcnt{color:var(--dim);flex:none}
.foldbar{display:flex;align-items:center;gap:10px;margin:16px 0 -6px;font-size:13px}
.foldbar .fname{font-weight:600}
.editbtn{font-size:11px;padding:1px 7px;flex:none;background:var(--panel2);border:1px solid var(--border);border-radius:5px;color:var(--dim);cursor:pointer}
.editbtn:hover{color:var(--accent);border-color:var(--accent)}
.avst{font-size:11px;color:var(--green);border:1px solid var(--green);border-radius:5px;padding:1px 7px;flex:none}
.avbtn.proc{color:var(--yellow);border-color:var(--yellow)}
.avbtn.fail{color:var(--red);border-color:var(--red)}
.cos-head{display:flex;align-items:center;gap:10px;margin:18px 0 6px;font-size:14px;font-weight:600}
.cos-head .cnt{color:var(--dim);font-weight:400;font-size:12px}
.cos{display:flex;gap:14px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;margin:10px 0}
.cos.hl{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cos .pic{flex:none;width:320px}
.cos .pic img{width:320px;height:180px;object-fit:contain;border-radius:6px;cursor:zoom-in;display:block;background:var(--panel2)}
.cos .pic .nopic{width:320px;height:180px;border:1px dashed var(--border);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dim);font-size:12px;text-align:center;padding:8px;line-height:1.5}
.cos .info{flex:1;min-width:0;font-size:13px}
.cos .info .lb{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cos .info .lb .id{color:var(--dim);font-weight:400;font-size:12px}
.cos .info .ml{color:var(--dim);font-size:12px;margin:3px 0}
.cos .info .ve{margin-top:6px;color:var(--text);opacity:.9;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.cos .info .ve.open{display:block}
.cos .info .warn{color:var(--yellow);font-size:12px;margin-top:4px}
.badge.def{border-color:var(--accent);color:var(--accent)}
.badge.cosb{border-color:var(--yellow);color:var(--yellow)}
.doc{border:1px solid var(--border);border-radius:10px;margin:14px 0;overflow:hidden}
.doc>h3{background:var(--panel);padding:9px 14px;font-size:13.5px;cursor:pointer;user-select:none}
.doc>h3::before{content:'▾ ';color:var(--dim)}
.doc.closed>h3::before{content:'▸ '}
.doc.closed>.body{display:none}
.doc>.body{padding:12px 16px;background:var(--panel2)}
dl.kv{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:4px 14px}
dl.kv>dt{color:var(--dim);font-size:12.5px;word-break:break-all}
dl.kv>dd{min-width:0;word-break:break-word}
dl.kv dl.kv{margin:2px 0 6px;padding-left:10px;border-left:1px solid var(--border)}
ul.arr{padding-left:18px}
ul.arr>li{margin:2px 0}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
#lightbox img{max-width:96vw;max-height:96vh;border-radius:6px}
</style>
</head>
<body>
<header>
  <a class="back" href="/">← 控制台</a>
  <h1>👤 人物预览</h1>
  <div class="spacer"></div>
  <input type="hidden" id="project">
  <select id="pvnav" title="切换预览页"></select>
  <button id="reload">刷新</button>
</header>
<main>
  <div id="list">
    <input id="search" placeholder="搜索角色…">
    <div id="items"></div>
  </div>
  <div id="detail"><div class="empty">加载中…</div></div>
</main>
<div id="lightbox"><img alt=""></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA=[], CUR=null, FOLDER=null;
// 深链定位:分镜预览页参考图标签跳转 ?id=<CHAR-ID>,首次加载直接选中该角色
let JUMP_ID=new URLSearchParams(location.search).get('id');
// 分镜预览页组卡服装图跳转 ?id=<CHAR>&costume=<COS-id>,首次渲染高亮该套服装卡
let JUMP_COS=new URLSearchParams(location.search).get('costume');
const DOC_NAMES={appearance:'外貌设定',personality:'性格设定',dialogue_style:'台词风格',voice:'声音/配音',age_versions:'年龄版本'};
const NOISE=new Set(['$schema_version','schema_version','file','owner_agent','task_id','project','source_inputs','write_via','agent']);

function jrender(v){
  if(v===null||v===undefined||v==='')return '<span style="color:var(--dim)">—</span>';
  if(Array.isArray(v)){
    if(!v.length)return '<span style="color:var(--dim)">(空)</span>';
    if(v.every(x=>typeof x!=='object'||x===null))return esc(v.join('、'));
    return '<ul class="arr">'+v.map(x=>'<li>'+jrender(x)+'</li>').join('')+'</ul>';
  }
  if(typeof v==='object'){
    const ks=Object.keys(v).filter(k=>!NOISE.has(k));
    if(!ks.length)return '<span style="color:var(--dim)">(空)</span>';
    return '<dl class="kv">'+ks.map(k=>`<dt>${esc(k)}</dt><dd>${jrender(v[k])}</dd>`).join('')+'</dl>';
  }
  return esc(String(v));
}

function renderList(){
  const q=$('#search').value.trim().toLowerCase();
  const box=$('#items');box.innerHTML='';
  DATA.filter(c=>!q||c.id.toLowerCase().includes(q)||(c.name||'').toLowerCase().includes(q)
      ||(c.meta.aliases||[]).some(a=>String(a.name||a).toLowerCase().includes(q)))
    .forEach(c=>{
      const d=document.createElement('div');
      d.className='item'+(CUR===c.id?' active':'');
      d.innerHTML=`<div class="row1"><span class="nm">${c.narrator?'🎙 ':''}${esc(c.narrator?t(c.name):c.name)}</span>`
        +(c.narrator&&(c.voices||[]).some(v=>v.url)?`<span class="badge pic" title="${esc(t('旁白声线'))}">🔊</span>`:'')
        +(c.meta.tier?`<span class="badge">${esc(c.meta.tier)}</span>`:'')
        +(c.images.length?`<span class="badge pic" title="${esc(I18N.f('图{n}',{n:c.images.length}))}">🖼${c.images.length}</span>`:'')
        +((c.costumes||[]).length?`<span class="badge cosb" title="${esc(t('服装 sheet:已出图/总套数'))}">👕${(c.costumes||[]).filter(x=>x.url).length}/${c.costumes.length}</span>`:'')
        +`</div><span class="id">${esc(c.id)}</span>`;
      d.onclick=()=>{CUR=c.id;FOLDER=null;renderList();renderDetail(c)};
      box.appendChild(d);
    });
  if(!box.children.length)box.innerHTML='<div class="empty">没有匹配的角色</div>';
}

// 「旁白」伪角色详情(2026-09-01):旁白声线卡 narrator.json + 冻结样本试听。
// 声线卡由 09-audio/voice-generation 按项目基调设计并冻结,此后不随 TTS 设置变。
function renderNarrator(c){
  const box=$('#detail');
  const card=c.voice_card||{};
  const loc=t('旁白声线(声线卡 assets/audio/voice/narrator.json,冻结样本 assets/audio/voice/refs/NARRATOR_voiceprint.mp3)');
  let h=`<h2 class="title">🎙 ${esc(t('旁白'))}<span class="id">NARRATOR</span>`
    +`<span class="badge" style="border-color:var(--dim);color:var(--dim)">narrator</span>`
    +`<button class="editbtn" data-loc="${esc(loc)}" title="对这个音色提修改意见,发消息给总制片">✏️ 修改</button></h2>`;
  h+=`<div class="meta-line">${esc(t('全片统一旁白声线:声线卡与冻结样本一经生成即固定,不随「生成模型」页 TTS 设置变'))}</div>`;
  const v=(c.voices||[])[0]||{};
  h+='<div class="voices"><div class="voice">🔊 <b>'+esc(t('旁白声线'))+'</b>'
    +(v.tts_voice?`<span class="vtag">${esc(v.tts_voice)}${v.tts_model?' · '+esc(v.tts_model):''}</span>`
                 :(v.tts_model?`<span class="vtag">${esc(v.tts_model)}</span>`:''))
    +(v.status&&v.status!=='confirmed'?`<span class="vtag" style="color:var(--yellow);border-color:var(--yellow)">${esc(v.status)}</span>`:'')
    +(v.url?`<audio controls preload="none" src="${esc(bust(v.url))}"></audio>`
           :`<span style="color:var(--dim);font-size:12px">${t('(旁白样本未生成)')}</span>`)
    +`<button class="editbtn" data-loc="${esc(loc)}" title="对这个音色提修改意见,发消息给总制片">✏️ 修改</button></div></div>`;
  if(Object.keys(card).length){
    h+=`<div class="doc"><h3 onclick="this.parentNode.classList.toggle('closed')">${esc(t('旁白声线卡'))} <span style="color:var(--dim);font-weight:400">narrator.json</span></h3><div class="body">${jrender(card)}</div></div>`;
  }else{
    h+=`<div class="meta-line">${esc(t('旁白声线卡未生成:待配音工位按项目基调设计声线描述并选型合成冻结样本'))}</div>`;
  }
  box.innerHTML=h;box.scrollTop=0;
}

function renderDetail(c){
  if(c.narrator)return renderNarrator(c);
  const box=$('#detail');
  const m=c.meta||{};
  const aliases=(m.aliases||[]).map(a=>a.name||a).filter(Boolean);
  let h=`<h2 class="title">${esc(c.name)}<span class="id">${esc(c.id)}</span>`
    +(m.tier?`<span class="badge">tier ${esc(m.tier)}</span>`:'')
    +(m.kind?`<span class="badge" style="border-color:var(--dim);color:var(--dim)">${esc(m.kind)}</span>`:'')
    +`<button class="editbtn" data-loc="${esc(I18N.f('人物 {name}({id};设定文档 bible/characters/{id}/,登记 bible/characters/index.json)',{name:c.name,id:c.id}))}" title="对这个人物的设定提修改意见,发消息给总制片">✏️ 修改</button></h2>`;
  const ml=[];
  if(aliases.length)ml.push(t('别名:')+aliases.join('、'));
  if(m.first_appearance)ml.push(t('首次登场:')+(m.first_appearance.chapter||JSON.stringify(m.first_appearance)));
  if(ml.length)h+=`<div class="meta-line">${esc(ml.join('  ·  '))}</div>`;
  if(m.notes)h+=`<div class="notes">${esc(m.notes)}</div>`;
  // 音色试听:选角事实源 casting.json 的音色 + refs/ 音色样本(voiceprint)
  if((c.voices||[]).length){
    h+='<div class="voices">'+c.voices.map(v=>{
      const vp=v.url?decodeURIComponent(v.url.split('?')[0].replace(/^\/api\/v1\/projects\/([^/]+)\/artifacts\//,'data/projects/$1/').replace(/^\/projects\//,'data/projects/')):t('(音色样本未生成)');
      const loc=I18N.f('音色 {cid}/{v}(选角 assets/audio/voice/casting.json 条目 char_id={cid},音色样本 {vp})',
        {cid:c.id,v:v.variant||t('主音色'),vp});
      return `<div class="voice">🔊 <b>${esc(v.variant||t('主音色'))}</b>`
      +(v.tts_voice?`<span class="vtag">${esc(v.tts_voice)}${v.tts_model?' · '+esc(v.tts_model):''}</span>`:'')
      +(v.status&&v.status!=='confirmed'?`<span class="vtag" style="color:var(--yellow);border-color:var(--yellow)">${esc(v.status)}</span>`:'')
      +(v.url?`<audio controls preload="none" src="${esc(bust(v.url))}"></audio>`
             :`<span style="color:var(--dim);font-size:12px">${t('(音色样本未生成)')}</span>`)
      +`<button class="editbtn" data-loc="${esc(loc)}" title="对这个音色提修改意见,发消息给总制片">✏️ 修改</button></div>`;
    }).join('')+'</div>';
  }
  // 图库分组:角色目录根下的图直接展示;candidates/ 等子目录收成文件夹卡片,点击进入
  const rootImgs=[],folders={};
  // 服装 sheet(sheet_<COS-id>.png)由下方「👕 服装」区按套展示,不在图库重复出现;默认装的 sheet.png 仍留在图库(形象锚)
  const cosFiles=new Set((c.costumes||[]).map(x=>(x.file||'').split('/').pop()).filter(f=>f&&f!=='sheet.png'));
  c.images.forEach(im=>{
    const i=im.name.indexOf('/');
    if(i>0){const d=im.name.slice(0,i);(folders[d]=folders[d]||[]).push(im)}
    else if(!cosFiles.has(im.name))rootImgs.push(im);
  });
  if(FOLDER&&!folders[FOLDER])FOLDER=null;
  const fig=(im,strip)=>{
    const nm=strip?im.name.slice(strip.length+1):im.name;
    return `<figure><img src="${esc(bust(im.url))}" loading="lazy" onclick="zoom(this.src)"><figcaption title="${esc(nm)}"><span class="fn">${esc(nm)}</span><button class="editbtn" data-url="${esc(im.url)}" title="到总制片界面对这张图提修改意见">✏️ 修改</button>${avCtl(im)}</figcaption></figure>`;
  };
  if(FOLDER){
    const ims=folders[FOLDER];
    h+=`<div class="foldbar"><button onclick="closeFolder()">${t('← 返回')}</button><span class="fname">📁 ${esc(FOLDER)}</span><span class="fcnt">${esc(I18N.f('{n} 张',{n:ims.length}))}</span></div>`;
    h+='<div class="gallery">'+ims.map(im=>fig(im,FOLDER)).join('')+'</div>';
  }else if(c.images.length){
    h+='<div class="gallery">'+rootImgs.map(im=>fig(im)).join('')
      +Object.keys(folders).sort().map(d=>{
        const ims=folders[d];
        return `<figure class="folder" data-d="${esc(d)}" onclick="openFolder(this.dataset.d)" title="${esc(d)}">`
          +`<div class="fthumb"><img src="${esc(bust(ims[0].url))}" loading="lazy"><div class="fmask">📁</div></div>`
          +`<figcaption><span class="fn">📁 ${esc(d)}</span><span class="fcnt">${esc(I18N.f('{n} 张',{n:ims.length}))}</span></figcaption></figure>`;
      }).join('')+'</div>';
  }else{
    h+='<div class="meta-line">(暂无概念图)</div>';
  }
  // 👕 服装:bible/costumes.json 该角色每套服装 × costume-concept 的服装 sheet(costume_sheets.json 台账)
  const cos=c.costumes||[];
  if(cos.length&&!FOLDER){
    const done=cos.filter(x=>x.url).length;
    h+=`<div class="cos-head">👕 ${t('服装')}<span class="cnt">${esc(I18N.f('{n} 套 · 已出图 {m}',{n:cos.length,m:done}))}</span></div>`;
    h+=cos.map(x=>{
      const file=x.file||(x.default?`assets/concepts/characters/${c.id}/sheet.png`:`assets/concepts/characters/${c.id}/sheet_${x.id}.png`);
      const loc=I18N.f('服装 {id}({label};角色 {cid},设定 bible/costumes.json 条目 {id},参考图 {file},台账 assets/concepts/characters/{cid}/costume_sheets.json)',{id:x.id,label:x.label,cid:c.id,file});
      const when=[x.episodes&&x.episodes.length?x.episodes.join('/'):'',x.chapters&&x.chapters.length?x.chapters.join('/'):'',x.scenes&&x.scenes.length?x.scenes.join('/'):''].filter(Boolean).join(' · ');
      let pic;
      if(x.url)pic=`<img src="${esc(bust(x.url))}" loading="lazy" onclick="zoom(this.src)" title="${esc(x.file||'')}">`;
      else if(x.blocked_on)pic=`<div class="nopic">⛔ ${esc(t('阻塞:')+x.blocked_on)}</div>`;
      else if(x.skip_reason)pic=`<div class="nopic">➖ ${esc(t('免出:')+x.skip_reason)}</div>`;
      else pic=`<div class="nopic">${esc(t('未出图'))}<br><span style="font-size:11px">${esc(file.split('/').pop())}</span></div>`;
      return `<div class="cos${JUMP_COS===x.id?' hl':''}" id="cos-${esc(x.id)}">
        <div class="pic">${pic}</div>
        <div class="info">
          <div class="lb">${esc(x.label)}<span class="id">${esc(x.id)}</span>${x.default?`<span class="badge def">${t('默认装')}</span>`:''}${x.default&&x.url?`<span class="id">(${t('sheet.png 复用')})</span>`:''}
            <button class="editbtn" data-loc="${esc(loc)}" title="${esc(t('对这套服装的设定或 sheet 提修改意见,发消息给总制片'))}">✏️ 修改</button></div>
          ${x.occasion||x.period?`<div class="ml">${x.occasion?esc(t('场合:')+x.occasion):''}${x.occasion&&x.period?'  ·  ':''}${x.period?esc(t('时期:')+x.period):''}</div>`:''}
          ${when?`<div class="ml">${esc(t('出场:')+when)}</div>`:''}
          ${x.variants&&x.variants.length?`<div class="ml">${esc(t('子状态:')+x.variants.join('、'))}</div>`:''}
          ${x.visual_en?`<div class="ve" onclick="this.classList.toggle('open')" title="${esc(t('点击展开/收起服装描述(visual_en,p7 prompt 逐字注入串)'))}">${esc(x.visual_en)}</div>`:''}
          ${x.url&&!x.in_ledger?`<div class="warn">⚠ ${esc(t('图在库但未登记 costume_sheets.json 台账'))}</div>`:''}
        </div></div>`;
    }).join('');
  }
  const docs=Object.keys(c.docs||{});
  if(docs.length){
    h+=docs.map(k=>`<div class="doc"><h3 onclick="this.parentNode.classList.toggle('closed')">${esc(DOC_NAMES[k]||k)} <span style="color:var(--dim);font-weight:400">${esc(k)}.json</span></h3><div class="body">${jrender(c.docs[k])}</div></div>`).join('');
  }else{
    h+='<div class="meta-line">(暂无 bible 设定文档)</div>';
  }
  box.innerHTML=h;box.scrollTop=0;
  if(JUMP_COS){const el=document.getElementById('cos-'+JUMP_COS);if(el)el.scrollIntoView({block:'center'});JUMP_COS=null}
  avRefresh(c);
}

// ---- 虚拟人像资产库(设置 → 高级):启用后每张形象图可一键入库,入库(Active)的
// 参考图在分镜重出时自动以 asset://<id> 提交,规避人脸参考图审核拦截 ----
let AV_ENABLED=false, AV_STATUS={};   // AV_STATUS: {rel: {asset_id, status}}
const AV_TS={};                        // 每角色状态刷新节流
const avRel=u=>decodeURIComponent(u.split('?')[0]
  .replace(/^\/api\/v1\/projects\/[^/]+\/artifacts\//,'').replace(/^\/projects\/[^/]+\//,''));
async function postJson(p,body){
  const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.detail||r.status);
  return j;
}
function avCtl(im){
  if(!AV_ENABLED)return '';
  const rel=avRel(im.url), st=(AV_STATUS[rel]||{}).status;
  if(st==='Active')return `<span class="avst" title="${esc(t('已入虚拟人像库:生成视频时以资产 URI 提交,规避人脸审核拦截'))}">✓ ${t('已入库')}</span>`;
  if(st==='Processing')return `<button class="editbtn avbtn proc" data-ref="${esc(rel)}" title="${esc(t('方舟审核中(异步),点击刷新状态'))}">⏳ ${t('审核中')}</button>`;
  if(st==='Failed')return `<button class="editbtn avbtn fail" data-ref="${esc(rel)}" title="${esc(t('入库失败(审核未过),点击重试'))}">⚠ ${t('重新入库')}</button>`;
  return `<button class="editbtn avbtn" data-ref="${esc(rel)}" title="${esc(t('上传到火山方舟虚拟人像资产库(异步审核,Active 后生成视频时生效)'))}">⬆ ${t('入库')}</button>`;
}
async function avRefresh(c){
  if(!AV_ENABLED||!c||!c.images.length)return;
  const now=Date.now();
  if(now-(AV_TS[c.id]||0)<3000)return;   // 3s 节流,避免重渲染回环反复请求
  AV_TS[c.id]=now;
  const proj=$('#project').value.trim()||'demo';
  const refs=c.images.map(im=>avRel(im.url));
  try{
    const st=(await postJson('/api/v1/avatar-assets/status',{project:proj,refs})).status||{};
    let changed=false;
    refs.forEach(r=>{
      if(JSON.stringify(AV_STATUS[r]||null)!==JSON.stringify(st[r]||null)){
        changed=true;
        if(st[r])AV_STATUS[r]=st[r];else delete AV_STATUS[r];
      }
    });
    if(changed&&CUR===c.id)renderDetail(c);
  }catch(e){}
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('.avbtn');
  if(!b||b.disabled)return;
  const rel=b.dataset.ref, proj=$('#project').value.trim()||'demo';
  const st=(AV_STATUS[rel]||{}).status;
  b.disabled=true;
  try{
    if(st==='Processing'){
      const d=await postJson('/api/v1/avatar-assets/status',{project:proj,refs:[rel]});
      if((d.status||{})[rel])AV_STATUS[rel]=d.status[rel];
    }else{
      b.textContent='⏳ '+t('入库中…');
      const d=await postJson('/api/v1/avatar-assets/upload',{project:proj,ref:rel});
      AV_STATUS[rel]={asset_id:d.asset_id,status:d.status};
    }
  }catch(err){alert(t('入库失败:')+err.message)}
  const c=DATA.find(x=>x.id===CUR);
  if(c)renderDetail(c);
});

// 图片 URL 加版本参数,避免文件覆写后浏览器仍用旧缓存;服务端已带 ?v= 时原样保留
const LOAD_T=Date.now();
const bust=u=>u.includes('?')?u:u+'?v='+LOAD_T;

function openFolder(name){FOLDER=name;const c=DATA.find(x=>x.id===CUR);if(c)renderDetail(c)}
function closeFolder(){openFolder(null)}

function zoom(src){$('#lightbox img').src=src;$('#lightbox').style.display='flex'}
$('#lightbox').onclick=()=>$('#lightbox').style.display='none';

// ✏️ 修改:跳转总制片界面,把修改对象预填进「输入工作指令」框。
// data-url=具体媒体文件路径;data-loc=结构化位置元数据(音色等无单一文件的对象)
document.addEventListener('click',e=>{
  const b=e.target.closest('.editbtn');
  if(!b||(!b.dataset.url&&!b.dataset.loc))return;
  const proj=$('#project').value.trim()||'demo';
  const subject=b.dataset.loc
    ||decodeURIComponent(b.dataset.url.split('?')[0].replace(/^\/api\/v1\/projects\/([^/]+)\/artifacts\//,'data/projects/$1/').replace(/^\/projects\//,'data/projects/'));
  location.href='/?project='+encodeURIComponent(proj)
    +'&compose='+encodeURIComponent(t('修改 ')+subject+'\n'+t('修改意见:'));
});

async function load(){
  const proj=$('#project').value.trim()||'demo';
  history.replaceState(null,'','?project='+encodeURIComponent(proj));
  $('#detail').innerHTML='<div class="empty">加载中…</div>';
  try{
    const r=await fetch('/api/v1/projects/'+encodeURIComponent(proj)+'/previews/characters');
    if(!r.ok)throw new Error((await r.json()).detail||r.status);
    DATA=(await r.json()).characters;
  }catch(e){$('#items').innerHTML='';$('#detail').innerHTML=`<div class="empty">加载失败:${esc(e.message)}</div>`;return}
  // 虚拟人像资产库是否启用(未启用则不渲染入库按钮;查询失败按未启用处理)
  try{AV_ENABLED=!!(await postJson('/api/v1/avatar-assets/status',{project:proj,refs:[]})).enabled}
  catch(e){AV_ENABLED=false}
  // 有图和有设定的排前面
  DATA.sort((a,b)=>(b.images.length?2:0)+(Object.keys(b.docs).length?1:0)-((a.images.length?2:0)+(Object.keys(a.docs).length?1:0))||a.id.localeCompare(b.id));
  // 「旁白」伪角色固定列表首位(项目旁白开关开启时后端下发,2026-09-01)
  const ni=DATA.findIndex(x=>x.narrator);
  if(ni>0)DATA.unshift(DATA.splice(ni,1)[0]);
  CUR=DATA.length?DATA[0].id:null;
  if(JUMP_ID){
    const c=DATA.find(x=>x.id===JUMP_ID);
    if(c)CUR=c.id;
    JUMP_ID=null;   // 只在首次加载生效,手动刷新/切项目后不再强制定位
  }
  renderList();
  const cur=DATA.find(x=>x.id===CUR);
  if(cur){
    renderDetail(cur);
    const a=$('#items .item.active');
    if(a)a.scrollIntoView({block:'center'});
  }else $('#detail').innerHTML='<div class="empty">该项目还没有人物设定</div>';
}
$('#reload').onclick=load;
$('#search').oninput=renderList;
$('#project').value=new URLSearchParams(location.search).get('project')
  ||(JSON.parse(localStorage.getItem('webui_prefs')||'{}').project)||'demo';
load();

// 右上角预览页切换下拉(项目值走 URL/localStorage,由隐藏 #project 承载)
const PV_PAGES=[['/preview/refs','\u{1F5BC} 参考文件'],['/preview/characters','\u{1F464} 人物预览'],['/preview/creatures','\u{1F40E} 生物预览'],['/preview/scenes','\u{1F3D4} 场景预览'],['/preview/props','\u{1F5E1} 道具预览'],['/preview/worldview','\u{1F30D} 世界观预览'],['/preview/workflow','\u{1F9ED} 工作流预览'],['/preview/storyboard','\u{1F3AC} 分镜预览'],['/preview/videos','\u{1F39E}\uFE0F 视频预览']];
PV_PAGES.forEach(([u,n])=>{const o=document.createElement('option');o.value=u;o.textContent=n;if(location.pathname===u)o.selected=true;$('#pvnav').appendChild(o)});
$('#pvnav').onchange=()=>{const p=($('#project').value||'').trim()||'demo';location.href=$('#pvnav').value+'?project='+encodeURIComponent(p)};
</script>
