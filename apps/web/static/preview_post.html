<style>
:root{
  --bg:#0f1117; --panel:#161a23; --panel2:#1c2130; --panel3:#232a3b; --border:#2a3040; --border2:#39415a;
  --text:#dde3ee; --dim:#8b93a7; --faint:#5c6478; --accent:#6c9ef8; --link:#fb923c; --green:#4ade80;
  --red:#f87171; --yellow:#fbbf24; --purple:#c084fc; --cyan:#5eead4; --pink:#f472b6;
  --l-pic:#6c9ef8; --l-pack:#c084fc; --l-snd:#5eead4;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
a{color:var(--link)}
body{background:var(--bg);color:var(--text);font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap;flex:none}
header h1{font-size:15px;font-weight:600;white-space:nowrap}
header a.back{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:3px 10px;line-height:1.4}
header a.back:hover{color:var(--accent);border-color:var(--accent)}
header .spacer{flex:1}
button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px;font-family:inherit}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.6;cursor:default}
button.pri{background:var(--accent);border-color:var(--accent);color:#0b1020;font-weight:600}
button.warn{border-color:#6a2e2e;color:var(--red)}
button.sm{font-size:11.5px;padding:2px 8px}
button.xs{font-size:11px;padding:0 6px;line-height:1.7}
header select,header input,select,input[type=text],input[type=number],textarea{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;font-family:inherit}
header select{cursor:pointer;max-width:260px}
header select:hover{border-color:var(--accent)}
#eps{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--panel);flex:none;align-items:center}
#eps select#epsel{background:var(--panel2);color:var(--text);border:1px solid var(--accent);border-radius:6px;padding:4px 8px;font-size:13px;font-weight:600;cursor:pointer;max-width:320px}
#eps select#epsel:hover{border-color:var(--link)}
#eps .stat{color:var(--dim);font-size:12px;margin-left:6px}
#eps .sp{flex:1}
.gate{display:inline-flex;align-items:center;gap:8px;font-size:12px;border:1px solid var(--border2);border-radius:14px;padding:2px 10px;color:var(--yellow)}
.gate.ok{color:var(--green);border-color:#2b5a3c}
.gate.stale{color:var(--red);border-color:#6a2e2e}
.gate.idle{color:var(--dim)}
.signbtn{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:2px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.signbtn.pri{background:var(--accent);border-color:var(--accent);color:#0b1020;font-weight:600}
.lay{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-left:8px}
.lay label{display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.pic{background:var(--l-pic)}.dot.pack{background:var(--l-pack)}.dot.snd{background:var(--l-snd)}
.dot.r{background:var(--red)}.dot.y{background:var(--yellow)}.dot.g{background:var(--green)}
.empty{color:var(--dim);text-align:center;margin-top:60px}
.spin{display:inline-block;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 三栏 ===== */
#work{flex:1;min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr) 350px}
.col{min-height:0;display:flex;flex-direction:column;overflow:hidden}
.col+.col{border-left:1px solid var(--border)}
.col-h{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--border);background:var(--panel);font-weight:600;font-size:12.5px;flex:none}
.col-h .sp{flex:1}
.col-h .lite{font-weight:400;color:var(--dim);font-size:12px}
.scroll{flex:1;min-height:0;overflow-y:auto}
/* 左栏 */
.flt{display:flex;gap:5px;padding:6px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap;flex:none}
.flt span{border:1px solid var(--border);border-radius:10px;padding:0 8px;color:var(--dim);font-size:11px;cursor:pointer}
.flt span.on{color:var(--text);border-color:var(--border2);background:var(--panel2)}
.scn{padding:5px 10px;color:var(--dim);font-size:11.5px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none;position:sticky;top:0;z-index:1}
.scn .sp{flex:1}
.scn .lite{opacity:.65;font-size:10.5px;margin-left:4px}
.scn .pal{display:inline-flex;gap:2px}
.scn .pal i{width:9px;height:9px;border-radius:2px;display:block}
.scn.closed+.grps{display:none}
.grp{display:grid;grid-template-columns:auto 46px 1fr auto;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border);align-items:center;cursor:pointer;font-size:12px}
.grp:hover{background:var(--panel2)}
.grp.sel{background:#1b2740;box-shadow:inset 3px 0 0 var(--accent)}
.grp .chk{display:none;width:14px}
body.multi .grp .chk{display:block}
.thumb{width:46px;height:26px;border-radius:3px;background:#0b0d13 center/cover no-repeat;border:1px solid var(--border)}
.grp>div:nth-child(3){min-width:0}
.grp .id{font:500 11.5px var(--mono);color:var(--text);display:flex;gap:5px;align-items:center;white-space:nowrap}
.grp .pend{font:600 9.5px var(--mono);color:#0b1020;background:var(--yellow);border-radius:3px;padding:0 4px;line-height:1.6;letter-spacing:.2px}
.grp.pending:not(.sel){box-shadow:inset 3px 0 0 var(--yellow)}
/* 右栏顶部:本组有待确认的新版本(2026-09-23):高亮横幅,一键对比 / 设为当前 */
.pendbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border);background:#2a2412;box-shadow:inset 3px 0 0 var(--yellow);font-size:12px;flex:none}
.pendbar:empty{display:none}
.pendbar b{color:var(--yellow);font-weight:600}
.pendbar button.hot{background:var(--yellow);border-color:var(--yellow);color:#0b1020;font-weight:600}
.pendbar button.hot:hover{filter:brightness(1.08)}
.grp .sub{font-size:10.5px;color:var(--dim);display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden}
.grp .st{display:flex;gap:3px;flex-direction:column;align-items:flex-end}
.dots{display:flex;gap:3px}
.dots i{display:block;width:7px;height:7px;border-radius:2px;background:var(--panel3)}
.dots i.pic{background:var(--l-pic)}.dots i.pack{background:var(--l-pack)}.dots i.snd{background:var(--l-snd)}
.dots i.half{background:linear-gradient(90deg,var(--l-pic) 50%,var(--panel3) 50%)}
.grp .n{font:10.5px var(--mono);color:var(--dim)}
.grp.nofile{opacity:.5}
/* 监视器 */
.mon-top{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--panel);font-size:11.5px;flex-wrap:wrap;flex:none}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:6px;overflow:hidden}
.seg span{padding:2px 8px;color:var(--dim);cursor:pointer;user-select:none;white-space:nowrap}
.seg span.on{background:#274680;color:#fff}
.vchip{font:500 11px var(--mono);border:1px solid var(--border2);border-radius:4px;padding:1px 6px;color:var(--text);background:var(--panel2)}
.vchip.a{border-color:#3d63b0;color:var(--accent)}
.vchip.b{border-color:#7a4c25;color:var(--link)}
.mon-top select{padding:1px 4px;font-size:11px}
.screen{flex:1;min-height:0;position:relative;background:#05060a;display:flex;align-items:center;justify-content:center;padding:10px}
.frame{position:relative;width:100%;max-width:100%;max-height:100%;aspect-ratio:16/9;background:#000;border-radius:4px;overflow:hidden;user-select:none}
.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.frame video.b{clip-path:inset(0 0 0 50%)}
.frame .split{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;box-shadow:0 0 0 1px #0008;pointer-events:none}
.frame .knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#fff;color:#000;font:600 10px var(--mono);display:flex;align-items:center;justify-content:center;cursor:ew-resize;z-index:3}
.frame .tag{position:absolute;bottom:8px;font:500 10.5px var(--mono);color:#fffc;text-shadow:0 1px 2px #000;pointer-events:none;z-index:2}
.frame .tag.a{left:8px}.frame .tag.b{right:8px}
.frame .tc{position:absolute;top:6px;right:8px;font:10.5px var(--mono);color:#fffa;pointer-events:none;z-index:2}
.frame .info{position:absolute;top:6px;left:8px;font:10.5px var(--mono);color:#fffa;pointer-events:none;z-index:2}
.frame .subt{position:absolute;left:0;right:0;text-align:center;color:#fff;pointer-events:none;z-index:2;line-height:1.35}
.frame .mask{position:absolute;border:1.5px dashed var(--pink);pointer-events:none;z-index:3}
.frame .mask small{position:absolute;bottom:-15px;left:0;font:10px var(--mono);color:var(--pink);white-space:nowrap}
.frame .maskpad{position:absolute;inset:0;cursor:crosshair;z-index:4;display:none}
body.masking .frame .maskpad{display:block}
.frame .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;pointer-events:none}
.xport{display:flex;gap:6px;align-items:center;padding:5px 10px;border-top:1px solid var(--border);background:var(--panel);font-size:11.5px;flex:none;flex-wrap:wrap}
.xport .tl{flex:1;min-width:120px;height:8px;border-radius:4px;background:var(--panel3);position:relative;cursor:pointer}
.xport .tl i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px;pointer-events:none}
.xport .tl b{position:absolute;top:-3px;width:2px;height:14px;background:#fff;pointer-events:none}
.xport .tl s{position:absolute;top:0;bottom:0;background:rgba(244,114,182,.35);pointer-events:none}
.xport .tc{font:11px var(--mono);color:var(--text);min-width:92px;text-align:center}
.xport .tl s.cut{background:rgba(248,113,113,.55);border-left:1px solid var(--red);border-right:1px solid var(--red)}
.xport .tl s.cut.on{background:rgba(248,113,113,.85)}
.xport .tl u{position:absolute;top:-2px;bottom:-2px;width:1px;background:rgba(255,255,255,.55);pointer-events:none}
/* 整集连播时的黑场垫片预览(2026-09-17):盖住监视器,右下角小字标时长 */
.padov{position:absolute;inset:0;background:#000;z-index:6;display:flex;align-items:flex-end;justify-content:flex-end;padding:8px 10px;font:10.5px var(--mono);color:#666;pointer-events:none}
/* 分镜剪辑面板(右栏,后期调整上方,默认展开,点标题折叠) */
.cutsec{flex:none;display:flex;flex-direction:column;min-height:0;max-height:55%;border-bottom:1px solid var(--border)}
.cutsec .col-h,#rec-h{cursor:pointer;user-select:none}
.cutsec .col-h .car,#rec-h .car{color:var(--faint);font-weight:400}
.cutsec.on .col-h,#right:not(.rec-closed) #rec-h{color:var(--accent)}
#rbody{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
/* 后期调整板块整体折叠(2026-10-01):标题行常显,作用域 + 列表收起;收起后分镜剪辑不再限高 */
#right.rec-closed #rbody{flex:none}
#right.rec-closed #rbody>.scope,#right.rec-closed #rlist{display:none}
#right.rec-closed .cutsec{max-height:none;flex:0 1 auto}
.cutp{background:var(--panel);padding:6px 10px;font-size:11.5px;display:grid;gap:6px;align-content:start;min-height:0;overflow-y:auto}
.cutp .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cutp .row .lb{color:var(--dim);white-space:nowrap}
.cutp .row .sp{flex:1}
.cutp{overflow-x:hidden}
.cutp .row{min-width:0}
.cutp select,.cutp input{max-width:100%}
.cutp .seg span{white-space:nowrap}
.seg span.now{padding:0;color:inherit;background:none}
#cut-mode{flex-wrap:wrap}
.cutp .row .lb.wrap{white-space:normal;flex:1 1 100%;font-size:10.5px}
.cutp table{border-collapse:collapse;width:100%;font:11px var(--mono)}
.cutp th{text-align:left;color:var(--dim);font-weight:500;padding:2px 6px;border-bottom:1px solid var(--border2)}
.cutp td{padding:2px 6px;border-bottom:1px solid var(--border);white-space:nowrap}
.cutp tr.on td{background:#2a1c22}
.cutp td input{width:64px;font:11px var(--mono);padding:1px 4px}
.cutp .empty2{color:var(--faint);padding:4px 6px;font-size:11px}
.cutp .msg{color:var(--dim);font-size:11px}
.cutp .msg.err{color:var(--red)}
.cutp .msg.ok{color:var(--green)}
.waves{position:relative;display:grid;grid-template-columns:52px 1fr;font:10px var(--mono);border-top:1px solid var(--border);flex:none;background:var(--panel)}
.waves .lb{padding:0 8px;color:var(--dim);border-bottom:1px solid var(--border);border-right:1px solid var(--border);display:flex;align-items:center;height:18px}
.waves .tr{height:18px;border-bottom:1px solid var(--border);position:relative;background:repeating-linear-gradient(90deg,transparent 0 24px,#ffffff06 24px 25px);overflow:hidden}
.waves .tr i{position:absolute;top:4px;height:10px;border-radius:2px;background:var(--panel3)}
.waves .tr i.v{background:#5a6b8e}.waves .tr i.n{background:#7a6c9e}.waves .tr i.m{background:#3e6f6a}
.waves .tr i.cue{width:2px;background:var(--yellow);top:2px;height:14px;cursor:pointer}
.waves .tr i.cue.miss{background:var(--red)}
/* 四轨统一当前时间线(2026-09-16):贯穿对白/旁白/BGM/音效四轨,盖在轨道内容之上;left 由 waveHead() 按标签列 52px + 轨道宽度比例算 */
.waves .wph{position:absolute;top:0;bottom:0;left:52px;width:1px;background:#fff;box-shadow:0 0 0 1px #0008;z-index:3;pointer-events:none}
.waves .wph::before{content:'';position:absolute;top:0;left:-3px;border:3.5px solid transparent;border-top:5px solid #fff;border-bottom:0}
.waves .tr i.nofile{opacity:.35;outline:1px dashed #ffffff55}
.waves .tr i.live{box-shadow:0 0 0 1px #fff;filter:brightness(1.45)}
/* 轨道条目选中(2026-09-16):点一条对白/旁白/BGM/音效 → 高亮 + 下方出现选中条(定位 / ✏️ 发修改意见给修改师) */
.waves .tr{cursor:col-resize;touch-action:none}
body.wscrub,body.wscrub *{cursor:col-resize!important;user-select:none!important}
.waves .tr i[data-i]{cursor:pointer}
.waves .tr i.sel{outline:2px solid var(--accent);outline-offset:1px;z-index:2}
.waves .wsel{grid-column:1/-1;display:flex;gap:6px;align-items:center;padding:3px 8px;border-bottom:1px solid var(--border);font:11.5px var(--font,system-ui);color:var(--text);background:var(--panel2)}
.waves .wsel .kd{padding:0 6px;border-radius:3px;font-family:var(--mono);font-size:10.5px;color:#0b1020}
.waves .wsel .kd.v{background:#8fa3cf}.waves .wsel .kd.n{background:#b3a4d9}.waves .wsel .kd.m{background:#6fb3ac}.waves .wsel .kd.s{background:var(--yellow)}
.waves .wsel .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.waves .wsel .tm{color:var(--dim);font-family:var(--mono);font-size:10.5px}
/* 右栏 */
.scope{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid var(--border);font-size:11.5px;align-items:center;flex:none;flex-wrap:wrap}
.acc{border-bottom:1px solid var(--border)}
.acc-h{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);font-weight:600;font-size:12px;cursor:pointer;user-select:none}
.acc-h .cnt{font:10px var(--mono);color:var(--dim);font-weight:400}
.acc-h .sp{flex:1}
.acc-h .add{color:var(--accent);font-weight:400;font-size:11.5px}
.acc-h .car{color:var(--faint)}
.acc.closed .acc-b{display:none}
.rec{padding:6px 10px;border-top:1px solid var(--border);font-size:11.5px}
.rec.inh{opacity:.55}
.rec.over{opacity:.35}
.rec .r1{display:flex;gap:3px 6px;align-items:center;flex-wrap:wrap}
.rec .r1 .nm{font-weight:600;white-space:nowrap}
.rec .r1 .sp{flex:1}
.rec .r1 .sc{color:var(--dim);font-size:10.5px;white-space:nowrap;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;margin-left:auto}
/* 出片版本另起一行、可换行,不再塞进状态徽标把处方名挤成竖排(2026-09-24) */
.rec .out{display:flex;flex-wrap:wrap;gap:2px 5px;margin-top:3px;font:10px var(--mono);color:var(--dim)}
.rec .out span{border:1px solid var(--border);border-radius:3px;padding:0 4px;white-space:nowrap}
.st{font:10px var(--mono);border:1px solid var(--border2);border-radius:3px;padding:0 5px;color:var(--dim);white-space:nowrap}
.st.draft{color:var(--dim)}.st.dispatched{color:var(--yellow);border-color:#5f4a17}.st.applied{color:var(--accent);border-color:#3d63b0}.st.adopted{color:var(--green);border-color:#2b5a3c}.st.failed{color:var(--red);border-color:#6a2e2e}.st.discarded{color:var(--faint)}
.rec .r2{color:var(--dim);font-size:10.5px;margin-top:2px;display:flex;flex-wrap:wrap;gap:3px 10px}
.rec .r2 .err{color:var(--red)}
/* 花字类型弹窗(2026-09-24) */
.capcat{border:1px solid var(--border);border-radius:8px;padding:6px 10px 8px}
.capcat .ch{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px;margin-bottom:4px}
.capcat .ch .sp{flex:1}
.capcat .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:3px 10px}
.capcat label{display:flex;gap:6px;align-items:flex-start;line-height:1.35;cursor:pointer}
.capcat label input{margin-top:3px}
.capcat label .d{display:block;color:var(--dim);font-size:10.5px}
.capcat label.na{opacity:.45;cursor:not-allowed}
.capcat.ex label{opacity:.5;cursor:default}

/* 底栏 */

#foot .fh{display:flex;align-items:center;gap:10px;padding:4px 12px;border-bottom:1px solid var(--border);color:var(--dim)}
#foot .fh .sp{flex:1}
.tlgrid{display:grid;grid-template-columns:54px 1fr;font:10px var(--mono)}
.tlgrid .lb{padding:0 8px;color:var(--dim);border-right:1px solid var(--border);display:flex;align-items:center;height:16px}

.tlgrid .row{position:relative;height:16px;border-bottom:1px solid #1d2230;overflow:hidden}
.tlgrid .row.g{height:24px}
.blk{position:absolute;top:2px;height:20px;border-radius:2px;background:var(--panel3);border:1px solid var(--border2);font:9px var(--mono);color:var(--dim);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;white-space:nowrap}
.blk:hover{border-color:var(--accent)}

.trs:hover{background:var(--accent)}
.bar{position:absolute;top:4px;height:8px;border-radius:2px;cursor:pointer}
.bar.pic{background:var(--l-pic)}.bar.pack{background:var(--l-pack)}.bar.snd{background:var(--l-snd)}
.bar.dim{opacity:.3}.bar.draft{opacity:.55;background-image:repeating-linear-gradient(45deg,transparent 0 3px,#0006 3px 5px)}
.ph{position:absolute;top:0;bottom:0;width:1px;background:#fff;z-index:3;pointer-events:none}
/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:98}
.modal.open{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--border2);border-radius:12px;width:640px;max-width:94vw;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal .bh{padding:10px 16px;font-weight:600;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;font-size:13.5px}
.modal .bh .sp{flex:1}
.modal .bb{padding:12px 16px;overflow-y:auto;font-size:12.5px;display:grid;gap:8px}
.modal .bf{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--border);align-items:center;flex-wrap:wrap}
.modal .bf .msg{flex:1;color:var(--dim);font-size:12px}
.modal .bf .msg.err{color:var(--red)}
.sfx-add{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0 6px;padding:8px;border:1px dashed var(--border);border-radius:6px}
.sfx-add .lb{color:var(--dim);font-size:12px}
.fld{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center}
.fld label{color:var(--dim);font-size:12px}
.fld .in{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fld input[type=range]{flex:1;min-width:120px}
.fld .val{font:11px var(--mono);color:var(--text);min-width:52px;text-align:right}
.fld textarea{width:100%;min-height:64px;resize:vertical}
.fld select,.fld input[type=text]{width:100%}
.fld .hint{grid-column:2;color:var(--dim);font-size:11px;margin-top:-4px}
.fld .ref{font:11px var(--mono);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:1px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.fld img.ref{width:64px;height:36px;object-fit:cover;padding:0}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips span{border:1px solid var(--border);border-radius:4px;padding:0 6px;font-size:11px;cursor:pointer;color:var(--dim)}
.chips span.on{color:var(--text);border-color:var(--accent)}
table.tb{border-collapse:collapse;width:100%;font-size:11.5px}
table.tb th{text-align:left;color:var(--dim);font-weight:500;padding:4px 6px;border-bottom:1px solid var(--border2);font-size:11px}
table.tb td{padding:4px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
table.tb select,table.tb input{padding:1px 4px;font-size:11px}
table.tb input.f{width:100%}
.chk-item{display:flex;gap:8px;align-items:baseline;font-size:12px}
.chk-item .s{font:10.5px var(--mono);min-width:44px;text-align:center;border-radius:3px;padding:0 4px}
.chk-item .s.PASS{color:var(--green);border:1px solid #2b5a3c}.chk-item .s.WARN{color:var(--yellow);border:1px solid #5f4a17}.chk-item .s.FAIL{color:var(--red);border:1px solid #6a2e2e}
.log{font:10.5px var(--mono);background:#0b0d13;border:1px solid var(--border);border-radius:6px;padding:6px 8px;max-height:180px;overflow-y:auto;white-space:pre-wrap;color:var(--dim)}
.blockers{color:var(--red);font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12px}
.kv dt{color:var(--dim)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}

<body>
<header>
  <a class="back" href="/" onclick="if(history.length>1){history.back();return false}" title="后退">&lt;</a>
  <a class="back" href="/">控制台</a>
  <h1>🎚️ 后期处理</h1>
  <div class="spacer"></div>
  <input type="hidden" id="project">
  <select id="pvnav" title="切换预览页"></select>
  <button id="reload">刷新</button>
</header>
<div id="eps"></div>
<div id="work"><div class="empty" style="grid-column:1/-1">加载中…</div></div>
<div id="foot"></div>

<div class="modal" id="m-recipe"><div class="box">
  <div class="bh"><span id="mr-title">新增调整</span><span class="sp"></span><button class="xs" data-close>✕</button></div>
  <div class="bb" id="mr-body"></div>
  <div class="bf"><span class="msg" id="mr-msg"></span><button id="mr-save">存为草稿</button><button id="mr-preview">快速预览</button><button class="pri" id="mr-go">出片</button></div>
</div></div>
<div class="modal" id="m-pre"><div class="box" style="width:720px">
  <div class="bh">🎬 拼装预检 · 出成片<span class="sp"></span><button class="xs" data-close>✕</button></div>
  <div class="bb" id="mp-body"></div>
  <div class="bf"><span class="msg" id="mp-msg"></span><button id="mp-recheck">重跑机检</button><button class="pri" id="mp-go">出成片</button></div>
</div></div>
<div class="modal" id="m-cap"><div class="box" style="width:820px">
  <div class="bh">✨ 花字类型<span class="sp"></span><span class="lite" id="mc-sub" style="font-weight:400;color:var(--dim);font-size:12px"></span><button class="xs" data-close>✕</button></div>
  <div class="bb" id="mc-body"></div>
  <div class="bf"><span class="msg" id="mc-msg"></span><select id="mc-preset" style="font-size:12px"></select><button class="pri" id="mc-save">保存</button></div>
</div></div>
<div class="modal" id="m-sfx"><div class="box" style="width:840px">
  <div class="bh">🔊 音效点位表<span class="sp"></span><span class="lite" id="ms-sub" style="font-weight:400;color:var(--dim);font-size:12px"></span><button class="xs" data-close>✕</button></div>
  <div class="bb" id="ms-body"></div>
  <div class="bf"><span class="msg" id="ms-msg"></span><button id="ms-save">保存点位表</button><button class="pri" id="ms-dispatch">派单生成缺项</button></div>
</div></div>
<div class="modal" id="m-ver"><div class="box" style="width:520px">
  <div class="bh">🗂 版本链<span class="sp"></span><button class="xs" data-close>✕</button></div>
  <div class="bb" id="mv-body"></div>
  <div class="bf"><span class="msg" id="mv-msg"></span></div>
</div></div>
<div id="lb"><img alt=""></div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=(v,d=1)=>v==null||isNaN(v)?'—':(+v).toFixed(d).replace(/\.0$/,'');
const tc=v=>{v=Math.max(0,+v||0);const m=Math.floor(v/60),s=v-m*60;return (m?String(m).padStart(2,'0')+':':'')+s.toFixed(2).padStart(5,'0')};
let D=null,EP='',SEL='',SCOPE='group',RANGE=null,AB='a',VA=null,VB=null,MODE='group',MULTI=new Set(),MASK=null,FILTER='all',
    POLL=null,JOB_POLL=null,LAYERS={picture:true,pack:true,sound:true},OPEN_SCN=new Set(),CLOSED_SEC=new Set(),EPIDX=0,PLAYING_EP=false;
const proj=()=>$('#project').value.trim()||'demo';
// 页面位置记忆(2026-09-11,同分镜预览):选中组 / 展开的场次 / 左栏组列表滚动按 项目:集 记进 localStorage,刷新或重开回到原位
let POS_TICK=null;
const posKey=()=>'post-pos:'+proj()+':'+EP;
function posLoad(){try{return JSON.parse(localStorage.getItem(posKey())||'{}')||{}}catch(_){return {}}}
function posSave(patch){try{localStorage.setItem(posKey(),JSON.stringify({...posLoad(),...patch}))}catch(_){}}
const api=p=>'/api/v1/projects/'+encodeURIComponent(proj())+'/post/'+encodeURIComponent(EP)+p;
async function J(url,method,body){
  const r=await fetch(url,{method:method||'GET',headers:body!==undefined?{'Content-Type':'application/json'}:{},body:body!==undefined?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.detail||j.error||r.status);
  return j;
}
const KIND=id=>(D&&D.catalog.kinds.find(k=>k.id===id))||null;
const SECS=()=>D?D.catalog.sections:[];
const EXEC_LABEL=x=>({ffmpeg:t('立即出片'),agent:t('派单出片'),record:t('成片时生效')}[x.exec]);
const grpById=id=>D&&D.groups.find(g=>g.group_id===id);
const sceneOfGroup=id=>{const g=grpById(id);return g?g.scene_id:''};
const LAYER_OF_SEC={fill:'picture',grade:'picture',vfx:'picture',pack:'pack',sound:'sound'};

/* ---------- 加载 ---------- */
async function load(keep){
  history.replaceState(null,'','?project='+encodeURIComponent(proj())+(EP?'&ep='+encodeURIComponent(EP):''));
  if(!keep)$('#work').innerHTML='<div class="empty" style="grid-column:1/-1">'+esc(t('加载中…'))+'</div>';
  try{
    const r=await fetch('/api/v1/projects/'+encodeURIComponent(proj())+'/previews/post'+(EP?'?ep='+encodeURIComponent(EP):''));
    if(!r.ok)throw new Error((await r.json()).detail||r.status);
    const d=await r.json();
    EP=d.ep||'';
    if(!(d.episodes||[]).length){$('#eps').innerHTML='';$('#work').innerHTML=`<div class="empty" style="grid-column:1/-1">${esc(t('该项目还没有分集数据'))}</div>`;return}
    if(!d.episodes.some(e=>e.ep===EP)){EP=d.episodes[0].ep;load(keep);return}
    localStorage.setItem('post-ep:'+(d.project||proj()),EP);
    const first=!D||D.ep!==d.ep;
    // 同一 grp 多行(旧服务端按 timeline 逐镜切条出行)并成一行:时长累加,场景的组清单去重
    {const m=new Map();for(const g of d.groups||[]){const x=m.get(g.group_id);if(x)x.duration=Math.round((x.duration+(g.duration||0))*1000)/1000;else m.set(g.group_id,g)}d.groups=[...m.values()];
     for(const sc of d.scenes||[])sc.groups=[...new Set(sc.groups)]}
    D=d;stemBuild();
    if(first||!grpById(SEL)){
      const pos=first?posLoad():{},blks=snBlocks(),open=(pos.open||[]).filter(id=>blks.some(x=>x.key===id));
      SEL=(pos.sel&&grpById(pos.sel)?pos.sel:(d.groups.find(g=>g.has_clip)||d.groups[0]||{}).group_id)||'';VA=null;VB=null;RANGE=null;MASK=null;
      OPEN_SCN=new Set(open.length?open:blks.slice(0,3).map(x=>x.key));
    }
    render(!first&&keep);
    schedulePoll();
  }catch(e){$('#work').innerHTML=`<div class="empty" style="grid-column:1/-1">${esc(t('加载失败:'))}${esc(e.message)}</div>`}
}
function schedulePoll(){
  const busy=(D.summary||{}).dispatched>0||(D.job||{}).status==='running';
  if(busy&&!POLL)POLL=setInterval(()=>load(true),60000);
  if(!busy&&POLL){clearInterval(POLL);POLL=null}
}

/* ---------- 顶部集行 ---------- */
function renderEps(){
  const s=D.summary||{},box=$('#eps');
  let h=`<select id="epsel" title="${esc(t('切换分集'))}">${D.episodes.map(e=>`<option value="${esc(e.ep)}" ${e.ep===EP?'selected':''}>${esc(e.ep)}${e.title?' · '+esc(e.title):''}${e.has_plan?' 📋':''}${!e.has_clips?' · '+esc(t('无组视频')):''}</option>`).join('')}</select>`;
  h+=`<span class="stat">${esc(I18N.f('{n} 组 · {d} · 后期调整 {t}(提交 {a} · 派单中 {p} · 草稿 {r})',{n:D.groups.length,d:tc(D.episode_duration),t:s.total||0,a:s.adopted||0,p:s.dispatched||0,r:(s.draft||0)+(s.applied||0)}))}</span>`;
  h+=`<span class="sp"></span><span id="gatebox">${gateHtml()}</span>`;
  h+=`<span class="lay">${esc(t('显示层'))} <label><input type="checkbox" data-layer="picture" ${LAYERS.picture?'checked':''}><i class="dot pic"></i>${esc(t('画面'))}</label><label><input type="checkbox" data-layer="pack" ${LAYERS.pack?'checked':''}><i class="dot pack"></i>${esc(t('包装'))}</label><label><input type="checkbox" data-layer="sound" ${LAYERS.sound?'checked':''}><i class="dot snd"></i>${esc(t('声音'))}</label></span>`;
  h+=`<button class="sm" id="btn-export" title="${esc(t('导出当前版本链的时间线(CSV/EDL),给 NLE 用的逃生口'))}">📤 ${esc(t('导出时间线'))}</button>`;
  const job=D.job||{};
  h+=`<button class="sm pri" id="btn-assemble" ${job.status==='running'?'disabled':''}>${job.status==='running'?'<span class="spin">⟳</span> '+esc(t('作业进行中'))+'('+esc(job.kind||'')+')':'🎬 '+esc(t('出成片'))}</button>`;
  box.innerHTML=h;
  $('#epsel').onchange=e=>{EP=e.target.value;D=null;load()};
  $$('#eps input[data-layer]').forEach(c=>c.onchange=()=>{LAYERS[c.dataset.layer]=c.checked;renderRight();renderFoot();applyLayerAudio()});
  $('#btn-export').onclick=exportTimeline;
  $('#btn-assemble').onclick=openPrecheck;
}
function gateHtml(){
  const g=D.gate||{};
  if((g.pending||[]).length){
    const c=g.pending[0];
    return `<span class="gate">🖋 ${esc(t('H3P 后期签字 · 待答复'))} <button class="signbtn pri" data-cid="${esc(c.id)}" data-answer="签字" title="${esc(c.question||'')}">✅ ${esc(t('签字确认'))}</button><button class="signbtn" data-cid="${esc(c.id)}" data-answer="暂缓">⏸ ${esc(t('暂缓'))}</button></span>`;
  }
  if(g.signed&&g.stale)return `<span class="gate stale" title="${esc(t('签字后台账又改动过(后期调整/指针变化);等总制片重新建签字单'))}">⚠ ${esc(t('H3P 签字已过期'))}${g.signed_at?' · '+esc(g.signed_at):''}</span>`;
  if(g.signed)return `<span class="gate ok">✅ ${esc(t('H3P 已签字'))}${g.signed_at?' · '+esc(g.signed_at):''}</span>`;
  return `<span class="gate idle" title="${esc(t('等总制片建签字单(转场/字幕交付后自动);建好后这里出现「签字确认」按钮'))}">${esc(t('H3P 后期签字'))} · ${esc(g.state||'pending')}</span>`;
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('.signbtn');if(!b||b.disabled||!D)return;
  if(b.dataset.answer==='签字'&&!confirm(t('确认签字放行本集后期?签字后按保留规则清理旧版本文件(母本 + 最近两个已提交版本保留),总制片将进入成片闸门。')))return;
  b.disabled=true;
  try{
    const j=await J(api('/signoff'),'POST',{confirm_id:b.dataset.cid,answer:b.dataset.answer});
    D.gate=j.gate||D.gate;$('#gatebox').innerHTML=gateHtml();
    if((j.cleaned||[]).length)toast(I18N.f('已清理 {n} 个旧版本文件',{n:j.cleaned.length}));
  }catch(err){b.disabled=false;alert(I18N.f('签字失败:{e}',{e:err.message}))}
});

/* ---------- 后期调整派生 ---------- */
function effective(gid){
  // 某组实际生效的后期调整(自身 + 继承;同 kind 更具体作用域覆盖上级)
  const g=grpById(gid);if(!g)return[];
  const rows=(D.plan.recipes||[]).filter(r=>r.status!=='discarded'&&scopeHits(r.scope,g)).map(r=>({...r,inherited:INH(r.scope.level)}));
  const deep={};rows.forEach(r=>{deep[r.kind]=Math.max(deep[r.kind]||0,lvl(r.scope.level))});
  rows.forEach(r=>{r.overridden=r.inherited&&lvl(r.scope.level)<deep[r.kind]});
  return rows;
}
const lvl=l=>({episode:0,scene:1,block:2,group:3,range:4})[l]||0;
const INH=l=>l==='episode'||l==='scene'||l==='block';
function scopeHits(sc,g){if(sc.level==='episode')return true;if(sc.level==='scene')return sc.scene_id===g.scene_id;if(sc.level==='block')return !!sc.block_id&&sc.block_id===g.block_id;return sc.group_id===g.group_id}
function scopeText(sc){
  if(sc.level==='episode')return t('整集');if(sc.level==='scene')return sc.scene_id;if(sc.level==='block')return t('叙事块 ')+sc.block_id;
  if(sc.level==='range')return `${sc.group_id} ${num(sc.t0,1)}–${num(sc.t1,1)}s`;return sc.group_id;
}
function groupStatus(gid){
  // 四格:画面(修补/特效) 画面(调色) 包装 声音;实心=有提交,半=有出片/草稿
  const rows=effective(gid).filter(r=>!r.overridden);
  const cell=secs=>{const rs=rows.filter(r=>secs.includes(r.section));if(rs.some(r=>r.status==='adopted'))return 'on';if(rs.length)return 'half';return ''};
  return {fill:cell(['fill','vfx']),grade:cell(['grade']),pack:cell(['pack']),snd:cell(['sound']),
    busy:rows.some(r=>r.status==='dispatched'),n:rows.length};
}

/* ---------- 主体 ---------- */
function render(keep){
  renderEps();
  if(!keep||!$('#left')){
    $('#work').innerHTML=`<div class="col" id="left"></div><div class="col" id="mid"></div><div class="col" id="right">
      <div class="pendbar" id="pendbar"></div>
      <div class="cutsec closed" id="cutsec"><div class="col-h" id="cut-h" title="${esc(t('分镜剪辑,四个模块:① 删段——选中的时间段直接删除,剩余拼成新版本;② 插段——把导入的另一版本整段插到最前面 / 最后面 / 当前时刻;③ 插黑 / 定格——在当前时刻或组边界插入定格帧 + 黑场控制切换节奏;④ 派单剪辑师——输入指令发给剪辑师工位,产物登记为新版本'))}"><span class="car">▸</span>✂️ ${esc(t('分镜剪辑'))} <span class="lite" id="cut-gid"></span><span class="sp"></span><span class="lite" id="cut-sum"></span></div><div class="cutp" id="cutpanel" style="display:none"></div></div>
      <div id="rbody"></div></div>`;
    $('#cut-h').onclick=toggleCut;
    renderMonitorShell();
  }
  renderLeft();renderRight();renderFoot();
  if(!keep)setMonitor();else{refreshMonitorMeta();renderWaves();drawRange()}
}
/* 左栏 */
// 左栏分组按场次(scene_no;与分镜预览页/导演台一致:按组序连续成块,同场次拆多块标 段号/总段数),无 scene_no 退回 scene_id;
// SCN 场景号作小字附在场次名后。D.scenes(按 SCN)仍供「场次」作用域处方/色板使用,不动
function snBlocks(){
  const out=[];
  for(const g of D.groups){const sn=g.scene_no||g.scene_id||'?',last=out.at(-1);if(last&&last.sn===sn)last.groups.push(g);else out.push({sn,groups:[g]})}

async function cutImported(j){

async function cutPickFile(){
  const b=$('#cut-pick');b.disabled=true;cutMsg(t('已弹出本机文件对话框,请在对话框里选文件…'));
  try{
    const j=await J(api('/pick-file'),'POST',{group_id:SEL});

    cutMsg(I18N.f('导入 {n} …',{n:j.name}));
    const r=await J(api('/import'),'POST',{group_id:SEL,path:j.path});
    await cutImported(r);
  }catch(e){

async function cutUploadFile(e){
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;

async function cutOut(){

  if(!cuts.length||CUT_BUSY)return;
  const cutLen=cuts.reduce((a,c)=>a+(c.t1-c.t0),0);
  if(!confirm(I18N.f('以 v{a} 为基准,直接删除 {n} 段(共 {s}s),剩余内容拼成 {g} 的新版本?',{a:baseV,n:cuts.length,s:num(cutLen,2),g:SEL})))return;

    toast(I18N.f('已生成 {g} v{v}({s}s)',{g:j.group_id,v:j.v,s:j.seconds}));

  const b=p.base,n=p.ins,wh=x=>x.width+'×'+x.height;

  const fit=p.aspect_differs?INS.fit:'pad',k=(p.upscale||{})[fit]||1;
  let h=`<div class="row"><span class="lb">${esc(t('分辨率'))}</span><span data-no-i18n style="font-family:var(--mono)">${esc(I18N.f('插入源 {a} · A {b}',{a:wh(n),b:wh(b)}))}</span><span class="lb wrap">${esc(info.join(' · '))}</span></div>`;
  if(p.aspect_differs){

function waveSeekAbs(abs){

function waveAbsAt(clientX){
  const tr=$('#waves .tr');if(!tr)return null;const r=tr.getBoundingClientRect(),[w0,w1]=waveWindow();
  return w0+Math.max(0,Math.min(1,(clientX-r.left)/Math.max(1,r.width)))*(w1-w0);

function waveScrubTo(abs){

let WSCRUB_BOUND=false;
function bindWaveScrub(){
  const box=$('#waves');if(!box)return;
  box.addEventListener('pointerdown',e=>{
    if(e.button!==0||!e.target.closest('.tr'))return;

    if(!WSCRUB.item){const a=waveAbsAt(e.clientX);if(a!=null)waveScrubTo(a)}

    if(!WSCRUB)return;

  });

  });

function recipeCard(r){
  const inh=r.inherited&&SCOPE==='group',over=r.overridden&&SCOPE==='group';
  const k=KIND(r.kind)||{};
  const params=Object.entries(r.params||{}).filter(([key,v])=>!(Array.isArray(v)&&!v.length)).map(([key,v])=>{
    const spec=(k.params||[]).find(p=>p.key===key)||{label:key};
    if(Array.isArray(v))return `<span class="pal">${v.slice(0,6).map(c=>`<i style="background:${esc(c)}"></i>`).join('')}</span>`;
    return `<span>${esc(spec.label)} ${esc(typeof v==='boolean'?(v?'✓':'✗'):v)}</span>`}).join('');
  const refs=Object.entries(r.refs||{}).map(([key,v])=>`<span title="${esc(typeof v==='string'?v:JSON.stringify(v))}">${esc({frame:t('参考帧'),mask:t('蒙版'),asset:t('素材')}[key]||key)} ✓</span>`).join('');
  const out=r.output&&r.output.versions?Object.entries(r.output.versions).map(([g,v])=>`<span>${esc(g)}=v${esc(v.v)}</span>`).join(''):'';
  let acts='';
  const A=(act,label,cls)=>`<button class="xs ${cls||''}" data-act="${act}" data-rid="${esc(r.id)}">${esc(label)}</button>`;
  if(inh){acts=A('override',t('在本组覆盖'))}
  else if(r.status==='draft'){
    if(r.exec==='ffmpeg')acts=A('preview',t('快速预览'))+A('apply',t('出片'),'pri');
    else if(r.exec==='agent')acts=A('dispatch',t('派单出片'),'pri');
    else acts=A('adopt',t('提交'),'pri');
    acts+=A('edit',t('编辑'))+A('delete',t('删除'));
  }else if(r.status==='dispatched'){acts=`<span class="spin">⟳</span> `+(r.run_id&&r.run_id!=='host'?`<a href="/?project=${encodeURIComponent(proj())}&run=${encodeURIComponent(r.run_id)}" target="_blank" style="font-size:11px">${esc(t('查看运行'))}</a>`:`<span style="font-size:11px;color:var(--dim)">${esc(t('宿主出片中'))}</span>`)}
  else if(r.status==='applied'){acts=A('ab',t('A|B 比对'),'pri')+A('adopt',t('提交'))+A('discard',t('弃用'))+A('edit',t('改参数重出'))+(r.preview_url?'':'')}
  else if(r.status==='adopted'){acts=(r.exec==='record'&&D.catalog.record_agents[r.kind]?A('dispatch',t('派单落地')):'')+(k.engine==='separation'&&D.catalog.record_agents[r.kind]?A('dispatch',t('派单重混')):'')+A('discard',r.exec==='record'?t('撤回'):t('弃用'))+A('copy',t('复制到…'))+(r.exec!=='record'?A('ab',t('看结果')):'')}
  else if(r.status==='failed'){acts=(r.exec==='ffmpeg'?A('apply',t('重试出片'),'pri'):A('dispatch',t('重新派单'),'pri'))+A('edit',t('编辑'))+A('delete',t('删除'))}
  else if(r.status==='discarded'){acts=A('reset',t('重置为草稿'))+A('delete',t('删除'))}
  if(r.preview_url&&(r.status==='draft'||r.status==='failed'))acts+=A('seepreview',t('看预览'));
  return `<div class="rec ${inh?'inh':''} ${over?'over':''}" data-rid="${esc(r.id)}"><div class="r1"><span class="nm" data-no-i18n>${esc(r.kind_label||r.kind)}</span>${r.created_by&&r.created_by!=='user'?`<span class="st" title="${esc(t('工位自动开的调整:'))+esc(r.created_by)}">🤖 ${esc(t('自动'))}</span>`:''}<span class="st ${esc(r.status)}">${esc(r.status_label||r.status)}</span><span class="sp"></span><span class="sc" data-no-i18n title="${esc(scopeText(r.scope))}">${inh?esc(t('继承'))+' ':''}${esc(scopeText(r.scope))}</span></div>
    ${r.status==='applied'&&out?`<div class="out" data-no-i18n>${out}</div>`:''}<div class="r2" data-no-i18n>${params}${refs}${r.cost&&r.cost.actual?`<span>${esc(r.cost.actual)}</span>`:r.cost&&r.cost.estimate?`<span>${esc(t('预估'))} ${esc(r.cost.estimate)}</span>`:''}${r.error?`<span class="err">${esc(r.error.slice(0,160))}</span>`:''}</div>
    ${r.note?`<div class="note" data-no-i18n title="${esc(r.note)}">${esc(r.note)}</div>`:''}<div class="r3">${acts}</div></div>`;
}
async function recipeAction(rid,act,btn){
  const r=(D.plan.recipes||[]).find(x=>x.id===rid);if(!r)return;
  try{
    if(act==='edit'){openRecipe({recipe:r});return}
    if(act==='override'){openRecipe({recipe:{...r,id:null,scope:{level:'group',group_id:SEL,scene_id:sceneOfGroup(SEL)},status:'draft',output:null}});return}
    if(act==='ab'){const gid=r.scope.group_id||SEL;const vs=r.output&&r.output.versions||{};const v=(vs[gid]||Object.values(vs)[0]||{}).v;if(MODE!=='group')setMode('group');if(r.scope.group_id&&r.scope.group_id!==SEL)selectGroup(r.scope.group_id);if(v!=null){VA=v;VB=(grpById(SEL)||{}).current||0;if(VB===VA)VB=0;AB='split';$$('#ab span').forEach(x=>x.classList.toggle('on',x.dataset.ab==='split'));setMonitor(true)}return}
    if(act==='seepreview'){const va=$('#va');va.src=r.preview_url;va.dataset.src=r.preview_url;$('#tagA').textContent=t('预览 ')+r.kind_label;AB='a';applyAB();va.play().catch(()=>{});return}
    if(act==='delete'){if(!confirm(t('删除这条调整?')))return;btn.disabled=true;await J(api('/recipes/'+rid),'DELETE');await load(true);return}
    if(act==='copy'){
      const gids=MULTI.size?Array.from(MULTI):(prompt(t('复制到哪些组?用逗号分隔(或先在左栏多选)'),'')||'').split(/[,，\s]+/).filter(Boolean);
      if(!gids.length)return;btn.disabled=true;const j=await J(api('/recipes/'+rid+'/copy'),'POST',{groups:gids});toast(I18N.f('已复制 {n} 条草稿',{n:(j.created||[]).length}));await load(true);return}
    if(act==='apply'){
      if(!confirm(I18N.f('在 {s} 出片「{k}」?',{s:scopeText(r.scope),k:r.kind_label})))return;
      btn.disabled=true;await J(api('/recipes/'+rid+'/apply'),'POST',{});await load(true);return}
    if(act==='preview'){btn.disabled=true;await J(api('/recipes/'+rid+'/preview'),'POST',{});await load(true);return}
    if(act==='dispatch'){btn.disabled=true;const j=await J(api('/recipes/'+rid+'/dispatch'),'POST',{});await load(true);return}
    btn.disabled=true;await J(api('/recipes/'+rid+'/'+act),'POST',{});await load(true);
    if(act==='adopt'&&(KIND(r.kind)||{}).engine==='separation')toast(t('已提交;成片里的声音要重跑混音后才会变(点「派单重混」)'));
    if(act==='adopt'&&r.exec!=='record'){
      // 同场次其余组套用提示
      const sid=sceneOfGroup(r.scope.group_id||SEL);const rest=D.groups.filter(g=>g.scene_id===sid&&g.group_id!==(r.scope.group_id||SEL)&&!(D.plan.recipes||[]).some(x=>x.kind===r.kind&&x.scope.group_id===g.group_id));
      if(rest.length&&!INH(r.scope.level)&&confirm(I18N.f('同场次还有 {n} 组未做「{k}」,复制同一调整为草稿?',{n:rest.length,k:r.kind_label}))){
        await J(api('/recipes/'+rid+'/copy'),'POST',{groups:rest.map(g=>g.group_id)});await load(true);
      }
    }
  }catch(e){alert(e.message);if(btn)btn.disabled=false}
}

function buildSfxRow(rows,{gid,shot,t:tt,text}){
  const g=D.groups.find(x=>x.group_id===gid);text=(text||'').trim();tt=Math.max(0,+tt||0);
  if(!g||!text)throw new Error(t('请选组并填写描述'));
  if(g.duration&&tt>g.duration)throw new Error(I18N.f('组内时间超出该组时长 {d}s',{d:num(g.duration,1)}));
  const n=rows.reduce((m,r)=>Math.max(m,+(String(r.id).match(/(\d+)$/)||[])[1]||0),0)+1,id=`sfx-${String(n).padStart(3,'0')}`;
  const row={id,shot_id:shot||'',group_id:gid,t:+tt.toFixed(3),t_abs:+((g.cum_start_s||0)+tt).toFixed(3),text,event:text.slice(0,60),level:'key',source:'generate',file:'',gain_db:-12};
  const at=rows.findIndex(r=>r.t_abs>row.t_abs);rows.splice(at<0?rows.length:at,0,row);
  return row;
}

  const cur=await J(api('/sfx'));const rows=((cur.sfx||{}).rows)||[];

function pollJob(){

  JOB_POLL=setInterval(async()=>{
    try{const j=await J(api('/job'));const job=j.job||{};D.job=job;
      const lg=$('#mp-log');if(lg){lg.textContent=(job.log||[]).join('\n')+(job.error?'\n'+job.error:'');lg.scrollTop=lg.scrollHeight}
      else if($('#m-pre').classList.contains('open')&&PRE){renderPrecheck()}
      if(job.status!=='running'){clearInterval(JOB_POLL);JOB_POLL=null;await load(true);if($('#m-pre').classList.contains('open')){PRE=await J(api('/precheck'),'POST',{quick:true});renderPrecheck()}}
    }catch(_){}
  },3000);
}

/* ---------- 音效点位表 ---------- */
let SFX=null;
/* ---------- 花字类型(2026-09-24):目录 modules/caption_catalog.json,策略 output.caption_mode/caption_types ---------- */
let CAPST=null;
async function saveOutput(patch){
  try{await J('/api/v1/projects/'+encodeURIComponent(proj())+'/config','POST',{project:proj(),output:patch});await load(true)}catch(e){alert(t('保存失败:')+e.message);await load(true)}
}
function openCapTypes(mode,onCancel){
  // mode: view=只读目录(自动模式)| edit=改手动勾选 | confirm=切换到手动前先勾选(取消回自动)
  const cc=D.caption_catalog||{},pol=cc.policy||{mode:'auto',types:[]},av={};(cc.availability||[]).forEach(a=>av[a.id]=a);
  const editable=mode!=='view',pre=new Set(mode==='view'?[]:(pol.types||[]));
  CAPST={mode,onCancel,saved:false};
  $('#mc-sub').textContent=mode==='view'?t('自动模式:花字 Agent 按题材从下列目录自选'):t('只出勾选的类型,不保证每种都出现');
  let h='';
  for(const c of (cc.categories||[])){
    const items=(cc.types||[]).filter(x=>x.category===c.id);
    h+=`<div class="capcat" data-cat="${esc(c.id)}"><div class="ch"><span>${esc(c.label)}</span><span class="sp"></span>${editable?`<button class="xs" data-all="1">${esc(t('全选'))}</button><button class="xs" data-all="0">${esc(t('清空'))}</button>`:''}</div><div class="items">`;
    for(const x of items){const a=av[x.id]||{available:true},na=!a.available;
      h+=`<label class="${na?'na':''}" title="${esc(na?a.reason:'')}"><input type="checkbox" data-tid="${esc(x.id)}" ${pre.has(x.id)&&!na?'checked':''} ${(na||!editable)?'disabled':''}><span><span>${esc(x.label)}</span><span class="d">${esc(x.desc)}</span>${na?`<span class="d" style="color:var(--yellow)">${esc(a.reason)}</span>`:''}</span></label>`}
    h+=`</div></div>`;
  }
  if((cc.excluded||[]).length){
    h+=`<div class="capcat ex"><div class="ch"><span>${esc(t('一期不进目录'))}</span></div><div class="items">`;
    for(const x of cc.excluded)h+=`<label title="${esc(x.reason)}"><input type="checkbox" disabled><span><span>${esc(x.label)}</span><span class="d">${esc(x.reason)}</span></span></label>`;
    h+=`</div></div>`;
  }
  $('#mc-body').innerHTML=h;$('#mc-msg').textContent='';$('#mc-msg').className='msg';
  const ps=$('#mc-preset');ps.innerHTML=`<option value="">${esc(t('按题材推荐…'))}</option>`+Object.entries(cc.presets||{}).map(([k,v])=>`<option value="${esc(k)}">${esc(v.label)}</option>`).join('');
  ps.style.display=editable?'':'none';$('#mc-save').style.display=editable?'':'none';
  ps.onchange=()=>{const pv=(cc.presets||{})[ps.value];if(!pv)return;const want=new Set(pv.types);$$('#mc-body input[data-tid]').forEach(i=>{if(!i.disabled)i.checked=want.has(i.dataset.tid)});ps.value='';updCapCount()};
  $$('#mc-body [data-all]').forEach(b=>b.onclick=()=>{b.closest('.capcat').querySelectorAll('input[data-tid]:not(:disabled)').forEach(i=>i.checked=b.dataset.all==='1');updCapCount()});
  $$('#mc-body input[data-tid]').forEach(i=>i.onchange=updCapCount);
  updCapCount();
  $('#m-cap').classList.add('open');
}
function capChecked(){return $$('#mc-body input[data-tid]:checked').map(i=>i.dataset.tid)}
function updCapCount(){if(CAPST&&CAPST.mode!=='view'){const n=capChecked().length;$('#mc-msg').textContent=I18N.f('已选 {n} 项',{n});$('#mc-msg').className='msg'}}
$('#mc-save').onclick=async()=>{
  const types=capChecked();
  if(!types.length){$('#mc-msg').textContent=t('手动模式至少勾选一项');$('#mc-msg').className='msg err';return}
  try{await J('/api/v1/projects/'+encodeURIComponent(proj())+'/config','POST',{project:proj(),output:{caption_mode:'manual',caption_types:types}});CAPST.saved=true;closeModal('#m-cap');toast(t('已保存'));await load(true)}
  catch(e){$('#mc-msg').textContent=e.message;$('#mc-msg').className='msg err'}
};

async function openSfx(focus){
  $('#ms-body').innerHTML=`<div class="empty" style="margin:20px">${esc(t('加载中…'))}</div>`;$('#m-sfx').classList.add('open');$('#ms-msg').textContent='';
  try{SFX=await J(api('/sfx'));renderSfx(focus)}catch(e){$('#ms-body').innerHTML=`<div class="blockers">${esc(e.message)}</div>`}
}
function renderSfx(focus){
  const rows=(SFX.sfx||{}).rows||[],lib=SFX.library||[];
  $('#ms-sub').textContent=I18N.f('{n} 条 · {s}',{n:rows.length,s:SFX.saved?t('已保存'):t('由分镜 sfx cue 生成,尚未保存')});
  let h=rows.length?'':`<div class="empty" style="margin:20px">${esc(I18N.f('本集没有音效点位(assets/audio/sfx/{ep}/audio_cues.json 不存在或为空)',{ep:EP}))}</div>`;
  if(rows.length)h+=`<table class="tb"><tr><th>${esc(t('时间'))}</th><th>${esc(t('组/镜'))}</th><th>${esc(t('分镜 cue'))}</th><th>${esc(t('来源'))}</th><th>${esc(t('文件'))}</th><th>dB</th></tr>`;
  for(const r of rows){
    const ok=r.source==='skip'||(r.source&&r.file);
    h+=`<tr data-id="${esc(r.id)}" ${r.id===focus?'style="outline:1px solid var(--accent)"':''}><td style="font-family:var(--mono);white-space:nowrap"><span style="color:${ok?'var(--green)':'var(--red)'}">●</span> ${tc(r.t_abs)}<br><small style="color:var(--dim)">${esc(r.group_id)} +${num(r.t,2)}s</small></td><td style="font-family:var(--mono);font-size:10.5px">${esc(r.group_id)}<br>${esc(r.shot_id||'')}</td><td data-no-i18n style="max-width:280px"><b>${esc(r.event||'')}</b> ${esc(r.text||'')}</td>
      <td><select data-k="source"><option value="" ${!r.source?'selected':''}>${esc(t('未定'))}</option><option value="library" ${r.source==='library'?'selected':''}>${esc(t('选库'))}</option><option value="generate" ${r.source==='generate'?'selected':''}>${esc(t('生成'))}</option><option value="skip" ${r.source==='skip'?'selected':''}>${esc(t('略过'))}</option></select></td>
      <td><input class="f" type="text" data-k="file" value="${esc(r.file||'')}" list="sfxlib" placeholder="assets/audio/sfx/${esc(EP)}/patches/…"></td><td><input type="number" data-k="gain_db" value="${r.gain_db??-12}" step="1" style="width:56px"></td></tr>`;
  }
  h+=(rows.length?'</table>':'')+`<datalist id="sfxlib">${lib.map(s=>`<option value="${esc(s.file)}">${esc(s.id)} ${esc((s.tags||[]).join(' '))}</option>`).join('')}</datalist>`;
  h+=`<div class="sfx-add"><span class="lb">${esc(t('新增点位'))}</span><select id="sa-grp">${D.groups.map(g=>`<option value="${esc(g.group_id)}">${esc(g.group_id)} · ${tc(g.cum_start_s)} · ${num(g.duration,1)}s</option>`).join('')}</select><select id="sa-shot"><option value="">${esc(t('镜(可选)'))}</option></select><input id="sa-t" type="number" min="0" step="0.1" value="0.5" title="${esc(t('组内第几秒'))}" style="width:64px"><span class="lb">s</span><input id="sa-text" type="text" placeholder="${esc(t('这一声是什么,如:女人尖叫'))}" style="flex:1;min-width:160px"><button id="sa-add">${esc(t('添加'))}</button></div>`;
  h+=`<div style="color:var(--dim);font-size:11.5px">${esc(t('来源=选库:文件填 data/sfx/manifest.json 里的条目或项目内路径;来源=生成:留空文件,点「派单生成缺项」让音效工位产出并回填;略过=显式不做。点位时间可在调整指令里让工位微调。'))}</div>`;
  $('#ms-body').innerHTML=h;
  $$('#ms-body tr[data-id]').forEach(tr=>{tr.querySelectorAll('[data-k]').forEach(el=>el.onchange=()=>{const r=rows.find(x=>x.id===tr.dataset.id);r[el.dataset.k]=el.dataset.k==='gain_db'?+el.value:el.value})});
  const fillShots=()=>{const g=D.groups.find(x=>x.group_id===$('#sa-grp').value)||{};$('#sa-shot').innerHTML=`<option value="">${esc(t('镜(可选)'))}</option>`+(g.shots||[]).map(sid=>`<option value="${esc(sid)}">${esc(sid)}</option>`).join('')};
  $('#sa-grp').onchange=fillShots;fillShots();
  $('#sa-add').onclick=()=>{
    let row;try{row=buildSfxRow(rows,{gid:$('#sa-grp').value,shot:$('#sa-shot').value,t:$('#sa-t').value,text:$('#sa-text').value})}catch(e){$('#ms-msg').textContent=e.message;$('#ms-msg').className='msg err';return}
    SFX.sfx=SFX.sfx||{};SFX.sfx.rows=rows;SFX.saved=false;$('#ms-msg').textContent=t('已加入,记得点「保存点位表」');$('#ms-msg').className='msg';
    renderSfx(row.id);
  };
  if(focus){const el=$(`#ms-body tr[data-id="${focus}"]`);if(el)el.scrollIntoView({block:'center'})}
}
$('#ms-save').onclick=async()=>{try{await J(api('/sfx'),'PUT',{rows:(SFX.sfx||{}).rows||[]});$('#ms-msg').textContent=t('已保存');SFX.saved=true;await load(true)}catch(e){$('#ms-msg').textContent=e.message;$('#ms-msg').className='msg err'}};
$('#ms-dispatch').onclick=async()=>{try{await J(api('/sfx'),'PUT',{rows:(SFX.sfx||{}).rows||[]});const j=await J(api('/sfx/dispatch'),'POST',{});$('#ms-msg').textContent=I18N.f('已派单 {n} 条(运行 {r})',{n:j.count,r:j.run_id})}catch(e){$('#ms-msg').textContent=e.message;$('#ms-msg').className='msg err'}};

/* ---------- 版本链 / 导出 ---------- */
function openVersions(gid){
  const g=grpById(gid);if(!g)return;
  let h=`<div style="font-family:var(--mono);font-size:12px;margin-bottom:6px">${esc(gid)} · ${esc(t('当前'))} v${g.current||0}</div><table class="tb"><tr><th>v</th><th>${esc(t('后期调整'))}</th><th>${esc(t('创建'))}</th><th>${esc(t('提交'))}</th><th></th></tr>`;
  for(const v of g.versions)h+=`<tr><td style="font-family:var(--mono)">v${v.v}${v.v===(g.current||0)?' ★':''}</td><td data-no-i18n>${esc((v.recipes||[]).map(r=>{const x=(D.plan.recipes||[]).find(y=>y.id===r);return x?x.kind_label:r}).join('+')||(v.v===0?t('母本'):'')||v.note||'')}</td><td style="font-size:10.5px;color:var(--dim)">${esc(v.created_at||'')}</td><td style="font-size:10.5px;color:var(--dim)">${esc(v.adopted_at||'')}</td><td>${v.cleaned?'<span style="color:var(--faint)">'+esc(t('文件已清理'))+'</span>':v.v===(g.current||0)?'':`<button class="xs" data-roll="${v.v}">${esc(t('指针到此'))}</button>`}</td></tr>`;
  h+=`</table>`;
  $('#mv-body').innerHTML=h;$('#mv-msg').textContent='';$('#m-ver').classList.add('open');
  $$('#mv-body [data-roll]').forEach(b=>b.onclick=async()=>{try{await J(api('/rollback'),'POST',{group_id:gid,to:+b.dataset.roll});closeModal('#m-ver');VA=null;VB=null;await load(true);setMonitor()}catch(e){$('#mv-msg').textContent=e.message}});
}
document.addEventListener('dblclick',e=>{const g=e.target.closest('.grp');if(g)openVersions(g.dataset.g)});
function exportTimeline(){
  const lines=['TITLE: '+proj()+' '+EP+' post','FCM: NON-DROP FRAME',''];
  const fr=s=>{s=Math.max(0,s);const f=Math.round(s*24);const h=Math.floor(f/86400),m=Math.floor(f%86400/1440),sec=Math.floor(f%1440/24),ff=f%24;return [h,m,sec,ff].map(x=>String(x).padStart(2,'0')).join(':')};
  D.groups.forEach((g,i)=>{const v=g.versions.find(x=>x.v===(g.current||0))||g.versions[0]||{};lines.push(`${String(i+1).padStart(3,'0')}  ${g.group_id.padEnd(8)} V     C        ${fr(0)} ${fr(g.duration)} ${fr(g.cum_start_s)} ${fr(g.cum_start_s+g.duration)}`);lines.push(`* FROM CLIP NAME: ${v.file||''}`);lines.push('')});
  const csv=['group_id,scene_id,order,cum_start_s,duration_s,version,file'].concat(D.groups.map(g=>{const v=g.versions.find(x=>x.v===(g.current||0))||{};return [g.group_id,g.scene_id,g.order,g.cum_start_s,g.duration,g.current||0,v.file||''].join(',')})).join('\n');
  const blob=new Blob([lines.join('\n')+'\n\n#CSV\n'+csv],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${proj()}_${EP}_post_timeline.edl.txt`;a.click();
}

/* ---------- 通用 ---------- */
function closeModal(sel){$(sel).classList.remove('open');if(sel==='#m-cap'&&CAPST&&!CAPST.saved){const cb=CAPST.onCancel;CAPST=null;if(cb)cb()}}
function toast(msg){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border2);color:var(--text);padding:6px 14px;border-radius:8px;font-size:12.5px;z-index:120;box-shadow:0 6px 24px #000a;transition:opacity .3s';document.body.appendChild(el)}el.textContent=msg;el.style.opacity='1';clearTimeout(el._t);el._t=setTimeout(()=>{el.style.opacity='0'},3500)}
$$('.modal [data-close]').forEach(b=>b.onclick=()=>closeModal('#'+b.closest('.modal').id));
$$('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal('#'+m.id)}));
$('#lb').onclick=()=>{$('#lb').style.display='none'};
document.addEventListener('click',e=>{const img=e.target.closest('img.ref');if(img){$('#lb img').src=img.src;$('#lb').style.display='flex'}});
try{
  const es=new EventSource('/api/v1/events');
  es.onmessage=e=>{try{const ev=JSON.parse(e.data);if(!D)return;
    if(ev.type==='post_job'&&ev.project===proj()&&ev.ep===EP){if(ev.status!=='running'){load(true);if($('#m-pre').classList.contains('open'))pollJob()}else if(ev.line){const lg=$('#mp-log');if(lg){lg.textContent+='\n'+ev.line;lg.scrollTop=lg.scrollHeight}}}
    else if((ev.type==='confirm'||ev.type==='confirm_done'))load(true);
    else if(ev.type==='run'&&ev.run&&ev.run.project===proj()&&(D.summary||{}).dispatched>0&&ev.run.status&&ev.run.status!=='running'&&ev.run.status!=='queued')load(true);
  }catch(_){}};
}catch(_){}
$('#reload').onclick=()=>load(true);
const _q=new URLSearchParams(location.search);
$('#project').value=_q.get('project')||(JSON.parse(localStorage.getItem('webui_prefs')||'{}').project)||'demo';
EP=_q.get('ep')||localStorage.getItem('post-ep:'+$('#project').value.trim())||'';
load();
// 右上角预览页切换下拉(项目值走 URL/localStorage,由隐藏 #project 承载)
const PV_PAGES=[['/preview/refs','\u{1F5BC} 参考文件'],['/preview/workflow','\u{1F9ED} 工作流预览'],['/preview/worldview','\u{1F30D} 世界观预览'],['/preview/scenes','\u{1F3D4} 场景预览'],['/preview/characters','\u{1F464} 人物预览'],['/preview/creatures','\u{1F40E} 生物预览'],['/preview/props','\u{1F5E1} 道具预览'],['/preview/script','\u{1F4DC} 剧本预览'],['/preview/board','\u{1F4CB} 故事板'],['/preview/storyboard','\u{1F3A6} 分镜预览'],['/preview/director','\u{1F4FA} 导演台'],['/preview/post','\u{1F39A}️ 后期处理'],['/preview/videos','\u{1F39E}️ 成片发布']];
PV_PAGES.forEach(([u,n])=>{const o=document.createElement('option');o.value=u;o.textContent=n;if(location.pathname===u)o.selected=true;$('#pvnav').appendChild(o)});
$('#pvnav').onchange=()=>{const p=($('#project').value||'').trim()||'demo';location.href=$('#pvnav').value+'?project='+encodeURIComponent(p)};
</script>
