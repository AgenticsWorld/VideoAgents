<style>
:root{
  --bg:#0f1117; --panel:#161a23; --panel2:#1c2130; --border:#2a3040;
  --text:#dde3ee; --dim:#8b93a7; --accent:#6c9ef8; --link:#fb923c; --green:#4ade80;
  --red:#f87171; --yellow:#fbbf24; --purple:#c084fc;
}
*{box-sizing:border-box;margin:0;padding:0}
a{color:var(--link)}
body{background:var(--bg);color:var(--text);font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
header h1{font-size:15px;font-weight:600}
header a.back{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:3px 10px;line-height:1.4}
header a.back:hover{color:var(--accent);border-color:var(--accent)}
header .spacer{flex:1}
input[type=text]{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px}
button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}
header select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;cursor:pointer}
header select:hover{border-color:var(--accent)}
main{flex:1;display:flex;min-height:0}
#list{width:270px;border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column}
#search{margin:10px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text)}
#items{flex:1;overflow-y:auto;padding-bottom:20px}
.item{padding:7px 14px;cursor:pointer;border-left:2px solid transparent}
.item:hover{background:var(--panel2)}
.item.active{background:var(--panel2);border-left-color:var(--accent)}
.item .row1{display:flex;align-items:center;gap:6px;min-width:0}
.item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .id{display:block;color:var(--dim);font-size:11px;line-height:1.4;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:10px;line-height:14px;height:16px;box-sizing:border-box;display:inline-flex;align-items:center;gap:1px;border:1px solid var(--purple);color:var(--purple);border-radius:4px;padding:0 5px;flex:none}
.badge.pic{border-color:var(--green);color:var(--green)}
/* 列表行标签限宽:过长标签截断加省略号,不挤掉名字(完整文本见 title) */
.item .row1 .badge{display:inline-block;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge.key{border-color:var(--yellow);color:var(--yellow)}
#detail{flex:1;overflow-y:auto;padding:22px 26px}
.empty{color:var(--dim);text-align:center;margin-top:60px}
h2.title{font-size:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2.title .id{color:var(--dim);font-size:13px;font-weight:400}
.meta-line{color:var(--dim);font-size:13px;margin:6px 0 4px}
.notes{color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:13px}
.gallery{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}
.gallery figure{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px;text-align:center}
.gallery img{height:230px;max-width:380px;object-fit:contain;border-radius:6px;cursor:zoom-in;display:block}
.gallery figcaption{font-size:11px;color:var(--dim);margin-top:4px;max-width:380px;display:flex;align-items:center;justify-content:center;gap:6px}
.gallery figcaption .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gallery figure.folder{cursor:pointer}
.gallery figure.folder:hover{border-color:var(--accent)}
.gallery figure.folder img{cursor:pointer}
.fthumb{position:relative}
.fthumb .fmask{position:absolute;inset:0;background:rgba(15,17,23,.42);display:flex;align-items:center;justify-content:center;font-size:46px;border-radius:6px}
.fcnt{color:var(--dim);flex:none}
.foldbar{display:flex;align-items:center;gap:10px;margin:16px 0 -6px;font-size:13px}
.foldbar .fname{font-weight:600}
.editbtn{font-size:11px;padding:1px 7px;flex:none;background:var(--panel2);border:1px solid var(--border);border-radius:5px;color:var(--dim);cursor:pointer}
.editbtn:hover{color:var(--accent);border-color:var(--accent)}
.doc{border:1px solid var(--border);border-radius:10px;margin:14px 0;overflow:hidden}
.doc>h3{background:var(--panel);padding:9px 14px;font-size:13.5px;cursor:pointer;user-select:none}
.doc>h3::before{content:'▾ ';color:var(--dim)}
.doc.closed>h3::before{content:'▸ '}
.doc.closed>.body{display:none}
.doc>.body{padding:12px 16px;background:var(--panel2)}
dl.kv{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:4px 14px}
dl.kv>dt{color:var(--dim);font-size:12.5px;word-break:break-all}
dl.kv>dd{min-width:0;word-break:break-word}
dl.kv dl.kv{margin:2px 0 6px;padding-left:10px;border-left:1px solid var(--border)}
ul.arr{padding-left:18px}
ul.arr>li{margin:2px 0}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
#lightbox img{max-width:96vw;max-height:96vh;border-radius:6px}
</style>

<body>
<header>
  <a class="back" href="/" onclick="if(history.length>1){history.back();return false}" title="后退">&lt;</a>
  <a class="back" href="/">控制台</a>
  <h1>🐎 生物预览</h1>
  <div class="spacer"></div>
  <span id="imp" title="本页生物概念图出图用的图像渠道/模型,与全局「生成模型」设置分开;空=跟随全局"></span>
  <input type="hidden" id="project">
  <select id="pvnav" title="切换预览页"></select>
  <button id="reload">刷新</button>
</header>
<main>
  <div id="list">
    <input id="search" placeholder="搜索生物…">
    <div id="items"></div>
  </div>
  <div id="detail"><div class="empty">加载中…</div></div>
</main>
<div id="lightbox"><img alt=""></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA=[], CUR=null, FOLDER=null;
// 深链定位:分镜预览页参考图标签跳转 ?id=<CRE-ID>,首次加载直接选中该生物
let JUMP_ID=new URLSearchParams(location.search).get('id');
// 把当前项目+选中条目写回地址栏(?project=&id=),刷新/分享后仍停在同一条目
function syncUrl(){
  const proj=$('#project').value.trim()||'demo';
  const id=CUR||JUMP_ID;
  history.replaceState(null,'','?project='+encodeURIComponent(proj)+(id?'&id='+encodeURIComponent(id):''));
}
const NOISE=new Set(['$schema_version','schema_version','file','owner_agent','task_id','project','source_inputs','write_via','agent','oid','id','name','is_plot_prop','key_prop','concept_ref','dictionary_term']);
// 详情卡分区标签:坐骑卡(mount.json)与生物卡(creature.json)字段并集;未知键原样显示
const SEC_NAMES={anatomy:'解剖结构',locomotion:'运动方式',ownership:'归属',tack:'鞍具装备',performance:'载具性能',
  endurance_state_log:'状态日志',maintenance:'保养维护',rampage_behavior:'狂暴行为',screen_usage:'镜头用途',
  visual_identifiers:'视觉识别特征',forms:'形态阶段',habits:'习性',combat:'战力',appearances:'出场',
  category:'类别',creature_ref:'生物引用',tech_ref:'技术引用',dictionary_ref:'词典引用',source:'原文出处',also_seen:'其他出处',
  one_line:'一句话概述',type:'类型',is_artificial:'是否造物',detail_file:'详情文件',chapters:'出场章节',inferred:'推断',reason:'推断依据'};
// 元数据(index.json 条目)里已在标题/摘要行展示过的键,不再重复渲染
const META_SHOWN=new Set(['id','name','type','one_line','chapters','tech_ref','dictionary_ref','detail_file']);

function jrender(v){
  if(v===null||v===undefined||v==='')return '<span style="color:var(--dim)">—</span>';
  if(Array.isArray(v)){
    if(!v.length)return '<span style="color:var(--dim)">(空)</span>';
    if(v.every(x=>typeof x!=='object'||x===null))return esc(v.join('、'));
    return '<ul class="arr">'+v.map(x=>'<li>'+jrender(x)+'</li>').join('')+'</ul>';
  }
  if(typeof v==='object'){
    const ks=Object.keys(v).filter(k=>!NOISE.has(k));
    if(!ks.length)return '<span style="color:var(--dim)">(空)</span>';
    return '<dl class="kv">'+ks.map(k=>`<dt>${esc(k)}</dt><dd>${jrender(v[k])}</dd>`).join('')+'</dl>';
  }
  return esc(String(v));
}

const ctype=p=>p.type||(p.meta&&p.meta.type)||'';

// 按集过滤(ep-filter.js):搜索框前的分集下拉,选集后只留该集出现的条目
const epOk=x=>x.narrator||EpFilter.match(x.id);
function renderList(){
  const q=$('#search').value.trim().toLowerCase();
  const box=$('#items');box.innerHTML='';
  DATA.filter(epOk).filter(p=>!q||p.id.toLowerCase().includes(q)||(p.name||'').toLowerCase().includes(q)
      ||ctype(p).toLowerCase().includes(q))
    .forEach(p=>{
      const d=document.createElement('div');
      d.className='item'+(CUR===p.id?' active':'');
      d.innerHTML=`<div class="row1"><span class="nm">${esc(p.name)}</span>`
        +(ctype(p)?`<span class="badge" title="${esc(ctype(p))}">${esc(ctype(p))}</span>`:'')
        +(p.images.length?`<span class="badge pic" title="${esc(I18N.f('图{n}',{n:p.images.length}))}">🖼${p.images.length}</span>`:'')
        +`</div><span class="id">${esc(p.id)}</span>`;
      d.onclick=()=>{CUR=p.id;FOLDER=null;syncUrl();renderList();renderDetail(p)};
      box.appendChild(d);
    });
  if(!box.children.length)box.innerHTML='<div class="empty">没有匹配的生物</div>';
}

const joinRefs=v=>Array.isArray(v)?v.join(','):(v||'');

function renderDetail(p){
  const box=$('#detail');
  const m=p.meta||{}, c=p.card||{};
  const cardSrc=p.card_source||m.detail_file||'bible/creatures/creature.json';
  let h=`<h2 class="title">${esc(p.name)}<span class="id">${esc(p.id)}</span>`
    +(ctype(p)?`<span class="badge">${esc(ctype(p))}</span>`:'')
    +(m.is_artificial?`<span class="badge key">造物</span>`:'')
    +`<button class="editbtn" data-kind="creature" data-id="${esc(p.id)}" data-loc="${esc(I18N.f('生物 {name}({id};登记 bible/creatures/index.json,详情卡 {src})',{name:p.name,id:p.id,src:cardSrc}))}" title="对这个生物的设定提修改意见,发给修改师处理">✏️ 修改</button></h2>`;
  const ml=[];
  if(m.chapters&&m.chapters.length)ml.push(t('出场章节:')+joinRefs(m.chapters));
  if(m.tech_ref&&(!Array.isArray(m.tech_ref)||m.tech_ref.length))ml.push(t('技术引用:')+joinRefs(m.tech_ref));
  if(m.dictionary_ref)ml.push(t('词典引用:')+joinRefs(m.dictionary_ref));
  if(ml.length)h+=`<div class="meta-line">${esc(ml.join('  ·  '))}</div>`;
  if(m.one_line)h+=`<div class="notes">${esc(m.one_line)}</div>`;
  // 图库分组:生物目录根下的图直接展示;candidates/ 等子目录收成文件夹卡片,点击进入
  const rootImgs=[],folders={};
  p.images.forEach(im=>{
    const i=im.name.indexOf('/');
    if(i>0){const d=im.name.slice(0,i);(folders[d]=folders[d]||[]).push(im)}
    else rootImgs.push(im);
  });
  if(FOLDER&&!folders[FOLDER])FOLDER=null;
  const fig=(im,strip)=>{
    const nm=strip?im.name.slice(strip.length+1):im.name;
    return `<figure><img src="${esc(bust(im.url))}" loading="lazy" onclick="zoom(this.src)"><figcaption title="${esc(nm)}"><span class="fn">${esc(nm)}</span><button class="editbtn" data-url="${esc(im.url)}" title="对这张图提修改意见,发给修改师处理">✏️ 修改</button></figcaption></figure>`;
  };
  if(FOLDER){
    const ims=folders[FOLDER];
    h+=`<div class="foldbar"><button onclick="closeFolder()">${t('← 返回')}</button><span class="fname">📁 ${esc(FOLDER)}</span><span class="fcnt">${esc(I18N.f('{n} 张',{n:ims.length}))}</span></div>`;
    h+='<div class="gallery">'+ims.map(im=>fig(im,FOLDER)).join('')+'</div>';
  }else if(p.images.length){
    h+='<div class="gallery">'+rootImgs.map(im=>fig(im)).join('')
      +Object.keys(folders).sort().map(d=>{
        const ims=folders[d];
        return `<figure class="folder" data-d="${esc(d)}" onclick="openFolder(this.dataset.d)" title="${esc(d)}">`
          +`<div class="fthumb"><img src="${esc(bust(ims[0].url))}" loading="lazy"><div class="fmask">📁</div></div>`
          +`<figcaption><span class="fn">📁 ${esc(d)}</span><span class="fcnt">${esc(I18N.f('{n} 张',{n:ims.length}))}</span></figcaption></figure>`;
      }).join('')+'</div>';
  }else{
    h+='<div class="meta-line">(暂无概念图)</div>';
  }
  // 详情卡分区(mount.json / creature.json 条目):已知键按 SEC_NAMES 顺序在前,其余键按出现顺序在后
  const doc=(k,v,closed)=>`<div class="doc${closed?' closed':''}"><h3 onclick="this.parentNode.classList.toggle('closed')">${esc(SEC_NAMES[k]||k)} <span style="color:var(--dim);font-weight:400">${esc(k)}</span></h3><div class="body">${jrender(v)}</div></div>`;
  const has=(o,k)=>o[k]!==undefined&&o[k]!==null&&o[k]!==''&&!NOISE.has(k);
  const order=Object.keys(SEC_NAMES);
  const cardKeys=Object.keys(c).filter(k=>has(c,k)&&k!=='creature_ref');
  cardKeys.sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?999:ia)-(ib<0?999:ib)});
  const CLOSED=new Set(['source','also_seen','endurance_state_log','maintenance','screen_usage']);
  if(cardKeys.length){
    h+=`<div class="meta-line">${esc(t('详情卡:')+cardSrc)}${c.id&&c.id!==p.id?esc(' · '+c.id):''}</div>`;
    h+=cardKeys.map(k=>doc(k,c[k],CLOSED.has(k))).join('');
  }else{
    h+=`<div class="meta-line">${esc(I18N.f('({src} 中暂无该生物的详情卡)',{src:cardSrc}))}</div>`;
  }
  const metaKeys=Object.keys(m).filter(k=>has(m,k)&&!META_SHOWN.has(k)&&k!=='_meta');
  if(metaKeys.length)h+=doc('index_entry',Object.fromEntries(metaKeys.map(k=>[k,m[k]])),true)
    .replace('>index_entry <','>'+esc(t('登记信息'))+' <');
  box.innerHTML=h;box.scrollTop=0;
}

// 图片 URL 加版本参数,避免文件覆写后浏览器仍用旧缓存;服务端已带 ?v= 时原样保留
const LOAD_T=Date.now();
const bust=u=>u.includes('?')?u:u+'?v='+LOAD_T;

function openFolder(name){FOLDER=name;const p=DATA.find(x=>x.id===CUR);if(p)renderDetail(p)}
function closeFolder(){openFolder(null)}

function zoom(src){$('#lightbox img').src=src;$('#lightbox').style.display='flex'}
$('#lightbox').onclick=()=>$('#lightbox').style.display='none';

// ✏️ 修改:在本页右下角弹出编辑浮窗(edit-popup.js),把修改对象预填进输入框,写完直接发给目标 Agent。
// data-url=具体媒体文件路径;data-loc=结构化位置元数据(设定卡等无单一文件的对象)
document.addEventListener('click',e=>{
  const b=e.target.closest('.editbtn');
  if(!b||(!b.dataset.url&&!b.dataset.loc))return;
  const proj=$('#project').value.trim()||'demo';
  const subject=b.dataset.loc
    ||decodeURIComponent(b.dataset.url.split('?')[0].replace(/^\/api\/v1\/projects\/([^/]+)\/artifacts\//,'data/projects/$1/').replace(/^\/projects\//,'data/projects/'));
  const target={kind:b.dataset.kind||'creature',id:b.dataset.id||'',ep:b.dataset.ep||((subject.match(/\bep\d{2,}\b/)||[''])[0]),files:b.dataset.url?[subject]:[],label:subject};   // 结构化定位→修改师(服务端拼修改单头、附代行工位 SOUL)
  EditPopup.open({project:proj,compose:t('修改 ')+subject+'\n'+t('修改意见:'),agent:b.dataset.agent||'',target});   // data-agent=直发指定 Agent(默认修改师)
});

async function load(){
  const proj=$('#project').value.trim()||'demo';
  syncUrl();   // 先写项目名(id 沿用当前选中/深链),加载完成后再按实际命中的条目重写
  $('#detail').innerHTML='<div class="empty">加载中…</div>';
  try{
    const r=await fetch('/api/v1/projects/'+encodeURIComponent(proj)+'/previews/creatures');
    if(!r.ok)throw new Error((await r.json()).detail||r.status);
    DATA=((await r.json()).creatures||[]).map(p=>({...p,meta:p.meta||{},card:p.card||{},images:p.images||[]}));
  }catch(e){$('#items').innerHTML='';$('#detail').innerHTML=`<div class="empty">加载失败:${esc(e.message)}</div>`;return}
  // 有概念图在前,其次有详情卡,再按 id
  DATA.sort((a,b)=>((b.images.length?2:0)+(Object.keys(b.card).length?1:0))
    -((a.images.length?2:0)+(Object.keys(a.card).length?1:0))
    ||a.id.localeCompare(b.id));
  await EpFilter.load(proj);
  // 优先级:首次深链 id > 页内刷新前已选中的条目 > 列表第一项(切项目时旧 id 找不到自然回落)
  const keep=JUMP_ID||CUR;
  JUMP_ID=null;   // 只在首次加载生效
  const kept=keep?DATA.find(x=>x.id===keep):null;
  CUR=kept?kept.id:((DATA.find(epOk)||DATA[0]||{}).id||null);
  syncUrl();
  renderList();
  const cur=DATA.find(x=>x.id===CUR);
  if(cur){
    renderDetail(cur);
    const a=$('#items .item.active');
    if(a)a.scrollIntoView({block:'center'});
  }else $('#detail').innerHTML='<div class="empty">该项目还没有生物设定</div>';
}
$('#reload').onclick=load;
mountImageModelPicker({kind:'creatures',host:'#imp',label:'🎨 图像模型'});
EpFilter.mount({kind:'creatures',onChange:renderList});
$('#search').oninput=renderList;
$('#project').value=new URLSearchParams(location.search).get('project')
  ||(JSON.parse(localStorage.getItem('webui_prefs')||'{}').project)||'demo';
load();

// 右上角预览页切换下拉(项目值走 URL/localStorage,由隐藏 #project 承载)
const PV_PAGES=[['/preview/refs','\u{1F5BC} 参考文件'],['/preview/workflow','\u{1F9ED} 工作流预览'],['/preview/worldview','\u{1F30D} 世界观预览'],['/preview/scenes','\u{1F3D4} 场景预览'],['/preview/characters','\u{1F464} 人物预览'],['/preview/creatures','\u{1F40E} 生物预览'],['/preview/props','\u{1F5E1} 道具预览'],['/preview/script','\u{1F4DC} 剧本预览'],['/preview/board','\u{1F4CB} 故事板'],['/preview/storyboard','\u{1F3A6} 分镜预览'],['/preview/director','\u{1F4FA} 导演台'],['/preview/post','\u{1F39A}\uFE0F 后期处理'],['/preview/videos','\u{1F39E}\uFE0F 成片发布']];
PV_PAGES.forEach(([u,n])=>{const o=document.createElement('option');o.value=u;o.textContent=n;if(location.pathname===u)o.selected=true;$('#pvnav').appendChild(o)});
$('#pvnav').onchange=()=>{const p=($('#project').value||'').trim()||'demo';location.href=$('#pvnav').value+'?project='+encodeURIComponent(p)};
</script>
