<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>缺陷单 · Agentics：VideoAgents</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Crect%20x%3D%274%27%20y%3D%273%27%20width%3D%2716%27%20height%3D%2718%27%20rx%3D%273%27%20fill%3D%27%236c9ef8%27%2F%3E%3Cpath%20d%3D%27M8%208h8M8%2012h8M8%2016h5%27%20stroke%3D%27%230f1117%27%20stroke-width%3D%271.8%27%20stroke-linecap%3D%27round%27%2F%3E%3C%2Fsvg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/static/i18n/i18n.js"></script>
<script>
/* 兜底:i18n 运行时未加载(如服务端未挂 /static)时保持中文界面可用 */
if(!window.I18N){
  window.I18N={lang:'zh',langs:{zh:'中文'},t:function(s){return s},
    f:function(s,p){p=p||{};return String(s).replace(/\{(\w+)\}/g,function(m,k){return k in p?p[k]:m})},
    setLang:function(){return Promise.resolve()}};
  window.t=function(s){return s};window.I18N_DICT={};
}
</script>
<script src="/static/edit-popup.js?v=20260911-reviser"></script>
<style>
:root{
  --bg:#0f1117; --panel:#161a23; --panel2:#1c2130; --border:#2a3040;
  --text:#dde3ee; --dim:#8b93a7; --accent:#6c9ef8; --link:#fb923c; --green:#4ade80;
  --red:#f87171; --yellow:#fbbf24; --purple:#c084fc;
}
*{box-sizing:border-box;margin:0;padding:0}
a{color:var(--link)}
body{background:var(--bg);color:var(--text);font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
header h1{font-size:15px;font-weight:600}
header h1 .proj{color:var(--accent);font-weight:600}
header a.back{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:3px 10px;line-height:1.4}
header a.back:hover{color:var(--accent);border-color:var(--accent)}
header .spacer{flex:1}
button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}
select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;cursor:pointer}
select:hover{border-color:var(--accent)}
#content{flex:1;overflow-y:auto;padding:20px 26px 300px}   /* 底部留白:末几行能滚到右下角浮窗上方 */
.empty{color:var(--dim);text-align:center;margin-top:60px}
h3.sec{font-size:15px;margin:0 0 10px;border-left:3px solid var(--accent);padding-left:10px;display:flex;align-items:baseline;gap:10px}
h3.sec .n{color:var(--dim);font-size:12px;font-weight:400}
.none{color:var(--dim);font-size:13px;margin:6px 0 0 13px}
.dfbar{display:flex;align-items:center;gap:14px;margin:2px 0 10px 13px;color:var(--dim);font-size:12.5px;flex-wrap:wrap}
.dfbar label{display:flex;align-items:center;gap:5px;cursor:pointer}
/* table-layout:fixed + 列宽百分比:表格恒为容器 100% 宽,长内容截断省略(悬停 title 看全文) */
table.df{width:100%;max-width:100%;table-layout:fixed;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:12.5px}
table.df th{background:var(--panel2);color:var(--dim);font-weight:600;text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.df td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:top;overflow:hidden;word-break:break-word}
table.df tr.row{cursor:pointer}
table.df tr.row:hover td{background:var(--panel2)}
table.df td.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.df td.id{font-weight:600;color:var(--accent)}
table.df td.art{color:var(--dim)}
table.df td.act{text-align:right;white-space:nowrap}
table.df td.act button{padding:2px 10px;font-size:12px}
table.df td.act button:hover{background:var(--accent);border-color:var(--accent);color:#0b1020}
.sev{font-size:11px;border:1px solid var(--border);border-radius:4px;padding:0 6px;white-space:nowrap}
.sev.critical,.sev.blocker{color:var(--red);border-color:var(--red)}
.sev.major{color:var(--yellow);border-color:var(--yellow)}
.sev.minor{color:var(--dim)}
.st{font-size:11px;border-radius:4px;padding:0 6px;white-space:nowrap;border:1px solid var(--border);color:var(--dim)}
.st.open,.st.new{color:var(--red);border-color:var(--red)}
.st.fixed,.st.resolved,.st.closed,.st.verified{color:var(--green);border-color:var(--green)}
.st.waived,.st.deferred{color:var(--yellow);border-color:var(--yellow)}
tr.detail td{background:var(--bg);padding:10px 14px}
tr.detail .kv{margin:4px 0;font-size:12.5px}
tr.detail .kv b{color:var(--dim);font-weight:600;margin-right:6px}
tr.detail pre{white-space:pre-wrap;word-break:break-word;font:12px/1.7 inherit;color:#c8d0e0;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-top:4px;max-height:300px;overflow-y:auto}
</style>
</head>
<body>
<header>
  <a class="back" href="/" onclick="if(history.length>1){history.back();return false}" title="后退">&lt;</a>
  <a class="back" href="/">控制台</a>
  <h1>🧾 缺陷单 — <span class="proj" id="proj-name" data-no-i18n></span></h1>
  <div class="spacer"></div>
  <button id="reload">刷新</button>
</header>
<div id="content"><div class="empty">加载中…</div></div>
<script>
/* 缺陷单页(项目设置 → 缺陷单,2026-09-19):全项目 qa/defects/ 审核工单,原在「成片发布」页底部。
 * 每行「处理」= 右下角浮窗(/static/edit-popup.js,dispatcher:true)预填工单定位发给总制片,
 * 由总制片按 SOUL「缺陷单路由」回派责任 Agent。 */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CLOSED=['fixed','resolved','closed','verified','waived'];
const _q=new URLSearchParams(location.search);
const PROJ=_q.get('project')||(JSON.parse(localStorage.getItem('webui_prefs')||'{}').project)||'demo';
// 过滤:SCOPE = ''(全部)| epNN | 'generic'(未标注集数);OPEN_ONLY = 只看未关闭
let SCOPE=_q.get('ep')||'',OPEN_ONLY=false,LAST=null,SHOWN=[];
$('#proj-name').textContent=PROJ;

function sevTag(s){s=String(s||'').toLowerCase();return s?`<span class="sev ${esc(s)}">${esc(s)}</span>`:''}
function stTag(s){s=String(s||'').toLowerCase();return s?`<span class="st ${esc(s)}">${esc(s)}</span>`:'<span class="st">—</span>'}

function defectRows(list){
  return list.map((d,i)=>{
    const desc=d.violated||d.impact||'';
    const kv=(k,v)=>v?`<div class="kv"><b>${k}</b>${esc(typeof v==='object'?JSON.stringify(v,null,1):v)}</div>`:'';
    const detail=kv('违反约定',d.violated)+kv('证据',d.evidence)+kv('影响',d.impact)
      +kv('修复建议',d.recommended_fix)+kv('指派',d.assigned_to)+kv('处理结果',d.resolution)
      +kv('豁免 waiver',d.waiver)+kv('工单文件',d.file)
      +(d.detail_text?`<pre>${esc(d.detail_text)}</pre>`:'');
    return `<tr class="row" data-i="${i}">
      <td class="ell id" title="${esc(d.defect_id)}">${esc(d.defect_id)}</td>
      <td>${sevTag(d.severity)}${d.blocking?' <span class="sev blocker">blocking</span>':''}</td>
      <td class="ell" title="${esc(d.type||'')}">${esc(d.type||'')}</td>
      <td>${stTag(d.status)}</td>
      <td class="ell art" title="${esc(d.artifact||'')}">${esc(d.artifact||'')}</td>
      <td class="ell" title="${esc(d.found_by||'')}">${esc(d.found_by||'')}</td>
      <td class="ell">${esc(String(d.date||'').slice(0,10))}</td>
      <td class="ell" title="${esc(desc)}">${esc(desc)}</td>
      <td class="act"><button type="button" class="handle" data-i="${i}" title="右下角弹出消息窗,把这张缺陷单发给总制片处理">处理</button></td>
    </tr>
    <tr class="detail" data-for="${i}" style="display:none"><td colspan="9">${detail||'<span style="color:var(--dim)">无详情</span>'}</td></tr>`;
  }).join('');
}

// 发给总制片的预填消息:正文给 Agent 读,固定中文不走界面语言
function composeFor(d){
  const one=v=>v==null||v===''?'':(typeof v==='object'?JSON.stringify(v):String(v));
  const head=[['严重度',one(d.severity)+(d.blocking?'(blocking)':'')],['状态',one(d.status)],['类型',one(d.type)],['指派',one(d.assigned_to)]]
    .filter(x=>x[1]).map(x=>x[0]+':'+x[1]).join(' · ');
  const lines=['处理缺陷单 '+d.defect_id+(d.file?'('+d.file+')':'')];
  if(head)lines.push(head);
  if(d.artifact)lines.push('对象:'+one(d.artifact));
  const desc=one(d.violated||d.impact);
  if(desc)lines.push('问题:'+(desc.length>300?desc.slice(0,300)+'…':desc));
  lines.push('请按缺陷单路由规则回派责任 Agent 修复,修复后回填工单 status / resolution。','补充要求:');
  return lines.join('\n');
}

function render(d){
  LAST=d;
  const all=d.defects||[],eps=d.episodes||[];
  const isOpen=x=>!CLOSED.includes(String(x.status||'').toLowerCase());
  if(SCOPE&&SCOPE!=='generic'&&!eps.some(e=>e.ep===SCOPE))SCOPE='';
  SHOWN=all.filter(x=>SCOPE===''?true:SCOPE==='generic'?!(x.eps||[]).length:(x.eps||[]).includes(SCOPE))
    .filter(x=>!OPEN_ONLY||isOpen(x));
  let h=`<h3 class="sec">🧾 审核问题反馈<span class="n">${esc(I18N.f('qa/defects/ · 显示 {a}/{b} 条,点击行展开详情',{a:SHOWN.length,b:all.length}))}</span></h3>`;
  h+=`<div class="dfbar"><select id="scope" title="按分集过滤">
      <option value="">${esc(t('全部分集'))}</option>
      ${eps.map(e=>`<option value="${esc(e.ep)}"${e.ep===SCOPE?' selected':''} data-no-i18n>${esc(e.ep)}${e.title?' '+esc(e.title):''}</option>`).join('')}
      <option value="generic"${SCOPE==='generic'?' selected':''}>${esc(t('未标注集数的通用工单'))}</option></select>
    <label><input type="checkbox" id="openonly" ${OPEN_ONLY?'checked':''}>只看未关闭</label>
    <span>${esc(I18N.f('未关闭 {n} 条',{n:all.filter(isOpen).length}))}</span></div>`;
  h+=SHOWN.length?`<table class="df">
    <colgroup><col style="width:14%"><col style="width:7%"><col style="width:9%"><col style="width:6%"><col style="width:17%"><col style="width:10%"><col style="width:7%"><col style="width:24%"><col style="width:6%"></colgroup>
    <thead><tr>
      <th>缺陷ID</th><th>严重度</th><th>类型</th><th>状态</th><th>对象 artifact</th><th>提出方</th><th>日期</th><th>问题描述</th><th></th>
    </tr></thead><tbody>${defectRows(SHOWN)}</tbody></table>`
    :'<div class="none">没有匹配的审核工单</div>';
  const box=$('#content'),top=box.scrollTop;
  box.innerHTML=h;box.scrollTop=top;
  $('#scope').onchange=()=>{SCOPE=$('#scope').value;syncUrl();render(LAST)};
  $('#openonly').onchange=()=>{OPEN_ONLY=$('#openonly').checked;render(LAST)};
  document.querySelectorAll('tr.row').forEach(tr=>tr.onclick=()=>{
    const dt=document.querySelector(`tr.detail[data-for="${tr.dataset.i}"]`);
    if(dt)dt.style.display=dt.style.display==='none'?'':'none';
  });
  document.querySelectorAll('button.handle').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const x=SHOWN[+b.dataset.i];if(!x)return;
    EditPopup.open({project:PROJ,dispatcher:true,compose:composeFor(x)});
  });
}

function syncUrl(){
  history.replaceState(null,'','?project='+encodeURIComponent(PROJ)+(SCOPE?'&ep='+encodeURIComponent(SCOPE):''));
}
async function load(){
  syncUrl();
  if(!LAST)$('#content').innerHTML='<div class="empty">加载中…</div>';
  try{
    const r=await fetch('/api/v1/projects/'+encodeURIComponent(PROJ)+'/previews/defects');
    if(!r.ok)throw new Error((await r.json()).detail||r.status);
    render(await r.json());
  }catch(e){$('#content').innerHTML=`<div class="empty">加载失败:${esc(e.message)}</div>`}
}
$('#reload').onclick=load;
load();
</script>
</body>
</html>
