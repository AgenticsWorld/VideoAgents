*{box-sizing:border-box;margin:0;padding:0}
a{color:var(--link)}
body{background:var(--bg);color:var(--text);font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* 汇总条 */

/* 状态着色 */

.s-dispatched{border-left:4px solid var(--cyan)}

.s-failed{border-left:4px solid var(--red);border-color:var(--red)}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(108,158,248,.45)}50%{box-shadow:0 0 0 7px rgba(108,158,248,0)}}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA=null, UNITS=new Map(), SEL=null, TIMER=null;

const PHASE_NAMES={p0:'摄入与立项',p1:'剧情理解',p2:'世界圣经',p3:'角色与资产',p4:'美术风格',
  p5:'剧本改编',p6:'导演分镜',p7:'视觉生成',p8:'音频',p9:'剪辑合成',p10:'终审',p11:'发布',extra:'加派任务'};
const DONE=new Set(['done','passed','passed_human_override']);
const SKIP=new Set(['skipped','cancelled','waived']);
const STRUCT=new Set(['expanded','template']);   // 结构节点:已扇出的模板,本身不执行

const SCOLOR={done:'var(--green)',running:'var(--accent)',dispatched:'var(--cyan)',
  pending:'#4b5265',failed:'var(--red)',blocked:'var(--orange)',skipped:'#3a4152',
  partial:'var(--yellow)',template:'var(--purple)',waitsign:'var(--yellow)'};
const SLABEL={done:'已通过',running:'执行中',dispatched:'已派单',pending:'待执行',
  failed:'失败',blocked:'受阻',skipped:'跳过/取消',partial:'部分完成',
  template:'待扇出模板',waitsign:'等待签字'};

function fmtDur(s){
  if(s==null)return '';
  s=Math.round(s);
  if(s<60)return s+'s';
  if(s<3600)return Math.floor(s/60)+'m'+(s%60?String(s%60).padStart(2,'0')+'s':'');
  return (s/3600).toFixed(1)+'h';
}
const fmtM=v=>v==null?'—':(v/1e6).toFixed(4)+'M';               // token 数按百万(M)为单位,保留 4 位小数

/* 单节点显示状态(叠加"等待签字"派生态:human 节点依赖全通过但未签) */
function nodeState(n,doneSet){
  if(DONE.has(n.state))return 'done';
  if(SKIP.has(n.state))return 'skipped';
  if(STRUCT.has(n.state))return 'template';
  if(n.state==='running')return 'running';
  if(n.state==='dispatched')return 'dispatched';
  if(n.state==='failed')return 'failed';
  if(n.human&&(n.depends_on||[]).every(d=>doneSet.has(d)))return 'waitsign';
  if(n.state==='blocked')return 'blocked';
  return 'pending';
}

/* 把节点按 family 聚合成渲染单元 */
let FAMBYID=new Map();
function buildUnits(){
  UNITS=new Map();
  FAMBYID=new Map(DATA.nodes.map(n=>[n.id,n.family]));
  const doneSet=new Set(DATA.nodes.filter(n=>DONE.has(n.state)).map(n=>n.id));
  for(const n of DATA.nodes){
    n._st=nodeState(n,doneSet);
    let u=UNITS.get(n.family);
    if(!u){u={key:n.family,members:[],phase:n.phase};UNITS.set(n.family,u)}
    u.members.push(n);
  }
  for(const u of UNITS.values()){
    const base=u.members.find(m=>m.id===u.key);
    u.base=base||null;
    u.exec=u.members.filter(m=>!STRUCT.has(m.state));       // 实际执行的成员
    u.phase=(base||u.members[0]).phase;
    u.gate=u.members.some(m=>m.gate);
    u.human=u.members.some(m=>m.human);
    u.checkpoint=(u.members.find(m=>m.checkpoint)||{}).checkpoint||'';
    u.agent=(u.members.find(m=>m.agent)||{}).agent||'';
    // 单元级依赖(映射到 family,去掉指向自身的)
    const dep=new Set();
    u.members.forEach(m=>(m.depends_on||[]).forEach(d=>{
      const f=(FAMBYID.get(d)||d);if(f!==u.key)dep.add(f)}));
    u.deps=[...dep];
    // 聚合状态
    const st=u.exec.map(m=>m._st);
    const has=x=>st.includes(x);
    u.state=!st.length?'template'
      :has('running')?'running':has('failed')?'failed':has('waitsign')?'waitsign'
      :has('dispatched')?'dispatched':has('blocked')?'blocked'
      :st.every(x=>x==='done'||x==='skipped')?(st.some(x=>x==='done')?'done':'skipped')
      :has('done')?'partial':'pending';
    // 时间:实际 Σ + 剩余估 Σ
    u.actDur=u.exec.reduce((a,m)=>a+(m.duration_s||0),0);
    u.estDur=u.exec.reduce((a,m)=>a+(m.est_duration_s||0),0);
    u.doneCnt=st.filter(x=>x==='done'||x==='skipped').length;
  }
}

/* 阶段内拓扑分层:同层=可并行,层与层=串行 */
function levelize(units){
  const byKey=new Map(units.map(u=>[u.key,u]));
  const lvl=new Map();
  const visit=(u,stack)=>{
    if(lvl.has(u.key))return lvl.get(u.key);
    if(stack.has(u.key))return 0;
    stack.add(u.key);
    let d=0;
    for(const dep of u.deps){
      const du=byKey.get(dep);
      if(du)d=Math.max(d,visit(du,stack)+1);   // 只按同阶段依赖分层
    }
    stack.delete(u.key);
    lvl.set(u.key,d);
    return d;
  };
  units.forEach(u=>visit(u,new Set()));
  const rows=[];
  for(const u of units){
    const d=lvl.get(u.key);
    (rows[d]=rows[d]||[]).push(u);
  }
  return rows.filter(r=>r&&r.length);
}

function chipHtml(u){
  const n=u.exec.length;
  const multi=n>1;
  const badges=(u.gate?`<span class="badge gate" title="${esc(t('闸门:全部依赖通过才放行'))}">${t('闸门')}</span>`:'')
    +(u.human?`<span class="badge human" title="${esc(u.checkpoint||t('需用户签字'))}">✍️ ${t('签字')}</span>`:'')
    +(multi?`<span class="badge cnt" title="${esc(t('扇出实例数'))}">×${n}</span>`:'');
  let mini='';
  if(multi){
    const seg=(cnt,color)=>cnt?`<i style="width:${cnt/n*100}%;background:${color}"></i>`:'';
    const c={};u.exec.forEach(m=>c[m._st]=(c[m._st]||0)+1);
    mini=`<div class="mini">${seg(c.done,'var(--green)')}${seg(c.skipped,'#3a4152')}${seg((c.running||0)+(c.dispatched||0),'var(--accent)')}${seg(c.failed,'var(--red)')}${seg(c.blocked,'var(--orange)')}${seg(c.waitsign,'var(--yellow)')}</div>`;
  }
  const tc=[];
  if(u.actDur)tc.push(`<span title="${esc(t('已发生的实际耗时'))}">✔ ${fmtDur(u.actDur)}</span>`);
  if(u.estDur)tc.push(`<span title="${esc(t('剩余部分按历史均值预估'))}">≈ ${fmtDur(u.estDur)}</span>`);
  const ag=u.agent?`<div class="ag" title="${esc(u.agent)}">${esc(u.agent.split('/').pop())}</div>`:'';
  const prog=multi?` <span style="color:var(--dim);font-weight:400">${u.doneCnt}/${n}</span>`:'';
  return `<div class="nodechip s-${u.state}${SEL===u.key?' sel':''}" data-key="${esc(u.key)}" title="${esc(SLABEL[u.state]?t(SLABEL[u.state]):u.state)}">
    <div class="nm"><span class="dot" style="background:${SCOLOR[u.state]}"></span><span class="tid">${esc(u.key)}</span>${prog}${badges}</div>
    ${ag}${mini}<div class="tc">${tc.join('')}</div></div>`;
}

function render(){
  buildUnits();
  // 阶段排序:pN 按数字,extra 最后
  const phases=new Map();
  for(const u of UNITS.values()){
    if(!phases.has(u.phase))phases.set(u.phase,[]);
    phases.get(u.phase).push(u);
  }
  const order=[...phases.keys()].sort((a,b)=>{
    const na=/^p(\d+)$/.exec(a),nb=/^p(\d+)$/.exec(b);
    if(na&&nb)return +na[1]-+nb[1];
    if(na)return -1;if(nb)return 1;return a.localeCompare(b);
  });
  const closed=new Set([...document.querySelectorAll('.phase.closed')].map(x=>x.dataset.ph));
  const first=!document.querySelector('.phase');
  let h='';
  for(const ph of order){
    const units=phases.get(ph);
    const exec=units.flatMap(u=>u.exec);
    const done=exec.filter(m=>m._st==='done'||m._st==='skipped').length;
    const allDone=exec.length>0&&done===exec.length;
    const estD=units.reduce((a,u)=>a+u.estDur,0);
    const actD=units.reduce((a,u)=>a+u.actDur,0);
    // 首次渲染:全部完成的阶段默认折叠;之后保持用户的开合选择
    const isClosed=first?allDone:closed.has(ph);
    const est=[actD?`✔ ${fmtDur(actD)}`:'',
               estD?`≈ ${t('剩余')} ${fmtDur(estD)}`:''].filter(Boolean).join(' · ');
    const rows=levelize(units);
    h+=`<div class="phase${isClosed?' closed':''}" data-ph="${esc(ph)}">
      <h3 onclick="this.parentNode.classList.toggle('closed');drawEdges()">
        <span class="pid">${esc(ph)}</span> ${esc(t(PHASE_NAMES[ph]||''))}
        <span class="prog">${done}/${exec.length}</span><span class="est">${esc(est)}</span></h3>
      <div class="ph-body">${rows.map(r=>`<div class="lvl">${r.map(chipHtml).join('')}</div>`).join('')}</div></div>`;
  }
  $('#legend').innerHTML=['done','running','dispatched','waitsign','pending','partial','failed','blocked','skipped','template']
    .map(s=>`<span><span class="dot" style="background:${SCOLOR[s]}"></span>${t(SLABEL[s])}</span>`).join('')
    +`<span>✍️=${t('需签字')} · ✔=${t('实际')} · ≈=${t('预估')}</span>`;
  $('#canvas').innerHTML=`<svg id="edges"></svg>`+h
    +(order.length?'':`<div class="empty">${t('该项目还没有 runs/dag.json(尚未立项)')}</div>`);
  renderSummary();
  requestAnimationFrame(drawEdges);
}

function renderSummary(){
  const s=DATA.summary;
  if(!s){$('#summary').innerHTML='';return}
  const exec=[...UNITS.values()].flatMap(u=>u.exec);
  const cnt=st=>exec.filter(m=>m._st===st).length;
  const done=cnt('done')+cnt('skipped'), total=exec.length;
  const running=cnt('running')+cnt('dispatched'), failed=cnt('failed'), blocked=cnt('blocked');
  const signs=exec.filter(m=>m._st==='waitsign');
  const pct=total?Math.round(done/total*100):0;
  $('#summary').innerHTML=
    `<span class="bar" title="${done}/${total}"><i style="width:${pct}%"></i></span>`
    +`<span class="st"><b>${pct}%</b> (${done}/${total})</span>`
    +(running?`<span class="st" style="color:var(--accent)">▶ <b>${running}</b> ${t('执行中')}</span>`:'')
    +(failed?`<span class="st" style="color:var(--red)">✖ <b>${failed}</b> ${t('失败')}</span>`:'')
    +(blocked?`<span class="st" style="color:var(--orange)">⛔ <b>${blocked}</b> ${t('受阻')}</span>`:'')
    +signs.map(m=>`<span class="sig" data-key="${esc(m.family)}" title="${esc(m.id)}">✍️ ${esc(m.checkpoint||m.id)}</span>`).join('')
    +`<span class="st">${t('已花费:')}<b>${fmtDur(s.spent_duration_s)||'—'}</b></span>`
    +`<span class="st" title="${esc(t('按历史均值预估'))}">${t('剩余预估:')}<b>${fmtDur(s.remaining_est_duration_s)||'—'}</b> (${s.remaining_count} ${t('个任务')})</span>`
    +`<span class="st" title="${esc(t('剩余任务沿依赖链的最长估时(并行推进下的理论最短完成时间)'))}">${t('关键路径:')}<b>${fmtDur(s.critical_path_s)||'—'}</b></span>`
    +`<span class="st" title="${esc(t('全部 Agent 会话输入+输出累计(含缓存读写)'))}">${t('消耗语言tokens')} <b>${fmtM(s.llm_tokens)}</b></span>`
    +`<span class="st" title="${esc(t('项目累计,含重roll/探针/候选'))}">${t('消耗视频tokens')} <b>${fmtM(s.video_tokens)}</b></span>`
    +`<span class="st" title="${esc(t('项目累计,含重roll/探针/候选'))}">${t('消耗图片tokens')} <b>${fmtM(s.image_tokens)}</b></span>`
    +`<button class="editbtn" id="wfEdit" title="${esc(t('对整个工作流提修改意见,发消息给总制片(由其编辑 runs/dag.json)'))}">✏️ ${esc(t('修改'))}</button>`;
}

/* 依赖连线:同屏可见的单元间画贝塞尔;选中单元的连线高亮 */
function drawEdges(){
  const svg=$('#edges');if(!svg)return;
  const cv=$('#canvas'), cr=cv.getBoundingClientRect();
  svg.setAttribute('width',cv.scrollWidth);svg.setAttribute('height',cv.scrollHeight);
  const pos={};
  document.querySelectorAll('.nodechip').forEach(el=>{
    const r=el.getBoundingClientRect();
    if(!r.width)return;                           // 折叠阶段里的节点不参与连线
    pos[el.dataset.key]={t:[r.left+r.width/2-cr.left,r.top-cr.top],
                         b:[r.left+r.width/2-cr.left,r.bottom-cr.top]};
  });
  let h='';
  for(const u of UNITS.values()){
    if(!pos[u.key])continue;
    for(const d of u.deps){
      if(!pos[d])continue;
      const [x1,y1]=pos[d].b,[x2,y2]=pos[u.key].t;
      if(y2<y1-4)continue;                        // 折叠/回指的线不画
      const sel=SEL===u.key||SEL===d;
      const my=(y1+y2)/2;
      h+=`<path d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}" fill="none" `
        +`stroke="${sel?'var(--accent)':'rgba(108,158,248,.22)'}" stroke-width="${sel?2:1.2}"/>`;
    }
  }
  svg.innerHTML=h;
}

function renderDetail(){
  const box=$('#detail');
  const u=SEL&&UNITS.get(SEL);
  if(!u){box.className='';box.innerHTML='';return}
  box.className='open';
  const kv=(k,v)=>v?`<dt>${k}</dt><dd>${v}</dd>`:'';
  const editBtn=id=>`<button class="editbtn" data-task="${esc(id)}" title="${esc(t('对该任务提修改意见,发消息给总制片'))}">✏️ ${esc(t('修改'))}</button>`;
  const members=u.exec.length>1||!u.base?u.exec:[];
  box.innerHTML=`<h2><span class="dot" style="background:${SCOLOR[u.state]}"></span>${esc(u.key)} ${editBtn(u.key)}<button class="close" title="${esc(t('关闭'))}">✕</button></h2>
    <dl class="kv">
      ${kv(t('状态'),`${esc(t(SLABEL[u.state]||u.state))}`)}
      ${kv('Agent',esc(u.agent))}
      ${kv(t('阶段'),esc(u.phase+' '+t(PHASE_NAMES[u.phase]||'')))}
      ${kv(t('签字点'),esc(u.checkpoint))}
      ${kv(t('实际'),u.actDur?esc(fmtDur(u.actDur)):'')}
      ${kv(t('预估'),u.estDur?esc(fmtDur(u.estDur))+` <span style="color:var(--dim)">(${t('按历史均值')})</span>`:'')}
      ${kv(t('依赖'),u.deps.length?`<span class="deps">${u.deps.map(d=>`<a data-key="${esc(d)}">${esc(d)}</a>`).join('、')}</span>`:'')}
      ${kv(t('产出'),esc((u.base||u.members[0]).outputs.join('、')))}
    </dl>
    ${(u.base&&u.base.note)?`<div class="member"><div class="note">${esc(u.base.note)}</div></div>`:''}
    ${members.length?`<div style="color:var(--dim);font-size:12px;margin:8px 0 2px">${I18N.f(t('实例(共 {n} 个)'),{n:members.length})}</div>`:''}
    ${members.map(m=>`<div class="member">
      <div class="row1"><span class="dot" style="background:${SCOLOR[m._st]}"></span><span class="tid">${esc(m.id)}</span>${editBtn(m.id)}</div>
      <div class="meta">${esc(t(SLABEL[m._st]||m.state))}${m.attempt>1?` · ${esc(I18N.f(t('第 {n} 次尝试'),{n:m.attempt}))}`:''}
        ${m.duration_s?` · ✔ ${fmtDur(m.duration_s)}`:''}
        ${m.est_duration_s?` · ≈ ${fmtDur(m.est_duration_s)}`:''}</div>
      ${m.note?`<div class="note">${esc(m.note)}</div>`:''}</div>`).join('')}`;
}

function select(key){
  SEL=(SEL===key)?null:key;
  document.querySelectorAll('.nodechip').forEach(el=>el.classList.toggle('sel',el.dataset.key===SEL));
  renderDetail();drawEdges();
}

document.addEventListener('click',e=>{
  if(e.target.closest('#wfEdit')){
    const proj=$('#project').value.trim()||'demo';
    EditPopup.open({project:proj,compose:t('调整整个工作流(编辑 runs/dag.json):')+'\n'+t('修改意见:')});
    return;
  }
  const eb=e.target.closest('.editbtn');
  if(eb){
    const proj=$('#project').value.trim()||'demo';
    EditPopup.open({project:proj,compose:t('调整工作流任务:')+eb.dataset.task+'\n'+t('修改意见:')});
    return;
  }
  if(e.target.closest('#detail .close')){select(SEL);return}
  const dl=e.target.closest('.deps a, #summary .sig');
  if(dl&&dl.dataset.key){
    select(dl.dataset.key);
    const el=document.querySelector(`.nodechip[data-key="${CSS.escape(dl.dataset.key)}"]`);
    if(el){el.closest('.phase')?.classList.remove('closed');el.scrollIntoView({block:'center',behavior:'smooth'});drawEdges()}
    return;
  }
  const chip=e.target.closest('.nodechip');
  if(chip)select(chip.dataset.key);
});

async function load(){
  const proj=$('#project').value.trim()||'demo';
  history.replaceState(null,'','?project='+encodeURIComponent(proj));
  try{
    const r=await fetch('/api/v1/projects/'+encodeURIComponent(proj)+'/previews/workflow');
    if(!r.ok)throw new Error((await r.json()).detail||r.status);
    DATA=await r.json();
  }catch(e){$('#canvas').innerHTML=`<div class="empty">${t('加载失败:')}${esc(e.message)}</div>`;$('#summary').innerHTML='';$('#legend').innerHTML='';return}
  if(!DATA.nodes.length){
    $('#canvas').innerHTML=`<div class="empty">${t('该项目还没有 runs/dag.json(尚未立项)')}</div>`;
    $('#summary').innerHTML='';$('#legend').innerHTML='';return;
  }
  render();renderDetail();
}
$('#reload').onclick=load;
window.addEventListener('resize',()=>drawEdges());
$('#flow').addEventListener('scroll',()=>{},{passive:true});
$('#project').value=new URLSearchParams(location.search).get('project')
  ||(JSON.parse(localStorage.getItem('webui_prefs')||'{}').project)||'demo';
load();
TIMER=setInterval(()=>{if(!document.hidden)load()},10000);   // 任务状态自动刷新

// 右上角预览页切换下拉(项目值走 URL/localStorage,由隐藏 #project 承载)
const PV_PAGES=[['/preview/refs','\u{1F5BC} 参考文件'],['/preview/workflow','\u{1F9ED} 工作流预览'],['/preview/worldview','\u{1F30D} 世界观预览'],['/preview/scenes','\u{1F3D4} 场景预览'],['/preview/characters','\u{1F464} 人物预览'],['/preview/creatures','\u{1F40E} 生物预览'],['/preview/props','\u{1F5E1} 道具预览'],['/preview/script','\u{1F4DC} 剧本预览'],['/preview/board','\u{1F4CB} 故事板预览'],['/preview/storyboard','\u{1F3AC} 分镜预览'],['/preview/videos','\u{1F39E}️ 视频预览']];
PV_PAGES.forEach(([u,n])=>{const o=document.createElement('option');o.value=u;o.textContent=n;if(location.pathname===u)o.selected=true;$('#pvnav').appendChild(o)});
$('#pvnav').onchange=()=>{const p=($('#project').value||'').trim()||'demo';location.href=$('#pvnav').value+'?project='+encodeURIComponent(p)};
</script>
