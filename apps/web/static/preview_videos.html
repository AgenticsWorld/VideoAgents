<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>成片发布 · Agentics：VideoAgents</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Cmask%20id%3D%27m%27%3E%3Crect%20width%3D%2724%27%20height%3D%2724%27%20fill%3D%27%23fff%27%2F%3E%3Cpath%20d%3D%27M10%208.5%2016%2012l-6%203.5z%27%20fill%3D%27%23000%27%2F%3E%3C%2Fmask%3E%3Crect%20x%3D%273%27%20y%3D%274%27%20width%3D%2718%27%20height%3D%2716%27%20rx%3D%273%27%20fill%3D%27%236c9ef8%27%20mask%3D%27url%28%23m%29%27%2F%3E%3C%2Fsvg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/static/i18n/i18n.js"></script>
<script src="/static/ep-picker.js?v=20260912"></script>
<script>
/* 兜底:i18n 运行时未加载(如服务端未挂 /static)时保持中文界面可用 */
if(!window.I18N){
  window.I18N={lang:'zh',langs:{zh:'中文'},t:function(s){return s},
    f:function(s,p){p=p||{};return String(s).replace(/\{(\w+)\}/g,function(m,k){return k in p?p[k]:m})},
    setLang:function(){return Promise.resolve()}};
  window.t=function(s){return s};window.I18N_DICT={};
}
</script>
<style>
:root{
  --bg:#0f1117; --panel:#161a23; --panel2:#1c2130; --border:#2a3040;
  --text:#dde3ee; --dim:#8b93a7; --accent:#6c9ef8; --link:#fb923c; --green:#4ade80;
  --red:#f87171; --yellow:#fbbf24; --purple:#c084fc;
}
*{box-sizing:border-box;margin:0;padding:0}
a{color:var(--link)}
body{background:var(--bg);color:var(--text);font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
header h1{font-size:15px;font-weight:600}
header a.back{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:3px 10px;line-height:1.4}
header a.back:hover{color:var(--accent);border-color:var(--accent)}
header .spacer{flex:1}
input[type=text]{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px}
button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}
header select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;cursor:pointer}
header select:hover{border-color:var(--accent)}
#eps{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel);flex:none}
#eps button{flex:none;white-space:nowrap}
#eps button.on{background:var(--accent);border-color:var(--accent);color:#0b1020;font-weight:600}
#content{flex:1;overflow-y:auto;padding:20px 26px}
.empty{color:var(--dim);text-align:center;margin-top:60px}
h2.title{font-size:20px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2.title .sub{color:var(--dim);font-size:13px;font-weight:400}
h3.sec{font-size:15px;margin:26px 0 10px;border-left:3px solid var(--accent);padding-left:10px;display:flex;align-items:baseline;gap:10px}
h3.sec .n{color:var(--dim);font-size:12px;font-weight:400}
.none{color:var(--dim);font-size:13px;margin:6px 0 0 13px}
/* 成片视频卡 */
.vids{display:flex;gap:16px;flex-wrap:wrap}
.vcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;max-width:560px;flex:1 1 480px}
.vcard video{width:100%;border-radius:6px;background:#000;display:block}
.vcard .cap{font-size:12px;color:var(--dim);margin-top:6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.vcard .cap .fn{color:var(--text);font-weight:600}
/* 封面 */
.thumbs{display:flex;gap:14px;flex-wrap:wrap}
.thumbs .t{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px}
.thumbs img{height:180px;border-radius:6px;cursor:zoom-in;display:block}
.thumbs .cap{font-size:11.5px;color:var(--dim);margin-top:5px;text-align:center;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 发布相关 */
.pub{display:flex;flex-direction:column;gap:12px}
.pcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.pcard .ph{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pcard .ph .n{color:var(--dim);font-size:11.5px;font-weight:400}
.pkvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:3px 20px;font-size:12.5px}
.pkv b{color:var(--dim);font-weight:600;margin-right:6px}
.topt{border:1px solid var(--border);border-radius:6px;padding:5px 10px;margin:4px 0;font-size:12.5px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.topt.on{border-color:var(--green)}
.topt .tid{color:var(--dim);font-size:11px;white-space:nowrap}
.topt .pick{color:var(--green);font-size:11px;white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;border:1px solid var(--border);border-radius:4px;padding:0 6px;color:var(--dim)}
.pfile{display:flex;gap:10px;align-items:baseline;font-size:12.5px;margin:3px 0;flex-wrap:wrap}
.pfile a{color:var(--link);text-decoration:none}
.pfile a:hover{text-decoration:underline}
.pfile .sz{color:var(--dim);font-size:11.5px}
.pcard details{margin-top:8px}
.pcard summary{cursor:pointer;color:var(--dim);font-size:12px}
.pcard details pre{white-space:pre-wrap;word-break:break-word;font:12px/1.7 inherit;color:#c8d0e0;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-top:6px;max-height:300px;overflow-y:auto}
.pnote{color:var(--dim);font-size:12px;margin-top:6px}
/* 状态徽标(发布包核对结论 / 上传状态) */
.st{font-size:11px;border-radius:4px;padding:0 6px;white-space:nowrap;border:1px solid var(--border);color:var(--dim)}
.st.open,.st.new{color:var(--red);border-color:var(--red)}
.st.fixed,.st.resolved,.st.closed,.st.verified{color:var(--green);border-color:var(--green)}
.st.waived,.st.deferred{color:var(--yellow);border-color:var(--yellow)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
#lightbox img{max-width:96vw;max-height:96vh;border-radius:6px}
</style>
</head>
<body>
<header>
  <a class="back" href="/" onclick="if(history.length>1){history.back();return false}" title="后退">&lt;</a>
  <a class="back" href="/">控制台</a>
  <h1>🎞️ 成片发布</h1>
  <div class="spacer"></div>
  <input type="hidden" id="project">
  <select id="pvnav" title="切换预览页"></select>
  <button id="reload">刷新</button>
</header>
<div id="eps"></div>
<div id="content"><div class="empty">加载中…</div></div>
<div id="lightbox"><img alt=""></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let EP='',LAST=null;
// 页面位置记忆(2026-09-11,同分镜预览):#content 滚动位置按 项目:集 记进 localStorage,刷新/重开回到原位;
// 页内刷新(load(true)/轮询重渲)保持原位;切集/切项目回顶。load 清空内容瞬间浏览器会把滚动条归零,SCROLL_HOLD 期间不记
let SCROLL_FIRST=true,SCROLL_TICK=null,SCROLL_HOLD=false;
function restoreScroll(box,ep){
  const k='vid-scroll:'+($('#project').value.trim()||'demo')+':'+(ep||''),same=box.dataset.skey===k;
  box.dataset.skey=k;box.scrollTop=(same||SCROLL_FIRST)?(+localStorage.getItem(k)||0):0;SCROLL_FIRST=false;SCROLL_HOLD=false;
}
$('#content').addEventListener('scroll',()=>{
  if(SCROLL_HOLD||SCROLL_TICK)return;
  SCROLL_TICK=requestAnimationFrame(()=>{SCROLL_TICK=null;const k=$('#content').dataset.skey;if(k)localStorage.setItem(k,Math.round($('#content').scrollTop))});
});

function zoom(src){$('#lightbox img').src=src;$('#lightbox').style.display='flex'}
$('#lightbox').onclick=()=>$('#lightbox').style.display='none';

// 集行:≤12 集逐集按钮,更多时收成一行下拉(/static/ep-picker.js,2026-09-12)
function renderEps(episodes){EpPicker.render($('#eps'),episodes,EP,ep=>{EP=ep;load()})}

function pubHtml(p,ep){
  if(!p)return '<div class="none">'+esc(I18N.f('该集还没有发布物料(publish/{ep}/)',{ep}))+'</div>';
  const kv=(k,v)=>(v==null||v==='')?'':`<div class="pkv"><b>${esc(k)}</b>${esc(v)}</div>`;
  let h='<div class="pub">';
  const m=p.metadata;
  if(m){
    h+=`<div class="pcard"><div class="ph">📋 发布元数据<span class="n">metadata.json${m.date?' · '+esc(m.date):''}</span></div><div class="pkvs">`
      +kv('系列',m.series?m.series+(m.episode_no?I18N.f(' · 第 {a}/{b} 集',{a:m.episode_no,b:m.episode_total||'?'}):''):'')
      +kv('本集标题',m.episode_title)
      +kv('分级',m.rating?m.rating+(m.made_for_kids===false?t(' · 非儿童向'):m.made_for_kids?t(' · 儿童向'):'')+(m.age_restricted?t(' · 年龄限制'):''):'')
      +kv('成片源',m.source_file)
      +kv('规格',[m.resolution,m.fps?m.fps+'fps':'',m.duration_s?Math.round(m.duration_s)+'s':''].filter(Boolean).join(' · '))
      +kv('发布门禁 H5',m.gate_verdict)
      +kv('出品',[m.producer,m.production_credit].filter(Boolean).join(' · '))
      +kv('下一集',m.next_episode)
      +'</div></div>';
  }
  const s=p.seo;
  if(s){
    const picked=s.picked;
    h+=`<div class="pcard"><div class="ph">🔍 SEO 上刊物料<span class="n">seo.json${s.platform?' · '+esc(s.platform):''}</span></div>`;
    h+=(s.titles||[]).map(t=>{
      const on=picked&&t.id===picked;
      return `<div class="topt${on?' on':''}"><span class="tid">${esc(t.orientation||t.id||'')}</span>${esc(t.text||'')}${on?'<span class="pick">✓ 已选定</span>':''}</div>`;
    }).join('');
    if((s.titles||[]).length&&!picked)h+='<div class="pnote">⚠ 上刊标题尚未选定(items[0].picked=null,待人工三选一)</div>';
    if((s.tags||[]).length)h+=`<div class="tags">${s.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`;
    if(s.description)h+=`<details><summary>${esc(I18N.f('视频简介 description({n} 字)',{n:s.description.length}))}</summary><pre>${esc(s.description)}</pre></details>`;
    h+='</div>';
  }
  (p.platforms||[]).forEach(pl=>{
    const v=String(pl.verdict||'').toLowerCase();
    const vt=pl.verdict?`<span class="st ${v==='pass'?'verified':(v.startsWith('fail')?'open':'waived')}">${esc(pl.verdict)}</span>`:'';
    const up=pl.uploaded===true?'<span class="st verified">已上传</span>':pl.uploaded===false?'<span class="st">未上传</span>':'';
    h+=`<div class="pcard"><div class="ph">${t('📦 发布包 · ')}${esc(pl.platform)}${vt}${up}<span class="n">${esc(I18N.f('spec_report.json · 规格核对 {n} 项',{n:pl.lint_total||0}))}</span></div>`;
    const fl=Object.entries(pl.lint_flagged||{});
    if(fl.length)h+=fl.map(([k,vv])=>`<div class="pnote">· ${esc(k)}:${esc(vv)}</div>`).join('');
    h+=(pl.files||[]).length?pl.files.map(f=>
      `<div class="pfile"><a href="${esc(f.url)}" target="_blank">${f.kind==='video'?'🎬':f.kind==='image'?'🖼':'📄'} ${esc(f.name)}</a><span class="sz">${f.size_mb} MB</span>${f.kind==='image'?`<a href="javascript:void(0)" onclick="zoom('${esc(f.url)}')">预览</a>`:''}</div>`).join('')
      :'<div class="pnote">package/ 发布包尚未产出</div>';
    if(pl.note)h+=`<div class="pnote">${esc(pl.note)}</div>`;
    h+='</div>';
  });
  if(!m&&!s&&!(p.platforms||[]).length)h+='<div class="none">'+esc(I18N.f('publish/{ep}/ 目录存在,但还没有可展示的物料',{ep}))+'</div>';
  return h+'</div>';
}

function render(d){
  LAST=d;
  renderEps(d.episodes||[]);
  const finals=d.finals||[],thumbs=d.thumbnails||[];
  const epTitle=((d.episodes||[]).find(e=>e.ep===d.ep)||{}).title||'';
  let h=`<h2 class="title">${esc(d.ep)}${epTitle?' '+esc(epTitle):''}<span class="sub">${esc(I18N.f('成片 {f} · 封面 {t}',{f:finals.length,t:thumbs.length}))}</span></h2>`;

  h+=`<h3 class="sec">▶ 成片视频(final)<span class="n">${esc(I18N.f('{n} 个 · edit/{ep}/',{n:finals.length,ep:d.ep}))}</span></h3>`;
  h+=finals.length?`<div class="vids">${finals.map(f=>
    `<div class="vcard"><video controls preload="metadata" src="${esc(f.url)}"></video>
     <div class="cap"><span class="fn">${esc(f.name)}</span><span>${f.size_mb} MB</span></div></div>`).join('')}</div>`
    :'<div class="none">'+esc(I18N.f('该集还没有 final 成片(edit/{ep}/*final*.mp4)',{ep:d.ep}))+'</div>';

  h+=`<h3 class="sec">🖼 封面 thumbnail<span class="n">${esc(I18N.f('{n} 张',{n:thumbs.length}))}</span></h3>`;
  h+=thumbs.length?`<div class="thumbs">${thumbs.map(t=>
    `<div class="t"><img src="${esc(t.url)}" loading="lazy" onclick="zoom(this.src)">
     <div class="cap" title="${esc(t.name)}">${esc(t.name)}</div></div>`).join('')}</div>`
    :'<div class="none">'+esc(I18N.f('该集还没有封面(edit/{ep}/thumbnail_*.png)',{ep:d.ep}))+'</div>';

  const pub=d.publish,pubN=pub?[pub.metadata?1:0,pub.seo?1:0].reduce((a,b)=>a+b,0)+(pub.platforms||[]).length:0;
  h+=`<h3 class="sec">📤 发布相关<span class="n">publish/${esc(d.ep)}/${pub?esc(I18N.f(' · {n} 项物料',{n:pubN})):''}</span></h3>`;
  h+=pubHtml(pub,d.ep);
  // 审核问题反馈(qa/defects/)2026-09-19 移到独立页:项目设置 → 缺陷单(/defects)

  $('#content').innerHTML=h;restoreScroll($('#content'),d.ep);
}

async function load(){
  const proj=$('#project').value.trim()||'demo';
  history.replaceState(null,'','?project='+encodeURIComponent(proj)+(EP?'&ep='+encodeURIComponent(EP):''));
  SCROLL_HOLD=true;$('#content').innerHTML='<div class="empty">加载中…</div>';
  try{
    const r=await fetch('/api/v1/projects/'+encodeURIComponent(proj)+'/previews/videos'+(EP?'?ep='+encodeURIComponent(EP):''));
    if(!r.ok)throw new Error((await r.json()).detail||r.status);
    const d=await r.json();
    EP=d.ep||'';
    if(!(d.episodes||[]).length){$('#eps').innerHTML='';$('#content').innerHTML='<div class="empty">该项目还没有分集数据</div>';return}
    // 集号记忆(2026-09-11,同分镜预览):记住的集已不存在时回落到首集
    if(!d.episodes.some(e=>e.ep===EP)){EP=d.episodes[0].ep;load();return}
    localStorage.setItem('vid-ep:'+(d.project||proj),EP);
    render(d);
  }catch(e){$('#content').innerHTML=`<div class="empty">加载失败:${esc(e.message)}</div>`}
}
$('#reload').onclick=load;
const _q=new URLSearchParams(location.search);
$('#project').value=_q.get('project')
  ||(JSON.parse(localStorage.getItem('webui_prefs')||'{}').project)||'demo';
// 集号记忆:URL 未指定 ep 时沿用该项目上次看的集(与滚动位置记忆配套)
EP=_q.get('ep')||localStorage.getItem('vid-ep:'+$('#project').value.trim())||'';
load();

// 右上角预览页切换下拉(项目值走 URL/localStorage,由隐藏 #project 承载)
const PV_PAGES=[['/preview/refs','\u{1F5BC} 参考文件'],['/preview/workflow','\u{1F9ED} 工作流预览'],['/preview/worldview','\u{1F30D} 世界观预览'],['/preview/scenes','\u{1F3D4} 场景预览'],['/preview/characters','\u{1F464} 人物预览'],['/preview/creatures','\u{1F40E} 生物预览'],['/preview/props','\u{1F5E1} 道具预览'],['/preview/script','\u{1F4DC} 剧本预览'],['/preview/board','\u{1F4CB} 故事板'],['/preview/storyboard','\u{1F3A6} 分镜预览'],['/preview/director','\u{1F4FA} 导演台'],['/preview/post','\u{1F39A}\uFE0F 后期处理'],['/preview/videos','\u{1F39E}\uFE0F 成片发布']];
PV_PAGES.forEach(([u,n])=>{const o=document.createElement('option');o.value=u;o.textContent=n;if(location.pathname===u)o.selected=true;$('#pvnav').appendChild(o)});
$('#pvnav').onchange=()=>{const p=($('#project').value||'').trim()||'demo';location.href=$('#pvnav').value+'?project='+encodeURIComponent(p)};
</script>
</body>
</html>
