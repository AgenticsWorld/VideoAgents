<style>

.nsrc{display:inline-block;margin-left:6px;padding:0 5px;border:1px solid var(--border);border-radius:8px;color:var(--dim);font-size:11px;white-space:nowrap;cursor:help}

.editbtn.notebtn{margin-left:4px}
.editbtn.notebtn.has{color:var(--yellow);border-color:rgba(251,191,36,.55);opacity:1}

.scene .note.un{color:var(--yellow)}
.epnote{color:var(--yellow);font-size:12.5px;white-space:pre-wrap;margin:0 0 10px;padding:6px 10px;border:1px dashed rgba(251,191,36,.45);border-radius:8px;background:rgba(251,191,36,.05)}

<header>

</div>

<div id="sd"><div class="box"><h3>✍️ 手绘分镜草图 — <span id="sd-key" data-no-i18n style="color:var(--accent)"></span></h3><div class="hint">手机扫码打开画布(同一局域网);画好提交后由 AI 按分镜草图风格重绘作为该分镜的草图;画布页取消勾选「AI 加工」则手绘原图直接作为草图</div><div class="qr" id="sd-qr"></div><div class="url" id="sd-url" data-no-i18n></div><div class="st" id="sd-st">等待手机提交…</div><button class="editbtn sd-close">关闭</button></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let EP='',LAST=null,SK={},JOBS={},REDRAW={},LOCAL_REDRAW={},POLL=null,PORTRAIT=false,ANIM={},GATE={},NOTES={};

// 页内刷新(load(true)/轮询重渲)保持原位;切集/切项目回顶。load 清空内容瞬间浏览器会把滚动条归零,SCROLL_HOLD 期间不记
let SCROLL_FIRST=true,SCROLL_TICK=null,SCROLL_HOLD=false;
function restoreScroll(box,ep){
  const k='board-scroll:'+($('#project').value.trim()||'demo')+':'+(ep||''),same=box.dataset.skey===k;
  box.dataset.skey=k;box.scrollTop=(same||SCROLL_FIRST)?(+localStorage.getItem(k)||0):0;SCROLL_FIRST=false;SCROLL_HOLD=false;
}
$('#content').addEventListener('scroll',()=>{
  if(SCROLL_HOLD||SCROLL_TICK)return;
  SCROLL_TICK=requestAnimationFrame(()=>{SCROLL_TICK=null;const k=$('#content').dataset.skey;if(k)localStorage.setItem(k,Math.round($('#content').scrollTop))});
});
const num=(v,d=1)=>v==null||isNaN(v)?'—':(+v).toFixed(d).replace(/\.0$/,'');
const secs=v=>v==null?'—':num(v,1)+'s';
const clip=(s,n)=>{s=String(s||'').replace(/\s+/g,' ');return s.length>n?s.slice(0,n)+'…':s};
const PROV_NAMES={agentics:'Agentics',openrouter:'OpenRouter',volcengine:'火山引擎',byteplus:'BytePlus',fal:'Fal',minimax:'MiniMax',comfyui:'ComfyUI'};
function todIcon(s){
  if(!s)return '';
  if(/黄昏|傍晚|暮|夕|日暮|dusk|sunset/i.test(s))return '🌇';
  if(/深夜|入夜|夜|晚|凌晨|night/i.test(s))return '🌙';
  if(/清晨|黎明|晨|早|dawn|morning/i.test(s))return '🌅';
  if(/午后|下午|afternoon/i.test(s))return '🌤';
  if(/日|白天|正午|午|day|noon/i.test(s))return '☀️';
  return '🕒';
}
const A=()=>(LAST&&LAST.assets)||{characters:{},scenes:{},creatures:{},props:{}};
const cname=id=>((A().characters[id]||A().creatures[id]||{}).name)||id||'?';
// 大图下方文字 → 该资产的预览页(场景/人物/生物/道具页都认 ?project&id 定位;看服装、全景等更多信息)

/* ✏️ 修改:默认发修改师(一人改完,牵涉上下游时由总制片按变更记录标脏);草图修改另发草图工位(data-agent) */
function editBtn(loc,cls,label,agent){

}
/* 🗒 注释(2026-09-15):用户对整集(*)/场次(S01)/镜(S01-03)写的设计意见,存 directing/<ep>/storyboard_notes.json,
   分镜师 / 镜头表工位 / 修改师重做分镜时必读;按钮放在 ✏️ 修改 后面 */
function noteBtn(key,cls){
  const n=NOTES[key];
  return `<button class="editbtn notebtn ${cls||''} ${n?'has':''}" data-note="${esc(key)}" title="${esc(n?t('注释:')+n.text:t('对这一块加注释:存到 directing/<ep>/storyboard_notes.json,分镜师 / 镜头表工位 / 修改师重做本集分镜时作为设计参考'))}">🗒 ${esc(t('注释'))}</button>`;
}
function epNoteHtml(){const n=NOTES['*'];return n?`<div class="epnote" data-no-i18n>🗒 ${esc(n.text)}</div>`:''}
function noteLabel(key){
  const ep=LAST?LAST.ep:'';
  if(key==='*')return I18N.f('{ep} 整集',{ep});
  for(const sc of (LAST&&LAST.scenes)||[]){
    if(sc.scene_no===key)return I18N.f('{ep} 场次 {no}{name}',{ep,no:sc.scene_no,name:sc.location?' '+sc.location:''});
    const sh=sc.shots.find(s=>s.key===key);
    if(sh)return I18N.f('{ep} 场次 {no} 第 {o} 镜「{txt}」',{ep,no:sc.scene_no,o:sh.order,txt:clip(sh.content,40)});
  }
  return ep+' '+key;
}
let NP_KEY='';
function openNote(key){
  NP_KEY=key;const np=$('#np'),ta=np.querySelector('textarea');
  np.querySelector('.loc').textContent=noteLabel(key);np.querySelector('.err').textContent='';
  ta.value=(NOTES[key]||{}).text||'';np.querySelector('.np-clear').style.display=NOTES[key]?'':'none';
  np.style.display='flex';setTimeout(()=>ta.focus(),0);
}
function closeNote(){$('#np').style.display='none';NP_KEY=''}
function renderNoteTarget(key){
  if(!LAST)return;
  if(key==='*'){const b=$('#epnotebtn');if(b)b.innerHTML=noteBtn('*');const d=$('#epnote');if(d)d.innerHTML=epNoteHtml();return}
  if((LAST.scenes||[]).some(sc=>sc.scene_no===key)){renderSceneHead(key);return}
  renderRow(key);
}
function renderRow(key){
  const tr=document.getElementById('sh-'+key);if(!tr||!LAST)return;
  for(const sc of LAST.scenes||[]){const sh=sc.shots.find(s=>s.key===key);if(sh){const tmp=document.createElement('tbody');tmp.innerHTML=shotRow(sc,sh,LAST.ep);tr.replaceWith(tmp.firstElementChild);return}}
}
async function saveNote(text){
  if(!LAST||!NP_KEY)return;
  const np=$('#np'),key=NP_KEY,proj=$('#project').value.trim()||'demo',ep=LAST.ep;
  np.querySelectorAll('button').forEach(b=>b.disabled=true);np.querySelector('.err').textContent='';
  try{
    const r=await fetch(`/api/v1/projects/${encodeURIComponent(proj)}/board/${encodeURIComponent(ep)}/notes`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,text})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.detail||j.error||r.status);
    NOTES=j.notes||{};closeNote();renderNoteTarget(key);refreshNotesSubmit();
  }catch(err){np.querySelector('.err').textContent=I18N.f('保存失败:{e}',{e:err.message})}
  finally{np.querySelectorAll('button').forEach(b=>b.disabled=false)}
}
document.addEventListener('click',e=>{
  const nb=e.target.closest('.notebtn');
  if(nb&&nb.dataset.note){openNote(nb.dataset.note);return}
  if(!e.target.closest('#np'))return;
  if(e.target.closest('.np-save'))saveNote($('#np textarea').value);
  else if(e.target.closest('.np-clear'))saveNote('');
  else if(e.target.closest('.np-cancel')||e.target===$('#np'))closeNote();
});
$('#np textarea').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.shiftKey){e.preventDefault();saveNote(e.target.value)}});
document.addEventListener('click',e=>{

  LAST=d;SK=d.sketches||{};JOBS=d.jobs||{};REDRAW=mergeRedraw(d.redraw_runs||{});ANIM=d.animatic||{};GATE=d.gate||{};NOTES=d.notes||{};

  if(d.has_storyboard)h+=`<div class="src"><span>🎬</span><span class="msg">${esc(I18N.f('分镜层产物 directing/{ep}/storyboard.json',{ep}))}${sm.task_id?` · ${esc(sm.task_id)}`:''}${sm.written_at?` · ${esc(sm.written_at)}`:''}${sm.status?` · ${esc(sm.status)}`:''} · ${esc(t('草图为铅笔手绘小图,只用于看构图与调度,不进视频参考图'))}</span></div>`;

  if(d.directing_plan){
    h+=`<div class="doc closed"><h3 onclick="if(!event.target.closest('.editbtn'))this.parentNode.classList.toggle('closed')">🎬 ${esc(t('导演计划'))} <span class="meta">directing_plan.md${d.directing_plan_mtime?' · '+esc(new Date(d.directing_plan_mtime*1000).toLocaleString()):''}</span>${editBtn(I18N.f('导演计划 {ep}(文件 directing/{ep}/directing_plan.md)',{ep}))}</h3><div class="body"><div class="md" data-no-i18n>${MiniMD.render(d.directing_plan)}</div></div></div>`;
  }
  if(!d.has_storyboard){
    h+=`<div class="empty">${esc(I18N.f('该集分镜层尚未产出 storyboard.json(directing/{ep}/);导演计划{p}',{ep,p:d.directing_plan?t('已在上方'):t('也还没有')}))}</div>`;
    box.innerHTML=h;restoreScroll(box,ep);return;
  }
  (d.scenes||[]).forEach(sc=>{h+=sceneCard(sc,d)});
  h+=`<div class="legend"><span>💬 ${esc(t('对白'))}</span><span>🎙 ${esc(t('旁白(正文·估时;灰标 = 宿主推定的挂点)'))}</span><span>🎬 ${esc(t('动作'))}</span><span>🧍 ${esc(t('姿态'))}</span><span>📐 ${esc(t('构图草描'))}</span><span>👥 ${esc(t('群演'))}</span><span>🚶 ${esc(t('NPC 参与构图'))}</span><span>📝 ${esc(t('备注'))}</span><span>🗒 ${esc(t('注释(用户写,分镜设计参考)'))}</span><span>${esc(t('绿色 shNNN = 镜头表定稿镜号/时长/组'))}</span></div>`;
  box.innerHTML=h;restoreScroll(box,ep);renderNav(d);
  // 从剧本/分镜预览跳来:#scene=S01 → 场次卡,#shot=S01-03 → 镜行

// 右侧快速定位(2026-09-13,同分镜预览):场次 + 镜
function renderNav(d){
  if(!window.PreviewNav)return;
  const items=[];
  ((d&&d.has_storyboard&&d.scenes)||[]).forEach(sc=>{
    const nm=sc.location||sc.scene_name||'';
    items.push({cls:'sc',id:'sc-'+sc.scene_no,label:sc.scene_no+(nm?' '+nm:''),hint:I18N.f('{n} 镜',{n:sc.shots.length}),badges:I18N.f('{n} 镜',{n:sc.shots.length})});
    sc.shots.forEach(sh=>items.push({cls:'s',id:'sh-'+sh.key,label:`#${sh.order} ${sh.shot_id||sh.key}`,hint:clip(sh.content,60),badges:sh.duration_hint_s!=null?secs(sh.duration_hint_s):''}));
  });
  PreviewNav.render('📑 场次 / 分镜',items);
}
/* ---------- H3S 故事板签字(workflow.yaml g6s):答复总制片发的签字卡,与控制台同一条 ---------- */
function gateHtml(){
  const g=GATE||{},ep=LAST.ep;
  if(!g.in_dag&&!(g.pending||[]).length&&!g.signed)return '';
  let h=`<div class="src gate"><span>🖋</span><span class="msg">`;
  if((g.pending||[]).length){
    const c=g.pending[0];
    h+=`<b>${esc(t('故事板签字'))}</b> · ${esc(I18N.f('H3S 签字卡待答复:看完本集分镜草案(草图可选)后签字,签字后才派镜头表定稿(shot-planning)',{}))}`;
    h+=`</span><button class="signbtn pri" data-cid="${esc(c.id)}" data-answer="签字" title="${esc(c.question||'')}">✅ ${esc(t('签字确认'))}</button><button class="signbtn" data-cid="${esc(c.id)}" data-answer="暂缓" title="${esc(t('先不放行,继续提修改意见'))}">⏸ ${esc(t('暂缓'))}</button>`;
  }else if(g.signed&&g.stale){
    h+=`⚠ <b>${esc(t('签字已过期'))}</b> · ${esc(t('签字后 storyboard.json 又改动过;等总制片重新建签字单,或在控制台确认'))}${g.signed_at?` · ${esc(g.signed_at)}`:''}</span>`;
  }else if(g.signed){
    h+=`✅ <b>${esc(t('故事板已签字'))}</b>${g.signed_at?` · ${esc(g.signed_at)}`:''}${g.state?` · ${esc(g.gate_id||'')} ${esc(g.state)}`:''}</span>`;
  }else{
    h+=`${esc(t('故事板签字点'))} ${esc(g.gate_id||'g6s')} · ${esc(g.state||'pending')} · ${esc(t('等总制片建签字单(分镜交付后自动);建好后这里出现「签字确认」按钮'))}</span>`;
  }
  return h+`</div>`;
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('.signbtn');if(!b||b.disabled||!LAST)return;
  const proj=$('#project').value.trim()||'demo',ep=LAST.ep;
  if(b.dataset.answer==='签字'&&!confirm(t('确认签字放行本集故事板?签字后总制片将派发镜头表定稿(shot-planning)。')))return;
  b.disabled=true;
  try{
    const r=await fetch(`/api/v1/projects/${encodeURIComponent(proj)}/board/${encodeURIComponent(ep)}/signoff`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm_id:b.dataset.cid,answer:b.dataset.answer})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.detail||j.error||r.status);
    GATE=j.gate||GATE;const box=$('#gatebox');if(box)box.innerHTML=gateHtml();
  }catch(err){b.disabled=false;alert(I18N.f('签字失败:{e}',{e:err.message}))}
});

/* ---------- 动态样片(code/animatic.py,零生成费用):草图按时长串片 + 台词/旁白字幕 ---------- */
function animHtml(){
  const a=ANIM||{},ep=LAST.ep,T=LAST.totals||{};
  const missing=a.exists?(a.missing_sketches??0):Math.max(0,(T.shots||0)-(a.sketches_done||0));
  let st='';
  if(a.running)st=`<span class="spin">⏳</span> ${esc(t('生成中…'))}`;
  else if(a.error)st=`<span style="color:var(--red)">❌ ${esc(clip(a.error,80))}</span>`;
  else if(a.exists&&a.stale&&a.stale_reason==='dialogue_tts')st=`<span style="color:var(--yellow)">⚠ ${esc(t('对白语音已变(台词或音色更新),建议重出样片'))}</span>`;
  else if(a.exists&&a.stale)st=`<span style="color:var(--yellow)">⚠ ${esc(t('样片已过期(草图或分镜时长变了),建议重出'))}</span>`;
  else if(a.exists)st=`<span style="color:var(--green)">✓ ${esc(a.created_at||'')}</span>`;
  const missTxt=missing?` · <span style="color:var(--yellow)">${esc(I18N.f('缺 {n} 张草图(占位卡顶替)',{n:missing}))}</span>`:'';
  let h=`<div class="doc closed anim"><h3 onclick="if(!event.target.closest('button'))this.parentNode.classList.toggle('closed')">🎞 ${esc(t('动态样片'))} <span class="meta">${a.exists?esc(I18N.f('{d}s · {n} 镜 · 时长口径 {s}',{d:num(a.duration_s,0),n:a.shots??'—',s:a.duration_source==='final'?t('定稿'):a.duration_source==='draft'?t('草案'):t('定稿+草案')})+(a.audio_tracks?' · 🔊 '+a.audio_tracks:'')):esc(t('尚未生成'))}${missTxt}</span><span style="margin-left:auto;display:inline-flex;gap:6px;align-items:center;font-size:12px">${st}<button class="editbtn pri animbtn" ${a.running?'disabled':''} title="${esc(t('把本集草图按时长串成样片并烧入台词/旁白字幕(有旁白/对白音轨则混入);缺图的镜用占位卡,不花生成费用'))}">🎞 ${esc(a.exists?t('重出样片'):t('出动态样片'))}</button></span></h3>`;
  h+=`<div class="body">${a.exists?`<video class="reelvid${PORTRAIT?' tall':''}" controls preload="metadata" onloadedmetadata="reelFit(this)" src="${esc(a.url)}" style="aspect-ratio:${aspectCss(LAST.aspect)}"></video><div class="meta" style="color:var(--dim);font-size:12px;margin-top:6px">${esc(a.path||'')}${a.size_mb!=null?` · ${a.size_mb} MB`:''}</div>`:`<div style="color:var(--dim);font-size:13px">${esc(t('点右上「出动态样片」生成;草图没出全也能出,缺图的镜显示画面内容文字'))}</div>`}</div></div>`;
  return h;
}

function reelFit(v){if(!v.videoWidth||!v.videoHeight)return;v.style.aspectRatio=v.videoWidth+'/'+v.videoHeight;v.classList.toggle('tall',v.videoHeight>v.videoWidth)}
function aspectPortrait(a){const m=/^(\d+):(\d+)$/.exec(a||'');return !!m&&+m[1]<+m[2]}
function aspectCss(a){const m=/^(\d+):(\d+)$/.exec(a||'');return m?`${m[1]}/${m[2]}`:'16/9'}
function mergeRedraw(server){
  const out=Object.assign({},server);
  // 刚发出的重绘工单服务端列表可能还没收进(异步),本地保 20s
  Object.keys(LOCAL_REDRAW).forEach(k=>{if(Date.now()-LOCAL_REDRAW[k]<20000){if(!out[k])out[k]=REDRAW[k]||'?'}else delete LOCAL_REDRAW[k]});
  return out;
}

/* ---------- 草图台账刷新(SSE 事件 + 轮询兜底) ---------- */
async function refreshSketches(){
  if(!LAST||!LAST.ep)return;
  const proj=$('#project').value.trim()||'demo',ep=LAST.ep;
  try{
    const r=await fetch(`/api/v1/projects/${encodeURIComponent(proj)}/board/${encodeURIComponent(ep)}/sketches`);
    if(!r.ok)return;
    const j=await r.json();
    if(!LAST||LAST.ep!==ep)return;
    const oldSK=SK,oldJ=JOBS,oldR=REDRAW;
    SK=j.sketches||{};JOBS=j.jobs||{};REDRAW=mergeRedraw(j.redraw_runs||{});
    const oldA=JSON.stringify(ANIM),oldG=JSON.stringify(GATE);ANIM=j.animatic||ANIM;GATE=j.gate||GATE;
    if(JSON.stringify(ANIM)!==oldA||JSON.stringify(GATE)!==oldG)refreshTop();
    const keys=new Set([...Object.keys(oldSK),...Object.keys(SK),...Object.keys(oldR),...Object.keys(REDRAW)]);
    keys.forEach(k=>{if(JSON.stringify(oldSK[k])!==JSON.stringify(SK[k])||oldR[k]!==REDRAW[k])renderCell(k)});
    const scs=new Set([...Object.keys(oldJ),...Object.keys(JOBS)]);
    (LAST.scenes||[]).forEach(sc=>{if(scs.has(sc.scene_no)||keys.size)renderSceneHead(sc.scene_no)});
    if(scs.size||keys.size)renderBatchBtn();
    (LAST.episodes||[]).forEach(e=>{if(e.ep===ep)e.sketches=Object.values(SK).filter(r=>r.status==='done').length});
    renderEps(LAST.episodes||[]);
  }catch(_){}
}
function startPoll(){
  if(POLL)return;
  POLL=setInterval(async()=>{await refreshSketches();if(!anyBusy()){clearInterval(POLL);POLL=null}},4000);
}
try{
  const es=new EventSource('/api/v1/events');
  es.onmessage=e=>{
    try{
      const ev=JSON.parse(e.data),proj=$('#project').value.trim()||'demo';
      if((ev.type==='board_sketch'||ev.type==='board_animatic'||ev.type==='dialogue_tts')&&ev.project===proj&&LAST&&ev.ep===LAST.ep){
        const pr=refreshSketches();
        if(ev.type==='board_sketch'&&ev.source==='hand'&&ev.key&&ev.key===SD_KEY)pr.then(sdDone);   // AI 加工时 status=running,sdDone 按台账状态给文案
      }
      else if((ev.type==='confirm'||ev.type==='confirm_done')&&LAST)refreshSketches();   // 签字卡出现/答复 → 刷新签字条
      else if(ev.type==='run'&&ev.run&&ev.run.project===proj&&LAST&&ev.run.agent===(LAST.agents||{}).sketch)refreshSketches();
    }catch(_){}
  };
}catch(_){}

document.addEventListener('click',async e=>{
  const b=e.target.closest('.sk-gen');if(!b||b.disabled||!LAST)return;
  const proj=$('#project').value.trim()||'demo',ep=LAST.ep;
  const whole=!!b.dataset.all;
  const body=whole?{all:true,force:!!e.shiftKey}:{scene:b.dataset.scene,force:!!e.shiftKey||b.dataset.order!=null};
  if(!whole&&b.dataset.order!=null)body.order=+b.dataset.order;
  Object.assign(body,skmValue());
  b.disabled=true;
  try{
    const r=await fetch(`/api/v1/projects/${encodeURIComponent(proj)}/board/${encodeURIComponent(ep)}/sketch`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.detail||j.error||r.status);
    if(!j.queued){b.disabled=false;alert(t(whole?'本集草图都已出过(或正在出);按住 Shift 点击可全部重出':'该场草图都已出过;按住 Shift 点击可全部重出'));return}
    await refreshSketches();startPoll();
  }catch(err){b.disabled=false;alert(I18N.f('出图失败:{e}',{e:err.message}))}
});

/* ---------- ✍️ 手绘草图(2026-09-16):POST /draw-sessions {kind:board_sketch,key} → 二维码 → 手机画好提交,
   服务端落 assets/storyboard/<ep>/<key>.png 并写台账(画布页「AI 加工」默认勾选 = 按草图风格重绘 mode=hand_ai,不勾选 = 原图 mode=hand);SSE board_sketch(source=hand)为主,3s 轮询兜底 ---------- */
let SD_KEY='',SD_POLL=null,SD_T0='';
function sdClose(){$('#sd').style.display='none';SD_KEY='';clearInterval(SD_POLL);SD_POLL=null}
function sdDone(){
  if(!SD_KEY)return;
  clearInterval(SD_POLL);SD_POLL=null;
  const busy=['queued','running'].includes((SK[SD_KEY]||{}).status);
  $('#sd-st').textContent=busy?t('✅ 已收到手绘稿,AI 正在按分镜草图风格重绘…'):t('✅ 已收到手绘草图,已作为该分镜的草图');
  if(busy)startPoll();
  setTimeout(sdClose,1500);
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('.sk-draw');if(!b||b.disabled||!LAST)return;
  const proj=$('#project').value.trim()||'demo',ep=LAST.ep,key=b.dataset.key;
  SD_KEY=key;SD_T0=(SK[key]||{}).updated_at||'';
  $('#sd-key').textContent=ep+' / '+key;
  $('#sd-qr').innerHTML='';$('#sd-url').textContent='';
  $('#sd-st').textContent=t('正在创建会话…');
  $('#sd').style.display='flex';
  try{
    const r=await fetch('/api/v1/draw-sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:proj,ep,kind:'board_sketch',key})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.detail||r.status);
    if(SD_KEY!==key)return;
    $('#sd-qr').innerHTML=d.qr_svg;
    // 显式 http:// 链接:桌面端点击直达,避免地址栏手输被浏览器自动升级成 https(服务无 TLS)
    $('#sd-url').innerHTML=`<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.url)}</a>`;
    $('#sd-st').textContent=t('等待手机提交…(会话 30 分钟有效)');
    clearInterval(SD_POLL);
    SD_POLL=setInterval(async()=>{await refreshSketches();if(SD_KEY&&((SK[SD_KEY]||{}).updated_at||'')!==SD_T0)sdDone()},3000);
  }catch(err){$('#sd-st').textContent=t('会话创建失败:')+err.message}
});
$('#sd').addEventListener('click',e=>{if(e.target.id==='sd'||e.target.closest('.sd-close'))sdClose()});

/* ---------- 草图渠道/模型(顶栏;共用 image-model-picker.js,存服务端 STATE.image_model_prefs.sketch) ---------- */
const SKM=mountImageModelPicker({kind:'sketch',host:'#skm',label:'🖊 草图模型'});
function skmValue(){return SKM.value()}

/* ---------- 草图画风(2026-09-30,顶栏模型选择后面;按项目存 settings.json output.sketch_style,默认 film) ---------- */
const SKS_API=()=>`/api/v1/projects/${encodeURIComponent($('#project').value.trim()||'demo')}/board-sketch-style`;
async function loadSketchStyle(){
  try{const r=await fetch(SKS_API());if(r.ok){const j=await r.json();$('#sks-sel').value=j.style||'film'}}catch(_){}
}
$('#sks-sel').addEventListener('change',async e=>{
  const style=e.target.value;
  try{
    const r=await fetch(SKS_API(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({style})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.detail||j.error||r.status);
    JumpAnchor.toast(I18N.f('✅ 草图画风已切换为「{s}」,之后出的草图按此画风',{s:e.target.selectedOptions[0].textContent}));
  }catch(err){JumpAnchor.toast(t('画风保存失败:')+err.message);loadSketchStyle()}
});

// 集行:≤12 集逐集按钮(带分镜状态角标),更多时收成一行下拉(/static/ep-picker.js,2026-09-12)
function renderEps(episodes){
  const glyph=e=>(e.has_storyboard?'✅':e.has_plan?'⚠':'–')+(e.sketches?' 🖊'+e.sketches:'');
  EpPicker.render($('#eps'),episodes,EP,ep=>{EP=ep;load()},{
    btnTag:e=>`<span class="st" title="${esc(e.has_storyboard?t('已有分镜草案'):e.has_plan?t('仅导演计划,尚无分镜'):t('无分镜'))}">${glyph(e)}</span>`,
    optTag:glyph});
  $('#eps').appendChild(notesSubmitBtn());   // EpPicker.render 会清空整行,📨 提交注释 必须在这里补回(refreshSketches 轮询/SSE 也走本函数,2026-09-27 修)
}
/* 📨 提交注释(2026-09-26):分集行靠右;本集全部注释(整集/场次/镜,含对象定位信息)由服务端拼成一张修改单发修改师,
   派单成功后 storyboard_notes.json 清空;无注释时禁用 */
function notesSubmitBtn(){
  const n=Object.keys(NOTES||{}).length,b=document.createElement('button');
  b.className='notes-submit editbtn'+(n?' has':'');b.id='notes-submit';b.disabled=!n;
  b.innerHTML=`📨 ${esc(t('提交注释'))}${n?`<span class="st">${n}</span>`:''}`;
  b.title=n?I18N.f('把本集 {n} 条注释(含对象定位信息)一次性发给修改师处理;提交后清空注释',{n}):t('本集暂无注释');
  b.onclick=submitNotes;
  return b;
}
function refreshNotesSubmit(){const old=$('#notes-submit');if(old)old.replaceWith(notesSubmitBtn());else if(LAST)$('#eps').appendChild(notesSubmitBtn())}
async function submitNotes(){
  if(!LAST||!LAST.ep)return;
  const n=Object.keys(NOTES||{}).length;if(!n)return;
  if(!confirm(I18N.f('把本集 {n} 条注释一次性发给修改师处理,并清空这些注释?',{n})))return;
  const proj=$('#project').value.trim()||'demo',b=$('#notes-submit');if(b)b.disabled=true;
  try{
    const r=await fetch(`/api/v1/projects/${encodeURIComponent(proj)}/board/${encodeURIComponent(LAST.ep)}/notes/submit`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.detail||j.error||r.status);
    NOTES={};JumpAnchor.toast(I18N.f('✅ 已把 {n} 条注释发给修改师,注释已清空',{n:j.count??n}));
    load(true);
  }catch(err){JumpAnchor.toast(t('提交失败:')+err.message);refreshNotesSubmit()}
}

/* ---------- 🖨️ 打印(2026-10-01):右下角按钮 → 单独的简洁表格页(只留 草图 / 内容 / 编号 三列)→ 系统打印界面(打印或存 PDF)。
   出页 / 分页 / 缩图 / 桌面端回退都在 /static/print-page.js;这里只拼页眉(本集信息)与表行,场次行(tr.sec)贴住下一镜 ---------- */
const PRINT_CSS=`
col.s{width:68mm}col.s.portrait{width:42mm}col.no{width:25mm}
tr.sec b{margin-right:2mm}
tr.sec .m{color:#555;font-size:9pt;margin-left:3mm}
td.c .ct{white-space:pre-wrap}
td.c .ln{display:flex;gap:1.5mm;align-items:baseline;margin-top:.6mm}
td.c .ln .k{flex:none;width:1.5em;text-align:center}
td.c .ln .v{min-width:0;flex:1}
td.c .ln.un .v{white-space:pre-wrap}
td.c .spk,td.c .nid{font-weight:600}
td.c .nid{margin-right:1.5mm}
td.c .dim,td.c .cast{color:#555;font-size:9.5pt}
td.c .es{color:#777;font-size:8.5pt;margin-left:1.5mm}
td.c .nsrc{display:none}
td.no{font-size:9pt;color:#444;line-height:1.5;word-break:break-all}
td.no b{font-size:12pt;color:#111}
td.no .badge{display:inline-block;border:1px solid #999;border-radius:3px;padding:0 1.2mm;font-size:8.5pt;color:#111}
td.no .grp{color:#777}
`;
$('#printbtn').onclick=()=>{
  if(!LAST||!LAST.has_storyboard)return;
  const d=LAST,ep=d.ep,T=d.totals||{},epi=(d.episodes||[]).find(e=>e.ep===ep)||{};
  const title=(ep+' '+(d.title||epi.title||'')).trim();
  const sub=I18N.f('{n} 场 · {m} 镜草案 · {g} 组草案 · 草案 Σ {d}s',{n:T.scenes??0,m:T.shots??0,g:T.groups??0,d:num(T.draft_sum_s,1)});
  const ar=aspectCss(d.aspect);
  let rows='';
  (d.scenes||[]).forEach(sc=>{
    const nm=sc.location||sc.scene_name||'';
    rows+=`<tr class="sec"><td colspan="3"><b>${esc(sc.scene_no)}</b>${esc(nm)}<span class="m">${sc.time_of_day?esc(sc.time_of_day)+' · ':''}${esc(I18N.f('{n} 镜',{n:sc.shots.length}))}</span></td></tr>`;
    sc.shots.forEach(sh=>{
      const r=SK[sh.key]||{};
      rows+=`<tr><td><div class="shot" style="aspect-ratio:${ar}">${r.url?`<img src="${esc(PrintPage.abs(r.url))}" alt="">`:esc(t('未出草图'))}</div></td><td class="c">${shotContentHtml(sh,true)}</td><td class="no">${shotNoHtml(sh)}</td></tr>`;
    });
  });
  const hint=t('图片加载完后自动弹出打印界面(可打印或存为 PDF)…');
  const how=PrintPage.open({title:t('故事板')+' '+title,lang:I18N.lang,hint,css:PRINT_CSS,rows,
    head:`${esc(title)}<span class="sub">${esc(sub)}</span>`,
    cols:[{label:t('草图'),cls:'s'+(PORTRAIT?' portrait':'')},{label:t('内容')},{label:t('编号'),cls:'no'}]});
  if(how==='iframe')JumpAnchor.toast(hint);
};

async function load(keep){
  const proj=$('#project').value.trim()||'demo';
  history.replaceState(null,'','?project='+encodeURIComponent(proj)+(EP?'&ep='+encodeURIComponent(EP):''));
  SCROLL_HOLD=true;if(!keep)$('#content').innerHTML='<div class="empty">加载中…</div>';
  try{
    const r=await fetch('/api/v1/projects/'+encodeURIComponent(proj)+'/previews/board'+(EP?'?ep='+encodeURIComponent(EP):''));
    if(!r.ok)throw new Error((await r.json()).detail||r.status);
    const d=await r.json();
    EP=d.ep||'';
    if(!(d.episodes||[]).length){$('#eps').innerHTML='';renderNav(null);$('#content').innerHTML=`<div class="empty">${esc(t('该项目还没有分集数据(story/episodes 与 directing 为空)'))}</div>`;return}
    if(!d.episodes.some(e=>e.ep===EP)){EP=d.episodes[0].ep;load(keep);return}
    localStorage.setItem('board-ep:'+(d.project||proj),EP);
    render(d);
  }catch(e){$('#content').innerHTML=`<div class="empty">${t('加载失败:')}${esc(e.message)}</div>`}
}
$('#reload').onclick=()=>load(true);
const _q=new URLSearchParams(location.search);
$('#project').value=_q.get('project')||(JSON.parse(localStorage.getItem('webui_prefs')||'{}').project)||'demo';
EP=_q.get('ep')||localStorage.getItem('board-ep:'+$('#project').value.trim())||'';
load();
loadSketchStyle();

// 右上角预览页切换下拉(项目值走 URL/localStorage,由隐藏 #project 承载)
const PV_PAGES=[['/preview/refs','\u{1F5BC} 参考文件'],['/preview/workflow','\u{1F9ED} 工作流预览'],['/preview/worldview','\u{1F30D} 世界观预览'],['/preview/scenes','\u{1F3D4} 场景预览'],['/preview/characters','\u{1F464} 人物预览'],['/preview/creatures','\u{1F40E} 生物预览'],['/preview/props','\u{1F5E1} 道具预览'],['/preview/script','\u{1F4DC} 剧本预览'],['/preview/board','\u{1F4CB} 故事板'],['/preview/storyboard','\u{1F3A6} 分镜预览'],['/preview/director','\u{1F4FA} 导演台'],['/preview/post','\u{1F39A}\uFE0F 后期处理'],['/preview/videos','\u{1F39E}️ 成片发布']];
PV_PAGES.forEach(([u,n])=>{const o=document.createElement('option');o.value=u;o.textContent=n;if(location.pathname===u)o.selected=true;$('#pvnav').appendChild(o)});
$('#pvnav').onchange=()=>{const p=($('#project').value||'').trim()||'demo';location.href=$('#pvnav').value+'?project='+encodeURIComponent(p)};
</script>
