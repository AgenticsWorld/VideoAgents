<script>
/* 兜底:i18n 运行时未加载(如服务端未挂 /static)时保持中文界面可用 */
if(!window.I18N){
  window.I18N={lang:'zh',langs:{zh:'中文'},t:function(s){return s},
    f:function(s,p){p=p||{};return String(s).replace(/\{(\w+)\}/g,function(m,k){return k in p?p[k]:m})},
    setLang:function(){return Promise.resolve()}};
  window.t=function(s){return s};window.I18N_DICT={};
}
if(!window.MiniMD)window.MiniMD={render:function(s){return '<pre>'+String(s||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</pre>'}};

<style>
:root{
  --bg:#0f1117; --panel:#161a23; --panel2:#1c2130; --border:#2a3040;
  --text:#dde3ee; --dim:#8b93a7; --accent:#6c9ef8; --link:#fb923c; --green:#4ade80;
  --red:#f87171; --yellow:#fbbf24; --purple:#c084fc;
}
*{box-sizing:border-box;margin:0;padding:0}
a{color:var(--link)}
body{background:var(--bg);color:var(--text);font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap}
header h1{font-size:15px;font-weight:600;white-space:nowrap}
header a.back{color:var(--dim);text-decoration:none;font-size:13px}
header a.back:hover{color:var(--accent)}
header .spacer{flex:1}
button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px;font-family:inherit}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.6;cursor:default}
header select,header input{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;cursor:pointer;max-width:260px}
header select:hover{border-color:var(--accent)}
header input{cursor:text;width:220px}
.skm{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);white-space:nowrap}
.skm b{color:var(--text);font-weight:500}
#eps{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel);flex:none}
#eps button{flex:none;white-space:nowrap}
#eps button.on{background:var(--accent);border-color:var(--accent);color:#0b1020;font-weight:600}
#eps button .st{font-size:10px;margin-left:4px;opacity:.75}
#content{flex:1;overflow-y:auto;padding:16px 22px 60px}
.empty{color:var(--dim);text-align:center;margin-top:60px}
h2.title{font-size:19px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
h2.title .sub{color:var(--dim);font-size:13px;font-weight:400}
h2.title .spacer{flex:1}
.src{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);margin-bottom:12px;color:var(--dim)}
.src .msg{flex:1;min-width:200px}
.spin{display:inline-block;animation:spin 1.2s linear infinite}
.src.gate{border-color:rgba(108,158,248,.5);color:var(--text)}
.src.gate b{font-weight:600}
.signbtn{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.signbtn.pri{background:var(--accent);border-color:var(--accent);color:#0b1020;font-weight:600}
.signbtn:disabled{opacity:.6;cursor:default}
.doc.anim>h3 .editbtn{margin-left:0}
@keyframes spin{to{transform:rotate(360deg)}}
/* 导演计划(Markdown 折叠块) */
.doc{border:1px solid var(--border);border-radius:10px;margin:12px 0 18px;overflow:hidden}
.doc>h3{background:var(--panel);padding:9px 14px;font-size:13.5px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px}
.doc>h3 .meta{color:var(--dim);font-weight:400;font-size:12px}
.doc>h3 .editbtn{margin-left:auto}
.doc>h3::before{content:'▾ ';color:var(--dim)}
.doc.closed>h3::before{content:'▸ '}
.doc.closed>.body{display:none}
.doc>.body{padding:14px 20px;background:var(--panel2);max-height:70vh;overflow-y:auto}
.md{font-size:13.5px;line-height:1.75;color:#c8d0e0}
.md h1,.md h2,.md h3,.md h4{color:var(--text);margin:14px 0 6px;line-height:1.4}
.md h1{font-size:18px}.md h2{font-size:16px;border-bottom:1px solid var(--border);padding-bottom:4px}.md h3{font-size:14.5px}.md h4{font-size:13.5px}
.md p{margin:6px 0}
.md ul,.md ol{margin:6px 0 6px 22px}
.md li{margin:2px 0}
.md blockquote{border-left:3px solid var(--accent);padding:4px 12px;margin:8px 0;color:var(--dim);background:rgba(108,158,248,.05);border-radius:0 6px 6px 0}
.md code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:rgba(255,255,255,.07);padding:0 4px;border-radius:4px}
.md pre{background:#0f1117;border:1px solid var(--border);border-radius:8px;padding:10px 12px;overflow-x:auto;margin:8px 0}
.md pre code{background:none;padding:0}
.md hr{border:0;border-top:1px solid var(--border);margin:12px 0}
.md .md-table{overflow-x:auto;margin:8px 0}
.md table{border-collapse:collapse;font-size:12.5px;min-width:60%}
.md th,.md td{border:1px solid var(--border);padding:5px 9px;vertical-align:top;text-align:left}
.md th{background:var(--panel);color:var(--dim);font-weight:500}
.md a{color:var(--link)}
/* 场次卡 */
.scene{border:1px solid var(--border);border-radius:10px;margin:0 0 18px;overflow:hidden;background:var(--panel)}
.scene>.hd{padding:10px 14px;background:#1a2033;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.scene .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.scene .no{font-weight:700;color:var(--accent);font-size:15px}
.scene .nm{font-weight:600}
.scene .meta{color:var(--dim);font-size:12.5px}
.scene .row1 .spacer{flex:1}
.scene .assets{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.achip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:20px;padding:2px 9px 2px 2px;font-size:12px;background:var(--panel2);white-space:nowrap}
.achip img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:top;background:#0f1117;flex:none}
.achip.sc img{width:56px;height:36px;border-radius:6px;object-position:center}
.achip .ph{width:30px;height:30px;border-radius:50%;background:#2a3040;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.achip.sc .ph{width:56px;height:36px;border-radius:6px}
.achip .cid{color:var(--dim);font-size:10px;font-family:ui-monospace,Menlo,monospace}
.achip.k{color:var(--dim);border-style:dashed;padding-left:8px}
.scene .note{color:var(--dim);font-size:12.5px;white-space:pre-wrap}
.scene .note b{color:var(--text);font-weight:500}
/* 分镜表 */
table.sb{width:100%;border-collapse:collapse;font-size:13px}
table.sb th{background:var(--panel);color:var(--dim);font-weight:500;text-align:left;padding:6px 12px;border-bottom:1px solid var(--border);font-size:12px}
table.sb td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
table.sb tr:last-child td{border-bottom:0}
table.sb tr:hover td{background:rgba(108,158,248,.04)}
td.no{width:118px;white-space:nowrap;color:var(--dim);font-size:12px;line-height:1.5}
td.no b{color:var(--text);font-size:15px}
td.no .badge{display:inline-block;border:1px solid var(--border);border-radius:4px;padding:0 5px;font-size:11px;color:var(--text);margin:2px 0}
td.no .fin{color:var(--green)}
td.no .fin.grp{color:var(--dim)}
td.c{line-height:1.7}
td.c .ct{white-space:pre-wrap}
td.c .ln{display:flex;gap:6px;align-items:baseline;margin:2px 0}
td.c .ln .k{flex:none;width:1.5em;text-align:center}
td.c .ln .v{min-width:0;flex:1}
td.c .dl .spk{font-weight:600;white-space:nowrap}
td.c .dl .tx{color:var(--yellow)}
td.c .dl .es{color:var(--dim);font-size:11.5px;margin-left:6px}
td.c .dim{color:var(--dim);font-size:12.5px}
td.c .nar{color:var(--purple)}
td.c .cast{font-size:12px;color:var(--dim)}
td.s{width:236px}
td.s.portrait{width:150px}
td.e{width:1%;white-space:nowrap;text-align:right}
.skbox{position:relative;width:212px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#0b0d12;display:flex;align-items:center;justify-content:center;cursor:pointer}
.skbox.portrait{width:126px}
.skbox img{width:100%;height:100%;object-fit:cover;display:block;filter:none}
.skbox .ph{color:var(--dim);font-size:12px;text-align:center;padding:6px}
.skbox .st{position:absolute;left:0;right:0;bottom:0;background:rgba(15,17,23,.8);color:var(--text);font-size:11.5px;padding:2px 6px;text-align:center}
.skbox.busy img{opacity:.45}
.skbox .st.f{color:var(--red)}.skbox .st.r{color:var(--yellow)}.skbox .st.q{color:var(--dim)}
.skbtns{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.skinfo{color:var(--dim);font-size:11px;margin-top:3px;max-width:212px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.editbtn{font-size:11px;padding:1px 7px;flex:none;background:var(--panel2);border:1px solid var(--border);border-radius:5px;color:var(--dim);cursor:pointer;font-family:inherit;white-space:nowrap}
.editbtn:hover{color:var(--accent);border-color:var(--accent)}
.editbtn.pri{color:var(--text)}
.editbtn.sm{font-size:10.5px;padding:0 5px;opacity:.75}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:96;cursor:zoom-out;flex-direction:column;gap:8px}
#lb img{max-width:92vw;max-height:84vh;border-radius:8px;box-shadow:0 10px 40px #000}
#lb .cap{color:var(--dim);font-size:12.5px;max-width:92vw;text-align:center}
.legend{font-size:11.5px;color:var(--dim);margin:8px 2px 0;display:flex;gap:14px;flex-wrap:wrap}
@media(max-width:900px){td.s{width:160px}.skbox{width:140px}td.no{width:90px}}
</style>
</head>
<body>
<header>
  <a class="back" href="/">← 控制台</a>
  <h1>📋 故事板预览</h1>
  <div class="spacer"></div>
  <span class="skm" id="skm" title="草图用的图像渠道/模型(与全局「生成模型」设置分开,草图一般用便宜模型即可;空=跟随全局)">🖊 草图模型 <select id="sk-prov"></select><select id="sk-model"></select><input id="sk-custom" placeholder="自定义模型 id" hidden></span>
  <input type="hidden" id="project">
  <select id="pvnav" title="切换预览页"></select>
  <button id="reload">刷新</button>
</header>
<div id="eps"></div>
<div id="content"><div class="empty">加载中…</div></div>
<div id="lb"><img alt=""><div class="cap"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let EP='',LAST=null,SK={},JOBS={},REDRAW={},LOCAL_REDRAW={},POLL=null,PORTRAIT=false,ANIM={},GATE={};
const num=(v,d=1)=>v==null||isNaN(v)?'—':(+v).toFixed(d).replace(/\.0$/,'');
const secs=v=>v==null?'—':num(v,1)+'s';
const clip=(s,n)=>{s=String(s||'').replace(/\s+/g,' ');return s.length>n?s.slice(0,n)+'…':s};
const PROV_NAMES={agentics:'Agentics',openrouter:'OpenRouter',volcengine:'火山引擎',byteplus:'BytePlus',fal:'Fal',minimax:'MiniMax',ideogram:'Ideogram',comfyui:'ComfyUI'};
function todIcon(s){
  if(!s)return '';
  if(/黄昏|傍晚|暮|夕|日暮|dusk|sunset/i.test(s))return '🌇';
  if(/深夜|入夜|夜|晚|凌晨|night/i.test(s))return '🌙';
  if(/清晨|黎明|晨|早|dawn|morning/i.test(s))return '🌅';
  if(/午后|下午|afternoon/i.test(s))return '🌤';
  if(/日|白天|正午|午|day|noon/i.test(s))return '☀️';
  return '🕒';
}
const A=()=>(LAST&&LAST.assets)||{characters:{},scenes:{},creatures:{},props:{}};
const cname=id=>((A().characters[id]||A().creatures[id]||{}).name)||id||'?';
/* 资产 chip:缩略图 + 名字(缺图给占位符号) */
function aChip(kind,id,icon){
  const rec=(A()[kind]||{})[id]||{name:id};
  const img=rec.url?`<img src="${esc(rec.url)}" alt="" loading="lazy">`:`<span class="ph">${icon}</span>`;
  return `<span class="achip ${kind==='scenes'?'sc':''}" title="${esc(id)}${rec.url?'':' · '+esc(t('尚无概念图'))}" data-img="${esc(rec.url||'')}" data-cap="${esc((rec.name||id)+' '+id)}">${img}<span>${esc(rec.name||id)}</span>${rec.name&&rec.name!==id?`<span class="cid">${esc(id)}</span>`:''}</span>`;
}
/* ✏️ 修改:默认发总制片(故事板改动牵涉上下游);草图修改另发草图工位(data-agent) */
function editBtn(loc,cls,label,agent){
  return `<button class="editbtn ${cls||''}" data-loc="${esc(loc)}"${agent?` data-agent="${esc(agent)}"`:''} title="${esc(agent?t('对这张草图提修改意见,由分镜草图工位重绘'):t('对这一块提修改意见,发给总制片统筹处理(会牵涉分镜/镜头表等上下游)'))}">✏️ ${esc(label||t('修改'))}</button>`;
}
document.addEventListener('click',e=>{
  const lbimg=e.target.closest('[data-img]');
  if(lbimg&&!e.target.closest('button')&&lbimg.dataset.img){showLb(lbimg.dataset.img,lbimg.dataset.cap);return}
  const b=e.target.closest('.editbtn');if(!b||!b.dataset.loc)return;
  const proj=$('#project').value.trim()||'demo';
  if(b.dataset.agent&&b.dataset.key){
    const key=b.dataset.key;
    EditPopup.open({project:proj,agent:b.dataset.agent,compose:b.dataset.loc+'\n'+t('修改意见:'),
      onSent:j=>{LOCAL_REDRAW[key]=Date.now();REDRAW[key]=j.run_id||'?';renderCell(key);startPoll()}});
    return;
  }
  EditPopup.open({project:proj,compose:t('修改 ')+b.dataset.loc+'\n'+t('修改意见:'),agent:b.dataset.agent||''});
});
function showLb(url,cap){const lb=$('#lb');lb.querySelector('img').src=url;lb.querySelector('.cap').textContent=cap||'';lb.style.display='flex'}
$('#lb').onclick=()=>{$('#lb').style.display='none'};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#lb').style.display==='flex')$('#lb').style.display='none'});

/* ---------- 渲染 ---------- */
function render(d){
  LAST=d;SK=d.sketches||{};JOBS=d.jobs||{};REDRAW=mergeRedraw(d.redraw_runs||{});ANIM=d.animatic||{};GATE=d.gate||{};
  PORTRAIT=aspectPortrait(d.aspect);
  renderEps(d.episodes||[]);
  renderSkm(d);
  const box=$('#content'),ep=d.ep;
  if(!ep){box.innerHTML=`<div class="empty">${esc(t('该项目还没有分集数据(story/episodes 与 directing 为空)'))}</div>`;return}
  const epi=(d.episodes||[]).find(e=>e.ep===ep)||{};
  const T=d.totals||{};
  let h=`<h2 class="title">${esc(ep)} ${esc(d.title||epi.title||'')}<span class="sub">${d.has_storyboard?esc(I18N.f('{n} 场 · {m} 镜草案 · {g} 组草案 · 草案 Σ {d}s',{n:T.scenes??0,m:T.shots??0,g:T.groups??0,d:num(T.draft_sum_s,1)})):''}${T.final_total_s!=null?esc(I18N.f(' · 定稿 {f}s / 预算 {b}s({s} 镜 {g} 组)',{f:num(T.final_total_s,1),b:T.budget_s==null?'—':num(T.budget_s,0),s:T.final_shots??'—',g:T.final_groups??'—'})):''}</span><span class="spacer"></span>${editBtn(I18N.f('故事板 {ep} {title}(整体反馈;文件 directing/{ep}/storyboard.json、directing_plan.md)',{ep,title:d.title||epi.title||''}))}</h2>`;
  const sm=d.storyboard_meta||{};
  if(d.has_storyboard)h+=`<div class="src"><span>🎬</span><span class="msg">${esc(I18N.f('分镜层产物 directing/{ep}/storyboard.json',{ep}))}${sm.task_id?` · ${esc(sm.task_id)}`:''}${sm.written_at?` · ${esc(sm.written_at)}`:''}${sm.status?` · ${esc(sm.status)}`:''} · ${esc(t('草图为铅笔手绘小图,只用于看构图与调度,不进视频参考图'))}</span></div>`;
  if(d.has_storyboard)h+=`<div id="gatebox">${gateHtml()}</div><div id="animbox">${animHtml()}</div>`;
  if(d.directing_plan){
    h+=`<div class="doc closed"><h3 onclick="if(!event.target.closest('.editbtn'))this.parentNode.classList.toggle('closed')">🎬 ${esc(t('导演计划'))} <span class="meta">directing_plan.md${d.directing_plan_mtime?' · '+esc(new Date(d.directing_plan_mtime*1000).toLocaleString()):''}</span>${editBtn(I18N.f('导演计划 {ep}(文件 directing/{ep}/directing_plan.md)',{ep}))}</h3><div class="body"><div class="md" data-no-i18n>${MiniMD.render(d.directing_plan)}</div></div></div>`;
  }
  if(!d.has_storyboard){
    h+=`<div class="empty">${esc(I18N.f('该集分镜层尚未产出 storyboard.json(directing/{ep}/);导演计划{p}',{ep,p:d.directing_plan?t('已在上方'):t('也还没有')}))}</div>`;
    box.innerHTML=h;return;
  }
  (d.scenes||[]).forEach(sc=>{h+=sceneCard(sc,d)});
  h+=`<div class="legend"><span>💬 ${esc(t('对白'))}</span><span>🎙 ${esc(t('旁白挂点'))}</span><span>🎬 ${esc(t('动作'))}</span><span>📐 ${esc(t('构图草描'))}</span><span>📝 ${esc(t('备注'))}</span><span>${esc(t('绿色 shNNN = 镜头表定稿镜号/时长/组'))}</span></div>`;
  box.innerHTML=h;
  if(anyBusy())startPoll();
}
/* ---------- H3S 故事板签字(workflow.yaml g6s):答复总制片发的签字卡,与控制台同一条 ---------- */
function gateHtml(){
  const g=GATE||{},ep=LAST.ep;
  if(!g.in_dag&&!(g.pending||[]).length&&!g.signed)return '';

/* ---------- 动态样片(code/animatic.py,零生成费用):草图按时长串片 + 台词/旁白字幕 ---------- */
function animHtml(){
  const a=ANIM||{},ep=LAST.ep,T=LAST.totals||{};
  const missing=a.exists?(a.missing_sketches??0):Math.max(0,(T.shots||0)-(a.sketches_done||0));
  let st='';
  if(a.running)st=`<span class="spin">⏳</span> ${esc(t('生成中…'))}`;
  else if(a.error)st=`<span style="color:var(--red)">❌ ${esc(clip(a.error,80))}</span>`;
  else if(a.exists&&a.stale)st=`<span style="color:var(--yellow)">⚠ ${esc(t('样片已过期(草图或分镜时长变了),建议重出'))}</span>`;
  else if(a.exists)st=`<span style="color:var(--green)">✓ ${esc(a.created_at||'')}</span>`;
  const missTxt=missing?` · <span style="color:var(--yellow)">${esc(I18N.f('缺 {n} 张草图(占位卡顶替)',{n:missing}))}</span>`:'';
  let h=`<div class="doc closed anim"><h3 onclick="if(!event.target.closest('button'))this.parentNode.classList.toggle('closed')">🎞 ${esc(t('动态样片'))} <span class="meta">${a.exists?esc(I18N.f('{d}s · {n} 镜 · 时长口径 {s}',{d:num(a.duration_s,0),n:a.shots??'—',s:a.duration_source==='final'?t('定稿'):a.duration_source==='draft'?t('草案'):t('定稿+草案')})+(a.audio_tracks?' · 🔊 '+a.audio_tracks:'')):esc(t('尚未生成'))}${missTxt}</span><span style="margin-left:auto;display:inline-flex;gap:6px;align-items:center;font-size:12px">${st}<button class="editbtn pri animbtn" ${a.running?'disabled':''} title="${esc(t('把本集草图按时长串成样片并烧入台词/旁白字幕(有旁白/对白音轨则混入);缺图的镜用占位卡,不花生成费用'))}">🎞 ${esc(a.exists?t('重出样片'):t('出动态样片'))}</button></span></h3>`;
  h+=`<div class="body">${a.exists?`<video controls preload="metadata" src="${esc(a.url)}" style="width:min(100%,720px);border-radius:8px;background:#000;display:block"></video><div class="meta" style="color:var(--dim);font-size:12px;margin-top:6px">${esc(a.path||'')}${a.size_mb!=null?` · ${a.size_mb} MB`:''} · ${esc(t('也在「视频预览」页可看'))}</div>`:`<div style="color:var(--dim);font-size:13px">${esc(t('点右上「出动态样片」生成;草图没出全也能出,缺图的镜显示画面内容文字'))}</div>`}</div></div>`;
  return h;
}

function aspectPortrait(a){const m=/^(\d+):(\d+)$/.exec(a||'');return !!m&&+m[1]<+m[2]}
function aspectCss(a){const m=/^(\d+):(\d+)$/.exec(a||'');return m?`${m[1]}/${m[2]}`:'16/9'}
function mergeRedraw(server){
  const out=Object.assign({},server);
  // 刚发出的重绘工单服务端列表可能还没收进(异步),本地保 20s
  Object.keys(LOCAL_REDRAW).forEach(k=>{if(Date.now()-LOCAL_REDRAW[k]<20000){if(!out[k])out[k]=REDRAW[k]||'?'}else delete LOCAL_REDRAW[k]});
  return out;
}

function sceneCard(sc,d){

  hd+=`<span class="meta">${sc.scene_id?esc(sc.scene_id)+' · ':''}${sc.time_of_day?todIcon(sc.time_of_day)+' '+esc(sc.time_of_day)+' · ':''}⏱ ${esc(t('分配'))} ${secs(sc.alloc_s)} · ${esc(t('草案'))} ${secs(sc.draft_sum_s)}${sc.final_sum_s!=null?' · '+esc(t('定稿'))+' '+secs(sc.final_sum_s):''} · ${esc(I18N.f('{n} 镜 · {g} 组',{n:sc.shots.length,g:sc.group_count}))}</span><span class="spacer"></span>`;

  hd+=editBtn(I18N.f('故事板 {ep} 场次 {no}{name}(文件 directing/{ep}/storyboard.json scenes[{no}])',{ep,no:sc.scene_no,name:sc.location?' '+sc.location:''}))+`</div>`;

  if(sh.shot_id)no+=`<div title="${esc(t('分镜草案镜号'))}">${esc(sh.shot_id)}</div>`;

    else c+=`<div class="ln dl"><span class="k">💬</span><span class="v"><span class="spk">${esc(l.name||cname(l.speaker)||'')}${l.name||l.speaker?':':''}</span> <span class="tx">${esc(l.text)}</span>${l.est_s!=null?`<span class="es">${secs(l.est_s)}</span>`:''}</span></div>`;
  });
  if((sh.narration_ref||[]).length)c+=`<div class="ln"><span class="k">🎙</span><span class="v nar">${esc(sh.narration_ref.join(' · '))}</span></div>`;
  if(sh.sketch)c+=`<div class="ln"><span class="k">📐</span><span class="v dim">${esc(sh.sketch)}</span></div>`;   // 构图草描用 📐,✏️ 留给「修改/反馈」按钮
  if(sh.extras)c+=`<div class="ln"><span class="k">👥</span><span class="v dim">${esc(sh.extras)}</span></div>`;

  if(sh.beat)c+=`<div class="ln"><span class="k">🎯</span><span class="v dim">${esc(sh.beat)}</span></div>`;
  if(sh.notes)c+=`<div class="ln"><span class="k">📝</span><span class="v dim" title="${esc(sh.notes)}">${esc(clip(sh.notes,160))}</span></div>`;
  const loc=I18N.f('故事板 {ep} 场次 {no} 第 {o} 镜「{txt}」(文件 directing/{ep}/storyboard.json scenes[{no}].shots_draft[order:{o}])',{ep,no:sc.scene_no,o:sh.order,txt:clip(sh.content,24)});
  return `<tr data-row="${esc(sh.key)}"><td class="no">${no}</td><td class="c" data-no-i18n>${c}</td><td class="s ${PORTRAIT?'portrait':''}" data-cell="${esc(sh.key)}">${sketchCell(sc,sh,ep)}</td><td class="e">${editBtn(loc,'sm',t('反馈'))}</td></tr>`;

function sketchCell(sc,sh,ep){
  const r=SK[sh.key]||{};
  const redraw=REDRAW[sh.key];
  let st='',cls='';
  if(redraw){st=`<span class="spin">🎨</span> ${esc(t('重绘中'))}`;cls='r'}
  else if(r.status==='queued'){st='⏳ '+esc(t('排队'));cls='q'}
  else if(r.status==='running'){st=`<span class="spin">🔄</span> ${esc(t('生成中'))}`;cls='r'}
  else if(r.status==='failed'){st='❌ '+esc(clip(r.error||t('失败'),40));cls='f'}
  else if(r.status==='missing'){st='⚠ '+esc(t('文件缺失'));cls='f'}
  const busy=!!redraw||r.status==='queued'||r.status==='running';
  const cap=`${ep} ${sc.scene_no} #${sh.order} · ${clip(sh.content,60)}`;
  let h=`<div class="skbox ${PORTRAIT?'portrait':''} ${busy?'busy':''}" style="aspect-ratio:${aspectCss(LAST.aspect)}" ${r.url?`data-img="${esc(r.url)}" data-cap="${esc(cap)}"`:''} title="${esc(r.status==='failed'?(r.error||''):(r.prompt||''))}">${r.url?`<img src="${esc(r.url)}" alt="" loading="lazy">`:`<div class="ph">${busy?'':'🖊 '+esc(t('未出草图'))}</div>`}${st?`<div class="st ${cls}">${st}</div>`:''}</div>`;
  h+=`<div class="skbtns"><button class="editbtn sk-gen" data-scene="${esc(sc.scene_no)}" data-order="${sh.order}" ${busy?'disabled':''} title="${esc(t('按当前草图模型出/重出这一镜的草图'))}">${r.url?'↻ '+esc(t('重出')):'🖊 '+esc(t('出图'))}</button>`;
  if(r.url)h+=`<button class="editbtn" data-agent="${esc((LAST.agents||{}).sketch||'07-directing/storyboard-sketch')}" data-key="${esc(sh.key)}" data-loc="${esc(I18N.f('[草图 {ep}/{key}] 修改分镜草图 {ep} 场次 {no} 第 {o} 镜(项目 {p};图片 {dir}/{key}.png,台账 {dir}/index.json;镜头内容:{txt})',{ep,key:sh.key,no:sc.scene_no,o:sh.order,p:LAST.project||'',dir:LAST.sketch_dir||('assets/storyboard/'+ep),txt:clip(sh.content,40)}))}" ${busy?'disabled':''}>✏️ ${esc(t('改草图'))}</button>`;
  h+=`</div>`;
  if(r.note||r.model)h+=`<div class="skinfo" title="${esc((r.note?t('修改意见:')+r.note+'\n':'')+(r.provider||'')+' '+(r.model||''))}">${r.note?'📝 '+esc(clip(r.note,30))+' · ':''}${esc(r.model||r.provider||'')}</div>`;
  return h;
}
function renderCell(key){
  const td=document.querySelector(`[data-cell="${CSS.escape(key)}"]`);if(!td||!LAST)return;
  for(const sc of LAST.scenes||[]){const sh=sc.shots.find(s=>s.key===key);if(sh){td.innerHTML=sketchCell(sc,sh,LAST.ep);return}}
}
function renderSceneHead(scene_no){
  const el=document.getElementById('sc-'+scene_no);if(!el||!LAST)return;
  const sc=(LAST.scenes||[]).find(s=>s.scene_no===scene_no);if(!sc)return;
  const tmp=document.createElement('div');tmp.innerHTML=sceneCard(sc,LAST);
  el.querySelector('.hd').innerHTML=tmp.querySelector('.hd').innerHTML;
}
function anyBusy(){
  return !!(ANIM&&ANIM.running)||Object.keys(REDRAW).length>0||Object.values(JOBS).some(j=>j.status==='running')||Object.values(SK).some(r=>r.status==='queued'||r.status==='running');
}

/* ---------- 草图台账刷新(SSE 事件 + 轮询兜底) ---------- */
async function refreshSketches(){
  if(!LAST||!LAST.ep)return;
  const proj=$('#project').value.trim()||'demo',ep=LAST.ep;
  try{
    const r=await fetch(`/api/v1/projects/${encodeURIComponent(proj)}/board/${encodeURIComponent(ep)}/sketches`);
    if(!r.ok)return;
    const j=await r.json();
    if(!LAST||LAST.ep!==ep)return;
    const oldSK=SK,oldJ=JOBS,oldR=REDRAW;
    SK=j.sketches||{};JOBS=j.jobs||{};REDRAW=mergeRedraw(j.redraw_runs||{});
    const oldA=JSON.stringify(ANIM),oldG=JSON.stringify(GATE);ANIM=j.animatic||ANIM;GATE=j.gate||GATE;
    if(JSON.stringify(ANIM)!==oldA||JSON.stringify(GATE)!==oldG)refreshTop();
    const keys=new Set([...Object.keys(oldSK),...Object.keys(SK),...Object.keys(oldR),...Object.keys(REDRAW)]);
    keys.forEach(k=>{if(JSON.stringify(oldSK[k])!==JSON.stringify(SK[k])||oldR[k]!==REDRAW[k])renderCell(k)});
    const scs=new Set([...Object.keys(oldJ),...Object.keys(JOBS)]);
    (LAST.scenes||[]).forEach(sc=>{if(scs.has(sc.scene_no)||keys.size)renderSceneHead(sc.scene_no)});
    (LAST.episodes||[]).forEach(e=>{if(e.ep===ep)e.sketches=Object.values(SK).filter(r=>r.status==='done').length});
    renderEps(LAST.episodes||[]);
  }catch(_){}
}
function startPoll(){
  if(POLL)return;
  POLL=setInterval(async()=>{await refreshSketches();if(!anyBusy()){clearInterval(POLL);POLL=null}},4000);
}
try{
  const es=new EventSource('/api/v1/events');
  es.onmessage=e=>{
    try{
      const ev=JSON.parse(e.data),proj=$('#project').value.trim()||'demo';
      if((ev.type==='board_sketch'||ev.type==='board_animatic')&&ev.project===proj&&LAST&&ev.ep===LAST.ep)refreshSketches();
      else if((ev.type==='confirm'||ev.type==='confirm_done')&&LAST)refreshSketches();   // 签字卡出现/答复 → 刷新签字条
      else if(ev.type==='run'&&ev.run&&ev.run.project===proj&&LAST&&ev.run.agent===(LAST.agents||{}).sketch)refreshSketches();
    }catch(_){}
  };
}catch(_){}

/* ---------- 草图渠道/模型(顶栏;存服务端 STATE,与全局「生成模型」分开) ---------- */
function skmValue(){
  const p=effProv(),m=$('#sk-model').value==='__custom__'?$('#sk-custom').value.trim():$('#sk-model').value;
  const g=(LAST&&LAST.global_image)||{};
  if(!$('#sk-prov').value&&(!m||m===g.model))return {};      // 跟随全局且模型没改:不传,按全局
  return p?{provider:p,model:m}:{};
}
function renderSkm(d){
  const ch=d.image_channels||[],cur=d.sketch_model||{},g=d.global_image||{};
  const sp=$('#sk-prov');sp.innerHTML='';
  const o0=document.createElement('option');o0.value='';o0.textContent=I18N.f('跟随全局({p} · {m})',{p:PROV_NAMES[g.provider]||g.provider||'—',m:clip(g.model||'—',28)});sp.appendChild(o0);
  ch.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=(PROV_NAMES[c.id]||c.id)+(c.configured?'':' ('+t('未配置')+')');o.disabled=!c.configured;sp.appendChild(o)});
  sp.value=ch.some(c=>c.id===cur.provider&&c.configured)?cur.provider:'';
  fillSkModels(cur.model||'');
}
// 模型下拉常显:渠道选「跟随全局」时列全局图像渠道的模型(当前全局模型预选),直接换模型即等于选定该渠道+模型
function effProv(){return $('#sk-prov').value||((LAST&&LAST.global_image)||{}).provider||''}
function fillSkModels(model){
  const p=effProv(),sm=$('#sk-model'),ci=$('#sk-custom');sm.innerHTML='';
  const ch=((LAST&&LAST.image_channels)||[]).find(c=>c.id===p)||{};
  if(!p||p==='comfyui'){sm.hidden=true;ci.hidden=true;return}
  sm.hidden=false;
  const list=(IMAGE_MODEL_LISTS[p]||[]).slice();
  if(ch.model&&!list.some(x=>x[0]===ch.model))list.unshift([ch.model,ch.model+' ('+t('当前全局')+')']);
  if(!model)model=ch.model||(list[0]||[''])[0];
  list.forEach(([id,label])=>{const o=document.createElement('option');o.value=id;o.textContent=clip(label||id,46);o.title=id;sm.appendChild(o)});
  const oc=document.createElement('option');oc.value='__custom__';oc.textContent=t('自定义…');sm.appendChild(oc);
  if(list.some(x=>x[0]===model))sm.value=model;else{sm.value='__custom__';ci.value=model}
  ci.hidden=sm.value!=='__custom__';
}
async function saveSkm(){
  const v=skmValue();
  try{await fetch('/api/v1/config/sketch-model',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:v.provider||'',model:v.model||''})});
    if(LAST)LAST.sketch_model={provider:v.provider||'',model:v.model||''};
  }catch(_){}
}
$('#sk-prov').onchange=()=>{fillSkModels('');saveSkm()};
$('#sk-model').onchange=()=>{
  // 跟随全局状态下换了模型:渠道落到全局渠道并保存,顶栏渠道下拉同步显示
  if(!$('#sk-prov').value&&$('#sk-model').value!==((LAST&&LAST.global_image)||{}).model){$('#sk-prov').value=effProv()}
  $('#sk-custom').hidden=$('#sk-model').value!=='__custom__';if($('#sk-model').value!=='__custom__')saveSkm();else $('#sk-custom').focus()};
$('#sk-custom').onchange=saveSkm;

function renderEps(episodes){
  const box=$('#eps');box.innerHTML='';
  episodes.forEach(e=>{
    const b=document.createElement('button');
    b.className=e.ep===EP?'on':'';
    b.innerHTML=esc(e.ep)+`<span class="st" title="${esc(e.has_storyboard?t('已有分镜草案'):e.has_plan?t('仅导演计划,尚无分镜'):t('无分镜'))}">${e.has_storyboard?'✅':e.has_plan?'⚠':'–'}${e.sketches?' 🖊'+e.sketches:''}</span>`;
    if(e.title)b.title=e.title;
    b.onclick=()=>{EP=e.ep;load()};
    box.appendChild(b);
  });
}

async function load(keep){
  const proj=$('#project').value.trim()||'demo';
  history.replaceState(null,'','?project='+encodeURIComponent(proj)+(EP?'&ep='+encodeURIComponent(EP):''));
  if(!keep)$('#content').innerHTML='<div class="empty">加载中…</div>';
  try{
    const r=await fetch('/api/v1/projects/'+encodeURIComponent(proj)+'/previews/board'+(EP?'?ep='+encodeURIComponent(EP):''));
    if(!r.ok)throw new Error((await r.json()).detail||r.status);
    const d=await r.json();
    EP=d.ep||'';
    if(!(d.episodes||[]).length){$('#eps').innerHTML='';renderSkm(d);$('#content').innerHTML=`<div class="empty">${esc(t('该项目还没有分集数据(story/episodes 与 directing 为空)'))}</div>`;return}
    if(!d.episodes.some(e=>e.ep===EP)){EP=d.episodes[0].ep;load(keep);return}
    localStorage.setItem('board-ep:'+(d.project||proj),EP);
    render(d);
  }catch(e){$('#content').innerHTML=`<div class="empty">${t('加载失败:')}${esc(e.message)}</div>`}
}
$('#reload').onclick=()=>load(true);
const _q=new URLSearchParams(location.search);
$('#project').value=_q.get('project')||(JSON.parse(localStorage.getItem('webui_prefs')||'{}').project)||'demo';
EP=_q.get('ep')||localStorage.getItem('board-ep:'+$('#project').value.trim())||'';
load();

// 右上角预览页切换下拉(项目值走 URL/localStorage,由隐藏 #project 承载)
const PV_PAGES=[['/preview/refs','\u{1F5BC} 参考文件'],['/preview/workflow','\u{1F9ED} 工作流预览'],['/preview/worldview','\u{1F30D} 世界观预览'],['/preview/scenes','\u{1F3D4} 场景预览'],['/preview/characters','\u{1F464} 人物预览'],['/preview/creatures','\u{1F40E} 生物预览'],['/preview/props','\u{1F5E1} 道具预览'],['/preview/script','\u{1F4DC} 剧本预览'],['/preview/board','\u{1F4CB} 故事板预览'],['/preview/storyboard','\u{1F3AC} 分镜预览'],['/preview/videos','\u{1F39E}️ 视频预览']];
PV_PAGES.forEach(([u,n])=>{const o=document.createElement('option');o.value=u;o.textContent=n;if(location.pathname===u)o.selected=true;$('#pvnav').appendChild(o)});
$('#pvnav').onchange=()=>{const p=($('#project').value||'').trim()||'demo';location.href=$('#pvnav').value+'?project='+encodeURIComponent(p)};
</script>
