<script>
/* 兜底:i18n 运行时未加载(如服务端未挂 /static)时保持中文界面可用 */
if(!window.I18N){
  window.I18N={lang:'zh',langs:{zh:'中文'},t:function(s){return s},
    f:function(s,p){p=p||{};return String(s).replace(/\{(\w+)\}/g,function(m,k){return k in p?p[k]:m})},
    setLang:function(){return Promise.resolve()}};
  window.t=function(s){return s};window.I18N_DICT={};
}

<style>
:root{
  --bg:#0f1117; --panel:#161a23; --panel2:#1c2130; --border:#2a3040;
  --text:#dde3ee; --dim:#8b93a7; --accent:#6c9ef8; --link:#fb923c; --green:#4ade80;
  --red:#f87171; --yellow:#fbbf24; --purple:#c084fc;
}
*{box-sizing:border-box;margin:0;padding:0}
a{color:var(--link)}
body{background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:15px;font-weight:600}
header .spacer{flex:1}
a.back{color:var(--dim);text-decoration:none;font-size:13px}
a.back:hover{color:var(--accent)}
select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:13px}
select:focus{outline:none;border-color:var(--accent)}
main{max-width:860px;margin:0 auto;padding:22px 18px 60px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 16px}
button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px;flex:none}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
#global-status{display:none;font-size:13px;border:1px solid var(--border);border-radius:10px;padding:10px 14px;background:var(--panel2)}
#global-status.show{display:block}
#global-status .err{color:var(--red)}
.card.copy h3{font-size:13px;color:var(--accent);margin-bottom:6px}
.card.copy p{font-size:12px;color:var(--dim);margin-bottom:10px}
.copy-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.copy-row input{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;flex:1;min-width:200px;font-family:ui-monospace,Menlo,monospace}
.copy-row input:focus{outline:none;border-color:var(--accent)}
#copy-status{display:none;font-size:12px;margin-top:8px}
#copy-status.show{display:block}
.card.danger{border-color:#7f1d1d}
.card.danger h3{font-size:13px;color:var(--red);margin-bottom:6px}
.card.danger p{font-size:12px;color:var(--dim);margin-bottom:10px}
.danger-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.danger-row input{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;flex:1;min-width:200px}
.danger-row input:focus{outline:none;border-color:var(--red)}
button.red{background:#b91c1c;border-color:#b91c1c;color:#fff;font-weight:600}
button.red:hover{background:#dc2626;border-color:#dc2626}
button.red:disabled{background:var(--panel2);border-color:var(--border);color:var(--dim);font-weight:400}
#del-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;align-items:center;justify-content:center}
#del-modal .box{background:var(--panel);border:1px solid #7f1d1d;border-radius:12px;padding:20px 22px;max-width:420px;display:flex;flex-direction:column;gap:12px}
#del-modal .box h3{font-size:14px;color:var(--red)}
#del-modal .box p{font-size:13px;color:var(--text)}
#del-modal .box .sub{font-size:12px;color:var(--dim)}
#del-modal .btns{display:flex;gap:10px;justify-content:flex-end}
</style>
</head>
<body>
<header>
  <a class="back" href="/">← 返回控制台</a>
  <h1>🧬 版本管理</h1>
  <div class="spacer"></div>
  <label style="font-size:12px;color:var(--dim)">项目</label>
  <select id="project"></select>
</header>
<main>
  <div class="card copy" id="copy-card">
    <h3>📋 复制项目</h3>
    <p>完整复制当前项目目录(全部产物、运行记录)为一个全新项目;复制完成后自动切换到新项目的控制台。大项目可能占用较多磁盘空间。</p>
    <div class="copy-row">
      <input id="copy-name" placeholder="新项目名称" autocomplete="off" spellcheck="false">
      <button id="copy-btn">复制项目</button>
    </div>
    <div id="copy-status"></div>
  </div>
  <div id="global-status"></div>
  <div class="card danger">
    <h3>⚠️ 危险操作:删除当前项目</h3>
    <p>将永久删除项目 <b id="del-proj-name"></b> 的整个目录(全部产物、运行记录),<b style="color:var(--red)">不可恢复</b>。请输入项目名称以解锁删除按钮。</p>
    <div class="danger-row">
      <input id="del-confirm" placeholder="输入项目名称" autocomplete="off">
      <button class="red" id="del-btn" disabled>删除项目</button>
    </div>
  </div>
</main>
<div id="del-modal">
  <div class="box">
    <h3>⚠️ 确认删除项目</h3>
    <p>即将永久删除项目 <b id="del-modal-name"></b> 的全部文件。</p>
    <p class="sub">此操作不可恢复:产物、运行记录将一并删除。删除后自动跳转到第一个项目。</p>
    <div class="btns">
      <button id="del-cancel">取消</button>
      <button class="red" id="del-ok">确认删除</button>
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
async function api(p,body){const o=body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{};const r=await fetch(p,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.status);return j}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

const curProj=()=>$('#project').value;

async function initProjects(){
  let list=[];try{list=await api('/api/v1/projects')}catch(e){}
  if(!list.length)list=['demo'];
  const sel=$('#project');sel.innerHTML='';
  list.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;sel.appendChild(o)});
  const want=(new URLSearchParams(location.search).get('project'))
    ||(JSON.parse(localStorage.getItem('webui_prefs')||'{}').project);
  sel.value=list.includes(want)?want:list[0];
  sel.onchange=()=>{refreshDanger();refreshCopy()};
}

/* ---------- 复制项目(整份复制当前项目目录 → 全新项目) ---------- */
let COPYING=false;
/* 默认名 = 源项目名-YYYYMMDD;若同名项目已存在(同日已复制过),依次追加 -1、-2… 直到不重名 */
function defaultCopyName(existing){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const base=curProj()+'-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());
  const taken=new Set(existing||[]);
  if(!taken.has(base))return base;
  for(let i=1;;i++){const c=base+'-'+i;if(!taken.has(c))return c;}
}
async function refreshCopy(){
  if(COPYING)return;
  const src=curProj();
  // 用最新项目列表查重(其它页面/实例可能刚建过同名项目);取不到就退回下拉里的列表
  let list=null;try{list=await api('/api/v1/projects')}catch(e){}
  if(!Array.isArray(list))list=[...$('#project').options].map(o=>o.value);
  if(COPYING||curProj()!==src)return;      // 等待期间用户已切换项目/开始复制,放弃本次刷新
  $('#copy-name').value=defaultCopyName(list);
  $('#copy-status').classList.remove('show');
}
function copyStatus(cls,html){
  const g=$('#copy-status');
  g.innerHTML=cls?`<span class="${cls}" style="color:${cls==='ok'?'var(--green)':'var(--red)'}">${html}</span>`:html;
  g.classList.add('show');
}
function pollCopy(src,name){
  const timer=setInterval(async()=>{
    let st;
    try{st=await api('/api/v1/projects/'+encodeURIComponent(src)+'/copy')}
    catch(e){return}
    if(st.state==='running'){
      const [n,total]=st.progress||[0,0];
      copyStatus('',`${t('⏳ 正在复制 →')} <b>${esc(name)}</b>:${esc(st.step||'')}${total?` ${n}/${total}`:''}`);
    }else{
      clearInterval(timer);COPYING=false;$('#copy-btn').disabled=false;
      if(st.state==='done'){
        copyStatus('ok',t('✓ 复制完成,正在打开新项目控制台…'));
        try{
          const p=JSON.parse(localStorage.getItem('webui_prefs')||'{}');
          p.project=name;localStorage.setItem('webui_prefs',JSON.stringify(p));
        }catch(e){}
        location.href='/?project='+encodeURIComponent(name);
      }else{
        copyStatus('err','✗ '+t('复制失败:')+esc(st.error||t('未知错误')));
      }
    }
  },1500);
}
$('#copy-btn').onclick=async()=>{
  if(COPYING)return;
  const src=curProj();
  const name=$('#copy-name').value.trim();
  if(!/^[A-Za-z0-9][A-Za-z0-9_-]*$/.test(name)||name.length>80){
    copyStatus('err','✗ '+t('名称只能包含字母、数字、- 和 _,且以字母或数字开头'));return;
  }
  COPYING=true;$('#copy-btn').disabled=true;
  copyStatus('',`${t('⏳ 正在复制 →')} <b>${esc(name)}</b> …`);
  try{
    await api('/api/v1/projects/'+encodeURIComponent(src)+'/copy',{project:src,name});
  }catch(e){
    COPYING=false;$('#copy-btn').disabled=false;
    copyStatus('err','✗ '+t('复制启动失败:')+esc(e.message));return;
  }
  pollCopy(src,name);
};

/* ---------- 危险操作:删除当前项目(输入项目名解锁 → 红色确认弹窗) ---------- */
function refreshDanger(){
  $('#del-proj-name').textContent=curProj();
  $('#del-confirm').value='';
  $('#del-btn').disabled=true;
}
$('#del-confirm').oninput=()=>{
  $('#del-btn').disabled=$('#del-confirm').value.trim()!==curProj();
};
$('#del-btn').onclick=()=>{
  if($('#del-confirm').value.trim()!==curProj())return;
  $('#del-modal-name').textContent=curProj();
  $('#del-modal').style.display='flex';
};
$('#del-cancel').onclick=()=>$('#del-modal').style.display='none';
$('#del-ok').onclick=async()=>{
  const proj=curProj();
  const btn=$('#del-ok');btn.disabled=true;btn.textContent='删除中…';
  try{
    const r=await api('/api/v1/projects/'+encodeURIComponent(proj),{project:proj,confirm:$('#del-confirm').value.trim()});
    // 更新本地偏好并跳到第一个项目的控制台
    try{
      const p=JSON.parse(localStorage.getItem('webui_prefs')||'{}');
      p.project=r.next||'';localStorage.setItem('webui_prefs',JSON.stringify(p));
    }catch(e){}
    location.href=r.next?('/?project='+encodeURIComponent(r.next)):'/';
  }catch(e){
    $('#del-modal').style.display='none';
    showStatus(`<span class="err">✗ ${t('删除失败:')}${esc(e.message)}</span>`);
  }finally{btn.disabled=false;btn.textContent='确认删除'}
};

function showStatus(html){const g=$('#global-status');g.innerHTML=html;g.classList.add('show')}

(async()=>{
  await initProjects();
  refreshDanger();
  refreshCopy();
  // 页面打开时若已有整份复制在跑(如刷新页面),恢复轮询并在完成后照常切换
  try{
    const st=await api('/api/v1/projects/'+encodeURIComponent(curProj())+'/copy');
    if(st.state==='running'){
      COPYING=true;$('#copy-btn').disabled=true;$('#copy-name').value=st.new_name||'';
      copyStatus('',`${t('⏳ 已有复制任务进行中 →')} <b>${esc(st.new_name)}</b> …`);
      pollCopy(curProj(),st.new_name||'');
    }
  }catch(e){}
})();
</script>
</body>
</html>
