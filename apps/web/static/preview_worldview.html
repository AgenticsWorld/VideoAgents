<script>
/* 兜底:i18n 运行时未加载(如服务端未挂 /static)时保持中文界面可用 */
if(!window.I18N){
  window.I18N={lang:'zh',langs:{zh:'中文'},t:function(s){return s},
    f:function(s,p){p=p||{};return String(s).replace(/\{(\w+)\}/g,function(m,k){return k in p?p[k]:m})},
    setLang:function(){return Promise.resolve()}};
  window.t=function(s){return s};window.I18N_DICT={};
}
</script>
<style>
:root{
  --bg:#0f1117; --panel:#161a23; --panel2:#1c2130; --border:#2a3040;
  --text:#dde3ee; --dim:#8b93a7; --accent:#6c9ef8; --link:#fb923c; --green:#4ade80;
  --red:#f87171; --yellow:#fbbf24; --purple:#c084fc;
}
*{box-sizing:border-box;margin:0;padding:0}
a{color:var(--link)}
body{background:var(--bg);color:var(--text);font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
header h1{font-size:15px;font-weight:600}
header a.back{color:var(--dim);text-decoration:none;font-size:13px}
header a.back:hover{color:var(--accent)}
header .spacer{flex:1}
input[type=text]{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px}
button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}
header select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;cursor:pointer}
header select:hover{border-color:var(--accent)}
main{flex:1;display:flex;min-height:0}
#list{width:270px;border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column}
#search{margin:10px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text)}
#items{flex:1;overflow-y:auto;padding-bottom:20px}
.item{padding:7px 14px;cursor:pointer;border-left:2px solid transparent}
.item:hover{background:var(--panel2)}
.item.active{background:var(--panel2);border-left-color:var(--accent)}
.item .row1{display:flex;align-items:center;gap:6px;min-width:0}
.item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .id{display:block;color:var(--dim);font-size:11px;line-height:1.4;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:10px;border:1px solid var(--purple);color:var(--purple);border-radius:4px;padding:0 5px;flex:none}
#detail{flex:1;overflow-y:auto;padding:22px 26px}
.empty{color:var(--dim);text-align:center;margin-top:60px}
h2.title{font-size:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2.title .id{color:var(--dim);font-size:13px;font-weight:400}
.meta-line{color:var(--dim);font-size:13px;margin:6px 0 4px}
.doc{border:1px solid var(--border);border-radius:10px;margin:14px 0;overflow:hidden}
.doc>h3{background:var(--panel);padding:9px 14px;font-size:13.5px;cursor:pointer;user-select:none}
.doc>h3::before{content:'▾ ';color:var(--dim)}
.doc.closed>h3::before{content:'▸ '}
.doc.closed>.body{display:none}
.doc>.body{padding:12px 16px;background:var(--panel2)}
.editbtn{font-size:11px;padding:1px 7px;flex:none;background:var(--panel2);border:1px solid var(--border);border-radius:5px;color:var(--dim);cursor:pointer}
.editbtn:hover{color:var(--accent);border-color:var(--accent)}
dl.kv{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:4px 14px}
dl.kv>dt{color:var(--dim);font-size:12.5px;word-break:break-all}
dl.kv>dd{min-width:0;word-break:break-word}
dl.kv dl.kv{margin:2px 0 6px;padding-left:10px;border-left:1px solid var(--border)}
ul.arr{padding-left:18px}
ul.arr>li{margin:2px 0}
ul.arr>li>dl.kv{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:6px 0}
pre.md{white-space:pre-wrap;word-break:break-word;font:13px/1.7 ui-monospace,Menlo,Consolas,monospace;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0}
</style>
</head>
<body>
<header>
  <a class="back" href="/">← 控制台</a>
  <h1>🌍 世界观预览</h1>
  <div class="spacer"></div>
  <input type="hidden" id="project">
  <select id="pvnav" title="切换预览页"></select>
  <button id="reload">刷新</button>
</header>
<main>
  <div id="list">
    <input id="search" placeholder="搜索板块或内容…">
    <div id="items"></div>
  </div>
  <div id="detail"><div class="empty">加载中…</div></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA=[], CUR=null;
const NOISE=new Set(['$schema_version','schema_version','file','owner_agent','task_id','project','source_inputs','write_via','agent','oid']);
/* 已知板块:图标 + 中文名 + 排序;bible 根新增的 JSON 会以文件名兜底出现在末尾 */
const SEC={
  world:['🌍','世界观总纲'], geography:['🗺️','地理'], politics:['🏛️','政治'],
  culture:['🎎','文化'], cultivation:['⚔️','修炼体系'], economy:['💰','经济'],
  religion:['⛩️','宗教'], dictionary:['📖','术语词典'], timeline:['🕰️','时间线'],
  style:['🎨','美术风格'], color_script:['🎬','色彩脚本'], costumes:['👘','服饰'],
  aspect_ratio:['📐','画幅规范'], props:['🗡️','道具'], changelog:['📝','修订记录'],
  README:['📄','说明文档'],
};
const SEC_ORDER=Object.keys(SEC);
const icon=s=>(SEC[s.id]||['📦'])[0];
const label=s=>t((SEC[s.id]||[,s.id])[1]);

function jrender(v){
  if(v===null||v===undefined||v==='')return '<span style="color:var(--dim)">—</span>';
  if(Array.isArray(v)){
    if(!v.length)return '<span style="color:var(--dim)">(空)</span>';
    if(v.every(x=>typeof x!=='object'||x===null))return esc(v.join('、'));
    return '<ul class="arr">'+v.map(x=>'<li>'+jrender(x)+'</li>').join('')+'</ul>';
  }
  if(typeof v==='object'){
    const ks=Object.keys(v).filter(k=>!NOISE.has(k));
    if(!ks.length)return '<span style="color:var(--dim)">(空)</span>';
    return '<dl class="kv">'+ks.map(k=>`<dt>${esc(k)}</dt><dd>${jrender(v[k])}</dd>`).join('')+'</dl>';
  }
  return esc(String(v));
}

function renderList(){
  const q=$('#search').value.trim().toLowerCase();
  const box=$('#items');box.innerHTML='';
  DATA.filter(s=>!q||s.id.toLowerCase().includes(q)||label(s).toLowerCase().includes(q)
      ||(s._blob||'').includes(q))
    .forEach(s=>{
      const d=document.createElement('div');
      d.className='item'+(CUR===s.id?' active':'');
      d.innerHTML=`<div class="row1"><span>${icon(s)}</span><span class="nm">${esc(label(s))}</span></div>`
        +`<span class="id">${esc(s.file)}</span>`;
      d.onclick=()=>{CUR=s.id;renderList();renderDetail(s)};
      box.appendChild(d);
    });
  if(!box.children.length)box.innerHTML='<div class="empty">没有匹配的板块</div>';
}

function renderDetail(s){
  const box=$('#detail');
  let h=`<h2 class="title">${icon(s)} ${esc(label(s))}<span class="id">${esc(s.file)}</span><button class="editbtn" data-file="${esc(s.file)}" title="${esc(t('到总制片界面对该设定文件提修改意见'))}">✏️ ${esc(t('修改'))}</button></h2>`;
  h+=`<div class="meta-line">${esc((s.size/1024).toFixed(1))} KB · ${t('更新于:')}${esc(new Date(s.mtime*1000).toLocaleString())}</div>`;
  if(s.text!==undefined){
    h+=`<pre class="md">${esc(s.text)}</pre>`;
  }else if(s.data===null||s.data===undefined){
    h+=`<div class="empty">${t('该文件不是有效 JSON,无法结构化显示')}</div>`;
  }else if(Array.isArray(s.data)){
    h+=`<div class="doc"><h3 onclick="this.parentNode.classList.toggle('closed')">${esc(label(s))} <span style="color:var(--dim);font-weight:400">${esc(I18N.f('共 {n} 条',{n:s.data.length}))}</span></h3><div class="body">${jrender(s.data)}</div></div>`;
  }else{
    const d=s.data, ks=Object.keys(d).filter(k=>!NOISE.has(k));
    // 顶层标量字段归入「基本信息」;对象/数组字段各成一个可折叠板块
    const flat=ks.filter(k=>typeof d[k]!=='object'||d[k]===null);
    const deep=ks.filter(k=>typeof d[k]==='object'&&d[k]!==null);
    if(flat.length)
      h+=`<div class="doc"><h3 onclick="this.parentNode.classList.toggle('closed')">${t('基础信息')}</h3><div class="body"><dl class="kv">${flat.map(k=>`<dt>${esc(k)}</dt><dd>${jrender(d[k])}</dd>`).join('')}</dl></div></div>`;
    deep.forEach(k=>{
      const n=Array.isArray(d[k])?` <span style="color:var(--dim);font-weight:400">${esc(I18N.f('共 {n} 条',{n:d[k].length}))}</span>`:'';
      h+=`<div class="doc"><h3 onclick="this.parentNode.classList.toggle('closed')">${esc(k)}${n}</h3><div class="body">${jrender(d[k])}</div></div>`;
    });
    if(!flat.length&&!deep.length)h+=`<div class="empty">(空)</div>`;
  }
  box.innerHTML=h;box.scrollTop=0;
}

// ✏️ 修改:跳转总制片界面,把该设定文件路径预填进「输入工作指令」框
document.addEventListener('click',e=>{
  const b=e.target.closest('.editbtn');if(!b)return;
  const proj=$('#project').value.trim()||'demo';
  const path='data/projects/'+proj+'/bible/'+b.dataset.file;
  location.href='/?project='+encodeURIComponent(proj)
    +'&compose='+encodeURIComponent(t('修改 ')+path+'\n'+t('修改意见:'));
});

async function load(){
  const proj=$('#project').value.trim()||'demo';
  history.replaceState(null,'','?project='+encodeURIComponent(proj));
  $('#detail').innerHTML='<div class="empty">加载中…</div>';
  try{
    const r=await fetch('/api/v1/projects/'+encodeURIComponent(proj)+'/previews/worldview');
    if(!r.ok)throw new Error((await r.json()).detail||r.status);
    DATA=(await r.json()).sections;
  }catch(e){$('#items').innerHTML='';$('#detail').innerHTML=`<div class="empty">加载失败:${esc(e.message)}</div>`;return}
  DATA.forEach(s=>s._blob=JSON.stringify(s.data??s.text??'').toLowerCase());
  DATA.sort((a,b)=>{
    const ia=SEC_ORDER.indexOf(a.id),ib=SEC_ORDER.indexOf(b.id);
    return (ia<0?SEC_ORDER.length:ia)-(ib<0?SEC_ORDER.length:ib)||a.id.localeCompare(b.id);
  });
  const keep=DATA.find(s=>s.id===CUR);
  CUR=(keep||DATA[0]||{}).id||null;
  renderList();
  if(CUR)renderDetail(DATA.find(s=>s.id===CUR));
  else $('#detail').innerHTML='<div class="empty">该项目还没有世界观设定(bible 目录为空)</div>';
}
$('#reload').onclick=load;
$('#search').oninput=renderList;
$('#project').value=new URLSearchParams(location.search).get('project')
  ||(JSON.parse(localStorage.getItem('webui_prefs')||'{}').project)||'demo';
load();

// 右上角预览页切换下拉(项目值走 URL/localStorage,由隐藏 #project 承载)
const PV_PAGES=[['/preview/refs','\u{1F5BC} 参考文件'],['/preview/characters','\u{1F464} 人物预览'],['/preview/creatures','\u{1F40E} 生物预览'],['/preview/scenes','\u{1F3D4} 场景预览'],['/preview/props','\u{1F5E1} 道具预览'],['/preview/worldview','\u{1F30D} 世界观预览'],['/preview/workflow','\u{1F9ED} 工作流预览'],['/preview/storyboard','\u{1F3AC} 分镜预览'],['/preview/videos','\u{1F39E}️ 视频预览']];
PV_PAGES.forEach(([u,n])=>{const o=document.createElement('option');o.value=u;o.textContent=n;if(location.pathname===u)o.selected=true;$('#pvnav').appendChild(o)});
$('#pvnav').onchange=()=>{const p=($('#project').value||'').trim()||'demo';location.href=$('#pvnav').value+'?project='+encodeURIComponent(p)};
</script>
</body>
</html>
