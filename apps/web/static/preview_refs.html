<style>
:root{
  --bg:#0f1117; --panel:#161a23; --panel2:#1c2130; --border:#2a3040;
  --text:#dde3ee; --dim:#8b93a7; --accent:#6c9ef8; --link:#fb923c; --green:#4ade80;
  --red:#f87171; --yellow:#fbbf24; --purple:#c084fc;
}
*{box-sizing:border-box;margin:0;padding:0}
a{color:var(--link)}
body{background:var(--bg);color:var(--text);font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
header h1{font-size:15px;font-weight:600}
header a.back{color:var(--dim);text-decoration:none;font-size:13px}
header a.back:hover{color:var(--accent)}
header .spacer{flex:1}
button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#0b1020;font-weight:600}
header select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;cursor:pointer}
header select:hover{border-color:var(--accent)}
input[type=text],textarea{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;font-family:inherit}
#content{flex:1;overflow-y:auto;padding:16px 22px 40px}
.pagenote{color:var(--dim);font-size:12.5px;margin-bottom:14px;max-width:1100px}
.empty{color:var(--dim);text-align:center;margin-top:60px}
/* 分类分区 */
.cat{border:1px solid var(--border);border-radius:12px;margin-bottom:16px;background:var(--panel);overflow:hidden}
.cat.dragover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.cat-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.cat-head h3{font-size:14px;display:flex;align-items:center;gap:7px}
.cat-head .key{color:var(--dim);font-size:12px;font-weight:400;font-family:ui-monospace,Menlo,monospace}
.cat-head .cnt{color:var(--dim);font-size:11.5px;font-weight:400;border:1px solid var(--border);border-radius:9px;padding:0 7px}
.cat-head .desc{color:var(--dim);font-size:12px;flex:1;min-width:120px}
.cat-head input.subdir{width:150px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;padding:14px}
.grid .none{grid-column:1/-1;color:var(--dim);font-size:12.5px;text-align:center;padding:14px 0;border:1px dashed var(--border);border-radius:8px}
/* 文件卡片 */
.card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card .thumb{height:140px;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:zoom-in;overflow:hidden}
.card .thumb img,.card .thumb video{width:100%;height:100%;object-fit:cover;display:block}
.card .thumb video{object-fit:contain;background:#000}
.card .thumb .fico{font-size:44px;cursor:default}
.card audio{width:100%;height:30px;margin-top:2px}
.card .fn{font-size:11.5px;color:var(--dim);padding:6px 9px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,Menlo,monospace}
.card .note-box{padding:5px 9px 9px;font-size:12.5px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .note-txt{white-space:pre-wrap;word-break:break-word;color:var(--text)}
.card .note-txt.none{color:var(--dim);font-style:italic}
.card .note-row{display:flex;align-items:center;gap:6px}
.editbtn{font-size:11px;padding:1px 7px;flex:none;background:var(--panel);border:1px solid var(--border);border-radius:5px;color:var(--dim);cursor:pointer}
.editbtn:hover{color:var(--accent);border-color:var(--accent)}
.card textarea{width:100%;min-height:64px;resize:vertical;font-size:12.5px}
.card .ed-acts{display:flex;justify-content:flex-end;gap:6px}
.card .ed-acts button{font-size:11.5px;padding:2px 10px}
.err{color:var(--red);font-size:12.5px;padding:0 14px 10px}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
#lightbox img{max-width:96vw;max-height:96vh;border-radius:6px}
</style>

<body>
<header>
  <a class="back" href="/">← 控制台</a>
  <h1>🖼 参考文件</h1>
  <div class="spacer"></div>
  <input type="hidden" id="project">
  <select id="pvnav" title="切换预览页"></select>
  <button id="reload">刷新</button>
</header>
<div id="content"><div class="empty">加载中…</div></div>
<input type="file" id="fileinp" multiple style="display:none">
<div id="lightbox"><img alt=""></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const proj=()=>$('#project').value.trim()||'demo';
let DATA=null,UP_CAT=null;

/* 分类展示元数据:图标/名称/说明;''=散放在 refs/ 根目录的文件 */
const CAT_META={
  style:['🎨','视觉风格','整体画风/渲染质感/色调/构图参考'],
  thumbnail:['🖼','封面','封面参考:他人爆款封面的构图/版式/文字风格范例'],
  characters:['👤','角色','角色形象参考;填子目录(角色名或 id)可定向到该角色'],
  scenes:['🏔','场景','场景与世界观:建筑/地貌/氛围参考'],
  props:['🗡','道具','道具/法宝参考;服装可填 costumes 子目录'],
  music:['🎵','音频','希望使用的音频文件(背景音轨,BGM 候选,配乐 Agent 优先选用)'],
  video:['🎞','视频','参考视频:动作/运镜/节奏/转场范例,视频生成 Agent 优先参考(支持的模型经 --ref-video 注入)'],
  text:['📝','文本','设定/文案等文本资料,相关 Agent 参考使用'],
  '':['📂','根目录散图','散放在 refs/ 根目录的文件,一律视为整体风格参考'],
};
const SUBDIR_CATS=new Set(['characters','props']);
const fmtSize=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':n>=1024?Math.round(n/1024)+' KB':n+' B';

function noteBoxHtml(f){
  const txt=f.note
    ?`<span class="note-txt">${esc(f.note)}</span>`
    :`<span class="note-txt none">${esc(t('(未添加注释)'))}</span>`;
  return `<div class="note-row"><button class="editbtn copybtn" title="${esc(t('复制在项目中的相对路径'))}">📋</button><button class="editbtn notebtn" title="${esc(t('注释说明这张图/这首曲子的用途,保存进 refs/NOTES.md,相关 Agent 必读'))}">✏️ ${esc(t('注释'))}</button><button class="editbtn delbtn" title="${esc(t('删除该文件(注释一并移除,不可恢复)'))}">🗑</button></div>${txt}`;
}
function cardHtml(f){
  let thumb;
  if(f.is_image)thumb=`<div class="thumb"><img loading="lazy" src="${esc(f.url)}" alt=""></div>`;
  else if(f.is_audio)thumb=`<div class="thumb"><span class="fico">🎵</span></div><audio controls preload="none" src="${esc(f.url)}"></audio>`;
  else if(f.is_video)thumb=`<div class="thumb"><video controls preload="metadata" src="${esc(f.url)}"></video></div>`;
  else thumb=`<div class="thumb"><span class="fico">📄</span></div>`;
  return `<figure class="card" data-path="${esc(f.path)}">${thumb}
    <div class="fn" title="${esc(f.path)} · ${fmtSize(f.size)}">${esc(f.name)}</div>
    <div class="note-box">${noteBoxHtml(f)}</div></figure>`;
}
function render(){
  const box=$('#content');
  const cats=DATA.categories;
  box.innerHTML=`<div class="pagenote">${esc(t('参考素材保存在项目 refs/ 目录,视觉/配乐 Agent 工作前必查、优先参考。给每个文件添加注释(哪张图管什么、哪首曲子想用在哪)会写入 refs/NOTES.md,相关 Agent 必读并按注释执行。也可拖拽文件到分类区域直接上传。'))}</div>`
    +cats.map(c=>{
      const [ico,nm,desc]=CAT_META[c.key]||['📁',c.key,''];
      const sub=SUBDIR_CATS.has(c.key)
        ?`<input type="text" class="subdir" placeholder="${esc(t('子目录(可选)'))}" title="${esc(t('填写后上传到该子目录,如角色名(仅英文数字)'))}">`:'';
      const up=c.key!==''
        ?`${sub}<button class="upbtn primary" data-cat="${esc(c.key)}">📤 ${esc(t('上传'))}</button>`:'';
      return `<div class="cat" data-cat="${esc(c.key)}">
        <div class="cat-head"><h3>${ico} ${esc(t(nm))} <span class="key">${c.key?esc(c.key)+'/':'refs/'}</span><span class="cnt">${c.files.length}</span></h3>
          <span class="desc">${esc(t(desc))}</span>${up}</div>
        <div class="err"></div>
        <div class="grid">${c.files.map(cardHtml).join('')||`<div class="none">${esc(t('暂无文件,点击上传或拖拽文件至此'))}</div>`}</div>
      </div>`;
    }).join('');
}

async function load(){
  history.replaceState(null,'','?project='+encodeURIComponent(proj()));
  try{
    const r=await fetch('/api/v1/projects/'+encodeURIComponent(proj())+'/references');
    if(!r.ok)throw new Error((await r.json()).detail||r.status);
    DATA=await r.json();
    render();
  }catch(e){$('#content').innerHTML=`<div class="empty">${esc(t('加载失败:'))}${esc(e.message)}</div>`}
}

/* ---------- 上传:按钮选文件或拖拽到分类区域;请求体即文件字节 ---------- */
async function upload(cat,sub,files,errBox){
  if(!files.length)return;
  errBox.textContent='';
  const btn=document.querySelector(`.upbtn[data-cat="${CSS.escape(cat)}"]`);
  const old=btn?btn.textContent:'';
  if(btn){btn.disabled=true}
  try{
    let done=0;
    for(const f of files){
      if(btn)btn.textContent=I18N.f('上传中 {done}/{total}…',{done:done+1,total:files.length});
      const q=new URLSearchParams({project:proj(),category:cat,subdir:sub||'',filename:f.name});
      const r=await fetch('/api/v1/projects/'+encodeURIComponent(proj())+'/references?'+q,{method:'POST',body:f});
      if(!r.ok)throw new Error((await r.json()).detail||r.status);
      done++;
    }
  }catch(e){errBox.textContent=t('上传失败:')+e.message}
  if(btn){btn.disabled=false;btn.textContent=old}
  await load();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.upbtn');
  if(!b)return;
  UP_CAT=b.dataset.cat;
  $('#fileinp').click();
});
$('#fileinp').onchange=()=>{
  const files=[...$('#fileinp').files];
  $('#fileinp').value='';
  if(!files.length||UP_CAT===null)return;
  const sec=document.querySelector(`.cat[data-cat="${CSS.escape(UP_CAT)}"]`);
  const sub=sec.querySelector('.subdir')?.value.trim()||'';
  upload(UP_CAT,sub,files,sec.querySelector('.err'));
};
document.addEventListener('dragover',e=>{
  const sec=e.target.closest?.('.cat');
  document.querySelectorAll('.cat.dragover').forEach(x=>x!==sec&&x.classList.remove('dragover'));
  if(sec&&sec.dataset.cat!==''){e.preventDefault();sec.classList.add('dragover')}
});
document.addEventListener('dragleave',e=>{
  const sec=e.target.closest?.('.cat');
  if(sec&&!sec.contains(e.relatedTarget))sec.classList.remove('dragover');
});
document.addEventListener('drop',e=>{
  const sec=e.target.closest?.('.cat');
  if(!sec||sec.dataset.cat==='')return;
  e.preventDefault();sec.classList.remove('dragover');
  const files=[...e.dataTransfer.files];
  const sub=sec.querySelector('.subdir')?.value.trim()||'';
  upload(sec.dataset.cat,sub,files,sec.querySelector('.err'));
});

/* ---------- 逐文件注释:行内编辑,保存进 annotations.json + NOTES.md ---------- */
function findFile(path){
  for(const c of DATA.categories){const f=c.files.find(x=>x.path===path);if(f)return f}
  return null;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.notebtn');
  if(!b)return;
  const card=b.closest('.card'),path=card.dataset.path,f=findFile(path);
  const box=card.querySelector('.note-box');
  box.innerHTML=`<textarea placeholder="${esc(t('如:主角青年时期发型以这张为准;这首曲子想用在决战段……'))}">${esc(f.note)}</textarea>
    <div class="ed-acts"><button class="ed-cancel">${esc(t('取消'))}</button><button class="primary ed-save">${esc(t('保存'))}</button></div>`;
  const ta=box.querySelector('textarea');ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
  box.querySelector('.ed-cancel').onclick=()=>{box.innerHTML=noteBoxHtml(f)};
  box.querySelector('.ed-save').onclick=async()=>{
    const btn=box.querySelector('.ed-save');btn.disabled=true;
    try{
      const r=await fetch('/api/v1/projects/'+encodeURIComponent(proj())+'/references/note',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({project:proj(),path,note:ta.value})});
      if(!r.ok)throw new Error((await r.json()).detail||r.status);
      f.note=(await r.json()).note;
      box.innerHTML=noteBoxHtml(f);
    }catch(err){alert(t('注释保存失败:')+err.message);btn.disabled=false}
  };
});

/* ---------- 删除文件(注释一并移除) ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('.delbtn');
  if(!b)return;
  const card=b.closest('.card'),path=card.dataset.path,f=findFile(path);
  if(!confirm(I18N.f('删除 {name}?该操作不可恢复,其注释一并移除',{name:f?f.name:path})))return;
  b.disabled=true;
  try{
    const r=await fetch('/api/v1/projects/'+encodeURIComponent(proj())+'/references/delete',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({project:proj(),path})});
    if(!r.ok)throw new Error((await r.json()).detail||r.status);
    await load();
  }catch(err){alert(t('删除失败:')+err.message);b.disabled=false}
});

/* ---------- 复制文件在项目中的相对路径(refs/<path>) ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('.copybtn');
  if(!b)return;
  const path='refs/'+b.closest('.card').dataset.path;
  let ok=false;
  try{await navigator.clipboard.writeText(path);ok=true}
  catch(_){                                   // http(局域网)下 clipboard API 不可用的兜底
    try{
      const ta=document.createElement('textarea');
      ta.value=path;ta.style.cssText='position:fixed;opacity:0';
      document.body.appendChild(ta);ta.select();
      ok=document.execCommand('copy');ta.remove();
    }catch(e2){ok=false}
  }
  const old=b.textContent;
  b.textContent=ok?'✅':'❌';
  setTimeout(()=>{b.textContent=old},1200);
});

/* ---------- 图片放大 ---------- */
document.addEventListener('click',e=>{
  const img=e.target.closest('.thumb img');
  if(!img)return;
  $('#lightbox img').src=img.src;$('#lightbox').style.display='flex';
});
$('#lightbox').onclick=()=>$('#lightbox').style.display='none';

$('#reload').onclick=load;
$('#project').value=new URLSearchParams(location.search).get('project')
  ||(JSON.parse(localStorage.getItem('webui_prefs')||'{}').project)||'demo';
load();

// 右上角预览页切换下拉(项目值走 URL/localStorage,由隐藏 #project 承载)
const PV_PAGES=[['/preview/refs','\u{1F5BC} 参考文件'],['/preview/characters','\u{1F464} 人物预览'],['/preview/scenes','\u{1F3D4} 场景预览'],['/preview/props','\u{1F5E1} 道具预览'],['/preview/creatures','\u{1F40E} 生物预览'],['/preview/worldview','\u{1F30D} 世界观预览'],['/preview/workflow','\u{1F9ED} 工作流预览'],['/preview/storyboard','\u{1F3AC} 分镜预览'],['/preview/videos','\u{1F39E}️ 视频预览']];
PV_PAGES.forEach(([u,n])=>{const o=document.createElement('option');o.value=u;o.textContent=n;if(location.pathname===u)o.selected=true;$('#pvnav').appendChild(o)});
$('#pvnav').onchange=()=>{const p=proj();location.href=$('#pvnav').value+'?project='+encodeURIComponent(p)};
</script>
