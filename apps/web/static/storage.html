<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/static/i18n/i18n.js"></script>
<script>
/* 兜底:i18n 运行时未加载(如服务端未挂 /static)时保持中文界面可用 */
if(!window.I18N){
  window.I18N={lang:'zh',langs:{zh:'中文'},t:function(s){return s},
    f:function(s,p){p=p||{};return String(s).replace(/\{(\w+)\}/g,function(m,k){return k in p?p[k]:m})},
    setLang:function(){return Promise.resolve()}};
  window.t=function(s){return s};window.I18N_DICT={};

<style>
:root{
  --bg:#0f1117; --panel:#161a23; --panel2:#1c2130; --border:#2a3040;
  --text:#dde3ee; --dim:#8b93a7; --accent:#6c9ef8; --link:#fb923c; --green:#4ade80;
  --red:#f87171; --yellow:#fbbf24; --purple:#c084fc;
}
*{box-sizing:border-box;margin:0;padding:0}
a{color:var(--link)}
body{background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:15px;font-weight:600}
header .spacer{flex:1}
a.back{color:var(--dim);text-decoration:none;font-size:13px}
a.back:hover{color:var(--accent)}
main{max-width:860px;margin:0 auto;padding:22px 18px 60px;display:flex;flex-direction:column;gap:22px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.card>h2{font-size:14px;padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.card>h2 .cur{margin-left:auto;font-size:12px;color:var(--dim);font-weight:400}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--panel2)}
.tab{flex:1;padding:9px 10px;text-align:center;cursor:pointer;font-size:13px;color:var(--dim);border-bottom:2px solid transparent;user-select:none;display:flex;align-items:center;justify-content:center;gap:6px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent);background:var(--panel)}
.panel{display:none;padding:16px;flex-direction:column;gap:14px}
.panel.show{display:flex}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row label{width:110px;color:var(--dim);font-size:13px;flex:none}
input[type=text],input[type=password],select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;flex:1;min-width:180px}
input:focus,select:focus{outline:none;border-color:var(--accent)}
button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px;flex:none}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#0b1020;font-weight:600;padding:8px 26px}
button:disabled{opacity:.5;cursor:default}
.hint{font-size:12px;color:var(--dim);margin-left:120px}
.hint a{color:var(--link)}
.status{font-size:12px;margin-left:120px}
.status.ok{color:var(--green)}
.status.err{color:var(--red)}
#savebar{display:flex;align-items:center;gap:14px;justify-content:flex-end}
#save-status{font-size:13px;color:var(--green);opacity:0;transition:opacity .3s}
#save-status.show{opacity:1}
.pill{font-size:11px;border:1px solid var(--border);border-radius:10px;padding:0 8px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <a class="back" href="/">← 返回控制台</a>
  <h1>📦 文件托管</h1>
  <span class="pill">对象存储托管:V2V 参考视频(--ref-video)经预签名 URL 传给方舟</span>
  <div class="spacer"></div>
</header>
<main>
  <div class="card" id="card-storage">
    <h2>📦 存储渠道 <span class="cur">生效渠道=当前选中的标签页(✅),保存后生效;各渠道配置可同时保存</span></h2>
    <div class="tabs" id="storage-tabs"></div>
    <div id="storage-panels"></div>
  </div>
  <div id="savebar">
    <span id="save-status">✓ 已保存</span>
    <button class="primary" id="save">保存设置</button>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
async function api(p,body){const o=body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{};const r=await fetch(p,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.status);return j}
function el(tag,attrs={},html){const d=document.createElement(tag);Object.assign(d,attrs);if(html!==undefined)d.innerHTML=html;return d}
function keyRow(id,placeholder,label){
  const d=el('div',{className:'row'});
  d.appendChild(el('label',{},label||'API Key'));
  const inp=el('input',{type:'password',id,placeholder:placeholder||''});
  const show=el('button',{},'显示');
  show.onclick=()=>{const pw=inp.type==='password';inp.type=pw?'text':'password';show.textContent=pw?'隐藏':'显示'};
  d.appendChild(inp);d.appendChild(show);
  return d;
}

let CFG=null;
let STORAGE_PROVIDER='tos';
const STORAGE_META={
  tos:{label:'火山引擎 TOS',ak:'AccessKey',sk:'SecretKey',
    akPh:'火山引擎 IAM AccessKey(非 ark- API Key)',skPh:'火山引擎 IAM SecretKey',
    bucketPh:'TOS 存储桶名(建议 cn-beijing 私有桶)',endpointPh:'tos-cn-beijing.volces.com',regionPh:'cn-beijing',
    hint:'与方舟同账号同区域,拉取最快(推荐)。私有 bucket + IAM AK/SK 在 <a href="https://console.volcengine.com/tos" target="_blank">TOS 控制台</a> 创建;建议给前缀配 7 天生命周期自动清理。依赖 <code>pip install tos</code>'},
  oss:{label:'阿里云 OSS',ak:'AccessKey ID',sk:'AccessKey Secret',
    akPh:'阿里云 RAM AccessKey ID',skPh:'阿里云 RAM AccessKey Secret',
    bucketPh:'OSS 存储桶名',endpointPh:'oss-cn-beijing.aliyuncs.com',regionPh:'(可留空,Endpoint 已含地域)',
    hint:'RAM 用户 AK/SK 在阿里云「RAM 访问控制」创建;Endpoint 填 bucket 所在地域(建议北京,离方舟近)。依赖 <code>pip install oss2</code>'},
  cos:{label:'腾讯云 COS',ak:'SecretId',sk:'SecretKey',
    akPh:'腾讯云 CAM SecretId',skPh:'腾讯云 CAM SecretKey',
    bucketPh:'桶名需含 APPID 后缀,如 mybucket-1250000000',endpointPh:'(留空,按 Region 自动)',regionPh:'ap-beijing',
    hint:'SecretId/SecretKey 在腾讯云「CAM 密钥管理」创建;Bucket 名必须带 APPID 后缀。依赖 <code>pip install cos-python-sdk-v5</code>'},
  s3:{label:'S3 兼容',ak:'Access Key',sk:'Secret Key',
    akPh:'Access Key ID',skPh:'Secret Access Key',
    bucketPh:'桶名',endpointPh:'AWS 官方留空;R2 填 https://<账户ID>.r2.cloudflarestorage.com',regionPh:'us-east-1(R2 填 auto)',
    hint:'通用 S3 协议:AWS S3 / Cloudflare R2 / MinIO / Backblaze B2 等均可(填对应 Endpoint)。注意境外源站方舟拉取可能较慢或不稳。依赖 <code>pip install boto3</code>'},
};
const STORAGE_PROVIDERS=Object.keys(STORAGE_META);

function buildStorage(){
  const tabs=$('#storage-tabs'),panels=$('#storage-panels');
  STORAGE_PROVIDERS.forEach(p=>{
    const m=STORAGE_META[p];
    const t=el('div',{className:'tab',id:`tab-storage-${p}`},m.label);
    t.onclick=()=>showStoragePanel(p);
    tabs.appendChild(t);
    const d=el('div',{className:'panel',id:`panel-storage-${p}`});
    d.appendChild(keyRow(`st-${p}-ak`,m.akPh,m.ak));
    d.appendChild(keyRow(`st-${p}-sk`,m.skPh,m.sk));
    [['bucket','Bucket',m.bucketPh],['endpoint','Endpoint',m.endpointPh],
     ['region','Region',m.regionPh],['prefix','对象前缀','genmedia-refs/'],
     ['expires','链接有效期(秒)','86400']].forEach(([f,label,ph])=>{
      const r=el('div',{className:'row'});
      r.appendChild(el('label',{},label));
      r.appendChild(el('input',{type:'text',id:`st-${p}-${f}`,placeholder:ph}));
      d.appendChild(r);
    });
    d.appendChild(el('div',{className:'hint'},
      '<span>方舟要求 reference_video 为公网 URL(base64 内联被拒):V2V 修复时参考视频自动上传对象存储并生成预签名链接,桶保持私有。</span><span>'+m.hint+'</span>'));
    panels.appendChild(d);
  });
}

function showStoragePanel(p){
  STORAGE_PROVIDER=p;
  STORAGE_PROVIDERS.forEach(x=>{
    const t=$(`#tab-storage-${x}`);
    t.classList.toggle('active',x===p);
    t.textContent=(x===p?'✅ ':'')+window.t(STORAGE_META[x].label);   // ✅ = 生效渠道(保存后)
    $(`#panel-storage-${x}`).classList.toggle('show',x===p);
  });
}

function loadIntoForm(){
  const stg=CFG.storage||{};
  STORAGE_PROVIDERS.forEach(p=>{
    const c=stg[p]||{};
    $(`#st-${p}-ak`).value=c.access_key||'';
    $(`#st-${p}-sk`).value=c.secret_key||'';
    $(`#st-${p}-bucket`).value=c.bucket||'';
    $(`#st-${p}-endpoint`).value=c.endpoint||(p==='tos'?'tos-cn-beijing.volces.com':p==='oss'?'oss-cn-beijing.aliyuncs.com':'');
    $(`#st-${p}-region`).value=c.region||(p==='tos'?'cn-beijing':p==='cos'?'ap-beijing':p==='s3'?'us-east-1':'');
    $(`#st-${p}-prefix`).value=c.prefix||'genmedia-refs/';
    $(`#st-${p}-expires`).value=c.url_expires||86400;
  });
  showStoragePanel(STORAGE_PROVIDERS.includes(stg.provider)?stg.provider:'tos');
}

function collect(){
  // 只提交 storage 块:后端 /api/v1/config/generation 深合并,不影响其他设置
  const storage={provider:STORAGE_PROVIDER};
  STORAGE_PROVIDERS.forEach(p=>{
    storage[p]={access_key:$(`#st-${p}-ak`).value.trim(),
      secret_key:$(`#st-${p}-sk`).value.trim(),
      endpoint:$(`#st-${p}-endpoint`).value.trim(),
      region:$(`#st-${p}-region`).value.trim(),
      bucket:$(`#st-${p}-bucket`).value.trim(),
      prefix:$(`#st-${p}-prefix`).value.trim()||'genmedia-refs/',
      url_expires:Number($(`#st-${p}-expires`).value)||86400};
  });
  return {storage};
}

$('#save').onclick=async()=>{
  const btn=$('#save');btn.disabled=true;btn.textContent='保存中…';
  try{
    const proj=(new URLSearchParams(location.search).get('project'))
      ||(JSON.parse(localStorage.getItem('webui_prefs')||'{}').project)||'demo';
    const r=await api('/api/v1/config/generation',Object.assign(collect(),{project:proj}));
    CFG=r.config;
    const st=$('#save-status');st.textContent='✓ 已保存';st.classList.add('show');
    setTimeout(()=>st.classList.remove('show'),2500);
  }catch(e){
    const st=$('#save-status');st.textContent='✗ 保存失败:'+e.message;
    st.style.color='var(--red)';st.classList.add('show');
  }finally{btn.disabled=false;btn.textContent='保存设置'}
};

(async()=>{
  buildStorage();
  CFG=await api('/api/v1/config/generation');
  loadIntoForm();
})();
</script>
</body>
</html>
