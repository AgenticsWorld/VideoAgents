<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>导演台 · VideoAgents</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Crect%20x%3D%273%27%20y%3D%276%27%20width%3D%2718%27%20height%3D%2712%27%20rx%3D%272.5%27%20fill%3D%27%236c9ef8%27%2F%3E%3Cpath%20d%3D%27M9%203l3%203%203-3%27%20stroke%3D%27%236c9ef8%27%20stroke-width%3D%271.8%27%20stroke-linecap%3D%27round%27%20fill%3D%27none%27%2F%3E%3Crect%20x%3D%275.5%27%20y%3D%278.5%27%20width%3D%2713%27%20height%3D%277%27%20rx%3D%271%27%20fill%3D%27%231c2130%27%2F%3E%3Cpath%20d%3D%27M8%2021h8%27%20stroke%3D%27%236c9ef8%27%20stroke-width%3D%271.8%27%20stroke-linecap%3D%27round%27%2F%3E%3C%2Fsvg%3E">
<script src="/static/i18n/i18n.js"></script>
<script src="/static/voice-input.js?v=20260911" data-voice-input="1"></script>
<script>
/* 兜底:i18n 运行时未加载时保持中文界面可用 */
if(!window.I18N){
  window.I18N={lang:'zh',langs:{zh:'中文'},t:function(s){return s},

    setLang:function(){return Promise.resolve()}};
  window.t=function(s){return s};window.I18N_DICT={};
}
</script>
<style>
:root{
  --bg:#0f1117; --panel:#161a23; --panel2:#1c2130; --panel3:#232a3b; --border:#2a3040; --border2:#39415a;
  --text:#dde3ee; --dim:#8b93a7; --faint:#5c6478; --accent:#6c9ef8; --link:#fb923c; --green:#4ade80;
  --red:#f87171; --yellow:#fbbf24; --purple:#c084fc; --cyan:#5eead4; --pink:#f472b6;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
a{color:var(--link)}
body{background:var(--bg);color:var(--text);font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap;flex:none}
header h1{font-size:15px;font-weight:600;white-space:nowrap}
header a.back{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:3px 10px;line-height:1.4}
header a.back:hover{color:var(--accent);border-color:var(--accent)}
header .spacer{flex:1}
button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px;font-family:inherit}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.6;cursor:default}
button.pri{background:var(--accent);border-color:var(--accent);color:#0b1020;font-weight:600}
button.warn{border-color:#6a2e2e;color:var(--red)}
button.sm{font-size:11.5px;padding:2px 8px}
button.xs{font-size:11px;padding:0 6px;line-height:1.7}
header select,header input,select,input[type=text],input[type=number],textarea{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;font-family:inherit}
header select{cursor:pointer;max-width:260px}
#eps{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--panel);flex:none;align-items:center}
#eps select#epsel{border-color:var(--accent);font-weight:600;cursor:pointer;max-width:320px;padding:4px 8px}
#eps .stat{color:var(--dim);font-size:12px;margin-left:6px}
#eps .sp{flex:1}
/* 「提交本集」橙色高亮(同站内橙 --link);无待提交内容时禁用变淡 */
#eps #ep-submit{background:var(--link);border-color:var(--link);color:#1a1005;font-weight:600;margin-left:auto}
#eps #ep-submit:hover:not(:disabled){background:#fdba74;border-color:#fdba74}
#eps #ep-submit:disabled{opacity:.45}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--border2);border-radius:14px;padding:2px 10px;color:var(--dim)}
.pill.run{color:var(--yellow);border-color:#5f4a17}
.pill.ok{color:var(--green);border-color:#2b5a3c}
/* 顶栏可点胶囊(已批准 / 提问)+ 下拉菜单 */
button.pill.menu{background:none;cursor:pointer;font-family:inherit;line-height:inherit}
button.pill.menu:hover,button.pill.menu.open{border-color:var(--accent);color:var(--text)}
button.pill.menu.ok:hover,button.pill.menu.ok.open{color:var(--green)}
button.pill.menu .car{font-size:9px;opacity:.7}
#pillmenu{position:fixed;display:none;flex-direction:column;min-width:150px;background:var(--panel2);border:1px solid var(--border2);border-radius:8px;padding:4px;z-index:110;box-shadow:0 6px 24px #000a}
#pillmenu button{background:none;border:0;border-radius:5px;padding:6px 10px;font-size:12.5px;text-align:left;white-space:nowrap}
#pillmenu button:hover:not(:disabled){background:var(--panel3)}
#pillmenu button:disabled{opacity:.45;cursor:default}
.empty{color:var(--dim);text-align:center;margin-top:60px}
.spin{display:inline-block;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 三栏 ===== */
#work{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr) 360px}
.col{min-height:0;display:flex;flex-direction:column;overflow:hidden}
.col+.col{border-left:1px solid var(--border)}
.col-h{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--border);background:var(--panel);font-weight:600;font-size:12.5px;flex:none}
.col-h .sp{flex:1}
.col-h .lite{font-weight:400;color:var(--dim);font-size:12px}
.scroll{flex:1;min-height:0;overflow-y:auto}
/* 左栏 */
.scn{padding:5px 10px;color:var(--dim);font-size:11.5px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none;position:sticky;top:0;z-index:1}
.scn .sp{flex:1}
.scn .lite{opacity:.65;font-size:10.5px;margin-left:4px}
.scn.closed+.grps{display:none}
.grp{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 10px;border-bottom:1px solid var(--border);align-items:center;cursor:pointer;font-size:12px}
.grp:hover{background:var(--panel2)}
.grp.sel{background:#1b2740;box-shadow:inset 3px 0 0 var(--accent)}
.grp .id{font:500 11.5px var(--mono);color:var(--text)}
.grp .sub{font-size:10.5px;color:var(--dim);display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden}
.grp .n{font:10.5px var(--mono);color:var(--dim);text-align:right}
.grp .cast{display:flex;gap:2px;grid-column:1/-1}
.grp .cast i{width:9px;height:9px;border-radius:50%;display:block}
.shots{display:none;padding:0 0 4px 18px;border-bottom:1px solid var(--border);background:#12151d}
.grp.sel+.shots{display:block}
.sh{display:flex;gap:6px;align-items:center;font:11px var(--mono);color:var(--dim);padding:2px 10px;cursor:pointer}
.sh:hover,.sh.on{color:var(--text)}
.sh.on{background:#1b2740}
.sh .dur{color:var(--faint);margin-left:auto}
.unpl{display:inline-block;padding:0 5px;border-radius:4px;border:1px solid var(--yellow);color:var(--yellow);font-size:10px;line-height:15px}
.unpl-bar{margin:8px 10px;padding:6px 9px;border-radius:6px;border:1px solid var(--yellow);color:var(--yellow);font-size:12px;line-height:1.5}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.r{background:var(--red)}.dot.y{background:var(--yellow)}.dot.g{background:var(--green)}.dot.b{background:var(--accent)}
/* 监视器 */
.mon-top{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--panel);font-size:11.5px;flex-wrap:wrap;flex:none}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:6px;overflow:hidden}
.seg span{padding:2px 8px;color:var(--dim);cursor:pointer;user-select:none;white-space:nowrap}
.seg span.on{background:#274680;color:#fff}
#viewseg span{padding:2px 7px;display:inline-flex;align-items:center}
#viewseg svg{width:15px;height:15px;display:block}
.mon-top select{padding:1px 4px;font-size:11px}
.screen{flex:none;position:relative;background:#05060a;display:flex;align-items:center;justify-content:center;padding:8px;height:46vh;min-height:220px}
.frame{position:relative;max-width:100%;max-height:100%;aspect-ratio:16/9;background:#000;border-radius:4px;overflow:hidden;user-select:none;height:100%;margin:0 auto}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.frame .tag{position:absolute;bottom:8px;font:500 10.5px var(--mono);color:#fff;text-shadow:0 1px 2px #000;pointer-events:none;z-index:4;background:#0007;padding:0 5px;border-radius:3px}
.frame .tag{left:8px}
.frame .tc{position:absolute;top:6px;right:8px;font:10.5px var(--mono);color:#fffa;pointer-events:none;z-index:4}
.frame .info{position:absolute;top:6px;left:8px;font:10.5px var(--mono);color:#fffa;pointer-events:none;z-index:4}
.frame .pad{position:absolute;inset:0;z-index:2;cursor:crosshair;touch-action:none}
.frame .pad.orbit{cursor:grab}
.frame .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;pointer-events:none;z-index:4}
.xport{display:flex;gap:6px;align-items:center;padding:5px 10px;border-top:1px solid var(--border);background:var(--panel);font-size:11.5px;flex:none;flex-wrap:wrap}
.xport .tl{flex:1;min-width:120px;height:10px;border-radius:4px;background:var(--panel3);position:relative;cursor:pointer}
.xport .tl i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px;pointer-events:none;opacity:.55}
.xport .tl b{position:absolute;top:-3px;width:2px;height:16px;background:#fff;pointer-events:none}
.xport .tl s{position:absolute;top:0;bottom:0;width:1px;background:#fff6;pointer-events:none}
.xport .tl u{position:absolute;top:11px;font:9px var(--mono);color:var(--faint);text-decoration:none;pointer-events:none}
.xport .tc{font:11px var(--mono);color:var(--text);min-width:130px;text-align:center}
.xport label{display:inline-flex;gap:4px;align-items:center;color:var(--dim);cursor:pointer}
/* 对象表 + 分镜信息 */
.midbody{flex:1;min-height:0;overflow-y:auto}
.objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;padding:8px 10px}
.obj{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;padding:5px 8px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:11.5px;background:var(--panel)}
.obj:hover{border-color:var(--border2)}
.obj.sel{border-color:var(--yellow);box-shadow:0 0 0 1px #fbbf2455}
.obj.absent{opacity:.5}
.av{width:34px;height:34px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font:600 13px var(--mono);color:#fff;overflow:hidden;background:var(--panel3)}
.av img{width:100%;height:100%;object-fit:cover;object-position:top}
.obj .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obj .meta{font:10px var(--mono);color:var(--dim);display:flex;gap:6px;flex-wrap:wrap}
.obj .stt{font-size:10px;border:1px solid var(--border2);border-radius:3px;padding:0 4px;color:var(--dim)}
.obj .stt.in{color:var(--green);border-color:#2b5a3c}.obj .stt.out{color:var(--yellow);border-color:#5f4a17}.obj .stt.off{color:var(--faint)}
.sec-h{display:flex;align-items:center;gap:8px;padding:5px 10px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--panel);font-weight:600;font-size:12px;position:sticky;top:0;z-index:1}
.sec-h .lite{font-weight:400;color:var(--dim);font-size:11.5px}
.shotinfo{padding:8px 10px;font-size:12px}
.shotinfo .r1{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.tag{font:10.5px var(--mono);border:1px solid var(--border2);border-radius:3px;padding:0 5px;color:var(--dim)}
.shotinfo .content{color:var(--text);white-space:pre-wrap}
.shotinfo .dl{color:var(--yellow);font-size:11.5px;margin-top:3px}
.shotinfo .cam{color:var(--dim);font-size:11.5px;margin-top:3px}
.shotinfo .media{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.shotinfo .media img{height:64px;border-radius:4px;border:1px solid var(--border);cursor:zoom-in}
.shotinfo .warn{color:var(--dim);font-size:11px;margin-top:6px;white-space:pre-wrap}
/* 右栏 */
.acc{border-bottom:1px solid var(--border)}
.acc-h{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);font-weight:600;font-size:12px;cursor:pointer;user-select:none;position:sticky;top:0;z-index:1}
.acc-h .cnt{font:10px var(--mono);color:var(--dim);font-weight:400}
.acc-h .sp{flex:1}
.acc-h .car{color:var(--faint)}
.objs[hidden],.shotinfo[hidden]{display:none}
.fold{cursor:pointer;user-select:none}.fold .car{color:var(--faint)}
.mon-edit .fold{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;color:var(--text)}
.acc.closed .acc-b{display:none}
.acc-b{padding:4px 0}
.note{padding:6px 10px;border-top:1px solid var(--border);font-size:11.5px}
.note .r1{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.note .r1 .sp{flex:1}
.note .txt{margin-top:3px;white-space:pre-wrap;word-break:break-word}
.note .r2{color:var(--dim);font:10.5px var(--mono);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.note .r2 .err{color:var(--red);font-family:inherit}
.note .r3{display:flex;gap:5px;margin-top:5px}
.note.other{opacity:.7}
.tg{display:inline-flex;align-items:center;gap:4px;font:10.5px var(--mono);border:1px solid var(--border2);border-radius:10px;padding:0 7px 0 3px;color:var(--text)}
.tg i{width:9px;height:9px;border-radius:50%;display:block;background:var(--faint)}
.st{font:10px var(--mono);border:1px solid var(--border2);border-radius:3px;padding:0 5px;color:var(--dim);white-space:nowrap}
.st.draft{color:var(--dim)}.st.submitted{color:var(--yellow);border-color:#5f4a17}.st.applied{color:var(--green);border-color:#2b5a3c}.st.failed{color:var(--red);border-color:#6a2e2e}
.st.running{color:var(--yellow);border-color:#5f4a17}.st.done{color:var(--green);border-color:#2b5a3c}.st.nochange{color:var(--dim)}
.nform{padding:8px 10px;border-top:1px solid var(--border);display:grid;gap:6px;background:#12151d}
.nform .row{display:grid;grid-template-columns:52px 1fr;gap:6px;align-items:center;font-size:11.5px}
.nform .row label{color:var(--dim)}
.nform select,.nform input,.nform textarea{width:100%;font-size:12px;padding:3px 6px}
.nform textarea{min-height:56px;resize:vertical}
.nform .btns{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.nform .msg{flex:1;color:var(--dim);font-size:11px}
.nform .msg.err{color:var(--red)}
.subrow{display:flex;gap:6px;padding:6px 10px;border-top:1px solid var(--border);flex-wrap:wrap;align-items:center;font-size:11.5px}
.subrow .msg{flex:1;color:var(--dim);font-size:11px;min-width:80px}
/* 待决项(样式随 whitebox.css wb-issue) */
.iss{padding:6px 10px;border-top:1px solid var(--border);font-size:11.5px}
.iss .h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font:10.5px var(--mono);color:var(--dim)}
.iss .sev{border:1px solid #6a2e2e;color:var(--red);border-radius:3px;padding:0 4px}
.iss.advisory .sev{border-color:#5f4a17;color:var(--yellow)}
.iss .q{margin-top:3px}
.iss .prov{color:var(--dim);font-size:11px;margin-top:2px}
.iss .opts{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.iss .opts button.on{border-color:var(--green);color:var(--green)}
.iss .opts button.rec em{color:var(--yellow);font-style:normal;font-size:10px}
.iss .state{font-size:11px;color:var(--green);margin-top:3px}
.iss .state.warn{color:var(--yellow)}
.ver{display:flex;gap:6px;align-items:center;padding:4px 10px;border-top:1px solid var(--border);font-size:11.5px;flex-wrap:wrap}
.ver .v{font:600 11.5px var(--mono);color:var(--text)}
.ver .lb{color:var(--dim);font-size:11px}
.ver .sp{flex:1}
.ver .cur{color:var(--accent);font-size:10px}
.bat{padding:5px 10px;border-top:1px solid var(--border);font-size:11px;color:var(--dim)}
.bat b{color:var(--text);font-family:var(--mono);font-weight:500}
/* 底栏 */
#foot{border-top:1px solid var(--border);background:var(--panel);font-size:10.5px;flex:none}
#foot .fh{display:flex;align-items:center;gap:10px;padding:3px 12px;color:var(--dim)}
#foot .fh .sp{flex:1}
.tlrow{position:relative;height:26px;margin:0 12px 6px;border-bottom:1px solid #1d2230}
.blk{position:absolute;top:2px;height:20px;border-radius:2px;background:var(--panel3);border:1px solid var(--border2);font:9px var(--mono);color:var(--dim);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;white-space:nowrap}
.blk:hover{border-color:var(--accent)}
.blk.sel{border-color:var(--accent);color:#fff;background:#1b2740}
.blk .d{position:absolute;top:1px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--yellow)}
.ph{position:absolute;top:0;bottom:0;width:1px;background:#fff;z-index:3;pointer-events:none}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
#lb img{max-width:92vw;max-height:88vh;border-radius:8px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border2);color:var(--text);padding:6px 14px;border-radius:8px;font-size:12.5px;z-index:120;box-shadow:0 6px 24px #000a;transition:opacity .3s;opacity:0;pointer-events:none}
/* v3 四联监看 / 辅助线 / 镜头数据 / 标记 / 批准 */
.gate{display:inline-flex;align-items:center;gap:8px;font-size:12px;border:1px solid var(--border2);border-radius:14px;padding:2px 10px;color:var(--yellow)}
.gate.ok{color:var(--green);border-color:#2b5a3c}
.gate.idle{color:var(--dim)}
.signbtn{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:2px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.signbtn.pri{background:var(--accent);border-color:var(--accent);color:#0b1020;font-weight:600}
.apv{color:var(--green);font-weight:700}
.apv.stale{color:var(--yellow)}
.screen.quad{display:grid;grid-template-columns:1fr 1fr;gap:6px;height:auto;max-height:none;align-items:start}
.screen.quad .frame{width:100%;height:auto;aspect-ratio:var(--ar,16/9)}
.qcell{display:none;position:relative;width:100%;aspect-ratio:var(--ar,16/9);background:#000;border-radius:4px;overflow:hidden}
.screen.quad .qcell{display:block}
.qcell img,.qcell video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.qcell .qlbl{position:absolute;top:6px;left:8px;font:10.5px var(--mono);color:#fff;background:#0007;padding:0 5px;border-radius:3px;z-index:2}
.qcell .qmute{cursor:pointer;margin-left:4px;user-select:none}
.qcell .qnone{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px}
.guides{position:absolute;inset:0;pointer-events:none;z-index:3}
.guides svg{width:100%;height:100%;display:block}
.lens{font:10.5px var(--mono);color:var(--dim);display:flex;gap:10px;flex-wrap:wrap;padding:3px 10px;border-top:1px solid var(--border);background:var(--panel);flex:none}
.lens b{color:var(--text);font-weight:500}
.lens .warn{color:var(--yellow)}
.markrow{display:flex;gap:6px;align-items:center;padding:4px 10px;border-bottom:1px solid var(--border);background:#12171d;font-size:11.5px;flex-wrap:wrap;flex:none}
.markrow input{width:120px;padding:2px 6px;font-size:11.5px}

<script type="module">
import * as THREE from '/static/vendor/three/three.module.js';
import { OrbitControls } from '/static/vendor/three/OrbitControls.js';
import { WhiteboxRenderer, sample } from '/static/whitebox-renderer.js?v=20261009-hand121';
import { projectRenderFormat } from '/static/whitebox-format.js?v=20260908-bedfoot-pour';

const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=1)=>v==null||isNaN(v)?'—':(+v).toFixed(d).replace(/\.0$/,'');
const tc=v=>{v=Math.max(0,+v||0);const m=Math.floor(v/60),s=v-m*60;return (m?String(m).padStart(2,'0')+':':'')+s.toFixed(2).padStart(5,'0')};
const FPS=24;
const proj=()=>$('#project').value.trim()||'demo';
const posKey=()=>'director-pos:'+proj()+':'+EP;
function posLoad(){try{return JSON.parse(localStorage.getItem(posKey())||'{}')||{}}catch(_){return {}}}
function posSave(patch){try{localStorage.setItem(posKey(),JSON.stringify({...posLoad(),...patch}))}catch(_){}}
const api=p=>'/api/v1/projects/'+encodeURIComponent(proj())+'/director/'+encodeURIComponent(EP)+p;
const wbApi=p=>'/api/v1/projects/'+encodeURIComponent(proj())+'/whitebox/'+p;
const artifactBase=()=>'/api/v1/projects/'+encodeURIComponent(proj())+'/artifacts/';
async function J(url,method,body){
  const r=await fetch(url,{method:method||'GET',headers:body!==undefined?{'Content-Type':'application/json'}:{},body:body!==undefined?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.detail||j.error||r.status);e.body=j;throw e}
  return j;
}
function toast(msg,ms=3500){const el=$('#toast');el.textContent=msg;el.style.opacity='1';clearTimeout(el._t);el._t=setTimeout(()=>{el.style.opacity='0'},ms)}

/* ---------- 状态 ---------- */
const Q0=new URLSearchParams(location.search);
let DD=null,WB=null,SB=null,FORMAT=null,EP='',SEL='',VIEW='camera',VERSION='live',TIME=0,PLAYING=false,LOOP=false,
    PICK=null,OPEN_SCN=new Set(),CLOSED_ACC=new Set(),NOTE_SCOPE='group',POLL=null,LAST_MAXV={},URL_T=null,SHOWALL=false;
const grpById=id=>WB&&WB.groups.find(g=>g.group_id===id);
// 未经白模调度的组(没有 whitebox_plans/<grp>.json):画面只是宿主自动推断的草稿,只看不改——注释/编辑/批准/存版/提交一律关(后端同拦)
const unplanned=id=>{const g=grpById(id);return !!(g&&g.artifact_status&&g.artifact_status.plan===false)};
const UNPLANNED_MSG=()=>t('本组尚未白模调度,当前是系统自动推断的草稿,只能查看;白模调度完成后再提修改');
const groupIssues=gid=>(grpById(gid)||{}).issues||[];
const groupNotes=gid=>((DD||{}).ledger||{}).notes.filter(n=>n.group_id===gid);
const versionsOf=gid=>(((DD||{}).ledger||{}).versions||{})[gid]||[];
const maxV=gid=>versionsOf(gid).reduce((m,v)=>Math.max(m,v.v),0);
const runningBatches=()=>(((DD||{}).ledger||{}).batches||[]).filter(b=>b.status==='running');
const shotOf=sid=>SB&&(SB.shots||[]).find(s=>s.shot_id===sid);
const TL=k=>((DD||{}).labels||{}).target?.[k]||k;

/* ---------- 加载 ---------- */
async function load(keep){
  history.replaceState(null,'','?project='+encodeURIComponent(proj())+(EP?'&ep='+encodeURIComponent(EP):'')+(SEL?'&grp='+encodeURIComponent(SEL):''));
  if(!keep)$('#work').innerHTML='<div class="empty" style="grid-column:1/-1">'+esc(t('加载中…'))+'</div>';
  try{
    if(!FORMAT){FORMAT=projectRenderFormat(await J('/api/v1/projects/'+encodeURIComponent(proj())+'/config'))}
    let dd;
    try{dd=await J(api(''))}
    catch(e){
      // 未指定集或该集没有白模:先取分集列表再定集
      if(!EP){const eps=await J('/api/v1/projects/'+encodeURIComponent(proj())+'/previews/storyboard').catch(()=>({episodes:[]}));
        const first=(eps.episodes||[])[0];if(first){EP=first.ep;return load(keep)}}
      throw e;
    }
    if(!(dd.episodes||[]).length){$('#eps').innerHTML='';$('#work').innerHTML=`<div class="empty" style="grid-column:1/-1">${esc(t('该项目还没有分集数据'))}</div>`;return}
    if(!dd.episodes.some(e=>e.ep===dd.ep)){EP=dd.episodes[0].ep;return load(keep)}
    EP=dd.ep;localStorage.setItem('director-ep:'+proj(),EP);LAST_EPISODES=dd.episodes;
    const [wb,sb]=await Promise.all([J(wbApi(encodeURIComponent(EP))),J('/api/v1/projects/'+encodeURIComponent(proj())+'/previews/storyboard?ep='+encodeURIComponent(EP)).catch(()=>null)]);
    const first=!DD||DD.ep!==dd.ep;
    const prevMax={...LAST_MAXV};
    DD=dd;WB=wb;SB=sb;
    LAST_MAXV={};for(const g of WB.groups)LAST_MAXV[g.group_id]=maxV(g.group_id);
    if(first||!grpById(SEL)){
      const pos=posLoad(),q=Q0;
      const want=q.get('grp')&&grpById(q.get('grp'))?q.get('grp'):(pos.sel&&grpById(pos.sel)?pos.sel:(WB.groups[0]||{}).group_id)||'';
      OPEN_SCN=new Set((pos.open||[]).length?pos.open:[]);
      SEL='';URL_T=q.get('t')!=null?Number(q.get('t')):null;Q0.delete('grp');Q0.delete('t');
      render(false);
      if(want)selectGroup(want,true);
    }else{
      render(true);
      // 实时模式自动刷新新版本;查看历史版本时保留用户选择
      const nv=LAST_MAXV[SEL]||0;
      if(nv>(prevMax[SEL]||0)){renderVersionSelects();toast(I18N.f('{g} 新版本 v{v} 已就绪',{g:SEL,v:nv}));if(VERSION==='live')reloadSource()}
    }
    schedulePoll();
  }catch(e){
    const noShots=e.body&&Array.isArray(e.body.episodes);
    $('#work').innerHTML=`<div class="empty" style="grid-column:1/-1">${noShots?esc(I18N.f('{ep} 还没有分镜表,导演台暂无内容;请在上方切换到已有分镜表的集',{ep:EP})):esc(t('加载失败:'))+esc(e.message)}</div>`;
    // 该集没有白模/分镜表时仍保留选集下拉,能切回别的集
    if(e.body&&Array.isArray(e.body.episodes)&&e.body.episodes.length)LAST_EPISODES=e.body.episodes;
    if(LAST_EPISODES.length){$('#eps').innerHTML=`<select id="epsel" title="${esc(t('切换分集'))}">${LAST_EPISODES.map(x=>`<option value="${esc(x.ep)}" ${x.ep===EP?'selected':''}>${esc(x.ep)}${x.title?' · '+esc(x.title):''}${x.has_shots===false?' · '+esc(t('无分镜表')):(x.has_whitebox?'':' · '+esc(t('无白模')))}</option>`).join('')}</select>`;
      $('#epsel').onchange=()=>{EP=$('#epsel').value;SEL='';DD=null;disposeRenderers();load()}}
  }
}
let LAST_EPISODES=[];
function schedulePoll(){
  const busy=runningBatches().length>0;
  if(busy&&!POLL)POLL=setInterval(()=>load(true),60000);
  if(!busy&&POLL){clearInterval(POLL);POLL=null}
}

/* ---------- 顶部集行 ---------- */
function renderEps(){
  const s=DD.summary||{},box=$('#eps');
  let h=`<select id="epsel" title="${esc(t('切换分集'))}">${DD.episodes.map(e=>`<option value="${esc(e.ep)}" ${e.ep===EP?'selected':''}>${esc(e.ep)}${e.title?' · '+esc(e.title):''}${e.has_shots===false?' · '+esc(t('无分镜表')):(e.has_whitebox?'':' · '+esc(t('无白模')))}${e.has_notes?' ✎':''}</option>`).join('')}</select>`;
  h+=`<span class="stat">${esc(I18N.f('{n} 组 · 注释 {t}(待提交 {d} · 已提交 {s} · 已套用 {a} · 未生效 {f})· 版本 {v}',{n:WB.groups.length,t:s.total||0,d:s.draft||0,s:s.submitted||0,a:s.applied||0,f:s.failed||0,v:s.versions||0}))}</span>`;
  h+=`<span class="sp"></span>`;
  const rb=runningBatches();
  h+=rb.length?`<span class="pill run"><span class="spin">⟳</span> ${esc(I18N.f('{n} 个批次运行中',{n:rb.length}))} · ${esc(rb.map(b=>b.group_ids.join(',')).join(' | '))}</span>`:`<span class="pill">${esc(t('无批次运行'))}</span>`;
  const apAll=DD.approvals||{},apN=Object.keys(apAll).filter(k=>grpById(k)).length,apStale=Object.values(apAll).filter(a=>a.stale).length;
  h+=`<button class="pill menu ${apN===WB.groups.length&&WB.groups.length?'ok':''}" data-pillmenu="approve" title="${esc(t('组级批准:看过并认可的组打 ✓;白模再变则标过期'))}">✓ ${esc(I18N.f('已批准 {a}/{n}',{a:apN,n:WB.groups.length}))}${apStale?` · <span style="color:var(--yellow)">${esc(I18N.f('{n} 组过期',{n:apStale}))}</span>`:''}<span class="car">▾</span></button>`;
  // Agent 提问:已选择(已选 / 已套用 / 随组批准接受)/ 总数
  const iq=issueStats();
  h+=`<button class="pill menu ${iq.total&&iq.answered===iq.total?'ok':''}" data-pillmenu="issues" title="${esc(t('Agent 提问:已选择 / 总数'))}">⚠ ${esc(I18N.f('提问 {a}/{n}',{a:iq.answered,n:iq.total}))}<span class="car">▾</span></button>`;
  h+=`<span id="gatebox">${gateHtml()}</span>`;
  if(!DD.whitebox_enabled)h+=`<span class="pill" style="color:var(--yellow)">${esc(t('项目未开启「人物精确空间位置」,白模链未启用'))}</span>`;
  if(WB.errors&&WB.errors.length)h+=`<span class="pill" style="color:var(--red)" title="${esc(WB.errors.map(e=>e.group_id+': '+e.error).join('\n'))}">${esc(I18N.f('{n} 组编译报错',{n:WB.errors.length}))}</span>`;
  h+=`<button class="sm pri" id="ep-submit" disabled title="${esc(t('一次性提交本集所有待提交内容(待提交注释 + 已裁决待决项 + 3D 直改),按工位拆批派单;同组有批次运行中会被拒'))}"></button>`;
  box.innerHTML=h;
  $('#epsel').onchange=()=>{EP=$('#epsel').value;SEL='';DD=null;disposeRenderers();load()};
  renderEpSubmit();
  $('#ep-submit').onclick=()=>{const b=$('#ep-submit');b.dataset.busy='1';submitBatch({},b)};
}

/* 顶栏胶囊菜单:✓ 已批准 → 全部批准;⚠ 提问 → 全部选择推荐方案 */
function issueStats(){
  let total=0,answered=0,pending=0;
  for(const g of (WB||{}).groups||[])for(const i of g.issues||[]){total++;if(i.status==='open'||i.status==='stale')pending++;else answered++}
  return {total,answered,pending};
}
// 可批准的组:已白模调度、且未批准或批准已过期
const approvableGroups=()=>((WB||{}).groups||[]).filter(g=>!unplanned(g.group_id)&&(!(DD.approvals||{})[g.group_id]||(DD.approvals||{})[g.group_id].stale));
function closePillMenu(){const m=$('#pillmenu');if(m)m.style.display='none';$$('#eps .pill.menu.open').forEach(b=>b.classList.remove('open'))}
function openPillMenu(btn){
  let m=$('#pillmenu');if(!m){m=document.createElement('div');m.id='pillmenu';document.body.appendChild(m)}
  const kind=btn.dataset.pillmenu;
  if(m.style.display==='flex'&&m.dataset.kind===kind){closePillMenu();return}
  closePillMenu();
  if(kind==='approve'){const n=approvableGroups().length;
    m.innerHTML=`<button data-act="approve-all" ${n?'':'disabled'} title="${esc(t('批准本集所有已完成白模调度的组;各组未答的 Agent 提问随之按当前白模接受'))}">✓ ${esc(t('全部批准'))}${n?` (${n})`:''}</button>`}
  else{const n=issueStats().pending;
    m.innerHTML=`<button data-act="recommend-all" ${n?'':'disabled'} title="${esc(t('给本集所有未答的 Agent 提问选择推荐方案(没有推荐方案的用默认取舍);提交本集时套用'))}">☑ ${esc(t('全部选择推荐方案'))}${n?` (${n})`:''}</button>`}
  m.dataset.kind=kind;m.style.display='flex';btn.classList.add('open');
  const r=btn.getBoundingClientRect();m.style.top=(r.bottom+4)+'px';m.style.left=Math.max(8,Math.min(r.left,innerWidth-m.offsetWidth-8))+'px';
}
async function approveAll(){
  try{
    const r=await J(api('/approve-all'),'POST',{});
    DD.approvals=r.approvals;DD.summary=r.summary;
    for(const [gid,list] of Object.entries(r.issues||{})){const g=grpById(gid);if(g)g.issues=list}
    renderRight();renderApproveBtn();renderLeft();renderEps();
    const n=(r.approved||[]).length,k=(r.skipped||[]).length;
    toast((n?I18N.f('已批准 {n} 组',{n}):t('没有可批准的组'))+(k?' · '+I18N.f('{n} 组尚未白模调度,已跳过',{n:k}):''),5000);
  }catch(e){toast(t('批准失败:')+e.message,6000)}
}
async function recommendAll(){
  try{
    const r=await J(wbApi(encodeURIComponent(EP)+'/issues/recommended'),'POST',{});
    for(const row of r.groups||[]){const g=grpById(row.group_id);if(g)g.issues=row.issues}
    renderRight();renderLeft();renderEps();
    const n=(r.chosen||[]).length,k=(r.skipped||[]).length;
    toast((n?I18N.f('已为 {n} 项提问选择推荐方案,提交本集时套用',{n}):t('没有待答的提问'))+(k?' · '+I18N.f('{n} 项没有推荐方案,需逐项选择',{n:k}):''),6000);
  }catch(e){toast(t('保存失败:')+e.message,6000)}
}
document.addEventListener('click',e=>{
  const act=e.target.closest('#pillmenu [data-act]');
  if(act){if(act.disabled)return;closePillMenu();(act.dataset.act==='approve-all'?approveAll:recommendAll)();return}
  const b=e.target.closest('#eps [data-pillmenu]');
  if(b&&DD&&WB){openPillMenu(b);return}
  closePillMenu();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePillMenu()});
addEventListener('resize',closePillMenu);

function gateHtml(){
  const g=DD.gate||{};
  if((g.pending||[]).length){const c=g.pending[0];
    return `<span class="gate">🖋 ${esc(t('H3W 白模签字 · 待答复'))} <button class="signbtn pri" data-cid="${esc(c.id)}" data-answer="签字" title="${esc(c.question||'')}">✅ ${esc(t('签字确认'))}</button><button class="signbtn" data-cid="${esc(c.id)}" data-answer="暂缓">⏸ ${esc(t('暂缓'))}</button></span>`}
  if(g.signed)return `<span class="gate ok">✅ ${esc(t('H3W 已签字'))}</span>`;
  return `<span class="gate idle" title="${esc(t('等总制片建签字单(白模调度交付后自动);建好后这里出现「签字确认」按钮。阻断级待决项未清时宿主拒签'))}">${esc(t('H3W 白模签字'))} · ${esc(g.state||'pending')}</span>`;
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('.signbtn');if(!b||b.disabled||!DD)return;
  if(b.dataset.answer==='签字'&&b.dataset.arm!=='1'){b.dataset.arm='1';const old=b.textContent;b.textContent=t('再点一次确认签字');setTimeout(()=>{b.dataset.arm='';b.textContent=old},3000);return}
  b.disabled=true;
  try{const j=await J(api('/signoff'),'POST',{confirm_id:b.dataset.cid,answer:b.dataset.answer});DD.gate=j.gate||DD.gate;$('#gatebox').innerHTML=gateHtml();toast(b.dataset.answer==='签字'?t('已签字,白模进入导出'):t('已暂缓'))}
  catch(err){b.disabled=false;b.dataset.arm='';toast(I18N.f('签字失败:{e}',{e:err.message}),6000)}
});

/* ---------- 主体 ---------- */
function render(keep){
  renderEps();
  if(!keep||!$('#left')){
    $('#work').innerHTML=`<div class="col" id="left"></div><div class="col" id="mid"></div><div class="col" id="right"></div>`;
    renderMonitorShell();
  }
  renderLeft();renderRight();renderFoot();
  if(keep){renderObjects();renderShotInfo();renderVersionSelects()}
}
/* 左栏 */
function renderLeft(){

/* 前视/侧视:页面自有的正交相机,不改共享渲染器(改渲染器会让所有已导出 camera.mp4 的渲染器指纹过期) */
function sideCam(rr,view){
  const key=view==='front'?'_front':'_side';
  if(!rr[key]){rr[key]=new THREE.OrthographicCamera(-10,10,6,-6,.05,3000);rr[key].layers.enable(1)}
  const cam=rr[key];const [w,h,d]=rr.sceneData?rr.sceneData.dimensions_m:[10,3,10];
  let top=h;for(const a of rr.actors||[])for(const k of a.data.keyframes)top=Math.max(top,k.position[1]+a.data.size_m[1]);
  const aspect=rr.width/rr.height,span=(view==='front'?w:d)*1.12,ext=Math.max(span,(top+1)*aspect)/2,cy=Math.max(top,2)/2;
  cam.left=-ext;cam.right=ext;cam.top=ext/aspect;cam.bottom=-ext/aspect;cam.far=Math.max(3000,Math.max(w,d,top)*6);
  if(view==='front')cam.position.set(0,cy,Math.max(w,d,top)*3);else cam.position.set(Math.max(w,d,top)*3,cy,0);
  cam.up.set(0,1,0);cam.lookAt(0,cy,0);cam.updateProjectionMatrix();cam.updateMatrixWorld(true);return cam;
}
function camOf(rr,view){return view==='world'?(WORLD?WORLD.camera:rr.overview):view==='camera'?rr.camera:view==='overview'?rr.overview:(view==='front'||view==='side')?sideCam(rr,view):rr.top}
function renderView(rr,view){
  WORLD?.setEnabled(view==='world');
  if(view==='world'&&WORLD){
    for(const {data,mesh} of rr.props){const k=data.keyframes?sample(data.keyframes,TIME):data;mesh.visible=k.visible!==false;}
    WORLD.render($('#worldthrough').checked);return;
  }
  if(view!=='front'&&view!=='side'){rr.render(view);return}
  if(!rr.scene)return;
  for(const m of rr.solids)m.visible=true;if(rr.realPlane)rr.realPlane.visible=false;rr.marker.visible=!!rr.group;rr.ray.visible=!!rr.group;
  rr.renderer.render(rr.scene,sideCam(rr,view));
}
const VIEW_NAME=()=>({world:t('世界模型视角'),camera:t('摄像机视角'),top:t('俯视图'),real:t('实景图'),front:t('前视'),side:t('侧视')})[VIEW]||t('旋转视角');

/* 拾取 */
function pick(e){if(EDIT&&TOOL==='measure'){measureClick(e);return}const p=pickAt(e);if(p&&p.way!=null){WAYSEL=p.way;const info=keysOf(PICK);if(info&&info.keys[p.way])seek(info.keys[p.way].t+(info.isCam?info.shot.start:0));renderLanes();updateWay();return}if(p&&p.insert){insertWaypoint(p.insert);return}setPick(p)}
function pickAt(e){
  if(!RA||!RA.scene)return null;
  const r=$('#frame').getBoundingClientRect();
  const nd=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-(((e.clientY-r.top)/r.height)*2-1));
  const cam=camOf(RA,VIEW);
  cam.updateMatrixWorld(true);
  const rc=new THREE.Raycaster();rc.setFromCamera(nd,cam);
  rc.layers.set(0);if(VIEW!=='camera')rc.layers.enable(1);
  // 编辑态:先试路径点/机位目标点/路径线(插帧)
  if(EDIT&&VIEW!=='camera'){
    if(WAY){const wh=rc.intersectObjects(WAY.children.filter(c=>c.isMesh),false);if(wh.length)return {...PICK,way:wh[0].object.userData.idx};}
    if(TARGET_H&&TARGET_H.visible){const th=rc.intersectObject(TARGET_H,false);if(th.length)return {...PICK,target:true};}
    if(WAY&&WAY.userData.line){rc.params.Line.threshold=0.25;const lh=rc.intersectObject(WAY.userData.line,false);if(lh.length)return {...PICK,insert:{index:lh[0].index,point:lh[0].point}};}
  }
  const targets=[];
  for(const a of RA.actors)if(a.root.visible)targets.push(a.root);
  for(const p of RA.props)if(p.mesh.visible)targets.push(p.mesh);
  if(VIEW!=='camera'&&RA.marker)targets.push(RA.marker);
  if(VIEW!=='world')for(const m of RA.solids.filter(m=>m.name!=='ground-floor'&&m.name!=='ground-grid'))targets.push(m);
  const hits=rc.intersectObjects(targets,true);
  const up=(obj,set)=>{for(let p=obj;p;p=p.parent)if(set(p))return p;return null};
  const g=grpById(SEL);
  if(rc.params&&rc.params.Line)rc.params.Line.threshold=1;
  const actorPick=a=>({kind:(a.data.id||'').startsWith('EXTRA')?'extra':'actor',id:a.data.id,label:a.data.label||a.data.id});
  // 先按射线命中;俯视/旋转视角里人物只有几个像素,没打中人物时再按屏幕距离就近吸附(16px 内)
  let picked=null,solidHit=null;
  for(const h of hits){
    const o=h.object;
    const actor=RA.actors.find(a=>up(o,p=>p===a.root));if(actor){picked=actorPick(actor);break}
    const prop=RA.props.find(p=>up(o,x=>x===p.mesh));if(prop){picked={kind:'prop',id:prop.data.id,label:prop.data.id};break}
    if(up(o,p=>p===RA.marker)){picked={kind:'camera',id:RA.shotId,label:t('摄影机')+' '+RA.shotId};break}
    const solid=RA.solids.filter(m=>m.name!=='ground-floor'&&m.name!=='ground-grid').find(m=>up(o,x=>x===m));if(solid&&!solidHit)solidHit=solid;
  }
  if(!picked){
    const tol=16/r.width*2;let best=null,bd=tol;
    const cands=[];
    for(const a of RA.actors)if(a.root.visible&&(VIEW!=='camera'||!(shotAt().visible_actor_ids&&!shotAt().visible_actor_ids.includes(a.data.id))))cands.push([a.root.position.clone().add(new THREE.Vector3(0,a.data.size_m[1]*.5,0)),actorPick(a)]);
    for(const p of RA.props)if(p.mesh.visible)cands.push([p.mesh.position.clone(),{kind:'prop',id:p.data.id,label:p.data.id}]);
    if(VIEW!=='camera'&&RA.marker)cands.push([RA.marker.position.clone(),{kind:'camera',id:RA.shotId,label:t('摄影机')+' '+RA.shotId}]);
    for(const [pos,pk] of cands){const c=pos.project(cam);if(c.z>1||c.z<-1)continue;const d=Math.hypot((c.x-nd.x),(c.y-nd.y)*r.height/r.width);if(d<bd){bd=d;best=pk}}
    picked=best;
  }
  if(!picked&&solidHit&&g)picked={kind:'scene',id:g.scene_id,label:t('场景物件')+' '+(solidHit.name||''),object:solidHit.name||''};
  return picked;
}
const shotAt=()=>{const g=viewedGroup();return g&&(g.cameras.find(c=>TIME<c.start+c.duration_s)||g.cameras.at(-1))||{}};
function setPick(p,silent){
  const prev=PICK;PICK=p;
  if(!p||!prev||p.kind!==prev.kind||p.id!==prev.id)WAYSEL=-1;
  if(HELPER&&RA&&RA.scene){RA.scene.remove(HELPER);HELPER.geometry.dispose();HELPER=null}
  if(p&&RA&&RA.scene){
    let obj=null;
    if(p.kind==='actor'||p.kind==='extra'){const a=RA.actors.find(a=>a.data.id===p.id);obj=a&&a.root}
    else if(p.kind==='prop'){const pr=RA.props.find(x=>x.data.id===p.id);obj=pr&&pr.mesh}
    else if(p.kind==='camera')obj=RA.marker;
    else if(p.kind==='scene')obj=RA.solids.find(m=>m.name===(p.object||p.id));
    if(obj){HELPER=new THREE.BoxHelper(obj,0xffcc00);HELPER.layers.set(0);HELPER.layers.enable(1);HELPER.layers.enable(2);HELPER.material.depthTest=false;RA.scene.add(HELPER)}
  }
  DIRTY=true;kick();
  $$('#objs .obj').forEach(el=>el.classList.toggle('sel',!!p&&el.dataset.kind===p.kind&&el.dataset.id===p.id));
  rebuildWay();renderNumbox();renderLanes();
  if(!silent)fillNoteForm(p);
}

function updateObjectStates(){
  if(!RA||!RA.scene)return;
  const g=viewedGroup();if(!g)return;
  const shot=g.cameras.find(c=>TIME<c.start+c.duration_s)||g.cameras.at(-1);
  RA.camera.updateMatrixWorld(true);   // 非摄像机视角时机位相机不参与渲染,矩阵是旧的,投影前先刷新
  const proj3=new THREE.Vector3();
  $$('#objs .obj').forEach(el=>{
    const st=el.querySelector('[data-st]');if(!st)return;
    const kind=el.dataset.kind,id=el.dataset.id;
    let txt='',cls='';
    if(kind==='actor'||kind==='extra'){
      const a=RA.actors.find(a=>a.data.id===id);if(!a)return;
      if(!a.root.visible){txt=t('已退场/未入场');cls='off'}
      else if(shot&&shot.visible_actor_ids&&!shot.visible_actor_ids.includes(id)){txt=t('镜头名单隐藏');cls='off'}
      else{
        const h=a.data.size_m[1];proj3.copy(a.root.position);proj3.y+=h*.6;const c=proj3.clone().project(RA.camera);
        const inFront=c.z<1&&c.z>-1,inFrame=Math.abs(c.x)<=1.1&&Math.abs(c.y)<=1.1;
        if(inFront&&inFrame){txt=t('入画');cls='in'}else{txt=t('画外');cls='out'}
      }
      const k=sample(a.data.keyframes,TIME);txt+=` · ${k.pose||'stand'} · (${k.position.map(v=>(+v).toFixed(1)).join(', ')})`;
      const cv=clearanceOf(a);if(cv){txt+=` · ⚠ ${I18N.f('与 {who} 净距 {d} m',{who:cv.label,d:cv.gap.toFixed(2)})}`;cls='out'}
    }else if(kind==='prop'){
      const p=RA.props.find(p=>p.data.id===id);if(!p)return;
      txt=p.mesh.visible?t('入画/在场'):t('本镜不出现');cls=p.mesh.visible?'in':'off';
    }else if(kind==='camera'){
      const c=g.cameras.find(c=>c.shot_id===id);if(!c)return;
      if(shot&&shot.shot_id===id){const k=sample(c.keyframes,TIME-c.start);txt=`${t('当前镜')} · fov ${num(k.fov,1)}° · ${t('机高')} ${num(k.position[1],2)} m`;cls='in'}
      else{txt=`${num(c.start,1)}–${num(c.start+c.duration_s,1)}s`;cls='off'}
    }else if(kind==='scene'){txt=(WB.scenes[id]||{}).dimensions_m?`${(WB.scenes[id].dimensions_m||[]).join(' × ')} m`:'';cls=''}
    else if(kind==='group'){txt=`${num(g.duration_s,1)}s · ${g.cameras.length}${t('镜')}`}
    st.textContent=txt;st.className='stt '+cls;
  });
}

  else if(i.status==='waived')state=`<div class="state">✓ ${esc(t('已随本组批准接受现状'))}</div>`;
  else if(i.status==='stale')state=`<div class="state warn">⚠ ${esc(t('答复已失效(问题已变),请重新选择'))}</div>`;
  return `<div class="iss ${esc(i.severity)}"><div class="h"><span class="sev">${esc(i.severity==='blocking'?t('阻断'):t('建议'))}</span><span>${esc(i.kind||'')}</span><span data-no-i18n>${esc(i.issue_id)}</span>${where?`<span data-no-i18n>${esc(where)}</span>`:''}${jumpT!=null?`<button class="xs" data-jump="${jumpT}">▶ ${esc(t('看现场'))}</button>`:''}</div>
    <div class="q" data-no-i18n>${esc(i.question)}</div>${i.provisional?`<div class="prov" data-no-i18n>${esc(t('默认取舍:'))}${esc(i.provisional)}</div>`:''}
    ${i.status==='applied'?'':`<div class="opts">${opts}</div>`}${state}</div>`;
}
function noteHtml(n){
  const tg=n.target||{},color=colorOf(tg.id);
  const other=n.group_id!==SEL;
  return `<div class="note ${other?'other':''}" data-nid="${esc(n.id)}"><div class="r1"><span class="tg"><i style="background:${esc(color)}"></i>${esc(TL(tg.kind))} ${esc(tg.label||tg.id||'')}</span>${other?`<button class="xs" data-gsel="${esc(n.group_id)}">${esc(n.group_id)}</button>`:''}${n.shot_id?`<span class="tag" data-no-i18n>${esc(n.shot_id)}</span>`:''}${n.t!=null?`<button class="xs" data-jump="${n.t}" title="${esc(t('跳到该时刻'))}">t=${esc(n.t)}s</button>`:''}${n.target_agent&&n.target_agent!==DD.agent?`<span class="tag" title="${esc(n.target_agent)}">→ ${esc((DD.routes||{})[n.target_agent]||n.target_agent)}</span>`:''}<span class="sp"></span><span class="st ${esc(n.status)}" title="${n.verified===false?esc(t('其它工位无编译指纹可核验,以运行回执为准')):''}">${esc((DD.labels.note_status||{})[n.status]||n.status)}${n.verified===false?'*':''}</span></div>
    <div class="txt" data-no-i18n>${esc(n.text)}</div>
    <div class="r2"><span>${esc(n.id)}</span><span>${esc((n.updated_at||n.created_at||'').slice(5,16))}</span>${n.batch_id?`<span>${esc(n.batch_id)}</span>`:''}${n.version_after?`<span>→ v${esc(n.version_after)}</span>`:''}${n.error?`<span class="err">${esc(n.error)}</span>`:''}</div>
    ${n.status==='draft'?`<div class="r3"><button class="xs" data-edit="${esc(n.id)}">${esc(t('编辑'))}</button><button class="xs warn" data-del="${esc(n.id)}">${esc(t('删除'))}</button></div>`:''}</div>`;
}
function colorOf(id){const g=grpById(SEL);if(!g)return '#5c6478';const a=[...(g.actors||[]),...(g.extras||[])].find(a=>a.id===id);return a?a.color:(WB.actor_colors||{})[id]||'#5c6478'}
let EDIT_ID=null;
// 右栏整块重渲(批次轮询 60s 一次、3D 改动、折叠/切本组全集)会重建注释表单:重渲前按组存下未保存的输入,
// 重渲后原样放回(含光标/焦点),否则正在写的「要求」会被清空;切到别的组再切回来也还在
const NOTE_FORM={};let FORM_GID='';
function keepNoteForm(){
  const ta=$('#nf-text');if(!ta||!FORM_GID)return;
  const v=id=>($(id)||{}).value;
  if(!ta.value&&!EDIT_ID){delete NOTE_FORM[FORM_GID];return}
  NOTE_FORM[FORM_GID]={text:ta.value,target:v('#nf-target'),agent:v('#nf-agent'),shot:v('#nf-shot'),uset:!!($('#nf-uset')||{}).checked,t:v('#nf-t'),edit:EDIT_ID,
    focus:document.activeElement===ta,a:ta.selectionStart,b:ta.selectionEnd,scroll:ta.scrollTop};
}
function restoreNoteForm(){
  const ta=$('#nf-text'),k=NOTE_FORM[SEL];
  if(FORM_GID!==SEL&&!k)EDIT_ID=null;
  FORM_GID=SEL;
  if(!ta||!k)return;
  const set=(id,val)=>{const el=$(id);if(el&&val!=null&&(el.tagName!=='SELECT'||[...el.options].some(o=>o.value===val)))el.value=val};
  ta.value=k.text;set('#nf-target',k.target);set('#nf-agent',k.agent);set('#nf-shot',k.shot);set('#nf-t',k.t);
  if($('#nf-uset'))$('#nf-uset').checked=k.uset;
  EDIT_ID=k.edit||null;if(EDIT_ID&&$('#nf-save'))$('#nf-save').textContent=t('保存修改');
  if(k.focus){ta.focus();try{ta.setSelectionRange(k.a,k.b)}catch(e){}ta.scrollTop=k.scroll||0}
}
function fillNoteForm(p,keepText){
  const sel=$('#nf-target'),shot=$('#nf-shot'),tin=$('#nf-t');if(!sel)return;
  const rows=objectRows();
  sel.innerHTML=rows.map(r=>`<option value="${esc(r.kind)}|${esc(r.id)}" data-label="${esc(r.stored||r.label)}">${esc(TL(r.kind))} · ${esc(r.label)}</option>`).join('');
  if(p){sel.value=p.kind+'|'+p.id;if(sel.selectedIndex<0)sel.selectedIndex=0;const ta=$('#nf-text');if(p.object&&ta&&!ta.value)ta.value='['+p.object+'] '}
  else if(sel.selectedIndex<0)sel.selectedIndex=0;
  const g=grpById(SEL);
  shot.innerHTML=`<option value="">${esc(t('不限镜'))}</option>`+(g?g.cameras.map(c=>`<option value="${esc(c.shot_id)}">${esc(c.shot_id)}</option>`).join(''):'');
  // RA.shotId 要等下一帧渲染才跟上 seek;点摄影机时直接取该镜,其余按当前 TIME 现算
  shot.value=p&&p.kind==='group'?'':(p&&p.kind==='camera'&&p.id)||shotAt().shot_id||(RA&&RA.shotId)||'';
  if(shot.selectedIndex<0)shot.value='';
  tin.value=(p&&p.kind==='group'?0:TIME).toFixed(1);
  if(!keepText){AIM=null;$('#nf-text').focus()}
}
// 左栏点 grpNNN / shNNN:把「我的修改」对准整组(不限镜)或该镜摄影机(该镜 + 起始秒);正在改已有条目时不动,已写的要求不清
// AIM 记住这次对准,右栏整块重渲(60s 轮询等)后原样放回;在 3D 里点对象或「清空」即作废
var AIM=null;
function aimNoteForm(kind,id,shotId,tSec,again){
  if(!again)AIM={gid:SEL,kind,id,shotId,tSec:tSec!=null?tSec:TIME};
  const sel=$('#nf-target'),shot=$('#nf-shot'),tin=$('#nf-t');if(!sel||!shot||EDIT_ID)return;
  const val=kind+'|'+id;if([...sel.options].some(o=>o.value===val))sel.value=val;
  shot.value=shotId||'';if(shot.selectedIndex<0)shot.value='';
  if(tin)tin.value=(tSec!=null?tSec:TIME).toFixed(1);
}
async function saveNote(){
  const btn=$('#nf-save'),msg=$('#nf-msg');
  if(unplanned(SEL)){msg.textContent=UNPLANNED_MSG();msg.className='msg err';return}
  const [kind,id]=($('#nf-target').value||'|').split('|');const opt=$('#nf-target').selectedOptions[0];
  const body={group_id:SEL,target:{kind,id,label:opt?opt.dataset.label:id}   /* label 存语言无关值(摄影机/场景/整组存 id),显示时由 TL(kind) 拼 */,text:$('#nf-text').value,shot_id:$('#nf-shot').value||null,
    t:$('#nf-uset').checked?Number($('#nf-t').value):null,view:VIEW,base_v:maxV(SEL)||null,target_agent:$('#nf-agent')?$('#nf-agent').value:undefined};
  if(!body.text.trim()){msg.textContent=t('先写修改要求');msg.className='msg err';return}
  btn.disabled=true;msg.textContent='';msg.className='msg';
  try{
    if(EDIT_ID)await J(api('/notes/'+encodeURIComponent(EDIT_ID)),'PUT',{text:body.text,t:body.t,shot_id:body.shot_id,target:body.target,target_agent:body.target_agent});
    else await J(api('/notes'),'POST',body);
    EDIT_ID=null;$('#nf-text').value='';toast(t('已加入队列'));await load(true);
  }catch(e){msg.textContent=e.message;msg.className='msg err';btn.disabled=false}
}
function editNote(nid){
  const n=(DD.ledger.notes||[]).find(n=>n.id===nid);if(!n)return;
  if(n.group_id!==SEL){selectGroup(n.group_id);setTimeout(()=>editNote(nid),50);return}
  EDIT_ID=nid;const tg=n.target||{};
  fillNoteForm({kind:tg.kind,id:tg.id,label:tg.label},true);
  $('#nf-text').value=n.text;$('#nf-shot').value=n.shot_id||'';$('#nf-uset').checked=n.t!=null;if(n.t!=null)$('#nf-t').value=n.t;if($('#nf-agent'))$('#nf-agent').value=n.target_agent||DD.agent;
  $('#nf-save').textContent=t('保存修改');$('#nf-text').focus();$('#nform').scrollIntoView({block:'nearest'});
}
async function delNote(nid){try{await J(api('/notes/'+encodeURIComponent(nid)),'DELETE');await load(true)}catch(e){toast(t('删除失败:')+e.message)}}
async function decideIssue(issueId,choice,btn){
  btn.disabled=true;
  try{
    const r=await J(wbApi(encodeURIComponent(EP)+'/issues/'+encodeURIComponent(issueId)+'/decision'),'POST',{choice});
    const g=grpById(SEL);const idx=(g.issues||[]).findIndex(i=>i.issue_id===issueId);if(idx>=0)g.issues[idx]=r.issue;
    renderRight();renderLeft();renderEps();
  }catch(e){toast(t('保存失败:')+e.message);btn.disabled=false}
}
async function submitBatch(body,btn){
  btn.disabled=true;const sm=$('#sub-msg');if(sm)sm.textContent=t('派单中…');
  const eb=$('#ep-submit');if(eb){eb.dataset.busy='1';eb.disabled=true}
  try{
    const r=await J(api('/submit'),'POST',body);
    toast(I18N.f('已派单 {n} 个批次:{list};白模批次完成后自动加载新版本',{n:(r.batches||[]).length,list:(r.batches||[]).map(b=>((DD.routes||{})[b.agent]||b.agent)+' '+b.batch.id).join(', ')}),7000);
    if((r.skipped||[]).length)console.log('skipped',r.skipped);
    await load(true);
  }catch(e){const msg=t('派单失败:')+e.message;if(sm)sm.textContent=msg;toast(msg,7000);btn.disabled=false;if(eb){eb.dataset.busy='';renderEpSubmit()}}
}

/* ---------- 底栏:整集时间线 ---------- */
const episodeDuration=()=>WB.groups.reduce((s,g)=>s+(g.duration_s||0),0)||1;
function cumStart(gid){let s=0;for(const g of WB.groups){if(g.group_id===gid)return s;s+=g.duration_s||0}return 0}
function renderFoot(){
  const T=episodeDuration();let cum=0;
  let h=`<div class="fh"><span>${esc(t('整集时间线'))}</span><span>${esc(I18N.f('{n} 组 · {d}',{n:WB.groups.length,d:tc(T)}))}</span><span class="sp"></span><span>${esc(t('点组切换;黄点 = 有待提交注释'))}</span></div><div class="tlrow" id="ftl">`;
  for(const g of WB.groups){
    const w=(g.duration_s||0)/T*100,l=cum/T*100;cum+=g.duration_s||0;
    const drafts=groupNotes(g.group_id).some(n=>n.status==='draft');
    h+=`<div class="blk ${g.group_id===SEL?'sel':''}" style="left:${l.toFixed(3)}%;width:${Math.max(0.3,w).toFixed(3)}%" data-g="${esc(g.group_id)}" title="${esc(g.group_id)} · ${num(g.duration_s,1)}s">${w>3?esc(g.group_id.replace('grp','')):''}${drafts?'<i class="d"></i>':''}</div>`;
  }
  h+=`<div class="ph" id="fph" style="left:${((cumStart(SEL)+TIME)/T*100).toFixed(3)}%"></div></div>`;
  $('#foot').innerHTML=h;
  $$('#foot .blk').forEach(b=>b.onclick=()=>selectGroup(b.dataset.g));
}

/* ---------- 通用 ---------- */
$('#lb').onclick=()=>{$('#lb').style.display='none'};
try{
  const es=new EventSource('/api/v1/events');
  es.onmessage=e=>{try{const ev=JSON.parse(e.data);if(!DD)return;
    if(ev.type==='director'&&ev.project===proj()&&ev.ep===EP)load(true);
    else if(ev.type==='run'&&ev.run&&ev.run.project===proj()&&runningBatches().length&&ev.run.status&&ev.run.status!=='running'&&ev.run.status!=='queued')load(true);
  }catch(_){}};
}catch(_){}
$('#reload').onclick=()=>load(true);
// 调试/自动化钩子(页内测试用):当前渲染器、拾取、状态
window.__director={get RA(){return RA},get VERSION(){return VERSION},get WORLD(){return WORLD},setView,selectVersion,get PICK(){return PICK},get TIME(){return TIME},get VIEW(){return VIEW},get EDIT(){return EDIT},get UNDO(){return UNDO},get DD(){return DD},get WB(){return WB},pick,pickAt,setPick,seek,setEdit,setTool,keysOf,commit,snapshotObj,keyIndexAt,rebuildWay,renderLanes,setQuad,axisInfo,subjectInfo,get OVL(){return OVL},get MEASURE(){return MEASURE},THREE};
