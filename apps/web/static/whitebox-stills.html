<!doctype html><html><head><meta charset="utf-8"><title>白模自检静帧</title></head><body>
<canvas id="render"></canvas>
<script type="module">
import { WhiteboxRenderer } from './whitebox-renderer.js';
const data=window.whiteboxExportData;
const renderer=new WhiteboxRenderer(document.querySelector('#render'),{width:data.width,height:data.height,controls:false});
// 白模自检静帧页(render_whitebox.py --stills):与预览/导出同一渲染器,只多一个可选视角。
// 独立成页是为了不改 whitebox-export.html——它计入 camera.mp4 的渲染器指纹,一改全部已导出视频都会过期。
window.whiteboxStills={
  load(gid){const group=data.episode.groups.find(g=>g.group_id===gid);renderer.load(data.episode.scenes[group.scene_id],group);},
  frame(time,view){renderer.setTime(time);renderer.render(view==='overview'?'overview':'camera');return renderer.canvas.toDataURL('image/jpeg',.88).split(',')[1];}
};
window.whiteboxReady=true;
</script></body></html>
